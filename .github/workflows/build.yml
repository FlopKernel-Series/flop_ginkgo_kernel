name: FloppyKernel – Build matrix & Release 

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release after build (true/false)'
        required: false
        default: 'true'
  push:
    branches:
      - main
      - release/*
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'README.md'

permissions:
  contents: write

env:
  # --- DIRECTORIES (Restored) ---
  TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/custom-toolchain
  CCACHE_DIR: "/home/runner/.ccache"
  WP: ${{ github.workspace }}
  
  # --- UPSTREAM CONFIG ---
  LLVM_WEEKLY_LATEST: "https://raw.githubusercontent.com/PurrrsLitterbox/LLVM-weekly/main/latestlink.txt"
  
  # --- BUILD ENVIRONMENT ---
  ARCH: arm64
  SUBARCH: arm64
  CLANG_TYPE: custom
  USE_CCACHE: 1
  CCACHE_SIZE: "4G" # Upgraded to 4G since we clean disk space now
  CCACHE_COMPRESS: "1"

  # --- [WORKFLOW OPTIMIZATION HACKS] ---
  LLVM: "1"
  LLVM_IAS: "1"
  INSTALL_MOD_STRIP: "1"
  KCPPFLAGS: "-DNDEBUG"

jobs:
  build:
    name: Build ${{ matrix.device }}-${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: [ginkgo, laurel_sprout]
        variant: [Vanilla, KSUNext, SukiSU]

    steps:
      # 1. CLEANUP (CRITICAL FIX: Fixes Out of Storage)
      - name: 🗑️ Free Disk Space
        run: |
          echo "::group::Cleaning Environment"
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "Disk space after cleanup:"
          df -h
          echo "::endgroup::"

      # 2. SWAP (CRITICAL FIX: Fixes Out of Ram)
      # Moved to top so space is available for it
      - name: 🧠 Setup Swap (12GB)
        run: |
          echo "::group::Allocating Swap"
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show
          echo "::endgroup::"

      # 3. Checkout (Restored Original)
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # 4. Install Tools (Restored + LLD)
      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential ninja-build lz4 zstd \
            libssl-dev libelf-dev device-tree-compiler \
            ccache binutils file optipng jpegoptim \
            python3 python3-pip zip unzip lld

      # 5. Handle LLVM Updates (Restored Logic)
      - name: Check Upstream LLVM Version
        id: check-llvm
        run: |
          # Added retry logic for network stability
          for i in {1..3}; do
            LATEST_URL=$(curl -fsSL "${{ env.LLVM_WEEKLY_LATEST }}" 2>/dev/null | tr -d '[:space:]')
            [ ! -z "$LATEST_URL" ] && break
            sleep 2
          done
          
          if [ -z "$LATEST_URL" ]; then
            echo "::error::Failed to fetch LLVM URL."
            exit 1
          fi
          echo "LLVM_URL=$LATEST_URL" >> $GITHUB_ENV
          URL_HASH=$(echo -n "$LATEST_URL" | sha256sum | head -c 16)
          echo "cache_key=$URL_HASH" >> $GITHUB_OUTPUT

      # 6. Cache Toolchain (Restored)
      - name: Cache LLVM Toolchain
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLCHAIN_DIR }}
          key: llvm-${{ steps.check-llvm.outputs.cache_key }}

      # 7. Download LLVM (Restored + Robust Wget)
      - name: Download & Install LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ env.TOOLCHAIN_DIR }}"
          cd "${{ env.TOOLCHAIN_DIR }}"
          # Added timeouts and retries
          wget --tries=3 --timeout=30 -qO clang.tar.zst "${{ env.LLVM_URL }}"
          if [ -f clang.tar.zst ]; then
            zstd -d -c clang.tar.zst | tar -xf -
            rm -f clang.tar.zst
          else
            echo "::error::Download failed!"
            exit 1
          fi

      - name: Verify Clang
        run: |
          export PATH="${{ env.TOOLCHAIN_DIR }}/bin:$PATH"
          clang --version

      # 8. Cache CCache (Restored)
      - name: Cache CCache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.device }}-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.device }}-${{ matrix.variant }}-
            ccache-

      - name: Setup CCache
        run: |
          mkdir -p ${{ env.CCACHE_DIR }}
          ccache -M ${{ env.CCACHE_SIZE }}
          ccache -z

      # 9. Environment Setup (Restored + Optimizations)
      - name: Prepare Environment
        run: |
          # Ensure LLD is used if available (Fixes RAM issues)
          if command -v ld.lld >/dev/null 2>&1; then
             echo "LD=ld.lld" >> $GITHUB_ENV
             echo "Using LLD Linker"
          else
             echo "LD=ld.lld" >> $GITHUB_ENV
          fi
          # Maximize CPU usage
          echo "MAKEFLAGS=-j$(nproc --all)" >> $GITHUB_ENV
          echo "JOBS=$(nproc --all)" >> $GITHUB_ENV

      # 10. Build Script (Restored + Robustness)
      - name: Run Build Script
        id: build_kernel
        shell: bash -l {0}
        run: |
          # --- SAFETY: UNLIMIT STACK ---
          ulimit -s unlimited

          case "${{ matrix.variant }}" in
            Vanilla) FLAG="" ;;
            KSUNext) FLAG="k" ;;
            SukiSU)  FLAG="s" ;;
          esac
          
          echo "::group::Build Config"
          echo "Device: ${{ matrix.device }}"
          echo "Variant: ${{ matrix.variant }}"
          echo "::endgroup::"

          export PATH="${{ env.TOOLCHAIN_DIR }}/bin:/usr/lib/ccache:$PATH"
          
          chmod +x do_build.sh ckbuild.sh
          
          set -o pipefail
          ./do_build.sh "${{ matrix.device }}" "$FLAG" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # 11. Post-Build: Stats (Restored)
      - name: Check CCache Stats
        if: always()
        run: ccache -s

      # 12. Filter Logs (Restored YOUR custom filtering)
      - name: Filter Logs (Errors/Warnings)
        if: failure() || success()
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          if [ -f "$LOG" ]; then
            grep -nEi '(error|warning):' "$LOG" > "$GITHUB_WORKSPACE/full_issues.log" || true
            grep -i "error:" "$GITHUB_WORKSPACE/full_issues.log" > "$GITHUB_WORKSPACE/errors.log" || true
            grep -i "warning:" "$GITHUB_WORKSPACE/full_issues.log" > "$GITHUB_WORKSPACE/warnings.log" || true
          fi

      # 13. Gather Artifacts (Restored)
      - name: Stage Zips
        id: stage_zips
        if: success()
        run: |
          mkdir -p release_artifacts
          find "$GITHUB_WORKSPACE" -maxdepth 4 -name "*.zip" -size +10M -exec cp -v {} release_artifacts/ \;
          if [ -z "$(ls -A release_artifacts)" ]; then
             echo "::warning::No kernel ZIPs found!"
             echo "zip_found=false" >> $GITHUB_OUTPUT
          else
             echo "zip_found=true" >> $GITHUB_OUTPUT
          fi

      # 14. Upload Logs (Restored - This was missing in my prev fix)
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.device }}-${{ matrix.variant }}
          path: |
            build.log
            errors.log
            warnings.log

      - name: Upload Kernel ZIPs
        if: steps.stage_zips.outputs.zip_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.device }}-${{ matrix.variant }}
          path: release_artifacts/*.zip
          compression-level: 0

  create_release:
    needs: build
    runs-on: ubuntu-latest
    if: |
      success() && 
      ((github.event_name == 'workflow_dispatch' && inputs.create_release == 'true') ||
       startsWith(github.ref, 'refs/tags/'))
    
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: kernel-*
          merge-multiple: true

      - name: Prepare Release Assets
        run: |
          mkdir -p final_assets
          DATE=$(date -u +%Y.%m.%d)
          
          cd artifacts
          for file in *.zip; do
             # Restored your specific naming convention
             mv "$file" "../final_assets/${DATE}-R${{ github.run_number }}-${file}"
          done
          
          echo "Assets prepared:"
          ls -lh ../final_assets/

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="FloppyKernel-${{ github.run_number }}-$(date -u +%Y%m%d)"
          TITLE="Floppy Kernel CI • Build ${{ github.run_number }}"
          
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "Automated CI Build | Toolchain: LLVM (Latest Weekly) | Devices: Ginkgo/Laurel" \
            --target "${{ github.sha }}" \
            final_assets/*.zip
