name: FloppyKernel – Build matrix & Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release after build (true/false)'
        required: false
        default: 'true'
  push:
    branches:
      - main
      - release/*
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'README.md'

permissions:
  contents: write

env:
  # --- DIRECTORIES ---
  TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/custom-toolchain
  CCACHE_DIR: "/home/runner/.ccache"
  WP: ${{ github.workspace }}
  
  # --- UPSTREAM CONFIG ---
  LLVM_WEEKLY_LATEST: "https://raw.githubusercontent.com/PurrrsLitterbox/LLVM-weekly/main/latestlink.txt"
  
  # --- BUILD ENVIRONMENT ---
  ARCH: arm64
  SUBARCH: arm64
  CLANG_TYPE: custom
  USE_CCACHE: 1
  CCACHE_SIZE: "4G"         # Increased to 4G (since we free up disk space)
  CCACHE_COMPRESS: "1"

  # --- [WORKFLOW OPTIMIZATION] ---
  LLVM: "1"
  LLVM_IAS: "1"
  INSTALL_MOD_STRIP: "1"
  KCPPFLAGS: "-DNDEBUG"

jobs:
  build:
    name: Build ${{ matrix.device }}-${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: [ginkgo, laurel_sprout]
        variant: [Vanilla, KSUNext, SukiSU]

    steps:
      # 1. CLEANUP (FIXES OUT OF STORAGE)
      - name: 🗑️ Free Disk Space (Aggressive)
        run: |
          echo "::group::Cleaning Environment"
          # Standard GitHub runners have ~14GB free. This script frees ~30GB more.
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "Disk space after cleanup:"
          df -h
          echo "::endgroup::"

      # 2. SWAP (FIXES OUT OF RAM)
      - name: 🧠 Setup Swap (12GB)
        run: |
          echo "::group::Allocating Swap"
          # We do this AFTER cleanup so we actually have space for the swap file
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show
          echo "::endgroup::"

      # 3. CHECKOUT
      - name: 📥 Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # 4. DEPENDENCIES
      - name: 📦 Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential ninja-build lz4 zstd \
            libssl-dev libelf-dev device-tree-compiler \
            ccache binutils file optipng jpegoptim \
            python3 python3-pip zip unzip

      # 5. LLVM CHECK
      - name: 🔎 Check Upstream LLVM Version
        id: check-llvm
        run: |
          # Added retry logic for robustness
          for i in {1..3}; do
            LATEST_URL=$(curl -fsSL "${{ env.LLVM_WEEKLY_LATEST }}" 2>/dev/null | tr -d '[:space:]')
            [ ! -z "$LATEST_URL" ] && break
            echo "Attempt $i failed, retrying..."
            sleep 2
          done
          
          if [ -z "$LATEST_URL" ]; then
            echo "::error::Failed to fetch LLVM URL after 3 attempts."
            exit 1
          fi
          
          echo "LLVM_URL=$LATEST_URL" >> $GITHUB_ENV
          URL_HASH=$(echo -n "$LATEST_URL" | sha256sum | head -c 16)
          echo "cache_key=$URL_HASH" >> $GITHUB_OUTPUT

      # 6. CACHE TOOLCHAIN
      - name: 💾 Cache LLVM Toolchain
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLCHAIN_DIR }}
          key: llvm-${{ steps.check-llvm.outputs.cache_key }}

      # 7. INSTALL LLVM
      - name: ⚙️ Download & Install LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ env.TOOLCHAIN_DIR }}"
          cd "${{ env.TOOLCHAIN_DIR }}"
          
          # Retry logic for large downloads
          wget --tries=3 --timeout=30 -qO clang.tar.zst "${{ env.LLVM_URL }}"
          
          if [ -f clang.tar.zst ]; then
            zstd -d -c clang.tar.zst | tar -xf -
            rm -f clang.tar.zst
          else
            echo "::error::Download failed!"
            exit 1
          fi

      - name: Verify Clang
        run: |
          export PATH="${{ env.TOOLCHAIN_DIR }}/bin:$PATH"
          clang --version

      # 8. CCACHE SETUP
      - name: ⚡ Setup CCache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.device }}-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.device }}-${{ matrix.variant }}-
            ccache-

      - name: Configure CCache
        run: |
          mkdir -p ${{ env.CCACHE_DIR }}
          ccache -M ${{ env.CCACHE_SIZE }}
          ccache -z

      # 9. BUILD
      - name: 🚀 Run Build Script
        id: build_kernel
        shell: bash -l {0}
        run: |
          # --- SAFETY CHECKS ---
          ulimit -s unlimited
          
          # Force LLD (Much lower RAM usage than standard linker)
          if command -v ld.lld >/dev/null 2>&1; then
             echo "Using LLD Linker"
             export LD=ld.lld
          else
             sudo apt-get install -y lld
             export LD=ld.lld
          fi

          # Config
          case "${{ matrix.variant }}" in
            Vanilla) FLAG="" ;;
            KSUNext) FLAG="k" ;;
            SukiSU)  FLAG="s" ;;
          esac
          
          echo "::group::Build Details"
          echo "Device: ${{ matrix.device }}"
          echo "Variant: ${{ matrix.variant }}"
          echo "Cores: $(nproc --all)"
          echo "::endgroup::"

          # Add Toolchain to path
          export PATH="${{ env.TOOLCHAIN_DIR }}/bin:/usr/lib/ccache:$PATH"
          
          chmod +x do_build.sh ckbuild.sh
          
          # Run build with pipefail to catch errors in the pipe
          set -o pipefail
          ./do_build.sh "${{ matrix.device }}" "$FLAG" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # 10. POST-BUILD
      - name: 📊 Check CCache Stats
        if: always()
        run: ccache -s

      - name: 🔍 Filter Logs
        if: failure() || success()
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          if [ -f "$LOG" ]; then
            # Grab last 200 lines of error context
            grep -C 5 -i "error:" "$LOG" > "$GITHUB_WORKSPACE/errors.log" || true
          fi

      - name: 📦 Stage Zips
        id: stage_zips
        if: success()
        run: |
          mkdir -p release_artifacts
          # Find zips larger than 10M to avoid empty junk files
          find "$GITHUB_WORKSPACE" -maxdepth 4 -name "*.zip" -size +10M -exec cp -v {} release_artifacts/ \;
          
          count=$(ls release_artifacts | wc -l)
          if [ "$count" -gt 0 ]; then
             echo "zip_found=true" >> $GITHUB_OUTPUT
          else
             echo "::warning::No kernel ZIPs found!"
             echo "zip_found=false" >> $GITHUB_OUTPUT
          fi

      - name: 📤 Upload Kernel ZIPs
        if: steps.stage_zips.outputs.zip_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.device }}-${{ matrix.variant }}
          path: release_artifacts/*.zip
          compression-level: 0

  create_release:
    needs: build
    runs-on: ubuntu-latest
    if: |
      success() && 
      ((github.event_name == 'workflow_dispatch' && inputs.create_release == 'true') ||
       startsWith(github.ref, 'refs/tags/'))
    
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: kernel-*
          merge-multiple: true

      - name: Prepare Release Assets
        run: |
          mkdir -p final_assets
          DATE=$(date -u +%Y.%m.%d)
          
          cd artifacts
          for file in *.zip; do
             # Renaming for clarity
             mv "$file" "../final_assets/${DATE}-CI-${file}"
          done

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="FloppyKernel-${{ github.run_number }}-$(date -u +%Y%m%d)"
          TITLE="Floppy Kernel CI • Build ${{ github.run_number }}"
          
          # Only create release if assets exist
          if [ -z "$(ls -A final_assets)" ]; then
             echo "No assets to release."
             exit 0
          fi
          
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "Automated CI Build | Toolchain: LLVM (Latest Weekly)" \
            --target "${{ github.sha }}" \
            final_assets/*.zip
