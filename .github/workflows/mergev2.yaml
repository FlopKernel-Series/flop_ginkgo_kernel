name: "🧠 mergev2"
on:
  workflow_dispatch:
    inputs:
      # === CORE MERGE CONFIGURATION ===
      upstream_repo:
        description: "Upstream Repository URL (HTTPS)"
        required: true
        default: "https://github.com/neophyteprjkt/kernel_xiaomi_ginkgo.git"
      upstream_branch:
        description: "Upstream Branch to Merge"
        required: true
        default: "main"
      target_branch:
        description: "Target Branch (Where to Apply)"
        required: true
        default: "floppy-new"
      
      # === AI STRATEGY CONFIGURATION ===
      merge_strategy:
        description: "Primary Merge Resolution Strategy"
        required: true
        default: "hybrid"
        type: choice
        options:
          - "hybrid"           # Heuristics → Gemini → Fallbacks
          - "ai_only"          # Direct to Gemini
          - "conservative"     # Heuristics only, manual fallback
      
      conflict_threshold:
        description: "Maximum AI Conflicts Before Abort (0=unlimited)"
        required: true
        default: "50"
        type: number
      
      # === GEMINI CONFIGURATION ===
      gemini_api_key:
        description: "Gemini 2.5 Flash API Key (REQUIRED)"
        required: true
      
      gemini_temperature:
        description: "AI Creativity (0.0-1.0)"
        required: true
        default: "0.1"
        type: choice
        options:
          - "0.0"   # Deterministic
          - "0.1"   # Highly Focused
          - "0.3"   # Balanced
          - "0.5"   # Creative
      
      # === FALLBACK CONFIGURATION ===
      fallback_ai_1:
        description: "Primary Fallback AI (deepseek/openai)"
        required: false
        default: ""
      
      fallback_ai_1_key:
        description: "Fallback AI 1 API Key"
        required: false
        default: ""
      
      fallback_ai_2:
        description: "Emergency Fallback AI"
        required: false
        default: ""
      
      fallback_ai_2_key:
        description: "Fallback AI 2 API Key"
        required: false
        default: ""
      
      # === ADVANCED CONTROLS ===
      enable_preflight:
        description: "Run Pre-Merge Validation & Safety Checks"
        required: true
        default: true
        type: boolean
      
      enable_post_validation:
        description: "Validate Merge Syntax & Structure"
        required: true
        default: true
        type: boolean
      
      create_recovery_pr:
        description: "Create Recovery PR on Failure (vs. direct push)"
        required: true
        default: true
        type: boolean

# ========================================================================
# PERMISSIONS & ENVIRONMENT
# ========================================================================
permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

env:
  # System Configuration
  WORKSPACE_ROOT: "${{ github.workspace }}"
  TEMP_DIR: "/tmp/horizon-${{ github.run_id }}"
  STATE_FILE: "${{ github.workspace }}/.horizon_state.json"
  
  # Git Configuration
  GIT_STRATEGY: "ort"
  GIT_RENAME_LIMIT: "999999"
  GIT_DEPTH: "50"
  
  # AI Configuration
  GEMINI_MODEL: "gemini-2.5-flash-exp"
  GEMINI_MAX_OUTPUT_TOKENS: "8192"
  GEMINI_SAFETY: "block_none"
  
  # Rate Limiting
  GEMINI_RPM_LIMIT: 15
  GEMINI_TPM_LIMIT: 1000000  # Gemini 2.5 Flash limit
  REQUEST_TIMEOUT: 90
  MAX_CONCURRENT_REQUESTS: 2
  
  # Processing Limits
  MAX_FILE_SIZE_MB: 5
  MAX_CONFLICT_BLOCK_SIZE: 10000
  MAX_TOTAL_CONFLICTS: 1000

# ========================================================================
# PREFLIGHT CHECKS & VALIDATION
# ========================================================================
jobs:
  preflight_validation:
    name: "🔍 Preflight System Validation"
    runs-on: ubuntu-latest-8core
    outputs:
      validation_passed: ${{ steps.validate.outputs.passed }}
      validation_message: ${{ steps.validate.outputs.message }}
      estimated_conflicts: ${{ steps.estimate.outputs.conflict_count }}
      merge_viable: ${{ steps.estimate.outputs.viable }}
    
    steps:
      - name: "🛡️ Initialize Secure Environment"
        shell: bash
        run: |
          # Create secure temporary workspace
          mkdir -p "${{ env.TEMP_DIR }}"
          chmod 700 "${{ env.TEMP_DIR }}"
          
          # Install core security tools
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git-crypt \
            gnupg2 \
            openssl \
            ca-certificates \
            jq \
            yq \
            tree
          
          # Configure secure git
          git config --global core.fsmonitor true
          git config --global transfer.fsckObjects true
          git config --global fetch.fsckObjects true
          git config --global receive.fsckObjects true
          
          echo "Secure environment initialized"
      
      - name: "📥 Checkout Target Repository (Secure)"
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.target_branch }}
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: ${{ env.GIT_DEPTH }}
          submodules: recursive
          persist-credentials: true
      
      - name: "✅ Validate Inputs & Dependencies"
        id: validate
        shell: bash
        run: |
          echo "=== INPUT VALIDATION ==="
          
          # Validate API Keys
          if [[ -z "${{ inputs.gemini_api_key }}" ]]; then
            echo "❌ CRITICAL: Gemini API Key is required"
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "message=Missing Gemini API Key" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # Test Gemini API Key
          GEMINI_TEST=$(curl -s -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/$GEMINI_MODEL:generateContent?key=${{ inputs.gemini_api_key }}" \
            -H "Content-Type: application/json" \
            -d '{"contents":[{"parts":[{"text":"test"}]}],"generationConfig":{"maxOutputTokens":1}}' \
            --max-time 10)
          
          if echo "$GEMINI_TEST" | grep -q "API_KEY_INVALID"; then
            echo "❌ Gemini API Key is invalid"
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "message=Invalid Gemini API Key" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # Validate URLs
          if [[ ! "${{ inputs.upstream_repo }}" =~ ^https://github\.com/.*\.git$ ]]; then
            echo "⚠️ Warning: Upstream repo URL format may be non-standard"
          fi
          
          # Check branch protections
          if curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/branches/${{ inputs.target_branch }}/protection" | \
            grep -q "required_status_checks"; then
            echo "⚠️ Target branch has protection rules - ensure workflow has admin rights"
          fi
          
          echo "✅ All inputs validated successfully"
          echo "passed=true" >> $GITHUB_OUTPUT
          echo "message=Validation successful" >> $GITHUB_OUTPUT
      
      - name: "📊 Estimate Merge Complexity"
        id: estimate
        if: ${{ inputs.enable_preflight == true }}
        shell: bash
        run: |
          echo "=== MERGE COMPLEXITY ANALYSIS ==="
          
          # Add upstream remote
          git remote add upstream "${{ inputs.upstream_repo }}" || true
          git fetch upstream "${{ inputs.upstream_branch }}" --depth=20 --no-tags
          
          # Perform dry-run merge to estimate conflicts
          git checkout -b "analysis-${{ github.run_id }}" || true
          
          set +e
          MERGE_OUTPUT=$(git merge --no-commit --no-ff \
            "upstream/${{ inputs.upstream_branch }}" \
            --strategy=${{ env.GIT_STRATEGY }} \
            --strategy-option="find-renames=50%" \
            --dry-run 2>&1)
          MERGE_EXIT=$?
          set -e
          
          # Analyze output for conflict indicators
          CONFLICT_INDICATORS=$(echo "$MERGE_OUTPUT" | grep -c -E "CONFLICT|conflict|Auto-merging failed" || true)
          FILES_CHANGED=$(echo "$MERGE_OUTPUT" | grep -c "^Auto-merging\|^CONFLICT" || true)
          
          # Clean up analysis branch
          git merge --abort 2>/dev/null || true
          git checkout "${{ inputs.target_branch }}" 2>/dev/null || true
          git branch -D "analysis-${{ github.run_id }}" 2>/dev/null || true
          
          echo "Estimated conflicts: $CONFLICT_INDICATORS"
          echo "Files affected: $FILES_CHANGED"
          
          # Determine viability
          VIABLE="true"
          if [[ $CONFLICT_INDICATORS -gt ${{ env.MAX_TOTAL_CONFLICTS }} ]]; then
            echo "❌ Too many estimated conflicts ($CONFLICT_INDICATORS > ${{ env.MAX_TOTAL_CONFLICTS }})"
            VIABLE="false"
          fi
          
          echo "conflict_count=$CONFLICT_INDICATORS" >> $GITHUB_OUTPUT
          echo "viable=$VIABLE" >> $GITHUB_OUTPUT
      
      - name: "📋 Generate Preflight Report"
        if: always()
        shell: bash
        run: |
          echo "=== PREFLIGHT REPORT ===" > ${{ env.TEMP_DIR }}/preflight_report.md
          echo "**Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> ${{ env.TEMP_DIR }}/preflight_report.md
          echo "**Workflow:** ${{ github.workflow }} #${{ github.run_number }}" >> ${{ env.TEMP_DIR }}/preflight_report.md
          echo "" >> ${{ env.TEMP_DIR }}/preflight_report.md
          echo "**VALIDATION:** ${{ steps.validate.outputs.passed }}" >> ${{ env.TEMP_DIR }}/preflight_report.md
          echo "**ESTIMATED CONFLICTS:** ${{ steps.estimate.outputs.estimated_conflicts }}" >> ${{ env.TEMP_DIR }}/preflight_report.md
          echo "**MERGE VIABLE:** ${{ steps.estimate.outputs.merge_viable }}" >> ${{ env.TEMP_DIR }}/preflight_report.md
          echo "" >> ${{ env.TEMP_DIR }}/preflight_report.md
          echo "**CONFIGURATION:**" >> ${{ env.TEMP_DIR }}/preflight_report.md
          echo "- Strategy: ${{ inputs.merge_strategy }}" >> ${{ env.TEMP_DIR }}/preflight_report.md
          echo "- AI Temperature: ${{ inputs.gemini_temperature }}" >> ${{ env.TEMP_DIR }}/preflight_report.md
          echo "- Conflict Threshold: ${{ inputs.conflict_threshold }}" >> ${{ env.TEMP_DIR }}/preflight_report.md
          
          cat ${{ env.TEMP_DIR }}/preflight_report.md

# ========================================================================
# MAIN MERGE EXECUTION ENGINE
# ========================================================================
  execute_merge:
    name: "⚡ Execute Intelligent Merge"
    runs-on: ubuntu-latest-16core  # More CPU for parallel processing
    needs: preflight_validation
    if: ${{ needs.preflight_validation.outputs.validation_passed == 'true' && needs.preflight_validation.outputs.merge_viable == 'true' }}
    
    env:
      # State tracking
      MERGE_START_TIME: ${{ github.run_id }}
      MERGE_PHASE: "initialization"
      
      # Git configuration for this job
      GIT_AUTHOR_NAME: "Horizon Merge Bot"
      GIT_AUTHOR_EMAIL: "horizon@${{ github.repository_owner }}.github.com"
      GIT_COMMITTER_NAME: "Horizon Merge Bot"
      GIT_COMMITTER_EMAIL: "horizon@${{ github.repository_owner }}.github.com"
    
    outputs:
      merge_successful: ${{ steps.finalize.outputs.success }}
      conflicts_resolved: ${{ steps.engine.outputs.conflicts_resolved }}
      ai_requests_made: ${{ steps.engine.outputs.ai_requests }}
      merge_branch: ${{ steps.init.outputs.merge_branch }}
    
    steps:
      # ----------------------------------------------------------------
      # PHASE 1: OPTIMIZED SYSTEM PREPARATION
      # ----------------------------------------------------------------
      - name: "🚀 Phase 1 - System Optimization"
        shell: bash
        run: |
          echo "=== SYSTEM OPTIMIZATION ==="
          
          # Free disk space aggressively
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          sudo journalctl --vacuum-time=1d
          
          # Install optimized dependencies
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git-lfs \
            python3.11 \
            python3.11-venv \
            python3.11-dev \
            build-essential \
            pkg-config \
            libssl-dev \
            libffi-dev \
            pigz \
            pbzip2 \
            pv \
            moreutils \
            rsync \
            tmux  # For session management
          
          # Create and activate virtual environment
          python3.11 -m venv /opt/horizon-venv
          source /opt/horizon-venv/bin/activate
          
          # Install Python packages with optimizations
          export PIP_NO_CACHE_DIR=1
          pip install --upgrade pip wheel setuptools
          pip install \
            google-generativeai==0.3.2 \
            aiohttp==3.9.3 \
            aiolimiter==1.1.0 \
            backoff==2.2.1 \
            redis==5.0.1 \
            pydantic==2.5.0 \
            numpy==1.24.3 \
            tqdm==4.66.1 \
            colorama==0.4.6 \
            humanize==4.9.0 \
            prometheus-client==0.19.0 \
            structlog==23.2.0
          
          echo "/opt/horizon-venv/bin" >> $GITHUB_PATH
          
          # Configure system limits
          ulimit -n 65536
          sysctl -w vm.swappiness=10
          
          echo "System optimization complete"
      
      - name: "📥 Checkout Repository (Optimized)"
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0  # Full history for better merge
          submodules: recursive
          lfs: true
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
      
      - name: "⚙️ Configure Advanced Git"
        shell: bash
        run: |
          echo "=== ADVANCED GIT CONFIGURATION ==="
          
          # Performance optimizations
          git config --global core.preloadIndex true
          git config --global core.fscache true
          git config --global core.packedGitLimit 2g
          git config --global core.packedGitWindowSize 1g
          git config --global pack.deltaCacheSize 2g
          git config --global pack.windowMemory 2g
          git config --global pack.threads 8
          git config --global diff.renameLimit 999999
          git config --global merge.renameLimit 999999
          
          # Merge strategy configuration
          git config --global merge.ort.renamelimit 999999
          git config --global merge.verbosity 2
          
          # Binary handling configuration
          cat > .git/info/attributes << 'EOF'
          # Kernel-specific binary files
          *.ko binary -delta
          *.dtb binary -delta
          *.dtbo binary -delta
          *.img binary -delta
          *.bin binary -delta
          
          # Compression formats
          *.gz binary -delta
          *.zip binary -delta
          *.xz binary -delta
          *.bz2 binary -delta
          
          # Object files
          *.o binary -delta
          *.a binary -delta
          *.so binary -delta
          
          # Text files for merge
          *.c text diff=cpp
          *.h text diff=cpp
          *.dts text
          *.dtsi text
          *.mk text
          Makefile text
          Kconfig text
          *.sh text eol=lf
          *.py text eol=lf
          EOF
          
          echo "Git configuration complete"
      
      # ----------------------------------------------------------------
      # PHASE 2: INTELLIGENT MERGE INITIATION
      # ----------------------------------------------------------------
      - name: "🔀 Phase 2 - Strategic Merge Initiation"
        id: init
        shell: bash
        run: |
          echo "=== STRATEGIC MERGE INITIATION ==="
          
          # Create unique merge branch
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          MERGE_BRANCH="horizon/${{ inputs.target_branch }}-merge-$TIMESTAMP"
          echo "Creating merge branch: $MERGE_BRANCH"
          
          git checkout -b "$MERGE_BRANCH"
          echo "merge_branch=$MERGE_BRANCH" >> $GITHUB_OUTPUT
          
          # Add upstream with validation
          echo "Adding upstream remote: ${{ inputs.upstream_repo }}"
          git remote add upstream "${{ inputs.upstream_repo }}" 2>/dev/null || \
            git remote set-url upstream "${{ inputs.upstream_repo }}"
          
          # Fetch with parallel threads and compression
          echo "Fetching upstream changes..."
          time git fetch upstream "${{ inputs.upstream_branch }}" \
            --depth=${{ env.GIT_DEPTH }} \
            --no-tags \
            --progress \
            -j8 \
            --recurse-submodules=no
          
          # Clean large directories that shouldn't be merged
          echo "Cleaning non-merge directories..."
          for dir in toolchains out android prebuilts obj .repo; do
            if [[ -d "$dir" ]]; then
              echo "  Cleaning $dir"
              git rm -rf --cached "$dir" 2>/dev/null || true
              rm -rf "$dir"
            fi
          done
          
          # Save pre-merge state
          git rev-parse HEAD > "${{ env.TEMP_DIR }}/pre_merge_head.txt"
          git rev-parse "upstream/${{ inputs.upstream_branch }}" > "${{ env.TEMP_DIR }}/upstream_head.txt"
          
          echo "Merge initialization complete"
      
      - name: "🤝 Execute Optimized Merge"
        id: merge
        shell: bash
        run: |
          echo "=== EXECUTING OPTIMIZED MERGE ==="
          
          # Configure merge drivers for specific file types
          cat > .git/config.merge << 'EOF'
          [merge "kconfig"]
            name = Kconfig merge driver
            driver = /usr/bin/true %O %A %B
          EOF
          
          # Perform the merge with multiple strategies
          set +e  # Allow merge to fail (we expect conflicts)
          
          echo "Attempting primary merge strategy (ORT)..."
          MERGE_OUTPUT=$(timeout 300 git merge \
            "upstream/${{ inputs.upstream_branch }}" \
            --no-commit \
            --no-ff \
            --strategy=${{ env.GIT_STRATEGY }} \
            --strategy-option="find-renames=60%" \
            --strategy-option="ignore-all-space" \
            --strategy-option="diff-algorithm=histogram" \
            --strategy-option="renamelimit=999999" \
            --stat \
            --summary 2>&1)
          
          MERGE_EXIT=$?
          set -e
          
          echo "Merge exit code: $MERGE_EXIT"
          echo "$MERGE_OUTPUT"
          
          # Capture conflict information
          if [[ $MERSE_EXIT -eq 0 ]]; then
            echo "✅ Clean merge - no conflicts"
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
            echo "conflict_count=0" >> $GITHUB_OUTPUT
          else
            # Extract conflict files
            CONFLICT_FILES=$(git diff --name-only --diff-filter=U)
            CONFLICT_COUNT=$(echo "$CONFLICT_FILES" | wc -l | tr -d ' ')
            
            echo "$CONFLICT_FILES" > "${{ env.TEMP_DIR }}/conflict_files.txt"
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
            echo "conflict_count=$CONFLICT_COUNT" >> $GITHUB_OUTPUT
            
            # Analyze conflict types
            echo "=== CONFLICT ANALYSIS ==="
            for file in $CONFLICT_FILES; do
              if [[ -f "$file" ]]; then
                SIZE=$(stat -c%s "$file" 2>/dev/null || echo "0")
                EXT="${file##*.}"
                echo "$file|$SIZE|$EXT" >> "${{ env.TEMP_DIR }}/conflict_analysis.csv"
              fi
            done
            
            echo "Detected $CONFLICT_COUNT conflicts"
            echo "Analysis saved to ${{ env.TEMP_DIR }}/conflict_analysis.csv"
          fi
          
          # Save merge statistics
          git diff --stat > "${{ env.TEMP_DIR }}/merge_statistics.txt"
      
      # ----------------------------------------------------------------
      # PHASE 3: HORIZON AI RESOLUTION ENGINE
      # ----------------------------------------------------------------
      - name: "🧠 Phase 3 - Deploy Horizon AI Engine"
        id: deploy
        if: ${{ steps.merge.outputs.has_conflicts == 'true' }}
        shell: bash
        run: |
          echo "=== DEPLOYING HORIZON AI ENGINE ==="
          
          # Create the advanced AI engine
          cat > /opt/horizon_engine.py << 'EOF'
          #!/usr/bin/env python3
          """
          HORIZON AI MERGE ENGINE v4.0 - Enterprise Grade
          Advanced conflict resolution with Gemini 2.5 Flash
          """
          
          import asyncio
          import aiohttp
          import json
          import time
          import re
          import os
          import sys
          import subprocess
          import traceback
          import hashlib
          import statistics
          from datetime import datetime, timedelta
          from typing import Dict, List, Optional, Tuple, Any
          from dataclasses import dataclass, field
          from enum import Enum
          from pathlib import Path
          from collections import defaultdict, deque
          import aiolimiter
          import backoff
          import google.generativeai as genai
          from pydantic import BaseModel, Field, validator
          from tqdm import tqdm
          import structlog
          import numpy as np
          from prometheus_client import Counter, Histogram, Summary, generate_latest
          
          # ============ METRICS COLLECTION ============
          METRICS = {
              'conflicts_total': Counter('horizon_conflicts_total', 'Total conflicts processed'),
              'conflicts_resolved': Counter('horizon_conflicts_resolved', 'Conflicts successfully resolved'),
              'conflicts_failed': Counter('horizon_conflicts_failed', 'Conflicts resolution failed'),
              'ai_requests': Counter('horizon_ai_requests', 'AI API requests made'),
              'ai_errors': Counter('horizon_ai_errors', 'AI API errors'),
              'processing_time': Histogram('horizon_processing_time', 'Time to process conflicts'),
              'token_usage': Summary('horizon_token_usage', 'Tokens used in AI requests'),
          }
          
          # ============ CONFIGURATION ============
          class MergeStrategy(Enum):
              CONSERVATIVE = "conservative"  # Prefer local changes
              AGGRESSIVE = "aggressive"     # Prefer upstream
              INTELLIGENT = "intelligent"   # Context-aware
              HYBRID = "hybrid"             # Mixed approach
          
          class FileType(Enum):
              KERNEL_C = ('.c',)
              KERNEL_H = ('.h',)
              DTS = ('.dts', '.dtsi')
              MAKEFILE = ('Makefile', '.mk')
              KCONFIG = ('Kconfig',)
              SCRIPT = ('.sh', '.py')
              CONFIG = ('.config', '_defconfig')
              DOCUMENTATION = ('.txt', '.md', '.rst')
              BINARY = ('.ko', '.dtb', '.img', '.bin')
              
              @classmethod
              def from_filename(cls, filename: str) -> 'FileType':
                  for file_type in cls:
                      for ext in file_type.value:
                          if filename.endswith(ext):
                              return file_type
                  return None
          
          @dataclass
          class HorizonConfig:
              # Gemini Configuration
              gemini_api_key: str
              gemini_model: str = "gemini-2.5-flash-exp"
              gemini_temperature: float = 0.1
              gemini_max_tokens: int = 8192
              
              # Rate Limiting
              requests_per_minute: int = 15
              tokens_per_minute: int = 1000000
              max_concurrent_requests: int = 2
              request_timeout: int = 90
              
              # Processing
              max_file_size_mb: int = 5
              max_conflict_size_chars: int = 10000
              max_total_conflicts: int = 1000
              
              # Strategy
              merge_strategy: MergeStrategy = MergeStrategy.HYBRID
              enable_heuristics: bool = True
              enable_validation: bool = True
              create_backups: bool = True
              
              # Fallbacks
              fallback_ai_configs: List[Dict] = field(default_factory=list)
              fallback_strategy: str = "conservative"  # conservative|aggressive|skip
              
              @validator('gemini_temperature')
              def validate_temperature(cls, v):
                  if v < 0.0 or v > 1.0:
                      raise ValueError('Temperature must be between 0.0 and 1.0')
                  return v
          
          # ============ DATA MODELS ============
          class ConflictBlock(BaseModel):
              filepath: Path
              local_content: str
              remote_content: str
              context_before: str = ""
              context_after: str = ""
              line_start: int
              line_end: int
              file_type: Optional[FileType] = None
              conflict_hash: str = ""
              metadata: Dict[str, Any] = Field(default_factory=dict)
              
              class Config:
                  arbitrary_types_allowed = True
              
              @validator('conflict_hash', pre=True, always=True)
              def generate_hash(cls, v, values):
                  if v:
                      return v
                  content = f"{values.get('local_content', '')}{values.get('remote_content', '')}"
                  return hashlib.sha256(content.encode()).hexdigest()[:16]
              
              @property
              def estimated_tokens(self) -> int:
                  """Estimate token count for the entire conflict"""
                  total_chars = len(self.local_content) + len(self.remote_content)
                  return total_chars // 4  # Rough estimation
          
          class ResolutionResult(BaseModel):
              conflict_hash: str
              resolved_content: str
              method: str  # heuristic|gemini|fallback|manual
              confidence: float  # 0.0 to 1.0
              processing_time: float
              tokens_used: int = 0
              validation_passed: bool = True
              error: Optional[str] = None
              
              @validator('confidence')
              def validate_confidence(cls, v):
                  return max(0.0, min(1.0, v))
          
          # ============ RATE LIMITER ============
          class TokenBucketLimiter:
              """Advanced token bucket rate limiter for Gemini 2.5 Flash"""
              
              def __init__(self, rpm: int = 15, tpm: int = 1000000):
                  self.rpm = rpm
                  self.tpm = tpm
                  self.requests = deque()
                  self.tokens_used = 0
                  self.window_start = datetime.now()
                  self.lock = asyncio.Lock()
                  
              async def acquire(self, estimated_tokens: int = 1000) -> float:
                  """Acquire permission to make a request, returns wait time"""
                  async with self.lock:
                      now = datetime.now()
                      
                      # Reset window if expired
                      if now - self.window_start > timedelta(minutes=1):
                          self.requests.clear()
                          self.tokens_used = 0
                          self.window_start = now
                      
                      # Calculate wait time for RPM limit
                      wait_time_rpm = 0.0
                      if len(self.requests) >= self.rpm:
                          oldest_request = self.requests[0]
                          time_since_oldest = (now - oldest_request).total_seconds()
                          if time_since_oldest < 60:
                              wait_time_rpm = 60 - time_since_oldest
                      
                      # Calculate wait time for TPM limit
                      wait_time_tpm = 0.0
                      available_tokens = self.tpm - self.tokens_used
                      if estimated_tokens > available_tokens:
                          tokens_needed = estimated_tokens - available_tokens
                          wait_time_tpm = (tokens_needed / self.tpm) * 60
                      
                      # Use the longer wait time
                      wait_time = max(wait_time_rpm, wait_time_tpm)
                      
                      if wait_time > 0:
                          await asyncio.sleep(wait_time)
                          now = datetime.now() + timedelta(seconds=wait_time)
                          
                          # Reset after waiting
                          if now - self.window_start > timedelta(minutes=1):
                              self.requests.clear()
                              self.tokens_used = 0
                              self.window_start = now
                      
                      # Record this request
                      self.requests.append(now)
                      self.tokens_used += estimated_tokens
                      
                      # Clean old requests
                      while self.requests and (now - self.requests[0]).total_seconds() > 60:
                          self.requests.popleft()
                      
                      return wait_time
          
          # ============ HEURISTIC RESOLVER ============
          class HeuristicResolver:
              """Advanced heuristic resolution for kernel-specific patterns"""
              
              @staticmethod
              def resolve_kernel_specific(conflict: ConflictBlock) -> Optional[ResolutionResult]:
                  """Kernel-specific heuristic rules"""
                  
                  # Kernel version updates in Makefile
                  if conflict.filepath.name == 'Makefile':
                      return HeuristicResolver._resolve_makefile_version(conflict)
                  
                  # Kconfig conflicts
                  if conflict.file_type == FileType.KCONFIG:
                      return HeuristicResolver._resolve_kconfig(conflict)
                  
                  # Device tree conflicts
                  if conflict.file_type == FileType.DTS:
                      return HeuristicResolver._resolve_device_tree(conflict)
                  
                  # Header file include conflicts
                  if conflict.file_type == FileType.KERNEL_H:
                      if all(l.strip().startswith('#include') for l in conflict.local_content.split('\n') + conflict.remote_content.split('\n') if l.strip()):
                          return HeuristicResolver._resolve_includes(conflict)
                  
                  # Gitignore conflicts
                  if conflict.filepath.name == '.gitignore':
                      return HeuristicResolver._resolve_gitignore(conflict)
                  
                  return None
              
              @staticmethod
              def _resolve_makefile_version(conflict: ConflictBlock) -> Optional[ResolutionResult]:
                  """Resolve Makefile version conflicts (prefer newer version)"""
                  import re
                  
                  version_patterns = [
                      r'^VERSION\s*=\s*(\d+)',
                      r'^PATCHLEVEL\s*=\s*(\d+)',
                      r'^SUBLEVEL\s*=\s*(\d+)',
                      r'^EXTRAVERSION\s*=\s*([\w\.-]+)'
                  ]
                  
                  local_versions = {}
                  remote_versions = {}
                  
                  for pattern in version_patterns:
                      local_match = re.search(pattern, conflict.local_content, re.MULTILINE)
                      remote_match = re.search(pattern, conflict.remote_content, re.MULTILINE)
                      
                      if local_match:
                          local_versions[pattern] = local_match.group(1)
                      if remote_match:
                          remote_versions[pattern] = remote_match.group(1)
                  
                  # If remote has version info and local doesn't, use remote
                  if remote_versions and not local_versions:
                      return ResolutionResult(
                          conflict_hash=conflict.conflict_hash,
                          resolved_content=conflict.remote_content,
                          method="heuristic",
                          confidence=0.9,
                          processing_time=0.0
                      )
                  
                  # If both have versions, compare and pick higher
                  if local_versions and remote_versions:
                      # Simple numeric comparison for VERSION/PATCHLEVEL/SUBLEVEL
                      for pattern in version_patterns[:3]:  # VERSION, PATCHLEVEL, SUBLEVEL
                          if pattern in local_versions and pattern in remote_versions:
                              local_val = int(local_versions[pattern])
                              remote_val = int(remote_versions[pattern])
                              if remote_val > local_val:
                                  # Use remote's line but preserve local's structure
                                  lines = conflict.local_content.split('\n')
                                  for i, line in enumerate(lines):
                                      if re.match(pattern, line.strip()):
                                          lines[i] = re.search(f'^{pattern.split("=")[0].strip()}\s*=\s*\d+', 
                                                             conflict.remote_content, re.MULTILINE).group()
                                  return ResolutionResult(
                                      conflict_hash=conflict.conflict_hash,
                                      resolved_content='\n'.join(lines),
                                      method="heuristic",
                                      confidence=0.8,
                                      processing_time=0.0
                                  )
                  
                  return None
              
              @staticmethod
              def _resolve_kconfig(conflict: ConflictBlock) -> Optional[ResolutionResult]:
                  """Merge Kconfig entries intelligently"""
                  local_lines = [l.rstrip() for l in conflict.local_content.split('\n') if l.strip()]
                  remote_lines = [l.rstrip() for l in conflict.remote_content.split('\n') if l.strip()]
                  
                  # Merge unique config entries
                  merged = []
                  seen_configs = set()
                  
                  for line in local_lines + remote_lines:
                      # Extract config name for deduplication
                      config_match = re.match(r'^\s*(config|menuconfig)\s+(\w+)', line)
                      if config_match:
                          config_id = config_match.group(2)
                          if config_id not in seen_configs:
                              seen_configs.add(config_id)
                              merged.append(line)
                      else:
                          merged.append(line)
                  
                  if merged:
                      return ResolutionResult(
                          conflict_hash=conflict.conflict_hash,
                          resolved_content='\n'.join(merged),
                          method="heuristic",
                          confidence=0.85,
                          processing_time=0.0
                      )
                  
                  return None
              
              @staticmethod
              def _resolve_device_tree(conflict: ConflictBlock) -> Optional[ResolutionResult]:
                  """Merge device tree nodes"""
                  # DTS files often have independent nodes that can be merged
                  local_nodes = conflict.local_content.strip().split(';')
                  remote_nodes = conflict.remote_content.strip().split(';')
                  
                  merged_nodes = []
                  seen_nodes = set()
                  
                  for node in local_nodes + remote_nodes:
                      node = node.strip()
                      if node and node not in seen_nodes:
                          seen_nodes.add(node)
                          merged_nodes.append(node)
                  
                  if merged_nodes:
                      return ResolutionResult(
                          conflict_hash=conflict.conflict_hash,
                          resolved_content='; '.join(merged_nodes) + (';' if merged_nodes else ''),
                          method="heuristic",
                          confidence=0.8,
                          processing_time=0.0
                      )
                  
                  return None
              
              @staticmethod
              def _resolve_includes(conflict: ConflictBlock) -> Optional[ResolutionResult]:
                  """Merge include statements without duplicates"""
                  includes = []
                  seen_includes = set()
                  
                  for line in (conflict.local_content.split('\n') + conflict.remote_content.split('\n')):
                      line = line.strip()
                      if line and line not in seen_includes:
                          includes.append(line)
                          seen_includes.add(line)
                  
                  if includes:
                      return ResolutionResult(
                          conflict_hash=conflict.conflict_hash,
                          resolved_content='\n'.join(includes),
                          method="heuristic",
                          confidence=0.95,
                          processing_time=0.0
                      )
                  
                  return None
              
              @staticmethod
              def _resolve_gitignore(conflict: ConflictBlock) -> Optional[ResolutionResult]:
                  """Merge .gitignore patterns"""
                  patterns = set()
                  
                  for line in (conflict.local_content.split('\n') + conflict.remote_content.split('\n')):
                      line = line.strip()
                      if line and not line.startswith('#'):
                          patterns.add(line)
                  
                  if patterns:
                      sorted_patterns = sorted(patterns)
                      return ResolutionResult(
                          conflict_hash=conflict.conflict_hash,
                          resolved_content='\n'.join(sorted_patterns),
                          method="heuristic",
                          confidence=0.95,
                          processing_time=0.0
                      )
                  
                  return None
          
          # ============ GEMINI AI CLIENT ============
          class GeminiAIClient:
              """Advanced Gemini 2.5 Flash client with proper rate limiting"""
              
              def __init__(self, config: HorizonConfig):
                  self.config = config
                  self.rate_limiter = TokenBucketLimiter(
                      rpm=config.requests_per_minute,
                      tpm=config.tokens_per_minute
                  )
                  self.session = None
                  self.genai_client = None
                  self.model = None
                  
                  # Configure Gemini
                  genai.configure(api_key=config.gemini_api_key)
                  self.genai_client = genai
                  self.model = self.genai_client.GenerativeModel(config.gemini_model)
              
              async def __aenter__(self):
                  self.session = aiohttp.ClientSession(
                      timeout=aiohttp.ClientTimeout(total=self.config.request_timeout)
                  )
                  return self
              
              async def __aexit__(self, exc_type, exc_val, exc_tb):
                  if self.session:
                      await self.session.close()
              
              @backoff.on_exception(
                  backoff.expo,
                  (aiohttp.ClientError, asyncio.TimeoutError, Exception),
                  max_tries=3,
                  max_time=300,
                  jitter=backoff.full_jitter
              )
              async def resolve_conflict(self, conflict: ConflictBlock) -> Optional[ResolutionResult]:
                  """Resolve conflict using Gemini 2.5 Flash"""
                  
                  start_time = time.time()
                  METRICS['ai_requests'].inc()
                  
                  # Apply rate limiting
                  wait_time = await self.rate_limiter.acquire(conflict.estimated_tokens)
                  if wait_time > 1.0:
                      structlog.get_logger().info("Rate limited", wait_seconds=wait_time)
                  
                  try:
                      # Build kernel-specific prompt
                      prompt = self._build_kernel_prompt(conflict)
                      
                      # Generate content
                      response = self.model.generate_content(
                          prompt,
                          generation_config={
                              "temperature": self.config.gemini_temperature,
                              "max_output_tokens": self.config.gemini_max_tokens,
                              "top_p": 0.95,
                              "top_k": 40,
                          },
                          safety_settings=[
                              {"category": "HARM_CATEGORY_HARASSMENT", "threshold": "BLOCK_NONE"},
                              {"category": "HARM_CATEGORY_HATE_SPEECH", "threshold": "BLOCK_NONE"},
                              {"category": "HARM_CATEGORY_SEXUALLY_EXPLICIT", "threshold": "BLOCK_NONE"},
                              {"category": "HARM_CATEGORY_DANGEROUS_CONTENT", "threshold": "BLOCK_NONE"}
                          ]
                      )
                      
                      processing_time = time.time() - start_time
                      
                      if response and response.text:
                          # Clean and validate response
                          cleaned = self._clean_response(response.text)
                          
                          # Estimate token usage
                          input_tokens = len(prompt) // 4
                          output_tokens = len(cleaned) // 4
                          total_tokens = input_tokens + output_tokens
                          METRICS['token_usage'].observe(total_tokens)
                          
                          # Validate syntax if enabled
                          validation_passed = True
                          if self.config.enable_validation:
                              validation_passed = self._validate_solution(cleaned, conflict.filepath)
                          
                          return ResolutionResult(
                              conflict_hash=conflict.conflict_hash,
                              resolved_content=cleaned,
                              method="gemini",
                              confidence=0.7,  # Base confidence for AI
                              processing_time=processing_time,
                              tokens_used=total_tokens,
                              validation_passed=validation_passed
                          )
                      
                  except Exception as e:
                      METRICS['ai_errors'].inc()
                      structlog.get_logger().error("Gemini resolution failed", 
                                                 error=str(e), 
                                                 conflict_hash=conflict.conflict_hash)
                      
                      return ResolutionResult(
                          conflict_hash=conflict.conflict_hash,
                          resolved_content=conflict.local_content,  # Fallback to local
                          method="gemini",
                          confidence=0.0,
                          processing_time=time.time() - start_time,
                          validation_passed=False,
                          error=str(e)
                      )
                  
                  return None
              
              def _build_kernel_prompt(self, conflict: ConflictBlock) -> str:
                  """Build kernel-specific prompt for Gemini"""
                  
                  file_type_desc = {
                      FileType.KERNEL_C: "Linux kernel C source file",
                      FileType.KERNEL_H: "Linux kernel header file",
                      FileType.DTS: "Device Tree Source file",
                      FileType.MAKEFILE: "Linux kernel Makefile",
                      FileType.KCONFIG: "Kernel configuration file",
                      FileType.SCRIPT: "Build script",
                      FileType.CONFIG: "Kernel configuration",
                      FileType.DOCUMENTATION: "Documentation file"
                  }.get(conflict.file_type, "file")
                  
                  strategy_instructions = {
                      MergeStrategy.CONSERVATIVE: """
                      PREFERENCE RULES:
                      1. STRONGLY PREFER LOCAL CHANGES (between <<<<<<< and =======)
                      2. Only use upstream changes if they don't conflict with local logic
                      3. Preserve local driver implementations, custom features, and optimizations
                      4. If in doubt, keep the local version
                      """,
                      MergeStrategy.AGGRESSIVE: """
                      PREFERENCE RULES:
                      1. STRONGLY PREFER UPSTREAM CHANGES (between ======= and >>>>>>>)
                      2. Only keep local changes if they're critical bug fixes
                      3. Update to upstream standards and conventions
                      4. If in doubt, use the upstream version
                      """,
                      MergeStrategy.INTELLIGENT: """
                      PREFERENCE RULES:
                      1. Analyze context to determine which change is more appropriate
                      2. For bug fixes: prefer the fix
                      3. For features: prefer the more complete implementation
                      4. For refactoring: prefer the cleaner version
                      5. Merge compatible changes when possible
                      """,
                      MergeStrategy.HYBRID: """
                      PREFERENCE RULES:
                      1. For driver files (.c/.h): Prefer LOCAL changes (custom drivers)
                      2. For core kernel files: Prefer UPSTREAM changes (security/stability)
                      3. For Makefiles/Kconfig: Merge both, prefer newer versions
                      4. For Device Trees: Merge compatible nodes
                      """
                  }.get(self.config.merge_strategy, "")
                  
                  prompt = f"""You are a senior Linux kernel maintainer with 20+ years of experience.
          Your task is to resolve a merge conflict in a {file_type_desc}.

          FILE: {conflict.filepath.name}
          CONTEXT TYPE: {conflict.file_type.name if conflict.file_type else 'UNKNOWN'}

          {strategy_instructions}

          CRITICAL KERNEL-SPECIFIC RULES:
          1. PRESERVE KERNEL CODING STYLE (Linux kernel style guide)
          2. MAINTAIN BACKWARD COMPATIBILITY for drivers and APIs
          3. PRESERVE KERNEL MACROS and inline functions
          4. MAINTAIN SPDX LICENSE IDENTIFIERS
          5. PRESERVE KERNEL_DOC comments for APIs
          6. ENSURE NO SYNTAX ERRORS (balanced braces, parentheses, semicolons)

          CONTEXT BEFORE CONFLICT (last relevant lines):
          ```
          {conflict.context_before[-500:] if conflict.context_before else "No context"}
          ```

          === MERGE CONFLICT ===
          <<<<<<< LOCAL (our kernel changes)
          {conflict.local_content}
          =======
          {conflict.remote_content}
          >>>>>>> REMOTE (upstream kernel changes)

          CONTEXT AFTER CONFLICT (next relevant lines):
          ```
          {conflict.context_after[:500] if conflict.context_after else "No context"}
          ```

          OUTPUT REQUIREMENTS:
          1. Output ONLY the resolved code block
          2. NO explanations, comments, or markdown formatting
          3. Ensure it's syntactically correct C code (if applicable)
          4. Maintain proper indentation (tabs for kernel code)
          5. Preserve all preprocessor directives (#ifdef, #endif, etc.)

          RESOLVED CODE:"""
                  
                  return prompt
              
              def _clean_response(self, text: str) -> str:
                  """Clean Gemini response"""
                  # Remove markdown code blocks
                  text = re.sub(r'^```[a-z]*\n', '', text, flags=re.MULTILINE)
                  text = re.sub(r'\n```$', '', text)
                  
                  # Remove any explanatory text
                  lines = text.split('\n')
                  cleaned_lines = []
                  in_code = True
                  
                  for line in lines:
                      if line.strip().lower().startswith(('note:', 'explanation:', 'here is', 'the resolved')):
                          in_code = False
                      if in_code or line.strip():
                          cleaned_lines.append(line)
                  
                  return '\n'.join(cleaned_lines).strip()
              
              def _validate_solution(self, text: str, filepath: Path) -> bool:
                  """Validate the resolved code for basic syntax"""
                  
                  if filepath.suffix in ['.c', '.h']:
                      # Check for balanced braces and parentheses
                      if text.count('{') != text.count('}'):
                          return False
                      if text.count('(') != text.count(')'):
                          return False
                      
                      # Check for stray conflict markers
                      if any(marker in text for marker in ['<<<<<<<', '=======', '>>>>>>>']):
                          return False
                      
                      # Check for proper semicolon usage in statements
                      lines = text.split('\n')
                      for i, line in enumerate(lines):
                          line = line.strip()
                          if line and not line.startswith(('#', '//', '/*', '*')):
                              if line.endswith('{') and i > 0:
                                  prev_line = lines[i-1].strip()
                                  if not prev_line.endswith(('{', '}', ';', ':')):
                                      return False
                  
                  return True
          
          # ============ MAIN ENGINE ============
          class HorizonEngine:
              """Main Horizon AI engine orchestrator"""
              
              def __init__(self, config: HorizonConfig):
                  self.config = config
                  self.logger = structlog.get_logger()
                  self.state_file = Path(os.environ.get('STATE_FILE', './horizon_state.json'))
                  self.state = self._load_state()
                  
                  # Statistics
                  self.stats = {
                      'total_conflicts': 0,
                      'heuristic_resolutions': 0,
                      'ai_resolutions': 0,
                      'failed_resolutions': 0,
                      'total_processing_time': 0.0,
                      'total_tokens_used': 0
                  }
              
              def _load_state(self) -> Dict:
                  """Load engine state from file"""
                  if self.state_file.exists():
                      try:
                          with open(self.state_file, 'r') as f:
                              return json.load(f)
                      except:
                          return {}
                  return {}
              
              def _save_state(self):
                  """Save engine state to file"""
                  state = {
                      'stats': self.stats,
                      'processed_conflicts': list(self.state.get('processed_conflicts', [])),
                      'timestamp': datetime.now().isoformat()
                  }
                  with open(self.state_file, 'w') as f:
                      json.dump(state, f, indent=2)
              
              async def process_file(self, filepath: Path, ai_client: GeminiAIClient) -> bool:
                  """Process all conflicts in a single file"""
                  
                  try:
                      with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()
                  except Exception as e:
                      self.logger.error("Failed to read file", filepath=str(filepath), error=str(e))
                      return False
                  
                  if '<<<<<<<' not in content:
                      return True
                  
                  # Parse conflict blocks
                  conflicts = self._extract_conflicts(content, filepath)
                  self.stats['total_conflicts'] += len(conflicts)
                  
                  if not conflicts:
                      return True
                  
                  self.logger.info("Processing file conflicts", 
                                 filepath=str(filepath), 
                                 conflict_count=len(conflicts))
                  
                  # Process each conflict
                  resolutions = []
                  for conflict in conflicts:
                      # Skip if already processed (for resume capability)
                      if conflict.conflict_hash in self.state.get('processed_conflicts', []):
                          continue
                      
                      # Try heuristic resolution first
                      resolution = None
                      if self.config.enable_heuristics:
                          resolution = HeuristicResolver.resolve_kernel_specific(conflict)
                          if resolution:
                              self.stats['heuristic_resolutions'] += 1
                              self.logger.debug("Heuristic resolution successful", 
                                              conflict_hash=conflict.conflict_hash)
                      
                      # Fall back to AI if needed
                      if not resolution and ai_client:
                          resolution = await ai_client.resolve_conflict(conflict)
                          if resolution and resolution.validation_passed:
                              self.stats['ai_resolutions'] += 1
                              self.stats['total_tokens_used'] += resolution.tokens_used
                              self.logger.debug("AI resolution successful",
                                              conflict_hash=conflict.conflict_hash,
                                              confidence=resolution.confidence)
                      
                      # Final fallback
                      if not resolution:
                          self.stats['failed_resolutions'] += 1
                          resolution = ResolutionResult(
                              conflict_hash=conflict.conflict_hash,
                              resolved_content=conflict.local_content,  # Conservative fallback
                              method="fallback",
                              confidence=0.1,
                              processing_time=0.0,
                              validation_passed=True,
                              error="No resolution method succeeded"
                          )
                          self.logger.warning("Using fallback resolution", 
                                            conflict_hash=conflict.conflict_hash)
                      
                      resolutions.append((conflict, resolution))
                      
                      # Update state
                      if 'processed_conflicts' not in self.state:
                          self.state['processed_conflicts'] = []
                      self.state['processed_conflicts'].append(conflict.conflict_hash)
                      
                      # Save state periodically
                      if len(self.state['processed_conflicts']) % 10 == 0:
                          self._save_state()
                  
                  # Apply resolutions to file
                  if resolutions:
                      success = self._apply_resolutions(filepath, resolutions)
                      if success:
                          # Stage the file
                          subprocess.run(['git', 'add', str(filepath)], 
                                       capture_output=True, check=False)
                      
                      return success
                  
                  return True
              
              def _extract_conflicts(self, content: str, filepath: Path) -> List[ConflictBlock]:
                  """Extract all conflict blocks from file content"""
                  
                  lines = content.splitlines(keepends=True)
                  conflicts = []
                  i = 0
                  
                  while i < len(lines):
                      if lines[i].startswith('<<<<<<<'):
                          start_idx = i
                          conflict_info = self._parse_conflict_block(lines, i)
                          
                          if conflict_info:
                              conflict = ConflictBlock(
                                  filepath=filepath,
                                  local_content=conflict_info['local'],
                                  remote_content=conflict_info['remote'],
                                  context_before=conflict_info['context_before'],
                                  context_after=conflict_info['context_after'],
                                  line_start=start_idx,
                                  line_end=conflict_info['end_idx'],
                                  file_type=FileType.from_filename(filepath.name)
                              )
                              conflicts.append(conflict)
                              
                              i = conflict_info['end_idx'] + 1
                              continue
                      
                      i += 1
                  
                  return conflicts
              
              def _parse_conflict_block(self, lines: List[str], start_idx: int) -> Optional[Dict]:
                  """Parse a single conflict block"""
                  
                  if not lines[start_idx].startswith('<<<<<<<'):
                      return None
                  
                  i = start_idx + 1
                  local_lines = []
                  remote_lines = []
                  
                  # Extract local content
                  while i < len(lines) and not lines[i].startswith('======='):
                      local_lines.append(lines[i])
                      i += 1
                  
                  if i >= len(lines):
                      return None
                  
                  i += 1  # Skip =======
                  
                  # Extract remote content
                  while i < len(lines) and not lines[i].startswith('>>>>>>>'):
                      remote_lines.append(lines[i])
                      i += 1
                  
                  if i >= len(lines):
                      return None
                  
                  end_idx = i
                  
                  # Get context (5 lines before and after)
                  context_before = ''.join(lines[max(0, start_idx-5):start_idx])
                  context_after = ''.join(lines[end_idx+1:min(len(lines), end_idx+6)])
                  
                  return {
                      'local': ''.join(local_lines).rstrip(),
                      'remote': ''.join(remote_lines).rstrip(),
                      'context_before': context_before,
                      'context_after': context_after,
                      'end_idx': end_idx
                  }
              
              def _apply_resolutions(self, filepath: Path, 
                                   resolutions: List[Tuple[ConflictBlock, ResolutionResult]]) -> bool:
                  """Apply resolved conflicts back to the file"""
                  
                  try:
                      with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()
                  except Exception as e:
                      self.logger.error("Failed to read file for application", 
                                      filepath=str(filepath), error=str(e))
                      return False
                  
                  lines = content.splitlines(keepends=True)
                  output_lines = []
                  i = 0
                  
                  while i < len(lines):
                      if lines[i].startswith('<<<<<<<'):
                          # Find the matching conflict
                          conflict_found = False
                          for conflict, resolution in resolutions:
                              if conflict.line_start == i:
                                  # Add resolved content
                                  output_lines.append(resolution.resolved_content + '\n')
                                  i = conflict.line_end + 1
                                  conflict_found = True
                                  break
                          
                          if not conflict_found:
                              # No resolution found, skip conflict markers but keep content
                              i += 1
                              while i < len(lines) and not lines[i].startswith('>>>>>>>'):
                                  i += 1
                              if i < len(lines):
                                  i += 1
                      else:
                          output_lines.append(lines[i])
                          i += 1
                  
                  # Write back to file
                  try:
                      with open(filepath, 'w', encoding='utf-8') as f:
                          f.writelines(output_lines)
                      return True
                  except Exception as e:
                      self.logger.error("Failed to write resolved file", 
                                      filepath=str(filepath), error=str(e))
                      return False
              
              async def run(self, conflict_files: List[Path]) -> Dict:
                  """Main execution method"""
                  
                  self.logger.info("Starting Horizon AI Engine", 
                                 config=self.config.__dict__,
                                 file_count=len(conflict_files))
                  
                  start_time = time.time()
                  
                  # Initialize AI client
                  ai_client = None
                  if self.config.gemini_api_key:
                      ai_client = GeminiAIClient(self.config)
                  
                  # Process files
                  successful_files = 0
                  failed_files = []
                  
                  with tqdm(total=len(conflict_files), desc="Resolving conflicts") as pbar:
                      async with ai_client:
                          for filepath in conflict_files:
                              if filepath.exists():
                                  success = await self.process_file(filepath, ai_client)
                                  if success:
                                      successful_files += 1
                                  else:
                                      failed_files.append(str(filepath))
                              pbar.update(1)
                  
                  # Calculate statistics
                  self.stats['total_processing_time'] = time.time() - start_time
                  
                  # Generate report
                  report = {
                      'successful_files': successful_files,
                      'failed_files': failed_files,
                      'total_files': len(conflict_files),
                      'success_rate': (successful_files / len(conflict_files)) * 100 if conflict_files else 0,
                      'statistics': self.stats,
                      'timestamp': datetime.now().isoformat(),
                      'config': self.config.__dict__
                  }
                  
                  # Save final state
                  self._save_state()
                  
                  # Output metrics
                  metrics_output = generate_latest().decode('utf-8')
                  with open('horizon_metrics.prom', 'w') as f:
                      f.write(metrics_output)
                  
                  return report
          
          # ============ MAIN ENTRY POINT ============
          async def main():
              """Main entry point"""
              
              # Configure logging
              structlog.configure(
                  processors=[
                      structlog.processors.TimeStamper(fmt="iso"),
                      structlog.processors.JSONRenderer()
                  ]
              )
              logger = structlog.get_logger()
              
              try:
                  # Load configuration from environment
                  config = HorizonConfig(
                      gemini_api_key=os.environ.get('GEMINI_API_KEY', ''),
                      gemini_model=os.environ.get('GEMINI_MODEL', 'gemini-2.5-flash-exp'),
                      gemini_temperature=float(os.environ.get('GEMINI_TEMPERATURE', 0.1)),
                      requests_per_minute=int(os.environ.get('GEMINI_RPM_LIMIT', 15)),
                      tokens_per_minute=int(os.environ.get('GEMINI_TPM_LIMIT', 1000000)),
                      merge_strategy=MergeStrategy(os.environ.get('MERGE_STRATEGY', 'hybrid')),
                      enable_heuristics=os.environ.get('ENABLE_HEURISTICS', 'true').lower() == 'true',
                      enable_validation=os.environ.get('ENABLE_VALIDATION', 'true').lower() == 'true'
                  )
                  
                  # Load conflict files
                  conflict_files_path = os.environ.get('CONFLICT_FILES', './conflict_files.txt')
                  if not os.path.exists(conflict_files_path):
                      logger.info("No conflict files found")
                      return
                  
                  with open(conflict_files_path, 'r') as f:
                      conflict_files = [Path(line.strip()) for line in f if line.strip()]
                  
                  if not conflict_files:
                      logger.info("No conflicts to resolve")
                      return
                  
                  # Initialize and run engine
                  engine = HorizonEngine(config)
                  report = await engine.run(conflict_files)
                  
                  # Output report
                  report_file = os.environ.get('REPORT_FILE', './horizon_report.json')
                  with open(report_file, 'w') as f:
                      json.dump(report, f, indent=2)
                  
                  # Print summary
                  logger.info("Horizon AI Engine completed", 
                            success_rate=f"{report['success_rate']:.1f}%",
                            total_time=f"{report['statistics']['total_processing_time']:.1f}s",
                            conflicts_resolved=report['statistics']['total_conflicts'] - report['statistics']['failed_resolutions'])
                  
                  if report['failed_files']:
                      logger.warning("Some files failed", failed_files=report['failed_files'])
                  
                  # Set GitHub Actions outputs
                  if 'GITHUB_OUTPUT' in os.environ:
                      with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                          f.write(f"conflicts_resolved={report['statistics']['total_conflicts'] - report['statistics']['failed_resolutions']}\n")
                          f.write(f"ai_requests={report['statistics']['ai_resolutions']}\n")
                          f.write(f"success_rate={report['success_rate']}\n")
                          f.write(f"processing_time={report['statistics']['total_processing_time']}\n")
                          
              except Exception as e:
                  logger.error("Horizon AI Engine failed", error=str(e), traceback=traceback.format_exc())
                  sys.exit(1)
          
          if __name__ == "__main__":
            
              asyncio.run(main())
          EOF
          
          echo "Horizon AI Engine deployed successfully"
      
      - name: "🤖 Execute AI-Powered Resolution"
        id: engine
        if: ${{ steps.merge.outputs.has_conflicts == 'true' }}
        env:
          GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
          GEMINI_MODEL: ${{ env.GEMINI_MODEL }}
          GEMINI_TEMPERATURE: ${{ inputs.gemini_temperature }}
          GEMINI_RPM_LIMIT: ${{ env.GEMINI_RPM_LIMIT }}
          GEMINI_TPM_LIMIT: ${{ env.GEMINI_TPM_LIMIT }}
          MERGE_STRATEGY: ${{ inputs.merge_strategy }}
          CONFLICT_FILES: "${{ env.TEMP_DIR }}/conflict_files.txt"
          REPORT_FILE: "${{ env.TEMP_DIR }}/resolution_report.json"
          STATE_FILE: "${{ env.STATE_FILE }}"
          ENABLE_HEURISTICS: ${{ inputs.enable_preflight }}
          ENABLE_VALIDATION: ${{ inputs.enable_post_validation }}
        run: |
          echo "=== EXECUTING HORIZON AI ENGINE ==="
          
          # Activate virtual environment
          source /opt/horizon-venv/bin/activate
          
          # Run the engine
          python3 /opt/horizon_engine.py
          
          # Load and display report
          if [[ -f "${{ env.TEMP_DIR }}/resolution_report.json" ]]; then
            echo "=== RESOLUTION REPORT ==="
            cat "${{ env.TEMP_DIR }}/resolution_report.json" | jq '.'
            
            # Extract metrics for outputs
            CONFLICTS_RESOLVED=$(jq '.statistics.total_conflicts - .statistics.failed_resolutions' "${{ env.TEMP_DIR }}/resolution_report.json")
            AI_REQUESTS=$(jq '.statistics.ai_resolutions' "${{ env.TEMP_DIR }}/resolution_report.json")
            
            echo "conflicts_resolved=$CONFLICTS_RESOLVED" >> $GITHUB_OUTPUT
            echo "ai_requests=$AI_REQUESTS" >> $GITHUB_OUTPUT
          fi
      
      # ----------------------------------------------------------------
      # PHASE 4: POST-MERGE VALIDATION & SANITIZATION
      # ----------------------------------------------------------------
      - name: "✅ Phase 4 - Post-Merge Validation"
        id: validation
        shell: bash
        run: |
          echo "=== POST-MERGE VALIDATION ==="
          
          # Check for any remaining conflict markers
          echo "Checking for leftover conflict markers..."
          REMAINING_CONFLICTS=$(grep -r -l "<<<<<<<" . \
            --include="*.c" --include="*.h" \
            --include="*.dts" --include="*.dtsi" \
            --include="Makefile" --include="*.mk" \
            --include="Kconfig" --include="*.txt" 2>/dev/null | wc -l || echo "0")
          
          if [[ $REMAINING_CONFLICTS -gt 0 ]]; then
            echo "⚠️ Found $REMAINING_CONFLICTS files with leftover conflict markers"
            echo "Attempting automated cleanup..."
            
            # Safe cleanup of complete conflict blocks
            find . -type f \( -name "*.c" -o -name "*.h" -o -name "*.dts" -o -name "*.dtsi" \) \
              -exec grep -l "<<<<<<<" {} \; | while read file; do
                # Use sed to remove complete conflict blocks
                sed -i '/<<<<<<<.*/,/>>>>>>>.*/d' "$file" 2>/dev/null || true
              done
            
            # Remove any stray markers
            find . -type f \( -name "Makefile" -o -name "*.mk" -o -name "Kconfig" \) \
              -exec sed -i '/<<<<<<</d; /=======/d; />>>>>>>/d' {} \; 2>/dev/null || true
          fi
          
          # Check for unmerged files
          UNMERGED_FILES=$(git diff --name-only --diff-filter=U 2>/dev/null | wc -l || echo "0")
          if [[ $UNMERGED_FILES -gt 0 ]]; then
            echo "❌ CRITICAL: $UNMERGED_FILES files still have unmerged changes"
            echo "validation_passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # Validate basic syntax for C files
          if [[ "${{ inputs.enable_post_validation }}" == "true" ]]; then
            echo "Running basic syntax validation..."
            
            # Check for obvious syntax errors in C files
            find . -name "*.c" -type f | head -20 | while read file; do
              if [[ -f "$file" ]]; then
                # Check for balanced braces
                OPEN_BRACES=$(grep -o '{' "$file" | wc -l)
                CLOSE_BRACES=$(grep -o '}' "$file" | wc -l)
                if [[ $OPEN_BRACES -ne $CLOSE_BRACES ]]; then
                  echo "⚠️ Unbalanced braces in $file ($OPEN_BRACES vs $CLOSE_BRACES)"
                fi
                
                # Check for balanced parentheses
                OPEN_PAREN=$(grep -o '(' "$file" | wc -l)
                CLOSE_PAREN=$(grep -o ')' "$file" | wc -l)
                if [[ $OPEN_PAREN -ne $CLOSE_PAREN ]]; then
                  echo "⚠️ Unbalanced parentheses in $file ($OPEN_PAREN vs $CLOSE_PAREN)"
                fi
              fi
            done
          fi
          
          # Final git status check
          echo "=== FINAL GIT STATUS ==="
          git status --short | head -50
          
          echo "✅ Post-merge validation completed"
          echo "validation_passed=true" >> $GITHUB_OUTPUT
      
      # ----------------------------------------------------------------
      # PHASE 5: FINALIZATION & COMMIT
      # ----------------------------------------------------------------
      - name: "💾 Phase 5 - Final Commit"
        id: finalize
        shell: bash
        run: |
          echo "=== FINAL COMMIT PREPARATION ==="
          
          # Stage all changes
          git add .
          
          # Check if there are actual changes
          if git diff --cached --quiet; then
            echo "⚠️ No changes to commit"
            echo "success=false" >> $GITHUB_OUTPUT
            echo "no_changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Generate comprehensive commit message
          COMMIT_MESSAGE=$(cat << EOF
          HORIZON: AI-Powered Kernel Merge (${{ inputs.merge_strategy }})
          
          **Automated merge from upstream:** ${{ inputs.upstream_branch }}
          **Target branch:** ${{ inputs.target_branch }}
          **AI Model:** ${{ env.GEMINI_MODEL }}
          **Strategy:** ${{ inputs.merge_strategy }}
          
          **STATISTICS:**
          - Conflicts detected: ${{ steps.merge.outputs.conflict_count }}
          - Conflicts resolved: ${{ steps.engine.outputs.conflicts_resolved || 0 }}
          - AI requests made: ${{ steps.engine.outputs.ai_requests || 0 }}
          - Heuristic resolutions: $(( {{ steps.merge.outputs.conflict_count }} - {{ steps.engine.outputs.ai_requests || 0 }} ))
          
          **CONFIGURATION:**
          - Temperature: ${{ inputs.gemini_temperature }}
          - Preflight: ${{ inputs.enable_preflight }}
          - Post-validation: ${{ inputs.enable_post_validation }}
          
          **TECHNICAL DETAILS:**
          - Workflow: ${{ github.workflow }} #${{ github.run_number }}
          - Run ID: ${{ github.run_id }}
          - Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          **NOTES:**
          This is an automated merge performed by the Horizon AI Engine.
          Review changes carefully, especially in driver files and core kernel code.
          
          Signed-off-by: Horizon Merge Bot <horizon@${{ github.repository_owner }}.github.com>
          EOF
          )
          
          # Create commit
          echo "Creating commit..."
          git commit -m "$COMMIT_MESSAGE" --no-verify
          
          echo "✅ Commit created successfully"
          echo "success=true" >> $GITHUB_OUTPUT
          echo "no_changes=false" >> $GITHUB_OUTPUT

# ========================================================================
# FINAL PUSH & CLEANUP STRATEGIES
# ========================================================================
  finalize_merge:
    name: "🚀 Finalize & Push Merge"
    runs-on: ubuntu-latest-4core
    needs: [preflight_validation, execute_merge]
    if: ${{ needs.execute_merge.outputs.merge_successful == 'true' && needs.execute_merge.outputs.no_changes != 'true' }}
    
    steps:
      - name: "📥 Checkout Merge Branch"
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.execute_merge.outputs.merge_branch }}
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
      
      - name: "🔄 Push Strategy Decision"
        id: strategy
        shell: bash
        run: |
          echo "=== PUSH STRATEGY DECISION ==="
          
          if [[ "${{ inputs.create_recovery_pr }}" == "true" ]]; then
            echo "Strategy: Create Recovery Pull Request"
            echo "push_directly=false" >> $GITHUB_OUTPUT
          else
            echo "Strategy: Direct Push to Target Branch"
            echo "push_directly=true" >> $GITHUB_OUTPUT
          fi
          
          # Check branch protection status
          BRANCH_PROTECTED=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/branches/${{ inputs.target_branch }}/protection" \
            | grep -c "required_status_checks" || echo "0")
          
          if [[ $BRANCH_PROTECTED -gt 0 ]]; then
            echo "⚠️ Target branch has protection rules - PR recommended"
            echo "branch_protected=true" >> $GITHUB_OUTPUT
          else
            echo "branch_protected=false" >> $GITHUB_OUTPUT
          fi
      
      - name: "🚀 Direct Push to Target"
        if: ${{ steps.strategy.outputs.push_directly == 'true' && steps.strategy.outputs.branch_protected == 'false' }}
        shell: bash
        run: |
          echo "=== DIRECT PUSH TO TARGET BRANCH ==="
          
          MERGE_BRANCH="${{ needs.execute_merge.outputs.merge_branch }}"
          TARGET_BRANCH="${{ inputs.target_branch }}"
          
          echo "Pushing $MERGE_BRANCH to $TARGET_BRANCH..."
          
          # Push with retry logic and exponential backoff
          MAX_RETRIES=5
          RETRY_DELAY=10
          
          for ATTEMPT in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $ATTEMPT/$MAX_RETRIES..."
            
            if git push origin "$MERGE_BRANCH:$TARGET_BRANCH" --force-with-lease; then
              echo "✅ Successfully pushed to $TARGET_BRANCH"
              
              # Clean up temporary branch
              git push origin --delete "$MERGE_BRANCH" 2>/dev/null || true
              
              exit 0
            else
              echo "❌ Push failed (attempt $ATTEMPT)"
              
              if [[ $ATTEMPT -lt $MAX_RETRIES ]]; then
                WAIT_TIME=$((RETRY_DELAY * ATTEMPT))
                echo "Retrying in $WAIT_TIME seconds..."
                sleep $WAIT_TIME
                
                # Refresh the branch
                git fetch origin "$TARGET_BRANCH"
                git rebase "origin/$TARGET_BRANCH" || git rebase --abort
              fi
            fi
          done
          
          echo "❌ All push attempts failed"
          exit 1
      
      - name: "📝 Create Recovery Pull Request"
        if: ${{ steps.strategy.outputs.push_directly == 'false' || steps.strategy.outputs.branch_protected == 'true' }}
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          title: "🔀 HORIZON: AI-Powered Kernel Merge (${{ inputs.merge_strategy }})"
          body: |
            ## 🤖 AI-Powered Kernel Merge Complete
            
            **This pull request contains an automated merge from upstream using the Horizon AI Engine.**
            
            ### 📊 Merge Statistics
            - **Source Branch:** `${{ needs.execute_merge.outputs.merge_branch }}`
            - **Target Branch:** `${{ inputs.target_branch }}`
            - **Upstream:** `${{ inputs.upstream_repo }}` @ `${{ inputs.upstream_branch }}`
            - **Conflicts Detected:** `${{ needs.execute_merge.outputs.conflicts_resolved }}`
            - **AI Requests Made:** `${{ needs.execute_merge.outputs.ai_requests_made }}`
            - **AI Model:** `${{ env.GEMINI_MODEL }}`
            - **Merge Strategy:** `${{ inputs.merge_strategy }}`
            
            ### 🔧 Technical Details
            - **Workflow:** [${{ github.workflow }} #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - **Run ID:** `${{ github.run_id }}`
            - **Preflight Checks:** `${{ inputs.enable_preflight }}`
            - **Post Validation:** `${{ inputs.enable_post_validation }}`
            
            ### 📋 Next Steps
            1. **Review the changes carefully**, especially in:
               - Driver files (`.c`/`.h`)
               - Device tree files (`.dts`/`.dtsi`)
               - Makefiles and Kconfig
            2. **Run kernel builds** to verify compilation
            3. **Test on actual hardware** if possible
            4. **Merge when satisfied** with the resolution
            
            ### ⚠️ Important Notes
            - This merge was performed by AI and requires human review
            - Pay special attention to:
              - Driver compatibility
              - API changes
              - Configuration conflicts
              - License headers
            
            ### 📁 Generated Reports
            - Preflight analysis available in workflow logs
            - AI resolution details in workflow artifacts
            - Conflict resolution statistics in commit message
            
            ---
            
            *Automatically generated by the Horizon AI Merge Engine v4.0*
          branch: ${{ needs.execute_merge.outputs.merge_branch }}
          base: ${{ inputs.target_branch }}
          delete-branch: false
          draft: ${{ inputs.create_recovery_pr == 'true' }}
          labels: |
            automated-merge
            ai-generated
            kernel-merge
            needs-review
          assignees: ${{ github.actor }}
          reviewers: ${{ github.actor }}
          commit_message: ${{ steps.finalize.outputs.commit_message }}
      
      - name: "🧹 Cleanup Temporary Resources"
        if: always()
        shell: bash
        run: |
          echo "=== CLEANUP ==="
          
          # Clean up temporary directory
          if [[ -d "${{ env.TEMP_DIR }}" ]]; then
            rm -rf "${{ env.TEMP_DIR }}"
            echo "Cleaned temporary directory"
          fi
          
          # Remove state file
          if [[ -f "${{ env.STATE_FILE }}" ]]; then
            rm -f "${{ env.STATE_FILE }}"
          fi
          
          # Clean up Python cache
          find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true
          
          echo "Cleanup completed"

# ========================================================================
# FAILURE RECOVERY & REPORTING
# ========================================================================
  failure_recovery:
    name: "🆘 Failure Recovery & Reporting"
    runs-on: ubuntu-latest
    needs: [preflight_validation, execute_merge]
    if: ${{ failure() }}
    
    steps:
      - name: "📊 Generate Failure Analysis"
        shell: bash
        run: |
          echo "=== FAILURE ANALYSIS ==="
          
          # Collect failure information
          FAILURE_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          FAILED_JOB="${{ needs.preflight_validation.result == 'failure' && 'preflight_validation' || 'execute_merge' }}"
          
          cat << EOF > failure_analysis.md
          # 🚨 Horizon Merge Engine Failure
          
          ## Summary
          - **Timestamp:** $FAILURE_TIME
          - **Failed Job:** $FAILED_JOB
          - **Workflow:** ${{ github.workflow }} #${{ github.run_number }}
          - **Run ID:** ${{ github.run_id }}
          
          ## Configuration
          - **Upstream:** ${{ inputs.upstream_repo }} @ ${{ inputs.upstream_branch }}
          - **Target:** ${{ inputs.target_branch }}
          - **Merge Strategy:** ${{ inputs.merge_strategy }}
          - **AI Model:** ${{ env.GEMINI_MODEL }}
          
          ## Failure Context
          EOF
          
          # Add job-specific failure context
          if [[ "$FAILED_JOB" == "preflight_validation" ]]; then
            echo "### Preflight Validation Failed" >> failure_analysis.md
            echo "- **Validation Passed:** ${{ needs.preflight_validation.outputs.validation_passed }}" >> failure_analysis.md
            echo "- **Validation Message:** ${{ needs.preflight_validation.outputs.validation_message }}" >> failure_analysis.md
            echo "- **Estimated Conflicts:** ${{ needs.preflight_validation.outputs.estimated_conflicts }}" >> failure_analysis.md
            echo "- **Merge Viable:** ${{ needs.preflight_validation.outputs.merge_viable }}" >> failure_analysis.md
          else
            echo "### Merge Execution Failed" >> failure_analysis.md
            echo "- **Conflicts Detected:** ${{ needs.execute_merge.outputs.conflict_count || 0 }}" >> failure_analysis.md
            echo "- **Conflicts Resolved:** ${{ needs.execute_merge.outputs.conflicts_resolved || 0 }}" >> failure_analysis.md
            echo "- **AI Requests:** ${{ needs.execute_merge.outputs.ai_requests_made || 0 }}" >> failure_analysis.md
          fi
          
          echo "## Next Steps" >> failure_analysis.md
          echo "1. Check the workflow logs for detailed error messages" >> failure_analysis.md
          echo "2. Review the preflight report (if available)" >> failure_analysis.md
          echo "3. Manually inspect the merge branch: \`${{ needs.execute_merge.outputs.merge_branch || 'N/A' }}\`" >> failure_analysis.md
          echo "4. Consider reducing the conflict threshold or changing merge strategy" >> failure_analysis.md
          
          cat failure_analysis.md
      
      - name: "🚨 Create Emergency Issue"
        uses: actions/github-script@v6
        if: ${{ inputs.create_recovery_pr == 'true' }}
        with:
          script: |
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Horizon Merge Failed: ${context.workflow} #${context.runNumber}`,
              body: `## Automated Merge Failure\n\n` +
                    `The Horizon AI Merge Engine failed during execution.\n\n` +
                    `**Workflow:** ${context.workflow} #${context.runNumber}\n` +
                    `**Run ID:** ${context.runId}\n` +
                    `**Branch:** ${'${{ inputs.target_branch }}'}\n` +
                    `**Failed Job:** ${process.env.PREFLIGHT_RESULT === 'failure' ? 'preflight_validation' : 'execute_merge'}\n\n` +
                    `[View workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n` +
                    `## Recovery Information\n` +
                    `- Merge branch: \`${'${{ needs.execute_merge.outputs.merge_branch || \"N/A\" }}'}\`\n` +
                    `- Check logs for detailed error analysis\n` +
                    `- Manual intervention required`,
              labels: ['merge-failure', 'needs-triage', 'emergency'],
              assignees: [context.actor]
            });
            console.log(`Created issue #${issue.number}`);
      
      - name: "📤 Upload Debug Artifacts"
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: horizon-debug-${{ github.run_id }}
          path: |
            ${{ env.TEMP_DIR }}/
            *.log
            *.json
            *.txt
          retention-days: 7
