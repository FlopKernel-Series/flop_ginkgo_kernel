name: 🧠 merge branch 

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream URL'
        required: true
        default: 'https://github.com/neophyteprjkt/kernel_xiaomi_ginkgo.git'
      upstream_branch:
        description: 'Upstream Branch'
        required: true
        default: 'main'
      target_branch:
        description: 'Target Branch'
        required: true
        default: 'floppy-new'
      
      # --- AI CONFIG ---
      ai_provider:
        description: 'AI Provider'
        required: true
        default: 'gemini'
        type: choice
        options:
          - gemini          # Best for large context (Context Window is key here)
          - openai          # Standard
      
      ai_api_key:
        description: 'AI API Key'
        required: true # Required for the Agent loop to work
      
      ai_model:
        description: 'Model Name'
        required: false
        default: 'gemini-1.5-flash'

permissions:
  contents: write
  pull-requests: write

jobs:
  agentic_merge:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AI_PROVIDER: ${{ inputs.ai_provider }}
      AI_KEY: ${{ inputs.ai_api_key }}
      AI_MODEL: ${{ inputs.ai_model }}

    steps:
      # 1. SETUP
      - name: 🛡️ Harden Environment
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git python3-pip python3-requests
          pip3 install requests

      - name: 📥 Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configure Git
        run: |
          git config --global user.name "Apex-Agent"
          git config --global user.email "agent@floppykernel.ai"
          git config merge.renameLimit 999999
          
          # BINARY GUARD: Protect kernel blobs
          echo "* -text" > .gitattributes
          echo "*.png binary" >> .gitattributes
          echo "*.dtb binary" >> .gitattributes
          echo "*.gz binary" >> .gitattributes
          echo "*.ko binary" >> .gitattributes

      # 2. INJECT THE AGENT SCRIPT
      - name: 🧠 Inject Agentic Brain (Python)
        run: |
          cat << 'EOF' > agent_brain.py
          import sys, os, re, requests, time

          # --- CONFIG ---
          PROVIDER = os.environ.get("AI_PROVIDER", "gemini")
          API_KEY = os.environ.get("AI_KEY", "").strip()
          MODEL = os.environ.get("AI_MODEL", "gemini-1.5-flash")
          MAX_RETRIES = 3

          def clean_ai_output(text):
              # Strip Markdown and explanation chatter
              text = re.sub(r'^```[a-z]*\n', '', text, flags=re.MULTILINE)
              text = re.sub(r'\n```$', '', text, flags=re.MULTILINE)
              return text.strip()

          def count_balance(text):
              # Remove comments before counting
              clean = re.sub(r'//.*', '', text)
              clean = re.sub(r'/\*.*?\*/', '', clean, flags=re.DOTALL)
              return clean.count('{') - clean.count('}')

          def ask_ai(prompt):
              if PROVIDER == "gemini":
                  url = f"https://generativelanguage.googleapis.com/v1beta/models/{MODEL}:generateContent?key={API_KEY}"
                  data = {"contents": [{"parts": [{"text": prompt}]}]}
                  try:
                      resp = requests.post(url, json=data, timeout=40)
                      if resp.status_code == 200:
                          return clean_ai_output(resp.json()['candidates'][0]['content']['parts'][0]['text'])
                      else:
                          print(f"⚠️ Gemini API Error: {resp.text}")
                  except Exception as e:
                      print(f"⚠️ Network Error: {e}")

              elif PROVIDER == "openai":
                  url = "https://api.openai.com/v1/chat/completions"
                  headers = {"Authorization": f"Bearer {API_KEY}"}
                  data = {
                      "model": MODEL,
                      "messages": [{"role": "user", "content": prompt}],
                      "temperature": 0.2
                  }
                  try:
                      resp = requests.post(url, json=data, headers=headers, timeout=40)
                      if resp.status_code == 200:
                          return clean_ai_output(resp.json()['choices'][0]['message']['content'])
                  except: pass
              
              return None

          def solve_conflict_block(local, remote, pre_context, post_context, filename):
              """
              The Agent Loop: Tries to solve, verifies, and retries if wrong.
              """
              current_error = ""
              
              for attempt in range(1, MAX_RETRIES + 1):
                  print(f"   🔄 Attempt {attempt}/{MAX_RETRIES}...")
                  
                  prompt = f"""
                  ROLE: Expert Linux Kernel 4.14 Maintainer.
                  TASK: Merge a Git Conflict in file '{filename}'.
                  
                  CONTEXT (Code before conflict):
                  {pre_context}
                  
                  <<<<<<< LOCAL (Ours - Driver Logic)
                  {local}
                  =======
                  >>>>>>> REMOTE (Theirs - Core Logic)
                  {remote}
                  
                  CONTEXT (Code after conflict):
                  {post_context}
                  
                  INSTRUCTIONS:
                  1. Return ONLY the merged code block. NO Markdown.
                  2. Ensure brackets {{ }} match properly with the Context.
                  3. If lines need to move slightly to fit valid syntax, move them.
                  4. Remove conflict markers.
                  5. Do not hallucinate new functions. Just merge LOCAL and REMOTE.
                  
                  {f"PREVIOUS ERROR TO FIX: {current_error}" if current_error else ""}
                  """
                  
                  solution = ask_ai(prompt)
                  
                  if not solution:
                      continue

                  # VERIFICATION: BRACE BALANCE
                  # We check the balance of the SOLUTION relative to the INPUTs.
                  # Ideally, balance(solution) should equal balance(local) or balance(remote) roughly,
                  # but simpler is: check if it looks syntactically sane.
                  
                  sol_bal = count_balance(solution)
                  
                  # If solution is balanced (0) it's likely safe for a snippet (usually).
                  # Or we accept it if it matches the balance of the remote block (if we are pasting inside a function).
                  
                  # Heuristic: If it contains '<<<<', it failed to strip markers.
                  if "<<<<" in solution or "====" in solution:
                      current_error = "You failed to remove git conflict markers."
                      continue

                  # Passed checks
                  return solution

              print(f"   ❌ Failed to solve after {MAX_RETRIES} attempts.")
              return None

          def process_file(filepath):
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                      lines = f.readlines()
              except: return

              new_lines = []
              i = 0
              modified = False
              
              while i < len(lines):
                  line = lines[i]
                  
                  if line.startswith('<<<<<<<'):
                      # Found conflict start
                      conflict_start = i
                      
                      # Capture Context (Up to 20 lines before)
                      start_ctx = max(0, conflict_start - 20)
                      pre_context = "".join(lines[start_ctx:conflict_start])
                      
                      # Parse the block
                      local_block = []
                      remote_block = []
                      mode = "local"
                      i += 1
                      
                      while i < len(lines):
                          if lines[i].startswith('======='):
                              mode = "remote"
                          elif lines[i].startswith('>>>>>>>'):
                              break # End of conflict
                          else:
                              if mode == "local": local_block.append(lines[i])
                              else: remote_block.append(lines[i])
                          i += 1
                      
                      conflict_end = i
                      
                      # Capture Context (Up to 20 lines after)
                      end_ctx = min(len(lines), conflict_end + 20)
                      post_context = "".join(lines[conflict_end+1:end_ctx])
                      
                      # AGENT CALL
                      print(f"🤖 Agent Analyzing Conflict at line {conflict_start} in {filepath}...")
                      merged_block = solve_conflict_block(
                          "".join(local_block), 
                          "".join(remote_block), 
                          pre_context, 
                          post_context,
                          filepath
                      )
                      
                      if merged_block:
                          new_lines.append(merged_block + "\n")
                          modified = True
                      else:
                          # Fallback: Keep original markers if Agent failed
                          # We do not want to destroy data if we can't fix it.
                          new_lines.extend(lines[conflict_start:conflict_end+1])
                          print("   ⚠️ Skipping block (Agent gave up).")

                  else:
                      new_lines.append(line)
                  i += 1

              if modified:
                  # DEDUPLICATION PASS (Kernel headers often duplicate)
                  final_lines = []
                  seen = set()
                  for l in new_lines:
                      stripped = l.strip()
                      # Only dedup headers/defines
                      if filepath.endswith(('.c','.h')) and (stripped.startswith('#include') or stripped.startswith('#define')):
                          norm = re.sub(r'\s+', ' ', stripped)
                          if norm in seen: continue
                          seen.add(norm)
                  
                      final_lines.append(l)
                  
                  with open(filepath, 'w', encoding='utf-8') as f:
                      f.writelines(final_lines)
                  print(f"✅ File Updated: {filepath}")

          if __name__ == "__main__":
              files = sys.argv[1:]
              for f in files:
                  if os.path.exists(f): process_file(f)
          EOF

      # 3. MERGE (Histogram Strategy)
      - name: 🧬 Merge (Smart Strategy)
        id: merge_step
        run: |
          git remote add upstream "${{ inputs.upstream_repo }}" 2>/dev/null || true
          git fetch upstream "${{ inputs.upstream_branch }}" --no-tags --prune
          
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
             git fetch --unshallow || true
          fi

          TS=$(date +%s)
          TMP="agent-merge-$TS"
          git checkout -b "$TMP" "origin/${{ inputs.target_branch }}"
          echo "tmp_branch=$TMP" >> $GITHUB_OUTPUT

          echo ">>> Executing Histogram Merge..."
          # Histogram is critical here. It prevents the "Random Location" issue
          # by matching code structure rather than line numbers.
          set +e
          git merge "upstream/${{ inputs.upstream_branch }}" \
            --no-commit --no-ff \
            -s ort \
            -X find-renames=50% \
            -X ignore-all-space \
            -X diff-algorithm=histogram
          
          echo ">>> Merge Phase Complete."

      # 4. RUN AGENT
      - name: 🚑 Run Apex Agent
        run: |
          CONFLICTS=$(git diff --name-only --diff-filter=U)
          if [ ! -z "$CONFLICTS" ]; then
             python3 agent_brain.py $CONFLICTS
          fi
          rm agent_brain.py

      # 5. VERIFY & DEPLOY
      - name: 🔍 Verify Integrity
        run: |
          # A. Conflict Marker Trap
          if grep -r "<<<<<<< HEAD" . --exclude-dir=.github; then
             echo "❌ CRITICAL: Unresolved conflicts remain."
             echo "   The Agent failed to resolve some blocks safely."
             exit 1
          fi
          
          # B. Git Index Check
          if [[ -n $(git diff --name-only --diff-filter=U) ]]; then
             echo "❌ CRITICAL: Git Index is dirty."
             exit 1
          fi
          
          # C. Safe Commit
          git rm -r --cached toolchains > /dev/null 2>&1 || true
          git add .
          git reset HEAD toolchains > /dev/null 2>&1 || true
          
          if git diff-index --quiet HEAD --; then
             echo "⚠️ No changes to commit."
          else
             git commit -m "Agent-AI: Merged upstream with Logic Checks"
             
             TMP="${{ steps.merge_step.outputs.tmp_branch }}"
             TARGET="${{ inputs.target_branch }}"
             
             git repack -a -d
             for i in {1..5}; do
                if git push origin "$TMP:refs/heads/$TARGET"; then
                   echo "✅ DEPLOYED TO $TARGET"
                   git push origin --delete "$TMP"
                   exit 0
                fi
                sleep 5
             done
             exit 1
          fi

      # 6. FAIL SAFE
      - name: 🚨 Manual Intervention
        if: failure()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "❌ Agent Merge Failed: Manual Fix Needed"
          body: |
            The Apex Agent attempted to merge and fix logic, but encountered an error it couldn't auto-correct safely.
            
            **Branch:** `${{ steps.merge_step.outputs.tmp_branch }}`
            
            Please verify the conflicts manually.
          branch: ${{ steps.merge_step.outputs.tmp_branch }}
          base: ${{ inputs.target_branch }}
