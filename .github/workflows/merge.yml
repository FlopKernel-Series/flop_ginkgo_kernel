name: 🧠 Auto-Merge 

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream Repository URL'
        required: true
        default: 'https://github.com/neophyteprjkt/kernel_xiaomi_ginkgo.git'
      upstream_branch:
        description: 'Upstream Branch'
        required: true
        default: 'main'
      target_branch:
        description: 'Target Branch (Your repo)'
        required: true
        default: 'floppy-new'
      strict_mode:
        description: 'Abort if structural damage is detected (true/false)'
        required: false
        default: 'true'

permissions:
  contents: write
  pull-requests: write

jobs:
  intelligence-merge:
    runs-on: ubuntu-latest
    steps:
      # 1. SETUP & CHECKOUT
      - name: 📥 Checkout Source (Full Depth)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for 'find-renames' to work

      - name: ⚙️ Configure Git Neural Settings
        run: |
          git config user.name "Cortex-Merge-Bot"
          git config user.email "bot@floppykernel.ai"
          
          # ONLINE FIX 1: Increase Rename Limit (Crucial for Kernels)
          # Kernels have thousands of files; default git gives up too early.
          git config merge.renameLimit 999999
          
          # ONLINE FIX 2: Binary Handling
          # Prevent git from trying to text-merge binary files (DTBs, Images)
          echo "* -text" > .gitattributes
          echo "*.png binary" >> .gitattributes
          echo "*.jpg binary" >> .gitattributes
          echo "*.dtb binary" >> .gitattributes
          echo "*.img binary" >> .gitattributes

      # 2. THE "BRAIN" (PYTHON SCRIPT)
      - name: 🧠 Embed Structural Logic Script
        run: |
          cat << 'EOF' > cortex_analyst.py
          import sys
          import re
          import os

          def analyze_file(filepath):
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                      lines = f.readlines()
              except:
                  return True # Skip binary/unreadable files

              new_lines = []
              seen_directives = set()
              
              # LOGIC 1: BRACE BALANCING (Did we break the code block?)
              # We count { and } to ensure the merge didn't leave an open function.
              brace_balance = 0
              
              # LOGIC 2: CONFLICT DETECTION
              has_conflict = False
              
              modified = False
              
              # Extensions that need strict checking
              is_code = filepath.endswith(('.c', '.h', '.cpp', '.dts', '.dtsi'))

              for i, line in enumerate(lines):
                  stripped = line.strip()
                  
                  # Check for Git Conflict Markers
                  if stripped.startswith('<<<<<<<') or stripped.startswith('======='):
                      print(f"❌ CRITICAL: Unresolved conflict marker in {filepath}:{i+1}")
                      return "CONFLICT"

                  # LOGIC 3: SMART DEDUPLICATION (Includes & Defines)
                  # Git often pastes the same import twice if context is messy.
                  if is_code and (stripped.startswith('#include') or stripped.startswith('#define')):
                      # Normalize spaces for comparison
                      norm = re.sub(r'\s+', ' ', stripped)
                      if norm in seen_directives:
                          # We found a duplicate! Skip it.
                          modified = True
                          continue
                      seen_directives.add(norm)

                  # Count Braces (ignoring comments roughly)
                  if is_code and not stripped.startswith('//') and not stripped.startswith('*'):
                      brace_balance += line.count('{')
                      brace_balance -= line.count('}')

                  new_lines.append(line)

              # LOGIC 4: FINAL STRUCTURAL ASSESSMENT
              if is_code and brace_balance != 0:
                  print(f"⚠️ STRUCTURAL WARN: Braces unbalanced ({brace_balance}) in {filepath}")
                  # If balance is wildly off (e.g. > 2), it's likely a bad merge location.
                  if abs(brace_balance) > 2:
                      return "BROKEN_STRUCTURE"

              if modified:
                  print(f"✨ Auto-healing: Removed duplicates in {filepath}")
                  with open(filepath, 'w', encoding='utf-8') as f:
                      f.writelines(new_lines)

              return "CLEAN"

          if __name__ == "__main__":
              files = sys.argv[1:]
              exit_code = 0
              
              for f in files:
                  if os.path.exists(f):
                      status = analyze_file(f)
                      if status == "CONFLICT":
                          exit_code = 1
                      elif status == "BROKEN_STRUCTURE":
                          # We allow strict mode to fail the build here
                          if os.environ.get('STRICT_MODE') == 'true':
                              print(f"⛔ Strict Mode: Aborting due to structural break in {f}")
                              exit_code = 1
              
              sys.exit(exit_code)
          EOF

      # 3. THE MERGE EXECUTION
      - name: 🧬 Execute Advanced Merge
        id: merge_step
        run: |
          set -e
          UPSTREAM="${{ inputs.upstream_repo }}"
          BRANCH="${{ inputs.upstream_branch }}"
          TARGET="${{ inputs.target_branch }}"

          git remote add upstream "$UPSTREAM" 2>/dev/null || true
          
          echo "::group::Fetching Data"
          git fetch upstream "$BRANCH" --no-tags --prune
          
          # Fix Shallow Repository (Essential for Histogram diff)
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
             git fetch --unshallow || true
          fi
          echo "::endgroup::"

          # Create Temporary Validation Branch
          TS=$(date +%s)
          TMP="cortex-verify-$TS"
          git checkout -b "$TMP" "origin/$TARGET"

          echo "---------------------------------------------------"
          echo "🔄 Running ORT-Histogram Strategy"
          echo "---------------------------------------------------"
          # ONLINE RESEARCH OPTIMIZATION:
          # - ort: Modern merge engine (better than recursive).
          # - histogram: Matches 'blocks' of code, not lines. Fixes "Random Location" bugs.
          # - renormalize: Ignores CRLF/LF nonsense.
          # - find-renames=25%: Detects file moves even if they changed significantly.
          # - theirs: In a conflict, prefer Upstream (usually newer). *Verified by Analyst later.*
          
          git merge "upstream/$BRANCH" \
            --no-edit --no-ff \
            -s ort \
            -X theirs \
            -X find-renames=25% \
            -X ignore-all-space \
            -X renormalize \
            -X diff-algorithm=histogram

          echo "tmp_branch=$TMP" >> $GITHUB_OUTPUT

      # 4. THE ANALYSIS
      - name: 🔬 Run Cortex Analyst (Structural Check)
        id: analyze
        env:
          STRICT_MODE: ${{ inputs.strict_mode }}
        run: |
          echo "---------------------------------------------------"
          echo "🤖 Analyzing merged files for Logic & Structure..."
          echo "---------------------------------------------------"
          
          # Get list of files modified by the merge
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
          
          # Run Python Logic
          if python3 cortex_analyst.py $CHANGED_FILES; then
             echo "✅ ANALYSIS PASSED: Code structure is valid."
             
             # Commit any auto-heals (deduplicated lines)
             if ! git diff --quiet; then
                git commit -am "Cortex-Bot: Auto-corrected structure and duplicates"
             fi
             
             echo "status=clean" >> $GITHUB_OUTPUT
          else
             echo "❌ ANALYSIS FAILED: The merge created invalid code blocks."
             echo "status=dirty" >> $GITHUB_OUTPUT
             exit 1
          fi

      # 5. PUSH
      - name: 🚀 Robust Push (With Retries)
        if: steps.analyze.outputs.status == 'clean'
        run: |
          TMP="${{ steps.merge_step.outputs.tmp_branch }}"
          TARGET="${{ inputs.target_branch }}"
          
          # Git Garbage Collection (Prevents 'pack too large' errors on push)
          git repack -a -d
          git gc --prune=now

          # Retry Loop for Network Stability
          for i in {1..5}; do
             echo "Push Attempt $i..."
             if git push origin "$TMP:refs/heads/$TARGET"; then
                echo "✅ Success!"
                git push origin --delete "$TMP"
                exit 0
             fi
             sleep 5
          done
          exit 1

      # 6. FAILURE HANDLER
      - name: 🚨 Create Report on Failure
        if: failure()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "❌ Auto-Merge Aborted: Structural Damage Detected"
          body: |
            **Cortex-AI Report:**
            The merge was attempted, but the Structural Analyst detected invalid code.
            
            **Diagnosis:**
            1. Likely inserted code outside of a function block.
            2. Or broke `brace_balance` (missing `}`).
            
            The corrupt code was **NOT** pushed to `${{ inputs.target_branch }}`.
            Please review the attached branch manually.
          branch: ${{ steps.merge_step.outputs.tmp_branch }}
          base: ${{ inputs.target_branch }}
          labels: "structural-failure, automated"
