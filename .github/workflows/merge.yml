name: 🧠 Auto merge branch

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream URL'
        required: true
        default: 'https://github.com/neophyteprjkt/kernel_xiaomi_ginkgo.git'
      upstream_branch:
        description: 'Upstream Branch'
        required: true
        default: 'main'
      target_branch:
        description: 'Target Branch'
        required: true
        default: 'floppy-new'
      
      # --- AI CONFIGURATION ---
      ai_provider:
        description: 'AI Provider'
        required: true
        default: 'gemini'
        type: choice
        options:
          - gemini          # Google Generative AI
          - openai          # OpenAI / Compatible API
      
      ai_api_key:
        description: 'AI API Key (Required)'
        required: true
      
      ai_model:
        description: 'Model Name (Type any: gemini-2.5-flash, gemini-1.5-pro, etc)'
        required: true
        default: 'gemini-1.5-flash'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  agentic_merge:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AI_PROVIDER: ${{ inputs.ai_provider }}
      AI_KEY: ${{ inputs.ai_api_key }}
      AI_MODEL: ${{ inputs.ai_model }}

    steps:
      # 1. ENVIRONMENT & CHECKOUT
      - name: 🛡️ Harden Environment
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git python3-pip python3-requests
          pip3 install requests

      - name: 📥 Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configure Git
        run: |
          git config --global user.name "Apex-Bot"
          git config --global user.email "bot@floppykernel.ai"
          git config merge.renameLimit 999999
          
          # BINARY GUARD: Protect kernel blobs from text merging
          echo "* -text" > .gitattributes
          echo "*.png binary" >> .gitattributes
          echo "*.dtb binary" >> .gitattributes
          echo "*.gz binary" >> .gitattributes
          echo "*.ko binary" >> .gitattributes
          echo "*.o binary" >> .gitattributes

      # 2. INJECT THE SMART AGENT
      - name: 🧠 Inject Apex Brain (Smart Fallback)
        run: |
          cat << 'EOF' > agent_brain.py
          import sys, os, re, requests, subprocess, time

          # --- CONFIG ---
          PROVIDER = os.environ.get("AI_PROVIDER", "gemini")
          API_KEY = os.environ.get("AI_KEY", "").strip()
          REQUESTED_MODEL = os.environ.get("AI_MODEL", "gemini-1.5-flash")
          MAX_RETRIES = 3

          # --- UTILS ---
          def clean_ai_output(text):
              # Strip Markdown code blocks
              text = re.sub(r'^```[a-z]*\n', '', text, flags=re.MULTILINE)
              text = re.sub(r'\n```$', '', text, flags=re.MULTILINE)
              return text.strip()

          def count_balance(text):
              # Remove comments to count braces accurately
              clean = re.sub(r'//.*', '', text)
              clean = re.sub(r'/\*.*?\*/', '', clean, flags=re.DOTALL)
              return clean.count('{') - clean.count('}')

          def execute_api_call(model, prompt):
              """Generic API caller for a specific model"""
              if PROVIDER == "gemini":
                  url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={API_KEY}"
                  data = {"contents": [{"parts": [{"text": prompt}]}]}
                  try:
                      resp = requests.post(url, json=data, timeout=50)
                      if resp.status_code == 200:
                          return clean_ai_output(resp.json()['candidates'][0]['content']['parts'][0]['text'])
                      elif resp.status_code == 404:
                          return "MODEL_NOT_FOUND"
                      else:
                          print(f"   ⚠️ Gemini Error ({model}): {resp.status_code} - {resp.text[:100]}")
                          return None
                  except Exception as e:
                      print(f"   ⚠️ Network: {e}")
                      return None

              elif PROVIDER == "openai":
                  url = "https://api.openai.com/v1/chat/completions"
                  headers = {"Authorization": f"Bearer {API_KEY}"}
                  data = {"model": model, "messages": [{"role": "user", "content": prompt}], "temperature": 0.2}
                  try:
                      resp = requests.post(url, json=data, headers=headers, timeout=50)
                      if resp.status_code == 200:
                          return clean_ai_output(resp.json()['choices'][0]['message']['content'])
                      elif resp.status_code == 404:
                          return "MODEL_NOT_FOUND"
                  except: pass
              return None

          def ask_ai_with_fallback(prompt):
              """Smart Router: Tries Requested Model -> Latest Exp -> Stable"""
              
              # 1. Try User's Custom Model (e.g., gemini-2.5-flash)
              res = execute_api_call(REQUESTED_MODEL, prompt)
              if res and res != "MODEL_NOT_FOUND": return res
              
              if res == "MODEL_NOT_FOUND":
                  print(f"   ⚠️ Model '{REQUESTED_MODEL}' not found/supported. switching fallback...")

              # 2. Fallback: Gemini 2.0 Flash Exp (Modern)
              if PROVIDER == "gemini":
                  print("   🔄 Retrying with gemini-2.0-flash-exp...")
                  res = execute_api_call("gemini-2.0-flash-exp", prompt)
                  if res and res != "MODEL_NOT_FOUND": return res

                  # 3. Fallback: Gemini 1.5 Flash (Stable)
                  print("   🔄 Retrying with gemini-1.5-flash...")
                  res = execute_api_call("gemini-1.5-flash", prompt)
                  if res and res != "MODEL_NOT_FOUND": return res

              return None

          def solve_conflict_block(local, remote, pre, post, filename):
              current_error = ""
              for attempt in range(1, MAX_RETRIES + 1):
                  print(f"   🧠 Thinking (Attempt {attempt})...")
                  
                  prompt = f"""
                  ROLE: Expert Linux Kernel 4.14 Developer.
                  TASK: Merge Git Conflict in file '{filename}'.
                  
                  GUIDELINES:
                  1. Return ONLY the merged C code. NO Markdown.
                  2. Use TABS for indentation (Kernel Standard).
                  3. Keep Driver Logic (Local) AND Core Updates (Remote).
                  4. Ensure strictly balanced braces {{ }}.
                  5. Do not hallucinate new variables.
                  
                  CONTEXT BEFORE (50 lines):
                  {pre}
                  
                  <<<<<<< LOCAL
                  {local}
                  =======
                  {remote}
                  >>>>>>> REMOTE
                  
                  CONTEXT AFTER (50 lines):
                  {post}
                  
                  {f"PREVIOUS ERROR TO FIX: {current_error}" if current_error else ""}
                  """
                  
                  solution = ask_ai_with_fallback(prompt)
                  
                  if not solution: continue
                  
                  # Verify Markers Removal
                  if "<<<<" in solution or "====" in solution:
                      current_error = "You failed to remove git conflict markers."
                      continue
                  
                  # Basic Brace Logic (Heuristic)
                  # If we are pasting into a balanced context, solution should be balanced.
                  if count_balance(solution) != 0:
                       # Allow if local block was also unbalanced (splitting a function)
                       if count_balance(local) == 0:
                           current_error = "Your code has unbalanced braces."
                           continue

                  return solution
              return None

          def process_file(filepath):
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f: lines = f.readlines()
              except: return

              new_lines = []
              i = 0
              modified = False
              
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('<<<<<<<'):
                      conflict_start = i
                      
                      # Grab Expanded Context (50 lines for better placement awareness)
                      start_ctx = max(0, conflict_start - 50)
                      pre = "".join(lines[start_ctx:conflict_start])
                      
                      local_block = []
                      remote_block = []
                      mode = "local"
                      i += 1
                      while i < len(lines):
                          if lines[i].startswith('======='): mode = "remote"
                          elif lines[i].startswith('>>>>>>>'): break
                          else:
                              if mode == "local": local_block.append(lines[i])
                              else: remote_block.append(lines[i])
                          i += 1
                      
                      end_ctx = min(len(lines), i + 50)
                      post = "".join(lines[i+1:end_ctx])
                      
                      print(f"🔎 Analyzing Conflict in: {filepath}")
                      merged = solve_conflict_block("".join(local_block), "".join(remote_block), pre, post, filepath)
                      
                      if merged:
                          new_lines.append(merged + "\n")
                          modified = True
                      else:
                          # Fallback: Keep markers
                          new_lines.extend(lines[conflict_start:i+1])
                          print("   ⚠️ Agent failed to resolve block.")
                  else:
                      new_lines.append(line)
                  i += 1

              if modified:
                  with open(filepath, 'w', encoding='utf-8') as f: f.writelines(new_lines)
                  print(f"✅ Fixed: {filepath}")
                  
                  # Force Stage (Fixes 'Dirty Index' bug)
                  try:
                      subprocess.run(["git", "add", filepath], check=True)
                  except:
                      pass

          if __name__ == "__main__":
              files = sys.argv[1:]
              if not files: 
                  print("No conflicts to fix.")
                  sys.exit(0)
              for f in files:
                  if os.path.exists(f): process_file(f)
          EOF

      # 3. MERGE (Histogram Strategy)
      - name: 🧬 Merge (Smart Strategy)
        id: merge_step
        run: |
          git remote add upstream "${{ inputs.upstream_repo }}" 2>/dev/null || true
          git fetch upstream "${{ inputs.upstream_branch }}" --no-tags --prune
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then git fetch --unshallow || true; fi

          TS=$(date +%s)
          TMP="agent-merge-$TS"
          git checkout -b "$TMP" "origin/${{ inputs.target_branch }}"
          echo "tmp_branch=$TMP" >> $GITHUB_OUTPUT

          echo ">>> Executing Histogram Merge..."
          set +e
          # 1. ORT strategy (Modern)
          # 2. Histogram diff (Better for code moves)
          # 3. 50% Rename Limit (Detects moved files)
          git merge "upstream/${{ inputs.upstream_branch }}" \
            --no-commit --no-ff \
            -s ort \
            -X find-renames=50% \
            -X ignore-all-space \
            -X diff-algorithm=histogram
          echo "Merge Phase Complete."

      # 4. RUN AGENT
      - name: 🚑 Run Apex Agent
        run: |
          # Get Conflicted Files
          CONFLICTS=$(git diff --name-only --diff-filter=U)
          if [ ! -z "$CONFLICTS" ]; then
             echo "Detected Conflicts in: $CONFLICTS"
             python3 agent_brain.py $CONFLICTS
          else
             echo "No text conflicts detected."
          fi
          rm agent_brain.py

      # 5. VERIFY & DEPLOY
      - name: 🔍 Verify Integrity
        run: |
          # A. Unmerged Check
          if [[ -n $(git diff --name-only --diff-filter=U) ]]; then
             echo "❌ CRITICAL: Unmerged files remain."
             git diff --name-only --diff-filter=U
             exit 1
          fi
          
          # B. Marker Check
          if grep -r "<<<<<<< HEAD" . --exclude-dir=.github; then
             echo "❌ CRITICAL: Conflict markers found in files."
             grep -r "<<<<<<< HEAD" . --exclude-dir=.github
             exit 1
          fi

          # C. Safe Commit
          # Remove toolchains (Submodules) from index to prevent errors
          git rm -r --cached toolchains > /dev/null 2>&1 || true
          git add .
          git reset HEAD toolchains > /dev/null 2>&1 || true
          
          if git diff-index --quiet HEAD --; then
             echo "⚠️ No changes to commit."
          else
             git commit -m "Agent-AI: Merged upstream with Auto-Fixes"
             
             TMP="${{ steps.merge_step.outputs.tmp_branch }}"
             TARGET="${{ inputs.target_branch }}"
             
             git repack -a -d
             for i in {1..5}; do
                if git push origin "$TMP:refs/heads/$TARGET"; then
                   echo "✅ DEPLOYED TO $TARGET"
                   git push origin --delete "$TMP"
                   exit 0
                fi
                sleep 5
             done
             exit 1
          fi

      # 6. FAIL SAFE (Emergency Save)
      - name: 🚨 Emergency Commit (On Failure)
        if: failure()
        run: |
          echo "⚠️ Workflow Failed. Committing WIP state..."
          git rm -r --cached toolchains > /dev/null 2>&1 || true
          git add . || true
          git reset HEAD toolchains > /dev/null 2>&1 || true
          
          git commit -m "⚠️ Auto-Merge Failed: Saving WIP" || true
          TMP="${{ steps.merge_step.outputs.tmp_branch }}"
          git push origin "$TMP" || true

      - name: 📝 Create Failure Report PR
        if: failure()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "❌ Agent Merge Failed: Manual Fix Needed"
          body: |
            The Apex Agent failed to resolve all conflicts safely.
            
            **Branch:** `${{ steps.merge_step.outputs.tmp_branch }}`
            
            1. Pull this branch.
            2. Search for `<<<<<<< HEAD`.
            3. Fix manually and push.
          branch: ${{ steps.merge_step.outputs.tmp_branch }}
          base: ${{ inputs.target_branch }}
