name: 🧠 merge branch

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream URL'
        required: true
        default: 'https://github.com/neophyteprjkt/kernel_xiaomi_ginkgo.git'
      upstream_branch:
        description: 'Upstream Branch'
        required: true
        default: 'main'
      target_branch:
        description: 'Target Branch (Your repo)'
        required: true
        default: 'floppy-new'
      ai_api_key:
        description: 'AI API Key (OpenAI/Gemini/DeepSeek). Leave empty for Offline Mode.'
        required: false
      ai_base_url:
        description: 'AI Base URL (Default: OpenAI)'
        required: false
        default: 'https://api.openai.com/v1'
      ai_model:
        description: 'Model Name'
        required: false
        default: 'gpt-4o'

permissions:
  contents: write
  pull-requests: write

jobs:
  neural_merge:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AI_KEY: ${{ inputs.ai_api_key }}
      AI_URL: ${{ inputs.ai_base_url }}
      AI_MODEL: ${{ inputs.ai_model }}
      
    steps:
      # --- PHASE 1: PREPARATION (From Logger.yml) ---
      - name: 🧹 Disk Cleanup & Setup
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git python3-pip python3-requests libncurses-dev

      - name: 📥 Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configure Git & Environment
        run: |
          git config --global user.name "Neural-Bot"
          git config --global user.email "bot@floppykernel.ai"
          git config merge.renameLimit 999999
          
          # SAFETY: Prevent binary corruption
          echo "* -text" > .gitattributes
          echo "*.png binary" >> .gitattributes
          echo "*.dtb binary" >> .gitattributes
          echo "*.gz binary" >> .gitattributes

      # --- PHASE 2: THE BRAIN (Python + AI Integration) ---
      - name: 🧠 Inject Neural Engine
        run: |
          cat << 'EOF' > neural_brain.py
          import sys, os, re, time
          import requests

          # --- CONFIG ---
          API_KEY = os.environ.get("AI_KEY", "").strip()
          BASE_URL = os.environ.get("AI_URL", "https://api.openai.com/v1")
          MODEL = os.environ.get("AI_MODEL", "gpt-4o")

          CONFLICT_PATTERN = re.compile(r'<<<<<<< HEAD\n(.*?)\n=======\n(.*?)\n>>>>>>> [a-f0-9]+', re.DOTALL)

          def ask_ai_to_resolve(local_code, remote_code, filename):
              if not API_KEY: return None
              
              prompt = f"""
              You are a Linux Kernel Maintainer. Resolve a git conflict in file: {filename}.
              
              LOCAL CODE (Ours):
              {local_code}
              
              REMOTE CODE (Theirs/Upstream):
              {remote_code}
              
              INSTRUCTIONS:
              1. Return ONLY the resolved code. No markdown, no explanations.
              2. Keep necessary logic from both if they don't conflict functionally.
              3. Prefer Upstream for logic updates, but keep Local specific drivers/features.
              4. Ensure C syntax is valid (brackets balanced).
              """
              
              headers = {"Authorization": f"Bearer {API_KEY}", "Content-Type": "application/json"}
              data = {
                  "model": MODEL,
                  "messages": [{"role": "user", "content": prompt}],
                  "temperature": 0.2
              }
              
              try:
                  print(f"🤖 Consulting AI for {filename}...")
                  resp = requests.post(f"{BASE_URL}/chat/completions", json=data, headers=headers, timeout=20)
                  if resp.status_code == 200:
                      return resp.json()['choices'][0]['message']['content'].strip().replace("```c", "").replace("```", "")
                  else:
                      print(f"⚠️ AI Error: {resp.text}")
              except Exception as e:
                  print(f"⚠️ AI Network Error: {e}")
              return None

          def heuristic_resolve(match, filepath):
              local = match.group(1)
              remote = match.group(2)
              
              # 1. Whitespace/Noise Check
              if local.strip() == remote.strip(): return local
              
              # 2. Brace Safety Check
              bal_local = local.count('{') - local.count('}')
              bal_remote = remote.count('{') - remote.count('}')
              
              # If Upstream is clean and we are broken, take Upstream
              if bal_remote == 0 and bal_local != 0: return remote
              
              # 3. AI Escalation
              if API_KEY:
                  ai_fix = ask_ai_to_resolve(local, remote, filepath)
                  if ai_fix: return ai_fix
              
              # 4. Fallback: If we can't solve it, keep the conflict markers 
              # so the verifier catches it. Do not guess blindly.
              return match.group(0) 

          def process_file(filepath):
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                      content = f.read()
              except: return # Skip binary

              original = content
              
              # A. Resolve Conflicts
              if '<<<<<<< HEAD' in content:
                  content = CONFLICT_PATTERN.sub(lambda m: heuristic_resolve(m, filepath), content)

              # B. Deduplicate & Clean
              lines = content.splitlines()
              new_lines = []
              seen = set()
              is_code = filepath.endswith(('.c', '.h', '.cpp', '.dtsi'))
              
              for line in lines:
                  stripped = line.strip()
                  # Remove duplicates
                  if is_code and (stripped.startswith('#include') or stripped.startswith('#define')):
                      norm = re.sub(r'\s+', ' ', stripped)
                      if norm in seen: continue
                      seen.add(norm)
                  new_lines.append(line)

              final_content = '\n'.join(new_lines) + '\n'
              
              if final_content != original:
                  with open(filepath, 'w', encoding='utf-8') as f:
                      f.write(final_content)
                  print(f"✅ Processed: {filepath}")

          if __name__ == "__main__":
              files = sys.argv[1:]
              for f in files:
                  if os.path.exists(f): process_file(f)
          EOF

      # --- PHASE 3: EXECUTION ---
      - name: 🧬 Merge with ORT Strategy
        id: merge_step
        run: |
          # 1. Fetch
          git remote add upstream "${{ inputs.upstream_repo }}" 2>/dev/null || true
          git fetch upstream "${{ inputs.upstream_branch }}" --no-tags --prune
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
             git fetch --unshallow || true
          fi

          # 2. Create Branch
          TS=$(date +%s)
          TMP="ai-merge-$TS"
          git checkout -b "$TMP" "origin/${{ inputs.target_branch }}"
          echo "tmp_branch=$TMP" >> $GITHUB_OUTPUT

          # 3. Merge (Allow Failure)
          echo ">>> Merging..."
          set +e
          git merge "upstream/${{ inputs.upstream_branch }}" \
            --no-commit --no-ff \
            -s ort \
            -X find-renames=50% \
            -X ignore-all-space \
            -X diff-algorithm=histogram
          
          echo "Merge finished. Starting Neural Processor..."

      - name: 🚑 Run Neural Healer
        run: |
          # Install requests for the script
          pip3 install requests

          # Identify files that need help
          CONFLICTS=$(git diff --name-only --diff-filter=U)
          MODIFIED=$(git diff --name-only HEAD)
          
          # Run the Python Brain
          if [ ! -z "$CONFLICTS" ] || [ ! -z "$MODIFIED" ]; then
             python3 neural_brain.py $CONFLICTS $MODIFIED
          fi
          
          # Cleanup the script
          rm neural_brain.py

      # --- PHASE 4: VERIFICATION & PUSH (From Logger.yml logic) ---
      - name: 🔍 Verify & Commit
        run: |
          echo ">>> Verifying Integrity..."
          
          # 1. Check for Markers
          if grep -r "<<<<<<< HEAD" . --exclude-dir=.github; then
             echo "❌ FAILURE: Unresolved conflicts remain."
             grep -r "<<<<<<< HEAD" . --exclude-dir=.github
             exit 1
          fi
          
          # 2. Unmerged Check
          if [[ -n $(git diff --name-only --diff-filter=U) ]]; then
             echo "❌ FAILURE: Git still reports unmerged files."
             exit 1
          fi
          
          # 3. Safe Commit (Logger.yml logic)
          # Remove toolchains from index to prevent submodule errors
          git rm -r --cached toolchains > /dev/null 2>&1 || true
          
          git add .
          git reset HEAD toolchains > /dev/null 2>&1 || true
          
          if git diff-index --quiet HEAD --; then
             echo "⚠️ No changes to commit."
          else
             git commit -m "Neural-AI: Merged upstream & resolved conflicts"
             
             # Push Loop
             TMP="${{ steps.merge_step.outputs.tmp_branch }}"
             TARGET="${{ inputs.target_branch }}"
             
             git repack -a -d
             for i in {1..5}; do
                if git push origin "$TMP:refs/heads/$TARGET"; then
                   echo "✅ Pushed to $TARGET"
                   git push origin --delete "$TMP"
                   exit 0
                fi
                sleep 5
             done
             exit 1
          fi

      - name: 🚨 Report Failure
        if: failure()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "❌ AI Merge Failed: Manual Intervention Required"
          body: |
            The Neural Merger attempted to resolve conflicts but could not guarantee 100% integrity.
            
            **Branch:** `${{ steps.merge_step.outputs.tmp_branch }}`
            
            Please pull this branch and fix the remaining markers manually.
          branch: ${{ steps.merge_step.outputs.tmp_branch }}
          base: ${{ inputs.target_branch }}
