name: 💠 

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream Repository URL'
        required: true
        default: 'https://github.com/neophyteprjkt/kernel_xiaomi_ginkgo.git'
      upstream_branch:
        description: 'Upstream Branch'
        required: true
        default: 'main'
      target_branch:
        description: 'Target Branch'
        required: true
        default: 'floppy-new'
      
      # --- CREDENTIALS (Leave empty if not using) ---
      gemini_api_key:
        description: 'Gemini API Key (Recommended Free Tier)'
        required: true
      
      deepseek_api_key:
        description: 'DeepSeek API Key (Coding Specialist)'
        required: false
      
      openai_api_key:
        description: 'OpenAI API Key (Generalist)'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # ========================================================
  # JOB 1: THE RECONNAISSANCE PROBE
  # ========================================================
  ai_recon:
    runs-on: ubuntu-latest
    outputs:
      ai_queue: ${{ steps.probe.outputs.queue }}
      best_gemini: ${{ steps.probe.outputs.gemini_model }}
    steps:
      - name: 🛡️ Init
        run: pip3 install requests

      - name: 🕵️ Probe & Rank APIs
        id: probe
        env:
          KEY_GEMINI: ${{ inputs.gemini_api_key }}
          KEY_DEEPSEEK: ${{ inputs.deepseek_api_key }}
          KEY_OPENAI: ${{ inputs.openai_api_key }}
        run: |
          cat << 'EOF' > recon.py
          import os, requests, re, json

          def check_deepseek(key):
              if not key: return False
              print(">>> 📡 Probing DeepSeek...")
              try:
                  resp = requests.post(
                      "https://api.deepseek.com/v1/chat/completions",
                      headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json"},
                      json={"model": "deepseek-chat", "messages": [{"role":"user", "content":"hi"}], "max_tokens": 1},
                      timeout=5
                  )
                  if resp.status_code == 200: 
                      print("    ✅ DeepSeek: Online & Funded.")
                      return True
                  if resp.status_code == 402:
                      print("    ❌ DeepSeek: Out of Credits (402).")
              except: pass
              return False

          def check_openai(key):
              if not key: return False
              print(">>> 📡 Probing OpenAI...")
              try:
                  resp = requests.post(
                      "https://api.openai.com/v1/chat/completions",
                      headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json"},
                      json={"model": "gpt-4o-mini", "messages": [{"role":"user", "content":"hi"}], "max_tokens": 1},
                      timeout=5
                  )
                  if resp.status_code == 200:
                      print("    ✅ OpenAI: Online & Funded.")
                      return True
              except: pass
              return False

          def find_best_gemini(key):
              print(">>> 📡 Scanning Gemini Models...")
              # Default fallback
              best = "gemini-1.5-flash"
              if not key: return best
              
              try:
                  url = f"https://generativelanguage.googleapis.com/v1beta/models?key={key}"
                  resp = requests.get(url, timeout=8)
                  if resp.status_code == 200:
                      data = resp.json().get('models', [])
                      flash_candidates = []
                      
                      for m in data:
                          name = m['name'].replace("models/", "")
                          # We specifically look for "flash" because "pro" has a 2 RPM limit on free tier.
                          # Automation requires Flash (15 RPM).
                          if "flash" in name and "generateContent" in m.get('supportedGenerationMethods', []):
                              flash_candidates.append(name)
                      
                      # Sort by Version Number (descending)
                      # e.g., 2.0 > 1.5
                      def version_parser(n):
                          match = re.search(r'(\d+\.\d+)', n)
                          return float(match.group(1)) if match else 0.0

                      flash_candidates.sort(key=version_parser, reverse=True)
                      
                      if flash_candidates:
                          best = flash_candidates[0]
                          print(f"    ✅ Selected Highest Free Tier: {best}")
                      else:
                          print("    ⚠️ No Flash models found, using fallback.")
              except Exception as e:
                  print(f"    ⚠️ Discovery Failed ({e}). Using fallback.")
              
              return best

          if __name__ == "__main__":
              k_ds = os.environ.get("KEY_DEEPSEEK")
              k_oa = os.environ.get("KEY_OPENAI")
              k_gem = os.environ.get("KEY_GEMINI")

              active_list = []

              # 1. DEEPSEEK (Top Priority - Coding Specialist)
              if check_deepseek(k_ds): active_list.append("deepseek")

              # 2. OPENAI (Second Priority - Stable Generalist)
              if check_openai(k_oa): active_list.append("openai")

              # 3. GEMINI (Final Priority - High Quota Free Tier)
              gem_model = find_best_gemini(k_gem)
              # Always add Gemini if key exists, as it's the safety net
              if k_gem: active_list.append("gemini")

              queue_str = ",".join(active_list)
              print(f"::notice::AI Battle Queue: {queue_str} | Gemini Model: {gem_model}")

              with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
                  fh.write(f"queue={queue_str}\n")
                  fh.write(f"gemini_model={gem_model}\n")
          EOF
          python3 recon.py

  # ========================================================
  # JOB 2: EXECUTION CORE
  # ========================================================
  omni_core:
    needs: ai_recon
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KEY_GEMINI: ${{ inputs.gemini_api_key }}
      KEY_DEEPSEEK: ${{ inputs.deepseek_api_key }}
      KEY_OPENAI: ${{ inputs.openai_api_key }}
      
      # Dynamic Inputs from Recon
      AI_QUEUE: ${{ needs.ai_recon.outputs.ai_queue }}
      MODEL_GEMINI: ${{ needs.ai_recon.outputs.best_gemini }}

    steps:
      - name: 🛡️ System Hardening
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git python3-pip python3-requests
          pip3 install requests

      - name: 📥 Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configure Git
        run: |
          git config --global user.name "Apex-Omni"
          git config --global user.email "bot@floppykernel.ai"
          git config merge.renameLimit 999999
          
          # BINARY GUARD
          echo "* -text" > .gitattributes
          for ext in png dtb gz ko o bpf zip jpg bmp iso so a; do
            echo "*.$ext binary" >> .gitattributes
          done

      - name: 🧠 Inject Omni-Core
        run: |
          cat << 'EOF' > omni_core.py
          import sys, os, re, requests, time, subprocess

          sys.stdout.reconfigure(line_buffering=True)

          # --- DYNAMIC CONFIG ---
          QUEUE = os.environ.get("AI_QUEUE", "gemini").split(",")
          GEMINI_ID = os.environ.get("MODEL_GEMINI", "gemini-1.5-flash")
          
          KEYS = {
              "gemini": os.environ.get("KEY_GEMINI", "").strip(),
              "deepseek": os.environ.get("KEY_DEEPSEEK", "").strip(),
              "openai": os.environ.get("KEY_OPENAI", "").strip()
          }

          # GOVERNOR: 15s delay to protect free tier buckets
          MIN_DELAY = 15.0
          LAST_REQUEST = 0

          print(f">>> [SYSTEM] Omni-Core Online.")
          print(f"    - Execution Order: {' -> '.join([q.upper() for q in QUEUE])}")
          print(f"    - Gemini Engine: {GEMINI_ID}")

          # ======================================================
          # CLASS: CORTEX (LOGIC GATE)
          # ======================================================
          class Cortex:
              @staticmethod
              def solve_math(local, remote, filename):
                  l_lines = [x.strip() for x in local.splitlines() if x.strip()]
                  r_lines = [x.strip() for x in remote.splitlines() if x.strip()]

                  # 1. Makefile Version Bump (Always Remote)
                  if filename == 'Makefile':
                      if any(x.startswith(('VERSION', 'PATCHLEVEL', 'SUBLEVEL')) for x in r_lines):
                          print(f"    ⚡ [CORTEX] Kernel Version Bump -> REMOTE")
                          return remote
                      if all('+=' in x for x in l_lines + r_lines):
                          print(f"    ⚡ [CORTEX] Makefile Append -> MERGE")
                          return local + "\n" + remote

                  # 2. Set Union (Lists, Configs, Includes)
                  if any(filename.endswith(x) for x in ['.gitignore', '.txt', '.conf', '.json']) or \
                     all(x.startswith(('#include', 'import')) for x in l_lines + r_lines):
                      print(f"    ⚡ [CORTEX] Set Union Merge")
                      return "\n".join(sorted(list(set(l_lines + r_lines))))

                  # 3. Kconfig
                  if 'Kconfig' in filename:
                      if all(re.match(r'^(config|bool|default|select|menu|source)', x) or '=' in x for x in l_lines + r_lines):
                          print("    ⚡ [CORTEX] Merging Config Definitions")
                          return "\n".join(sorted(list(set(l_lines + r_lines))))
                  return None

              @staticmethod
              def validate(text, filename):
                  clean = re.sub(r'//.*', '', text)
                  clean = re.sub(r'/\*.*?\*/', '', clean, flags=re.DOTALL)
                  if any(filename.endswith(x) for x in ['.txt', '.gitignore', 'Makefile', '.mk', 'Kconfig']): return True
                  return clean.count('{') == clean.count('}')

          # ======================================================
          # CLASS: OMNI AGENT (MULTI-PROVIDER)
          # ======================================================
          class OmniAgent:
              @staticmethod
              def clean(text):
                  text = re.sub(r'^```[a-z]*\n', '', text, flags=re.MULTILINE)
                  text = re.sub(r'\n```$', '', text, flags=re.MULTILINE)
                  return text.strip()

              @staticmethod
              def govern():
                  global LAST_REQUEST
                  now = time.time()
                  elapsed = now - LAST_REQUEST
                  if elapsed < MIN_DELAY:
                      time.sleep(MIN_DELAY - elapsed)
                  LAST_REQUEST = time.time()

              @staticmethod
              def call(provider, prompt):
                  OmniAgent.govern()
                  key = KEYS.get(provider)
                  
                  if provider == "deepseek":
                      try:
                          resp = requests.post(
                              "https://api.deepseek.com/v1/chat/completions",
                              headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json"},
                              json={"model": "deepseek-chat", "messages": [{"role":"user", "content":prompt}], "temperature":0.1},
                              timeout=60
                          )
                          if resp.status_code == 200:
                              return OmniAgent.clean(resp.json()['choices'][0]['message']['content'])
                      except: pass

                  elif provider == "openai":
                      try:
                          resp = requests.post(
                              "https://api.openai.com/v1/chat/completions",
                              headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json"},
                              json={"model": "gpt-4o-mini", "messages": [{"role":"user", "content":prompt}], "temperature":0.1},
                              timeout=60
                          )
                          if resp.status_code == 200:
                              return OmniAgent.clean(resp.json()['choices'][0]['message']['content'])
                      except: pass

                  elif provider == "gemini":
                      url = f"https://generativelanguage.googleapis.com/v1beta/models/{GEMINI_ID}:generateContent?key={key}"
                      for i in range(2):
                          try:
                              resp = requests.post(
                                  url, headers={'Content-Type': 'application/json'},
                                  json={"contents": [{"parts": [{"text": prompt}]}], "generationConfig": {"temperature": 0.2}},
                                  timeout=60
                              )
                              if resp.status_code == 200:
                                  return OmniAgent.clean(resp.json()['candidates'][0]['content']['parts'][0]['text'])
                              elif resp.status_code == 429:
                                  print("    🛑 [GEMINI] 429. Sleeping 60s...")
                                  time.sleep(60)
                                  continue
                          except: time.sleep(5)
                  
                  return None

          # ======================================================
          # ORCHESTRATOR
          # ======================================================
          def solve_conflict(filepath):
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f: lines = f.readlines()
              except: return

              new_lines = []
              i = 0
              modified = False
              
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('<<<<<<<'):
                      start = i
                      # Context: Truncate to 2000 chars to save tokens
                      pre_raw = "".join(lines[max(0, start-40):start])
                      pre = pre_raw[-2000:]
                      
                      local_blk, remote_blk = [], []
                      mode = "local"
                      i += 1
                      while i < len(lines):
                          if lines[i].startswith('======='): mode = "remote"
                          elif lines[i].startswith('>>>>>>>'): break
                          else:
                              if mode == "local": local_blk.append(lines[i])
                              else: remote_blk.append(lines[i])
                          i += 1
                      
                      post_raw = "".join(lines[i+1:min(len(lines), i+40)])
                      post = post_raw[:2000]
                      
                      local_str = "".join(local_blk)
                      remote_str = "".join(remote_blk)
                      
                      print(f"🔎 Conflict: {filepath} (Line {start})")

                      # 1. CORTEX
                      merged = Cortex.solve_math(local_str, remote_str, filepath)
                      
                      # 2. GHOST DETECT
                      if merged is None and not local_str.strip() and remote_str.strip():
                          print("    👻 [CORTEX] Detected Deletion -> Preserving")
                          merged = ""

                      # 3. AI LOOP (QUEUE)
                      if merged is None:
                          prompt = f"""
                          ROLE: Senior Linux Kernel Dev.
                          TASK: Merge Conflict in '{filepath}'.
                          RULES:
                          1. **LOCAL SUPREMACY:** My branch (LOCAL) contains custom drivers. PRESERVE IT.
                          2. **UPSTREAM:** Merge REMOTE changes only if they are version updates/bugfixes that don't break LOCAL.
                          3. **SYNTAX:** Strict brace balance.
                          
                          CONTEXT BEFORE:
                          {pre}
                          <<<<<<< LOCAL
                          {local_str}
                          =======
                          {remote_str}
                          >>>>>>> REMOTE
                          CONTEXT AFTER:
                          {post}
                          
                          OUTPUT: VALID C CODE ONLY.
                          """
                          
                          for provider in QUEUE:
                              if provider == "none": continue
                              print(f"    🧠 Asking {provider.upper()}...")
                              ai_out = OmniAgent.call(provider, prompt)
                              
                              if ai_out and Cortex.validate(ai_out, filepath):
                                  print(f"    ✅ Resolved by {provider.upper()}.")
                                  merged = ai_out
                                  break # Exit Queue Loop
                              elif ai_out:
                                  print(f"    ⚠️ {provider.upper()} Validation Failed.")

                      # 4. FINAL FALLBACK
                      if merged is not None:
                          new_lines.append(merged + "\n")
                      else:
                          print("    ☢️ ALL FAILED. Enforcing LOCAL.")
                          new_lines.append(local_str)

                      modified = True
                  else:
                      new_lines.append(line)
                  i += 1

              if modified:
                  with open(filepath, 'w', encoding='utf-8') as f: f.writelines(new_lines)
                  subprocess.run(["git", "add", filepath], check=True)

          if __name__ == "__main__":
              if not os.path.exists("conflicts.txt"): sys.exit(0)
              with open("conflicts.txt", "r") as f:
                  files = [x.strip() for x in f if x.strip()]
              
              print(f"📋 Mission: Fix {len(files)} files.")
              for f in files:
                  if os.path.exists(f): solve_conflict(f)
          EOF

      - name: 🧬 Execute Strategic Merge
        id: merge
        shell: bash
        run: |
          git remote add upstream "${{ inputs.upstream_repo }}" 2>/dev/null || true
          git fetch upstream "${{ inputs.upstream_branch }}" --no-tags
          
          TS=$(date +%s)
          TMP="omni-$TS"
          git checkout -b "$TMP" "origin/${{ inputs.target_branch }}"
          echo "branch=$TMP" >> $GITHUB_OUTPUT

          echo "🧹 Sanitizing Index..."
          git rm -r --cached toolchains > /dev/null 2>&1 || true

          echo ">>> Executing Merge..."
          git merge "upstream/${{ inputs.upstream_branch }}" \
            --no-commit --no-ff \
            -s ort \
            -X find-renames=50% \
            -X ignore-all-space \
            -X diff-algorithm=histogram || true
          
          git diff --name-only --diff-filter=U > conflicts.txt
          COUNT=$(wc -l < conflicts.txt)
          
          if [ "$COUNT" -gt "0" ]; then
             echo "has_conflicts=true" >> $GITHUB_OUTPUT
             echo "⚠️ Conflicts: $COUNT"
             cat conflicts.txt
          else
             echo "has_conflicts=false" >> $GITHUB_OUTPUT
             echo "✅ Clean Merge."
          fi

      - name: 🚑 Engage Omni-Core
        if: steps.merge.outputs.has_conflicts == 'true'
        run: |
          echo ">>> Starting Omni-Core..."
          python3 -u omni_core.py
          rm omni_core.py conflicts.txt

      - name: 🔒 Commit & Push
        run: |
          if grep -r "<<<<<<< HEAD" . --exclude-dir=.github; then
             echo "⚠️ Cleaning markers..."
             grep -r -l "<<<<<<< HEAD" . | xargs sed -i '/<<<<<<< HEAD/d'
             grep -r -l "=======" . | xargs sed -i '/=======/d'
             grep -r -l ">>>>>>>" . | xargs sed -i '/>>>>>>>/d'
          fi

          if [[ -n $(git diff --name-only --diff-filter=U) ]]; then
             echo "❌ CRITICAL: Unmerged files."
             exit 1
          fi

          git add .
          git reset HEAD toolchains > /dev/null 2>&1 || true
          
          if git diff-index --quiet HEAD --; then
             echo "⚠️ No changes."
          else
             git commit -m "Omni: Auto-Merge ($MODEL_GEMINI)"
             TARGET="${{ inputs.target_branch }}"
             BRANCH="${{ steps.merge.outputs.branch }}"
             
             git repack -a -d
             for i in {1..5}; do
                if git push origin "$BRANCH:refs/heads/$TARGET"; then
                   echo "✅ SUCCESS"
                   git push origin --delete "$BRANCH"
                   exit 0
                fi
                sleep 5
             done
             exit 1
          fi

      - name: 📝 Report
        if: failure()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "❌ Omni-Merge Failed"
          body: "Manual intervention required on branch `${{ steps.merge.outputs.branch }}`."
          branch: ${{ steps.merge.outputs.branch }}
          base: ${{ inputs.target_branch }}
