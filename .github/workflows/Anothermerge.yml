name: auto merge v2

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream URL'
        required: true
        default: 'https://github.com/neophyteprjkt/kernel_xiaomi_ginkgo.git'
      upstream_branch:
        description: 'Upstream Branch'
        required: true
        default: 'main'
      target_branch:
        description: 'Target Branch'
        required: true
        default: 'floppy-new'
      
      ai_api_key:
        description: 'Gemini API Key'
        required: true
      
      ai_model:
        description: 'Model ID'
        required: true
        default: 'models/gemini-2.5-flash'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  apex_engine:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AI_KEY: ${{ inputs.ai_api_key }}
      AI_MODEL: ${{ inputs.ai_model }}

    steps:
      # ========================================================
      # 1. PROFESSIONAL ENVIRONMENT & CHECKOUT
      # ========================================================
      - name: 🛡️ Harden System
        run: |
          # Clean bloat to prevent disk space issues
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git python3-pip python3-requests
          pip3 install requests

      - name: 📥 Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configure Git Logic
        run: |
          git config --global user.name "Apex-GodMode"
          git config --global user.email "bot@floppykernel.ai"
          git config merge.renameLimit 999999
          
          # BINARY GUARD: Protect Kernel Blobs
          echo "* -text" > .gitattributes
          for ext in png dtb gz ko o bpf zip jpg bmp; do
            echo "*.$ext binary" >> .gitattributes
          done

      # ========================================================
      # 2. INJECT THE APEX BRAIN (PYTHON LOGIC)
      # ========================================================
      - name: 🧠 Inject Apex Brain
        run: |
          cat << 'EOF' > apex_brain.py
          import sys, os, re, requests, time, subprocess

          # --- CONFIGURATION ---
          API_KEY = os.environ.get("AI_KEY", "").strip()
          MODEL_ID = os.environ.get("AI_MODEL", "models/gemini-2.5-flash")
          
          # --- TUNING ---
          MAX_RETRIES = 5
          # RESET AI: We wait 5 seconds after every file to reset quota
          SESSION_RESET_TIME = 5

          def clean_response(text):
              """Sanitizes AI output."""
              text = re.sub(r'^```[a-z]*\n', '', text, flags=re.MULTILINE)
              text = re.sub(r'\n```$', '', text, flags=re.MULTILINE)
              text = re.sub(r'<<<<<<< .*', '', text)
              text = re.sub(r'=======', '', text)
              text = re.sub(r'>>>>>>> .*', '', text)
              return text.strip()

          def validate_syntax(text, filename):
              """Checks for basic C/C++ integrity."""
              clean = re.sub(r'//.*', '', text)
              clean = re.sub(r'/\*.*?\*/', '', clean, flags=re.DOTALL)
              
              # Allow Makefiles/Lists/Txt
              if any(filename.endswith(x) for x in ['.txt', '.gitignore', 'Makefile', '.mk', '.bp']):
                  return True
              
              # C-Balance Check
              return clean.count('{') == clean.count('}')

          def reset_session():
              """The 'Reset' Logic you requested."""
              print(f"      ⏳ System: Resetting Session ({SESSION_RESET_TIME}s)...")
              time.sleep(SESSION_RESET_TIME)

          def execute_gemini_request(prompt):
              url = f"https://generativelanguage.googleapis.com/v1beta/{MODEL_ID}:generateContent?key={API_KEY}"
              headers = {'Content-Type': 'application/json'}
              data = {
                  "contents": [{"parts": [{"text": prompt}]}],
                  "generationConfig": {"temperature": 0.2, "maxOutputTokens": 8192}
              }

              for attempt in range(1, MAX_RETRIES + 1):
                  try:
                      response = requests.post(url, headers=headers, json=data, timeout=60)
                      if response.status_code == 200:
                          try:
                              return clean_response(response.json()['candidates'][0]['content']['parts'][0]['text'])
                          except: return None
                      elif response.status_code == 429:
                          wait = attempt * 15
                          print(f"      🛑 [429] Rate Limit. Pausing {wait}s...")
                          time.sleep(wait)
                          continue
                      elif response.status_code >= 500:
                          time.sleep(5)
                          continue
                      else:
                          print(f"      ❌ Fatal API Error: {response.status_code}")
                          return None
                  except: time.sleep(5)
              return None

          def solve_heuristic(local, remote, filename):
              """Solves Lists/Imports instantly without AI."""
              l_lines = [x.strip() for x in local.splitlines() if x.strip()]
              r_lines = [x.strip() for x in remote.splitlines() if x.strip()]
              
              # Gitignore / Txt
              if filename.endswith('.gitignore') or filename.endswith('.txt'):
                  print(f"      ⚡ [LOGIC] Merging List")
                  return "\n".join(sorted(list(set(l_lines + r_lines))))
              
              # Header Imports
              if all(x.startswith('#include') or x.startswith('import') for x in l_lines + r_lines):
                  print("      ⚡ [LOGIC] Merging Includes")
                  return "\n".join(sorted(list(set(l_lines + r_lines))))
              return None

          def process_block(local, remote, pre, post, filename):
              # 1. Heuristic
              heuristic = solve_heuristic(local, remote, filename)
              if heuristic: return heuristic

              # 2. AI
              print(f"      🧠 [AI] Engaging {MODEL_ID}...")
              prompt = f"""
              ROLE: Expert Linux Kernel Developer.
              TASK: Resolve Git Conflict in '{filename}'.
              RULES:
              1. PRESERVE 'LOCAL' (Downstream Driver Logic).
              2. MERGE 'REMOTE' (Upstream Fixes) only if safe.
              3. OUTPUT CODE ONLY. NO MARKDOWN.
              
              CONTEXT BEFORE:
              {pre}
              <<<<<<< LOCAL
              {local}
              =======
              {remote}
              >>>>>>> REMOTE
              CONTEXT AFTER:
              {post}
              """
              
              ai_sol = execute_gemini_request(prompt)
              if ai_sol and validate_syntax(ai_sol, filename):
                  return ai_sol
              return None

          def process_file(filepath):
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f: lines = f.readlines()
              except: return

              new_lines = []
              i = 0
              modified = False
              
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('<<<<<<<'):
                      start = i
                      pre_ctx = "".join(lines[max(0, start-100):start])
                      
                      local_blk, remote_blk = [], []
                      mode = "local"
                      i += 1
                      while i < len(lines):
                          if lines[i].startswith('======='): mode = "remote"
                          elif lines[i].startswith('>>>>>>>'): break
                          else:
                              if mode == "local": local_blk.append(lines[i])
                              else: remote_blk.append(lines[i])
                          i += 1
                      
                      post_ctx = "".join(lines[i+1:min(len(lines), i+100)])
                      
                      print(f"🔎 Conflict: {filepath}")
                      resolved = process_block("".join(local_blk), "".join(remote_blk), pre_ctx, post_ctx, filepath)
                      
                      if resolved:
                          new_lines.append(resolved + "\n")
                          print("      ✅ Resolved.")
                      else:
                          print("      ☢️ FAILED. Enforcing LOCAL (Ours).")
                          new_lines.append("".join(local_blk))
                      
                      modified = True
                      reset_session()
                  else:
                      new_lines.append(line)
                  i += 1

              if modified:
                  with open(filepath, 'w', encoding='utf-8') as f: f.writelines(new_lines)
                  subprocess.run(["git", "add", filepath], check=True)

          if __name__ == "__main__":
              if not os.path.exists("conflicts.txt"): sys.exit(0)
              with open("conflicts.txt", "r") as f:
                  files = [x.strip() for x in f if x.strip()]
              
              print(f"📋 Processing {len(files)} conflicts...")
              for f in files:
                  if os.path.exists(f): process_file(f)
          EOF

      # ========================================================
      # 3. MERGE EXECUTION (THE FIX)
      # ========================================================
      - name: 🧬 Merge & Detect
        id: merge
        shell: bash
        run: |
          # 1. SETUP REMOTES
          git remote add upstream "${{ inputs.upstream_repo }}" 2>/dev/null || true
          git fetch upstream "${{ inputs.upstream_branch }}" --no-tags
          
          # 2. CREATE TEMP BRANCH
          TS=$(date +%s)
          TMP="godmode-$TS"
          git checkout -b "$TMP" "origin/${{ inputs.target_branch }}"
          echo "branch=$TMP" >> $GITHUB_OUTPUT

          # 3. CLEAN SUBMODULES (CRITICAL FIX: PRE-MERGE CLEANUP)
          # Removes toolchains from index so merge doesn't trip on them
          echo "🧹 Sanitizing index..."
          git rm -r --cached toolchains > /dev/null 2>&1 || true

          # 4. EXECUTE MERGE
          echo ">>> STARTING MERGE..."
          # set +e ensures script doesn't die on conflict
          set +e 
          git merge "upstream/${{ inputs.upstream_branch }}" \
            --no-commit --no-ff \
            -s ort \
            -X find-renames=50% \
            -X ignore-all-space \
            -X diff-algorithm=histogram
          
          MERGE_EXIT_CODE=$?
          echo "Merge Exit Code: $MERGE_EXIT_CODE"

          # 5. CAPTURE CONFLICTS
          # We check for Unmerged (U) files
          git diff --name-only --diff-filter=U > conflicts.txt
          COUNT=$(wc -l < conflicts.txt)
          
          if [ "$COUNT" -gt "0" ]; then
             echo "found_conflicts=true" >> $GITHUB_OUTPUT
             echo "⚠️ Detected $COUNT conflicts."
             cat conflicts.txt
          else
             echo "found_conflicts=false" >> $GITHUB_OUTPUT
             echo "✅ Clean merge."
          fi

      # ========================================================
      # 4. ENGAGE APEX BRAIN
      # ========================================================
      - name: 🚑 Engage Apex AI
        if: steps.merge.outputs.found_conflicts == 'true'
        run: |
          echo ">>> STARTING AI RESOLUTION..."
          python3 apex_brain.py
          rm apex_brain.py conflicts.txt

      # ========================================================
      # 5. VERIFY & DEPLOY
      # ========================================================
      - name: 🔒 Verify & Push
        run: |
          # 1. MARKER SAFETY CHECK
          if grep -r "<<<<<<< HEAD" . --exclude-dir=.github; then
             echo "⚠️ Cleaning residual markers..."
             grep -r -l "<<<<<<< HEAD" . | xargs sed -i '/<<<<<<< HEAD/d'
             grep -r -l "=======" . | xargs sed -i '/=======/d'
             grep -r -l ">>>>>>>" . | xargs sed -i '/>>>>>>>/d'
          fi
          
          # 2. FINAL INDEX CHECK
          if [[ -n $(git diff --name-only --diff-filter=U) ]]; then
             echo "❌ CRITICAL: Unmerged files remain."
             exit 1
          fi

          # 3. COMMIT
          # Re-add everything carefully
          git add .
          
          # Exclude toolchains again to keep repo clean
          git reset HEAD toolchains > /dev/null 2>&1 || true
          
          if git diff-index --quiet HEAD --; then
             echo "⚠️ No changes to commit."
          else
             git commit -m "Apex GodMode: Auto-Merge (${{ inputs.ai_model }})"
             
             TARGET="${{ inputs.target_branch }}"
             BRANCH="${{ steps.merge.outputs.branch }}"
             
             # 4. PUSH
             git repack -a -d
             for i in {1..5}; do
                if git push origin "$BRANCH:refs/heads/$TARGET"; then
                   echo "✅ DEPLOY SUCCESSFUL: $TARGET"
                   git push origin --delete "$BRANCH"
                   exit 0
                fi
                echo "   🔄 Retrying push..."
                sleep 5
             done
             exit 1
          fi

      # ========================================================
      # 6. REPORTING
      # ========================================================
      - name: 📝 Failure Report
        if: failure()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "❌ Apex GodMode Failed"
          body: "Manual intervention required on branch `${{ steps.merge.outputs.branch }}`."
          branch: ${{ steps.merge.outputs.branch }}
          base: ${{ inputs.target_branch }}
