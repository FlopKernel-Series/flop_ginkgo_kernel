name: ⚙️ merge system 

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream Repository URL'
        required: true
        default: 'https://github.com/neophyteprjkt/kernel_xiaomi_ginkgo.git'
      upstream_branch:
        description: 'Upstream Branch'
        required: true
        default: 'main'
      target_branch:
        description: 'Target Branch'
        required: true
        default: 'floppy-new'
      
      ai_api_key:
        description: 'Gemini API Key'
        required: true
      
      ai_model:
        description: 'Model ID'
        required: true
        default: 'gemini-2.5-flash'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  titanium_core:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AI_KEY: ${{ inputs.ai_api_key }}
      AI_MODEL: ${{ inputs.ai_model }}

    steps:
      # ========================================================
      # PHASE 1: HARDENING & PREP
      # ========================================================
      - name: 🛡️ Harden System
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git python3-pip python3-requests
          pip3 install requests

      - name: 📥 Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configure Git
        run: |
          git config --global user.name "Apex-Titanium"
          git config --global user.email "bot@floppykernel.ai"
          git config merge.renameLimit 999999
          
          # BINARY GUARD: Prevent text-merging of binary assets
          echo "* -text" > .gitattributes
          for ext in png dtb gz ko o bpf zip jpg bmp iso so a; do
            echo "*.$ext binary" >> .gitattributes
          done

      # ========================================================
      # PHASE 2: THE LOGIC CORE (PYTHON INJECTION)
      # ========================================================
      - name: 🧠 Inject Titanium Core
        run: |
          cat << 'EOF' > titanium_core.py
          import sys, os, re, requests, time, subprocess

          # 1. FORCE UNBUFFERED OUTPUT (Fixes "Silent Death")
          sys.stdout.reconfigure(line_buffering=True)

          # 2. CONFIGURATION
          API_KEY = os.environ.get("AI_KEY", "").strip()
          # Fix "Double Prefix" Error
          RAW_MODEL = os.environ.get("AI_MODEL", "gemini-2.5-flash")
          MODEL_ID = RAW_MODEL.replace("models/", "")
          
          MAX_RETRIES = 3
          # CRITICAL: Reduced context to 40 lines to save Tokens and prevent 429
          CONTEXT_LINES = 40  

          # RATE LIMIT GOVERNOR (15 RPM = 4s/req. We use 5s for safety)
          MIN_DELAY = 5.0
          LAST_CALL = 0

          print(f">>> [INIT] Titanium Core Active. Model: {MODEL_ID}")

          def enforce_rate_limit():
              global LAST_CALL
              now = time.time()
              elapsed = now - LAST_CALL
              if elapsed < MIN_DELAY:
                  sleep_time = MIN_DELAY - elapsed
                  print(f"    ⏳ Governor: Pacing ({sleep_time:.2f}s)...")
                  time.sleep(sleep_time)
              LAST_CALL = time.time()

          def clean_response(text):
              text = re.sub(r'^```[a-z]*\n', '', text, flags=re.MULTILINE)
              text = re.sub(r'\n```$', '', text, flags=re.MULTILINE)
              text = re.sub(r'<<<<<<< .*', '', text)
              text = re.sub(r'=======', '', text)
              text = re.sub(r'>>>>>>> .*', '', text)
              return text.strip()

          def validate_syntax(text, filename):
              # Basic brace balance check for C-like languages
              clean = re.sub(r'//.*', '', text)
              clean = re.sub(r'/\*.*?\*/', '', clean, flags=re.DOTALL)
              
              if any(filename.endswith(x) for x in ['.txt', '.gitignore', 'Makefile', '.mk', 'Kconfig', '.conf']):
                  return True
              
              return clean.count('{') == clean.count('}')

          def solve_heuristic(local, remote, filename):
              """Layer 1: Deterministic Solver (No API Cost)."""
              l_lines = [x.strip() for x in local.splitlines() if x.strip()]
              r_lines = [x.strip() for x in remote.splitlines() if x.strip()]
              
              # Lists / Configs
              if any(filename.endswith(x) for x in ['.gitignore', '.txt', '.conf']):
                  print(f"    ⚡ [LOGIC] Merging Unique List")
                  return "\n".join(sorted(list(set(l_lines + r_lines))))

              # Includes / Imports
              if all(x.startswith('#include') or x.startswith('import') for x in l_lines + r_lines):
                  print("    ⚡ [LOGIC] Merging Headers")
                  return "\n".join(sorted(list(set(l_lines + r_lines))))

              # Makefile Additions (obj-y +=)
              if 'Makefile' in filename or filename.endswith('.mk'):
                  if all('+=' in x for x in l_lines + r_lines):
                      print("    ⚡ [LOGIC] Merging Makefile Additions")
                      return local + "\n" + remote

              # Kconfig (config FOO)
              if 'Kconfig' in filename:
                  if all((x.startswith('config ') or x.startswith('bool ') or x.startswith('default ')) for x in l_lines + r_lines):
                       print("    ⚡ [LOGIC] Merging Kconfig Entries")
                       return local + "\n" + remote

              return None

          def execute_gemini(prompt):
              enforce_rate_limit() # STRICT GOVERNOR CHECK

              url = f"https://generativelanguage.googleapis.com/v1beta/models/{MODEL_ID}:generateContent?key={API_KEY}"
              headers = {'Content-Type': 'application/json'}
              # Max Output Tokens limited to prevent runaway generation
              data = {
                  "contents": [{"parts": [{"text": prompt}]}],
                  "generationConfig": {"temperature": 0.2, "maxOutputTokens": 4096}
              }

              for attempt in range(1, MAX_RETRIES + 1):
                  try:
                      resp = requests.post(url, headers=headers, json=data, timeout=60)
                      
                      if resp.status_code == 200:
                          try:
                              return clean_response(resp.json()['candidates'][0]['content']['parts'][0]['text'])
                          except: return None
                      
                      elif resp.status_code == 429:
                          # THE PENALTY BOX
                          print(f"    🛑 Rate Limit (429). Penalty Box: Sleeping 60s...")
                          time.sleep(60) # Heavy penalty to reset bucket
                          continue
                      
                      elif resp.status_code >= 500:
                          time.sleep(5)
                          continue
                      else:
                          print(f"    ❌ API Error: {resp.status_code}")
                          return None
                  except Exception as e:
                      print(f"    ⚠️ Network: {e}")
                      time.sleep(5)
              return None

          def process_file(filepath):
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f: lines = f.readlines()
              except: return

              new_lines = []
              i = 0
              modified = False
              
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('<<<<<<<'):
                      start = i
                      # Context Reduced to 40 lines (Token Optimization)
                      pre = "".join(lines[max(0, start-CONTEXT_LINES):start])
                      
                      local_blk, remote_blk = [], []
                      mode = "local"
                      i += 1
                      while i < len(lines):
                          if lines[i].startswith('======='): mode = "remote"
                          elif lines[i].startswith('>>>>>>>'): break
                          else:
                              if mode == "local": local_blk.append(lines[i])
                              else: remote_blk.append(lines[i])
                          i += 1
                      
                      post = "".join(lines[i+1:min(len(lines), i+CONTEXT_LINES)])
                      
                      print(f"🔎 Analyzing: {filepath} (Line {start})")
                      
                      # 1. Heuristic (Cost: 0)
                      resolved = solve_heuristic("".join(local_blk), "".join(remote_blk), filepath)
                      
                      # 2. AI (Cost: 1 Request)
                      if not resolved:
                          print(f"    🧠 Engaging AI...")
                          prompt = f"""
                          ROLE: Linux Kernel Dev.
                          TASK: Merge Conflict in '{filepath}'.
                          RULES: Keep LOCAL driver logic. Merge REMOTE if safe. Output CODE ONLY.
                          
                          CONTEXT BEFORE:
                          {pre}
                          <<<<<<< LOCAL
                          {"".join(local_blk)}
                          =======
                          {"".join(remote_blk)}
                          >>>>>>> REMOTE
                          CONTEXT AFTER:
                          {post}
                          """
                          ai_res = execute_gemini(prompt)
                          if ai_res and validate_syntax(ai_res, filepath):
                              resolved = ai_res
                              print("    ✅ AI Resolved.")
                          else:
                              print("    ☢️ AI Failed/Unsafe. Enforcing LOCAL.")
                              resolved = "".join(local_blk) # Nuclear Fallback

                      new_lines.append(resolved + "\n")
                      modified = True

                  else:
                      new_lines.append(line)
                  i += 1

              if modified:
                  with open(filepath, 'w', encoding='utf-8') as f: f.writelines(new_lines)
                  subprocess.run(["git", "add", filepath], check=True)

          if __name__ == "__main__":
              # IPC: Read from file (Fixes Argument List Too Long)
              if not os.path.exists("conflicts.txt"):
                  print("No conflicts file found.")
                  sys.exit(0)
                  
              with open("conflicts.txt", "r") as f:
                  files = [x.strip() for x in f if x.strip()]
              
              print(f"📋 Processing {len(files)} conflicts...")
              for f in files:
                  if os.path.exists(f): process_file(f)
          EOF

      # ========================================================
      # PHASE 3: THE STRATEGIC MERGE
      # ========================================================
      - name: 🧬 Merge Sequence
        id: merge
        shell: bash
        run: |
          git remote add upstream "${{ inputs.upstream_repo }}" 2>/dev/null || true
          git fetch upstream "${{ inputs.upstream_branch }}" --no-tags
          
          TS=$(date +%s)
          TMP="titanium-$TS"
          git checkout -b "$TMP" "origin/${{ inputs.target_branch }}"
          echo "branch=$TMP" >> $GITHUB_OUTPUT

          # CRITICAL FIX: Clean Index of Submodules
          echo "🧹 Unstaging toolchains..."
          git rm -r --cached toolchains > /dev/null 2>&1 || true

          echo ">>> Executing Merge..."
          # || true ensures workflow continues to Python step
          git merge "upstream/${{ inputs.upstream_branch }}" \
            --no-commit --no-ff \
            -s ort \
            -X find-renames=50% \
            -X ignore-all-space \
            -X diff-algorithm=histogram || true
          
          # Detect Conflicts
          git diff --name-only --diff-filter=U > conflicts.txt
          COUNT=$(wc -l < conflicts.txt)
          
          if [ "$COUNT" -gt "0" ]; then
             echo "has_conflicts=true" >> $GITHUB_OUTPUT
             echo "⚠️ Conflicts Detected: $COUNT"
             cat conflicts.txt
          else
             echo "has_conflicts=false" >> $GITHUB_OUTPUT
             echo "✅ Clean Merge."
          fi

      # ========================================================
      # PHASE 4: EXECUTION & DEPLOY
      # ========================================================
      - name: 🚑 Run Titanium Core
        if: steps.merge.outputs.has_conflicts == 'true'
        run: |
          echo ">>> Starting Resolution Engine..."
          # -u flag fixes "Silent Death"
          python3 -u titanium_core.py
          rm titanium_core.py conflicts.txt

      - name: 🔒 Verify & Push
        run: |
          # 1. Marker Cleanup
          if grep -r "<<<<<<< HEAD" . --exclude-dir=.github; then
             echo "⚠️ Cleaning residual markers..."
             grep -r -l "<<<<<<< HEAD" . | xargs sed -i '/<<<<<<< HEAD/d'
             grep -r -l "=======" . | xargs sed -i '/=======/d'
             grep -r -l ">>>>>>>" . | xargs sed -i '/>>>>>>>/d'
          fi

          # 2. Index Check
          if [[ -n $(git diff --name-only --diff-filter=U) ]]; then
             echo "❌ CRITICAL: Unmerged files remain."
             exit 1
          fi

          # 3. Restore Index & Commit
          git add .
          # CRITICAL: Restore toolchains to index
          git reset HEAD toolchains > /dev/null 2>&1 || true
          
          if git diff-index --quiet HEAD --; then
             echo "⚠️ No changes to commit."
          else
             git commit -m "Titanium: Auto-Merge (${{ inputs.ai_model }})"
             
             TARGET="${{ inputs.target_branch }}"
             BRANCH="${{ steps.merge.outputs.branch }}"
             
             git repack -a -d
             for i in {1..5}; do
                if git push origin "$BRANCH:refs/heads/$TARGET"; then
                   echo "✅ DEPLOY SUCCESSFUL"
                   git push origin --delete "$BRANCH"
                   exit 0
                fi
                echo "   🔄 Push conflict. Retrying..."
                sleep 5
             done
             exit 1
          fi

      - name: 📝 Failure Report
        if: failure()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "❌ Titanium Merge Failed"
          body: "Manual intervention required on branch `${{ steps.merge.outputs.branch }}`."
          branch: ${{ steps.merge.outputs.branch }}
          base: ${{ inputs.target_branch }}
