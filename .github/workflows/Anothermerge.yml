name: ⚙️ merge 

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream Repository URL'
        required: true
        default: 'https://github.com/neophyteprjkt/kernel_xiaomi_ginkgo.git'
      upstream_branch:
        description: 'Upstream Branch'
        required: true
        default: 'main'
      target_branch:
        description: 'Target Branch'
        required: true
        default: 'floppy-new'
      
      ai_api_key:
        description: 'Gemini API Key'
        required: true
      
      ai_model:
        description: 'Model ID'
        required: true
        default: 'gemini-2.5-flash'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  titanium_core:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AI_KEY: ${{ inputs.ai_api_key }}
      AI_MODEL: ${{ inputs.ai_model }}

    steps:
      # ========================================================
      # PHASE 1: HARDENING & PREP
      # ========================================================
      - name: 🛡️ Harden System
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git python3-pip python3-requests
          pip3 install requests

      - name: 📥 Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configure Git
        run: |
          git config --global user.name "Apex-Titanium"
          git config --global user.email "bot@floppykernel.ai"
          git config merge.renameLimit 999999
          
          # BINARY GUARD: Prevent text-merging of binary assets
          echo "* -text" > .gitattributes
          for ext in png dtb gz ko o bpf zip jpg bmp iso so a; do
            echo "*.$ext binary" >> .gitattributes
          done

      # ========================================================
      # PHASE 2: THE LOGIC CORE
      # ========================================================
      - name: 🧠 Inject Titanium Core
        run: |
          cat << 'EOF' > titanium_core.py
          import sys, os, re, requests, time, subprocess

          # FORCE UNBUFFERED LOGS
          sys.stdout.reconfigure(line_buffering=True)

          # --- CONFIGURATION ---
          API_KEY = os.environ.get("AI_KEY", "").strip()
          RAW_MODEL = os.environ.get("AI_MODEL", "gemini-2.5-flash")
          MODEL_ID = RAW_MODEL.replace("models/", "")

          # --- TUNING FOR FREE TIER (15 RPM = 4s/request) ---
          MIN_REQUEST_INTERVAL = 10.0 # Strict 10s delay between AI calls (extra safety)
          LAST_REQUEST_TIME = 0       # Tracks last API call time

          MAX_AI_RETRIES_PER_BLOCK = 3 # AI's internal attempts for self-correction
          MAX_API_BACKOFF_ATTEMPTS = 3 # Network/429 retries

          CONTEXT_LINES = 40          # Token Optimization

          print(f">>> [INIT] Apex Titanium Pro. Model: {MODEL_ID}")

          def enforce_rate_limit():
              """Strictly enforces minimum delay between API calls."""
              global LAST_REQUEST_TIME
              now = time.time()
              elapsed = now - LAST_REQUEST_TIME
              if elapsed < MIN_REQUEST_INTERVAL:
                  sleep_time = MIN_REQUEST_INTERVAL - elapsed
                  time.sleep(sleep_time)
              LAST_REQUEST_TIME = time.time()

          def clean_response(text):
              """Sanitizes AI output."""
              text = re.sub(r'^```[a-z]*\n', '', text, flags=re.MULTILINE)
              text = re.sub(r'\n```$', '', text, flags=re.MULTILINE)
              text = re.sub(r'<<<<<<< .*', '', text)
              text = re.sub(r'=======', '', text)
              text = re.sub(r'>>>>>>> .*', '', text)
              return text.strip()

          def remove_comments(text):
              """Strips C-style comments to reduce token count for context."""
              text = re.sub(r'//.*', '', text)
              text = re.sub(r'/\*.*?\*/', '', text, flags=re.DOTALL)
              return text

          def validate_syntax(text, filename):
              clean = remove_comments(text)
              
              if any(filename.endswith(x) for x in ['.txt', '.gitignore', 'Makefile', '.mk', 'Kconfig', '.conf', '.json']):
                  return True # Allow non-code files to pass freely
              
              # DTS/DTSI specific check (only brace balance)
              if filename.endswith('.dts') or filename.endswith('.dtsi'):
                  return clean.count('{') == clean.count('}')

              # Standard C/C++ Brace Balance
              return clean.count('{') == clean.count('}')

          # --- THE HEURISTIC FIREWALL (0 TOKEN COST) ---
          def solve_heuristic(local, remote, filename):
              l_lines = [x.strip() for x in local.splitlines() if x.strip()]
              r_lines = [x.strip() for x in remote.splitlines() if x.strip()]
              
              # 1. Lists / Configs / Gitignore
              if any(filename.endswith(x) for x in ['.gitignore', '.txt', '.conf', '.json']):
                  print(f"    ⚡ [HEURISTIC] Merging Unique List (0 Tokens)")
                  return "\n".join(sorted(list(set(l_lines + r_lines))))

              # 2. Includes / Imports
              if all(x.startswith('#include') or x.startswith('import') for x in l_lines + r_lines):
                  print("    ⚡ [HEURISTIC] Merging Headers (0 Tokens)")
                  return "\n".join(sorted(list(set(l_lines + r_lines))))

              # 3. Makefiles (obj-y += foo.o)
              if 'Makefile' in filename or filename.endswith('.mk'):
                  if all(re.match(r'^\s*(obj|lib|extra|subdir)-[ym]\s*\+?=.*', x) for x in l_lines + r_lines):
                      print("    ⚡ [HEURISTIC] Merging Makefile Additions (0 Tokens)")
                      return local + "\n" + remote
                  # General Makefile lines (e.g., variable assignments, targets)
                  if all(re.match(r'^\s*([A-Za-z0-9_-]+)\s*(\:|\?|\+|\=).*', x) or x.startswith('\t') for x in l_lines + r_lines):
                       print("    ⚡ [HEURISTIC] Merging Makefile Union (0 Tokens)")
                       return "\n".join(list(set(l_lines + r_lines))) # Simple union

              # 4. Kconfig / Defconfig (CONFIG_FOO=y)
              if 'Kconfig' in filename or 'defconfig' in filename:
                  if all((x.startswith('config ') or x.startswith('bool ') or x.startswith('default ') or '=' in x or x.startswith('menu ') or x.startswith('endmenu ')) for x in l_lines + r_lines):
                      print("    ⚡ [HEURISTIC] Merging Kconfig Entries (0 Tokens)")
                      merged_configs = {}
                      for line in l_lines + r_lines:
                          key_match = re.match(r'^\s*(config|menu|endmenu|bool|tristate|default|select|depends on|prompt|help)\s+([A-Za-z0-9_]+).*', line)
                          if key_match:
                              key = key_match.group(1).strip() + ':' + key_match.group(2).strip()
                              merged_configs[key] = line
                          elif '=' in line:
                              key = line.split('=')[0].strip()
                              merged_configs[key] = line
                          else: # For comments or other unique lines
                              merged_configs[line] = line
                      return "\n".join(sorted(merged_configs.values()))
            
              # 5. DTS/DTSI Property Additions (simple, non-nested)
              if filename.endswith('.dts') or filename.endswith('.dtsi'):
                  # Looking for lines like `property = <val>;` or `node {`
                  if all(re.match(r'^\s*([a-zA-Z0-9_-]+\s*=\s*<[^>]*>\s*;|[a-zA-Z0-9_-]+\s*=\s*"[^"]*"\s*;|[a-zA-Z0-9_-]+\s*\{)\s*$', x) or x.startswith('#include') for x in l_lines + r_lines):
                      print("    ⚡ [HEURISTIC] Merging DTS Properties (0 Tokens)")
                      unique_dts_lines = list(set(l_lines + r_lines))
                      return "\n".join(sorted(unique_dts_lines, key=lambda x: x.strip()))


              return None

          def execute_gemini_request_with_feedback(prompt_base, filename):
              """
              AI Engine with Self-Correction and Rate Limit Management.
              (Mimics merge.yml's 'thinking' strategy)
              """
              current_error = ""
              for attempt in range(1, MAX_AI_RETRIES_PER_BLOCK + 1):
                  print(f"    🧠 [AI] Attempt {attempt} (for this block)...")
                  full_prompt = prompt_base
                  if current_error:
                      full_prompt += f"\n\nPREVIOUS ATTEMPT ERROR TO FIX: {current_error}"

                  # --- STRICT RATE LIMIT GOVERNOR ---
                  enforce_rate_limit() 

                  url = f"https://generativelanguage.googleapis.com/v1beta/models/{MODEL_ID}:generateContent?key={API_KEY}"
                  headers = {'Content-Type': 'application/json'}
                  data = {
                      "contents": [{"parts": [{"text": full_prompt}]}],
                      "generationConfig": {"temperature": 0.2, "maxOutputTokens": 4096}
                  }

                  api_retries = 0
                  while api_retries < MAX_API_BACKOFF_ATTEMPTS:
                      try:
                          resp = requests.post(url, headers=headers, json=data, timeout=60)
                          
                          if resp.status_code == 200:
                              try:
                                  ai_res = clean_response(resp.json()['candidates'][0]['content']['parts'][0]['text'])
                                  # Validate AI Output
                                  if "<<<<<<<" in ai_res:
                                      current_error = "Generated content still contains git conflict markers. Remove them."
                                      print(f"    ⚠️ AI Self-Correction: {current_error}")
                                      break # Break API retry loop, go to next AI attempt
                                  if not validate_syntax(ai_res, filename):
                                      current_error = "Generated content has unbalanced syntax (braces/parentheses). Fix it."
                                      print(f"    ⚠️ AI Self-Correction: {current_error}")
                                      break # Break API retry loop, go to next AI attempt
                                  return ai_res # Valid solution, return it
                              except:
                                  current_error = "Failed to parse AI response (KeyError/JSON issue)."
                                  print(f"    ⚠️ AI Self-Correction: {current_error}")
                                  break # Break API retry loop, go to next AI attempt
                              
                          elif resp.status_code == 429:
                              wait = 30 * (api_retries + 1) # Exponential backoff for 429
                              print(f"    🛑 Rate Limit (429). Sleeping {wait}s...")
                              time.sleep(wait)
                              api_retries += 1
                              current_error = f"API hit rate limit. Waited {wait}s. Try again with more precise merging."
                              continue # Retry API call
                          
                          elif resp.status_code >= 500:
                              print(f"    ⚠️ API Server Error: {resp.status_code}. Retrying in 5s.")
                              time.sleep(5)
                              api_retries += 1
                              continue
                          else:
                              print(f"    ❌ Fatal API Error {resp.status_code}.")
                              return None # Unrecoverable API error for this block

                      except Exception as e:
                          print(f"    ⚠️ Network Exception: {e}. Retrying in 5s.")
                          time.sleep(5)
                          api_retries += 1
                          continue
                  
                  # If we exhausted API retries for this AI attempt
                  if api_retries == MAX_API_BACKOFF_ATTEMPTS:
                      print(f"    ☢️ API calls exhausted for this AI attempt. Trying next AI attempt.")
                      current_error = "API calls to model failed after multiple retries."
                      # The outer loop will continue with current_error to the AI
                      
              print("    ☢️ Max AI Retries Exceeded for this block.")
              return None # AI failed after all self-correction attempts

          def process_file(filepath):
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f: lines = f.readlines()
              except Exception as e:
                  print(f"    ❌ File Read Error: {e}")
                  return

              new_lines = []
              i = 0
              modified = False
              
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('<<<<<<<'):
                      start = i
                      
                      pre_raw = "".join(lines[max(0, start-CONTEXT_LINES):start])
                      pre = remove_comments(pre_raw) # Token Optimization
                      
                      local_blk, remote_blk = [], []
                      mode = "local"
                      i += 1
                      while i < len(lines):
                          if lines[i].startswith('======='): mode = "remote"
                          elif lines[i].startswith('>>>>>>>'): break
                          else:
                              if mode == "local": local_blk.append(lines[i])
                              else: remote_blk.append(lines[i])
                          i += 1
                      
                      post_raw = "".join(lines[i+1:min(len(lines), i+CONTEXT_LINES)])
                      post = remove_comments(post_raw) # Token Optimization
                      
                      local_str = "".join(local_blk)
                      remote_str = "".join(remote_blk)

                      print(f"🔎 Analyzing: {filepath} (Line {start})")
                      
                      # 1. HEURISTIC FIREWALL (0 Token Cost)
                      resolved = solve_heuristic(local_str, remote_str, filepath)
                      
                      # 2. AI ENGINE (With Self-Correction)
                      if not resolved:
                          print(f"    🧠 Engaging AI (with self-correction)...")
                          prompt_base = f"""
                          ROLE: Senior Linux Kernel Developer.
                          TASK: Resolve Git Conflict in '{filepath}'.
                          
                          RULES:
                          1. Output ONLY THE MERGED CODE. No Markdown, no explanations.
                          2. PRESERVE 'LOCAL' (Downstream/My Driver) Logic - This is the primary directive.
                          3. MERGE 'REMOTE' (Upstream) changes carefully, only if they don't break LOCAL.
                          4. Ensure perfect syntax balance for braces {{}} and parentheses ().
                          
                          CONTEXT BEFORE:
                          {pre}
                          <<<<<<< LOCAL
                          {local_str}
                          =======
                          {remote_str}
                          >>>>>>> REMOTE
                          CONTEXT AFTER:
                          {post}
                          """
                          resolved = execute_gemini_request_with_feedback(prompt_base, filepath)
                          
                          if resolved:
                              print("    ✅ AI Resolved.")
                          else:
                              print("    ☢️ AI Failed/Unsafe. Enforcing LOCAL.")
                              resolved = local_str # Nuclear Fallback

                      new_lines.append(resolved + "\n")
                      modified = True
                      
                  else:
                      new_lines.append(line)
                  i += 1

              if modified:
                  with open(filepath, 'w', encoding='utf-8') as f: f.writelines(new_lines)
                  subprocess.run(["git", "add", filepath], check=True)

          if __name__ == "__main__":
              # IPC: Read from file (Fixes Argument List Too Long)
              if not os.path.exists("conflicts.txt"):
                  print("No conflicts file found.")
                  sys.exit(0)
                  
              with open("conflicts.txt", "r") as f:
                  files = [x.strip() for x in f if x.strip()]
              
              print(f"📋 Processing {len(files)} conflicts...")
              for f in files:
                  if os.path.exists(f): process_file(f)
          EOF

      # ========================================================
      # PHASE 3: THE STRATEGIC MERGE
      # ========================================================
      - name: 🧬 Merge Sequence
        id: merge
        shell: bash
        run: |
          git remote add upstream "${{ inputs.upstream_repo }}" 2>/dev/null || true
          git fetch upstream "${{ inputs.upstream_branch }}" --no-tags
          
          TS=$(date +%s)
          TMP="titanium-$TS"
          git checkout -b "$TMP" "origin/${{ inputs.target_branch }}"
          echo "branch=$TMP" >> $GITHUB_OUTPUT

          # CRITICAL FIX: Clean Index of Submodules
          echo "🧹 Unstaging toolchains..."
          git rm -r --cached toolchains > /dev/null 2>&1 || true

          echo ">>> Executing Merge..."
          # || true ensures workflow continues to Python step
          git merge "upstream/${{ inputs.upstream_branch }}" \
            --no-commit --no-ff \
            -s ort \
            -X find-renames=50% \
            -X ignore-all-space \
            -X diff-algorithm=histogram || true
          
          # Detect Conflicts
          git diff --name-only --diff-filter=U > conflicts.txt
          COUNT=$(wc -l < conflicts.txt)
          
          if [ "$COUNT" -gt "0" ]; then
             echo "has_conflicts=true" >> $GITHUB_OUTPUT
             echo "⚠️ Conflicts Detected: $COUNT"
             cat conflicts.txt
          else
             echo "has_conflicts=false" >> $GITHUB_OUTPUT
             echo "✅ Clean Merge."
          fi

      # ========================================================
      # PHASE 4: EXECUTION & DEPLOY
      # ========================================================
      - name: 🚑 Run Titanium Core
        if: steps.merge.outputs.has_conflicts == 'true'
        run: |
          echo ">>> Starting Resolution Engine..."
          # -u flag fixes "Silent Death"
          python3 -u titanium_core.py
          rm titanium_core.py conflicts.txt

      - name: 🔒 Verify & Push
        run: |
          # 1. Marker Cleanup
          
          if grep -r "<<<<<<< HEAD" . --exclude-dir=.github; then
             echo "⚠️ Cleaning residual markers..."
             grep -r -l "<<<<<<< HEAD" . | xargs sed -i '/<<<<<<< HEAD/d'
             grep -r -l "=======" . | xargs sed -i '/=======/d'
             grep -r -l ">>>>>>>" . | xargs sed -i '/>>>>>>>/d'
          fi

          # 2. Index Check
          
          if [[ -n $(git diff --name-only --diff-filter=U) ]]; then
             echo "❌ CRITICAL: Unmerged files remain."
             exit 1
          fi

          # 3. Restore Index & Commit
          
          git add .
          # CRITICAL: Restore toolchains to index
          git reset HEAD toolchains > /dev/null 2>&1 || true
          
          if git diff-index --quiet HEAD --; then
             echo "⚠️ No changes to commit."
          else
             git commit -m "Titanium: Auto-Merge (${{ inputs.ai_model }})"
             
             TARGET="${{ inputs.target_branch }}"
             BRANCH="${{ steps.merge.outputs.branch }}"
             
             git repack -a -d
             for i in {1..5}; do
                if git push origin "$BRANCH:refs/heads/$TARGET"; then
                   echo "✅ DEPLOY SUCCESSFUL"
                   git push origin --delete "$BRANCH"
                   exit 0
                fi
                echo "   🔄 Push conflict. Retrying..."
                sleep 5
             done
             exit 1
          fi

      - name: 📝 Failure Report
        if: failure()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "❌ Titanium Merge Failed"
          body: "Manual intervention required on branch `${{ steps.merge.outputs.branch }}`."
          branch: ${{ steps.merge.outputs.branch }}
          base: ${{ inputs.target_branch }}
