name: 😅 (Auto-Merge)

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream URL'
        required: true
        default: 'https://github.com/neophyteprjkt/kernel_xiaomi_ginkgo.git'
      upstream_branch:
        description: 'Upstream Branch'
        required: true
        default: 'main'
      target_branch:
        description: 'Target Branch'
        required: true
        default: 'floppy-new'
      
      ai_api_key:
        description: 'Gemini API Key'
        required: true
      
      ai_model:
        description: 'Model ID (e.g. gemini-2.5-flash)'
        required: true
        default: 'gemini-2.5-flash'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  apex_core:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AI_KEY: ${{ inputs.ai_api_key }}
      AI_MODEL: ${{ inputs.ai_model }}

    steps:
      # ========================================================
      # 1. SYSTEM HARDENING & PREPARATION
      # ========================================================
      - name: 🛡️ Initialize Environment
        run: |
          # Remove bloat to prevent disk IO lag
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git python3-pip python3-requests
          pip3 install requests

      - name: 📥 Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configure Git Logic
        run: |
          git config --global user.name "Apex-Zenith"
          git config --global user.email "bot@floppykernel.ai"
          git config merge.renameLimit 999999
          
          # SAFETY: Protect Kernel Binaries from Text Merging
          echo "* -text" > .gitattributes
          for ext in png dtb gz ko o bpf zip jpg bmp; do
            echo "*.$ext binary" >> .gitattributes
          done

      # ========================================================
      # 2. INJECT APEX ZENITH BRAIN (Python)
      # ========================================================
      - name: 🧠 Inject Apex Brain
        run: |
          cat << 'EOF' > apex_brain.py
          import sys, os, re, requests, time, subprocess

          # --- CONFIGURATION ---
          API_KEY = os.environ.get("AI_KEY", "").strip()
          RAW_MODEL = os.environ.get("AI_MODEL", "gemini-2.5-flash")
          
          # FIX: Automatically strip 'models/' prefix if user included it
          MODEL_ID = RAW_MODEL.replace("models/", "")
          
          # TUNING
          MAX_RETRIES = 5
          SESSION_RESET_TIME = 5  # Seconds to sleep after every file

          def clean_response(text):
              """Sanitizes AI output to strictly code."""
              text = re.sub(r'^```[a-z]*\n', '', text, flags=re.MULTILINE)
              text = re.sub(r'\n```$', '', text, flags=re.MULTILINE)
              # Safety: Remove any hallucinated markers
              text = re.sub(r'<<<<<<< .*', '', text)
              text = re.sub(r'=======', '', text)
              text = re.sub(r'>>>>>>> .*', '', text)
              return text.strip()

          def validate_syntax(text, filename):
              """Ensures the AI didn't break the code structure."""
              clean = re.sub(r'//.*', '', text)
              clean = re.sub(r'/\*.*?\*/', '', clean, flags=re.DOTALL)
              
              # Allow non-C files to pass
              if any(filename.endswith(x) for x in ['.txt', '.gitignore', 'Makefile', '.mk', '.bp', '.json']):
                  return True
              
              # Strict C/C++ Balance Check
              return clean.count('{') == clean.count('}')

          def reset_session():
              """Pauses execution to allow API quota bucket to refill."""
              print(f"      ⏳ Quota: Resetting Session ({SESSION_RESET_TIME}s)...")
              time.sleep(SESSION_RESET_TIME)

          def execute_gemini_request(prompt):
              # Correct URL Construction
              url = f"https://generativelanguage.googleapis.com/v1beta/models/{MODEL_ID}:generateContent?key={API_KEY}"
              headers = {'Content-Type': 'application/json'}
              data = {
                  "contents": [{"parts": [{"text": prompt}]}],
                  "generationConfig": {
                      "temperature": 0.2, # Low temp = High logic
                      "maxOutputTokens": 8192
                  }
              }

              for attempt in range(1, MAX_RETRIES + 1):
                  try:
                      response = requests.post(url, headers=headers, json=data, timeout=60)
                      
                      if response.status_code == 200:
                          try:
                              return clean_response(response.json()['candidates'][0]['content']['parts'][0]['text'])
                          except:
                              print("      ⚠️ JSON Parsing Error")
                      elif response.status_code == 429:
                          wait = attempt * 10
                          print(f"      🛑 Rate Limit (429). Cooling down {wait}s...")
                          time.sleep(wait)
                          continue
                      elif response.status_code == 404:
                          print(f"      ❌ Model Not Found: 'models/{MODEL_ID}'. Check input.")
                          return None
                      else:
                          print(f"      ❌ API Error: {response.status_code}")
                          time.sleep(5)
                  except Exception as e:
                      print(f"      ⚠️ Network Error: {e}")
                      time.sleep(5)
              return None

          def solve_heuristic(local, remote, filename):
              """Layer 1: Solves simple lists/imports instantly (0 Token Cost)."""
              l_lines = [x.strip() for x in local.splitlines() if x.strip()]
              r_lines = [x.strip() for x in remote.splitlines() if x.strip()]
              
              # 1. Gitignore / Text Lists / Makefiles
              if any(filename.endswith(x) for x in ['.gitignore', '.txt']):
                  print(f"      ⚡ [LOGIC] Merging Unique List")
                  return "\n".join(sorted(list(set(l_lines + r_lines))))
              
              # 2. Header Imports
              if all(x.startswith('#include') or x.startswith('import') for x in l_lines + r_lines):
                  print("      ⚡ [LOGIC] Merging Includes")
                  return "\n".join(sorted(list(set(l_lines + r_lines))))
              return None

          def process_block(local, remote, pre, post, filename):
              # A. Heuristic Solver
              heuristic = solve_heuristic(local, remote, filename)
              if heuristic: return heuristic

              # B. AI Solver
              print(f"      🧠 [AI] Querying {MODEL_ID}...")
              prompt = f"""
              ROLE: Expert Linux Kernel Developer.
              TASK: Resolve Git Conflict in '{filename}'.
              
              MANDATES:
              1. PRESERVE 'LOCAL' (Downstream Driver Logic) at all costs.
              2. INTEGRATE 'REMOTE' (Upstream) only if it is safe.
              3. OUTPUT CODE ONLY. NO MARKDOWN.
              
              CONTEXT BEFORE:
              {pre}
              <<<<<<< LOCAL
              {local}
              =======
              {remote}
              >>>>>>> REMOTE
              CONTEXT AFTER:
              {post}
              """
              
              ai_sol = execute_gemini_request(prompt)
              
              # C. Validation
              if ai_sol and validate_syntax(ai_sol, filename):
                  return ai_sol
              
              return None

          def process_file(filepath):
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f: lines = f.readlines()
              except: return

              new_lines = []
              i = 0
              modified = False
              
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('<<<<<<<'):
                      start = i
                      # Context: 100 lines for structural awareness
                      pre_ctx = "".join(lines[max(0, start-100):start])
                      
                      local_blk, remote_blk = [], []
                      mode = "local"
                      i += 1
                      while i < len(lines):
                          if lines[i].startswith('======='): mode = "remote"
                          elif lines[i].startswith('>>>>>>>'): break
                          else:
                              if mode == "local": local_blk.append(lines[i])
                              else: remote_blk.append(lines[i])
                          i += 1
                      
                      post_ctx = "".join(lines[i+1:min(len(lines), i+100)])
                      
                      print(f"🔎 Conflict: {filepath} (Line {start})")
                      resolved = process_block("".join(local_blk), "".join(remote_blk), pre_ctx, post_ctx, filepath)
                      
                      if resolved:
                          new_lines.append(resolved + "\n")
                          print("      ✅ Resolved.")
                      else:
                          # NUCLEAR FALLBACK: Force Local
                          print("      ☢️ RESOLUTION FAILED. Enforcing LOCAL (Ours).")
                          new_lines.append("".join(local_blk))
                      
                      modified = True
                      # CRITICAL: Reset session to prevent 429s on next block
                      reset_session()
                  else:
                      new_lines.append(line)
                  i += 1

              if modified:
                  with open(filepath, 'w', encoding='utf-8') as f: f.writelines(new_lines)
                  subprocess.run(["git", "add", filepath], check=True)

          if __name__ == "__main__":
              # Read conflicts from file to prevent Argument List Too Long error
              if not os.path.exists("conflicts.txt"):
                  print("No conflicts file found.")
                  sys.exit(0)
                  
              with open("conflicts.txt", "r") as f:
                  files = [x.strip() for x in f if x.strip()]
              
              if not files:
                  print("No conflicts to process.")
                  sys.exit(0)

              print(f"📋 Processing {len(files)} conflicted files...")
              for f in files:
                  if os.path.exists(f): process_file(f)
          EOF

      # ========================================================
      # 3. MERGE EXECUTION
      # ========================================================
      - name: 🧬 Merge & Detect
        id: merge
        shell: bash
        run: |
          # 1. SETUP
          git remote add upstream "${{ inputs.upstream_repo }}" 2>/dev/null || true
          git fetch upstream "${{ inputs.upstream_branch }}" --no-tags
          
          TS=$(date +%s)
          TMP="zenith-$TS"
          git checkout -b "$TMP" "origin/${{ inputs.target_branch }}"
          echo "branch=$TMP" >> $GITHUB_OUTPUT

          # 2. PRE-MERGE CLEANUP (The "Dirty Index" Fix)
          echo "🧹 Unstaging submodules to prevent merge blocks..."
          git rm -r --cached toolchains > /dev/null 2>&1 || true

          # 3. MERGE
          echo ">>> STARTING MERGE..."
          # || true ensures we don't crash, allowing Python to fix conflicts
          git merge "upstream/${{ inputs.upstream_branch }}" \
            --no-commit --no-ff \
            -s ort \
            -X find-renames=50% \
            -X ignore-all-space \
            -X diff-algorithm=histogram || true
          
          # 4. CAPTURE CONFLICTS
          git diff --name-only --diff-filter=U > conflicts.txt
          COUNT=$(wc -l < conflicts.txt)
          
          if [ "$COUNT" -gt "0" ]; then
             echo "found_conflicts=true" >> $GITHUB_OUTPUT
             echo "⚠️ Conflicts Detected: $COUNT"
             cat conflicts.txt
          else
             echo "found_conflicts=false" >> $GITHUB_OUTPUT
             echo "✅ Clean Merge."
          fi

      # ========================================================
      # 4. ENGAGE APEX BRAIN
      # ========================================================
      - name: 🚑 Engage Apex AI
        if: steps.merge.outputs.found_conflicts == 'true'
        run: |
          echo ">>> STARTING AI ENGINE..."
          python3 apex_brain.py
          rm apex_brain.py conflicts.txt

      # ========================================================
      # 5. VERIFY & DEPLOY
      # ========================================================
      - name: 🔒 Verify & Push
        run: |
          # 1. SAFETY: Remove any hallucinated markers
          if grep -r "<<<<<<< HEAD" . --exclude-dir=.github; then
             echo "⚠️ Removing residual markers..."
             grep -r -l "<<<<<<< HEAD" . | xargs sed -i '/<<<<<<< HEAD/d'
             grep -r -l "=======" . | xargs sed -i '/=======/d'
             grep -r -l ">>>>>>>" . | xargs sed -i '/>>>>>>>/d'
          fi
          
          # 2. SAFETY: Fail if unmerged files remain
          if [[ -n $(git diff --name-only --diff-filter=U) ]]; then
             echo "❌ CRITICAL: Unmerged files remain."
             exit 1
          fi

          # 3. COMMIT
          git add .
          # Ensure toolchains are not committed in a broken state
          git reset HEAD toolchains > /dev/null 2>&1 || true
          
          if git diff-index --quiet HEAD --; then
             echo "⚠️ No changes to commit."
          else
             git commit -m "Apex Zenith: Auto-Merge (${{ inputs.ai_model }})"
             
             TARGET="${{ inputs.target_branch }}"
             BRANCH="${{ steps.merge.outputs.branch }}"
             
             # 4. ROBUST PUSH
             git repack -a -d
             for i in {1..5}; do
                if git push origin "$BRANCH:refs/heads/$TARGET"; then
                   echo "✅ DEPLOY SUCCESSFUL: $TARGET"
                   git push origin --delete "$BRANCH"
                   exit 0
                fi
                echo "   🔄 Push retry..."
                sleep 5
             done
             exit 1
          fi

      # ========================================================
      # 6. REPORTING
      # ========================================================
      - name: 📝 Failure Report
        if: failure()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "❌ Apex Zenith Failed"
          body: "Manual Fix Required on branch `${{ steps.merge.outputs.branch }}`."
          branch: ${{ steps.merge.outputs.branch }}
          base: ${{ inputs.target_branch }}
