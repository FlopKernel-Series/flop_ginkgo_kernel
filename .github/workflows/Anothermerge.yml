name: ⚙️ Merge System

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream Repository URL'
        required: true
        default: 'https://github.com/neophyteprjkt/kernel_xiaomi_ginkgo.git'
      upstream_branch:
        description: 'Upstream Branch'
        required: true
        default: 'main'
      target_branch:
        description: 'Target Branch'
        required: true
        default: 'floppy-new'
      
      ai_api_key:
        description: 'Gemini API Key'
        required: true
      
      ai_model:
        description: 'Model ID'
        required: true
        default: 'gemini-2.5-flash'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  merge_logic:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AI_KEY: ${{ inputs.ai_api_key }}
      AI_MODEL: ${{ inputs.ai_model }}

    steps:
      # ========================================================
      # 1. SETUP & CHECKOUT
      # ========================================================
      - name: 🛡️ System Prep
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git python3-pip python3-requests
          pip3 install requests

      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configure Git
        run: |
          git config --global user.name "Titanium-Bot"
          git config --global user.email "bot@titanium.ai"
          git config merge.renameLimit 999999
          
          # Binary Safety
          echo "* -text" > .gitattributes
          for ext in png dtb gz ko o bpf zip jpg bmp iso; do
            echo "*.$ext binary" >> .gitattributes
          done

      # ========================================================
      # 2. INJECT PYTHON LOGIC (UNBUFFERED)
      # ========================================================
      - name: 🧠 Inject Logic Core
        run: |
          cat << 'EOF' > titanium_core.py
          import sys, os, re, requests, time, subprocess

          # --- SETUP ---
          # Flush stdout immediately so logs appear in Actions instantly
          sys.stdout.reconfigure(line_buffering=True)

          print(">>> [INIT] Python Core Starting...")

          API_KEY = os.environ.get("AI_KEY", "").strip()
          RAW_MODEL = os.environ.get("AI_MODEL", "gemini-2.5-flash")
          MODEL_ID = RAW_MODEL.replace("models/", "")
          
          print(f">>> [CONF] Model: {MODEL_ID}")

          # --- UTILS ---
          def clean_response(text):
              text = re.sub(r'^```[a-z]*\n', '', text, flags=re.MULTILINE)
              text = re.sub(r'\n```$', '', text, flags=re.MULTILINE)
              text = re.sub(r'<<<<<<< .*', '', text)
              text = re.sub(r'=======', '', text)
              text = re.sub(r'>>>>>>> .*', '', text)
              return text.strip()

          def validate_syntax(text, filename):
              # Basic C syntax check
              clean = re.sub(r'//.*', '', text)
              clean = re.sub(r'/\*.*?\*/', '', clean, flags=re.DOTALL)
              
              if any(filename.endswith(x) for x in ['.txt', '.gitignore', 'Makefile', '.mk']):
                  return True
              
              return clean.count('{') == clean.count('}')

          def call_gemini(prompt):
              url = f"https://generativelanguage.googleapis.com/v1beta/models/{MODEL_ID}:generateContent?key={API_KEY}"
              headers = {'Content-Type': 'application/json'}
              data = {
                  "contents": [{"parts": [{"text": prompt}]}],
                  "generationConfig": {"temperature": 0.2, "maxOutputTokens": 8192}
              }

              # Retry Loop (5 attempts)
              for attempt in range(1, 6):
                  try:
                      resp = requests.post(url, headers=headers, json=data, timeout=60)
                      
                      if resp.status_code == 200:
                          return clean_response(resp.json()['candidates'][0]['content']['parts'][0]['text'])
                      elif resp.status_code == 429:
                          wait = attempt * 10
                          print(f"    ⏳ Rate Limit (429). Waiting {wait}s...")
                          time.sleep(wait)
                      else:
                          print(f"    ❌ API Error: {resp.status_code}")
                          time.sleep(5)
                  except Exception as e:
                      print(f"    ⚠️ Network: {e}")
                      time.sleep(5)
              return None

          def solve_file(filepath):
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f: lines = f.readlines()
              except Exception as e:
                  print(f"    ❌ Read Error: {e}")
                  return

              new_lines = []
              i = 0
              modified = False
              
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('<<<<<<<'):
                      print(f"    🔎 Conflict at line {i}...")
                      start = i
                      pre = "".join(lines[max(0, start-100):start])
                      
                      local_blk, remote_blk = [], []
                      mode = "local"
                      i += 1
                      while i < len(lines):
                          if lines[i].startswith('======='): mode = "remote"
                          elif lines[i].startswith('>>>>>>>'): break
                          else:
                              if mode == "local": local_blk.append(lines[i])
                              else: remote_blk.append(lines[i])
                          i += 1
                      
                      post = "".join(lines[i+1:min(len(lines), i+100)])
                      
                      # 1. HEURISTIC (FAST)
                      local_str = "".join(local_blk)
                      remote_str = "".join(remote_blk)
                      merged = None
                      
                      # Lists/Imports
                      if filepath.endswith('.gitignore') or filepath.endswith('.txt') or \
                         all(x.strip().startswith('#include') for x in local_blk + remote_blk):
                             merged = "\n".join(sorted(list(set([x.strip() for x in local_blk + remote_blk if x.strip()]))))
                             print("    ⚡ Heuristic Merge Applied.")

                      # 2. AI (SLOW)
                      if not merged:
                          print(f"    🧠 Calling {MODEL_ID}...")
                          prompt = f"""
                          ROLE: Linux Kernel Dev.
                          TASK: Merge Conflict in '{filepath}'.
                          RULES: Keep LOCAL driver logic. Merge REMOTE updates safely. Output CODE ONLY.
                          
                          CONTEXT BEFORE:
                          {pre}
                          <<<<<<< LOCAL
                          {local_str}
                          =======
                          {remote_str}
                          >>>>>>> REMOTE
                          CONTEXT AFTER:
                          {post}
                          """
                          ai_out = call_gemini(prompt)
                          if ai_out and validate_syntax(ai_out, filepath):
                              merged = ai_out
                              print("    ✅ AI Resolved.")
                          else:
                              print("    ☢️ AI Failed/Unsafe. Keeping LOCAL.")
                              merged = local_str # Fallback

                      new_lines.append(merged + "\n")
                      modified = True
                      
                      # QUOTA RESET
                      print("    ⏳ Cooldown (5s)...")
                      time.sleep(5)

                  else:
                      new_lines.append(line)
                  i += 1

              if modified:
                  with open(filepath, 'w', encoding='utf-8') as f: f.writelines(new_lines)
                  subprocess.run(["git", "add", filepath], check=True)

          if __name__ == "__main__":
              if not os.path.exists("conflicts.txt"):
                  print("❌ Error: conflicts.txt not found!")
                  sys.exit(0)
                  
              with open("conflicts.txt", "r") as f:
                  files = [x.strip() for x in f if x.strip()]
              
              print(f">>> [JOB] Processing {len(files)} files...")
              for f in files:
                  print(f">>> [FILE] {f}")
                  if os.path.exists(f): solve_file(f)
                  else: print("    ⚠️ File not found on disk.")
          EOF

      # ========================================================
      # 3. MERGE EXECUTION
      # ========================================================
      - name: 🧬 Merge Process
        id: merge
        shell: bash
        run: |
          git remote add upstream "${{ inputs.upstream_repo }}" 2>/dev/null || true
          git fetch upstream "${{ inputs.upstream_branch }}" --no-tags
          
          TS=$(date +%s)
          TMP="titanium-$TS"
          git checkout -b "$TMP" "origin/${{ inputs.target_branch }}"
          echo "branch=$TMP" >> $GITHUB_OUTPUT

          # CLEAN INDEX
          git rm -r --cached toolchains > /dev/null 2>&1 || true

          echo ">>> Executing Merge..."
          git merge "upstream/${{ inputs.upstream_branch }}" \
            --no-commit --no-ff \
            -s ort \
            -X find-renames=50% \
            -X ignore-all-space \
            -X diff-algorithm=histogram || true
          
          # DETECT
          git diff --name-only --diff-filter=U > conflicts.txt
          COUNT=$(wc -l < conflicts.txt)
          echo ">>> Conflicts Found: $COUNT"
          
          if [ "$COUNT" -gt "0" ]; then
             echo "has_conflicts=true" >> $GITHUB_OUTPUT
             cat conflicts.txt
          else
             echo "has_conflicts=false" >> $GITHUB_OUTPUT
          fi

      # ========================================================
      # 4. RUN PYTHON (UNBUFFERED)
      # ========================================================
      - name: 🚑 Run AI Engine
        if: steps.merge.outputs.has_conflicts == 'true'
        run: |
          echo ">>> Checking Environment..."
          ls -la conflicts.txt
          echo ">>> Launching Python..."
          # The -u flag is CRITICAL. It disables buffering.
          python3 -u titanium_core.py
          rm titanium_core.py conflicts.txt

      # ========================================================
      # 5. COMMIT & PUSH
      # ========================================================
      - name: 🔒 Finalize
        run: |
          # Cleanup Markers
          if grep -r "<<<<<<< HEAD" . --exclude-dir=.github; then
             grep -r -l "<<<<<<< HEAD" . | xargs sed -i '/<<<<<<< HEAD/d'
             grep -r -l "=======" . | xargs sed -i '/=======/d'
             grep -r -l ">>>>>>>" . | xargs sed -i '/>>>>>>>/d'
          fi

          if [[ -n $(git diff --name-only --diff-filter=U) ]]; then
             echo "❌ Unmerged files remain."
             exit 1
          fi

          git add .
          git reset HEAD toolchains > /dev/null 2>&1 || true
          
          if git diff-index --quiet HEAD --; then
             echo "⚠️ No changes."
          else
             git commit -m "Titanium Merge: Auto-Resolved"
             
             TARGET="${{ inputs.target_branch }}"
             BRANCH="${{ steps.merge.outputs.branch }}"
             
             git repack -a -d
             for i in {1..5}; do
                if git push origin "$BRANCH:refs/heads/$TARGET"; then
                   echo "✅ SUCCESS"
                   git push origin --delete "$BRANCH"
                   exit 0
                fi
                sleep 5
             done
             exit 1
          fi

      - name: 📝 Report Failure
        if: failure()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "❌ Titanium Merge Failed"
          body: "Manual Fix Needed on `${{ steps.merge.outputs.branch }}`"
          branch: ${{ steps.merge.outputs.branch }}
          base: ${{ inputs.target_branch }}
