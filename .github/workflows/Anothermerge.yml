name: 🛡️ 

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream Repository URL'
        required: true
        default: 'https://github.com/neophyteprjkt/kernel_xiaomi_ginkgo.git'
      upstream_branch:
        description: 'Upstream Branch'
        required: true
        default: 'main'
      target_branch:
        description: 'Target Branch (Your Fork)'
        required: true
        default: 'floppy-new'
      ai_api_key:
        description: 'Gemini API Key'
        required: true
      ai_model:
        description: 'Model ID'
        required: true
        default: 'gemini-2.5-flash'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  titanium_core:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AI_KEY: ${{ inputs.ai_api_key }}
      MODEL_ID: ${{ inputs.ai_model }}

    steps:
      # ========================================================
      # PHASE 1: HARDENING & PREPARATION
      # ========================================================
      - name: 🛡️ System Hardening
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git python3-pip python3-requests
          pip3 install requests

      - name: 📥 Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configure Git & Binary Protection
        run: |
          git config --global user.name "Apex-Titanium"
          git config --global user.email "titanium@apex-automation.ai"
          git config merge.renameLimit 999999
          
          # BINARY GUARD: Protects kernel blobs from text merging
          echo "* -text" > .gitattributes
          for ext in png dtb gz ko o bpf zip jpg bmp iso so a; do
            echo "*.$ext binary" >> .gitattributes
          done

      # ========================================================
      # PHASE 2: INJECT TITANIUM CORE (OBSIDIAN ENGINE)
      # ========================================================
      - name: 🧠 Inject Titanium Core
        run: |
          # ESCAPED FOR YAML: We use __backtick__ placeholders
          cat << 'EOF' > titanium_core.py
          import sys, os, re, requests, time, subprocess, random

          # --- CONFIGURATION ---
          sys.stdout.reconfigure(line_buffering=True)
          
          API_KEY = os.environ.get("AI_KEY", "").strip()
          MODEL = os.environ.get("MODEL_ID", "gemini-2.5-flash").replace("models/", "")
          
          # --- TUNING PARAMETERS ---
          CONTEXT_LINES = 20       # EXACTLY 20 Lines
          MAX_RETRIES = 3          # Attempts per file
          REQUEST_DELAY = 12       # 12s = 5 RPM (Safe)
          PENALTY_WAIT = 60        # 429 Penalty
          MAX_BLOCK_SIZE = 200     # Token Safety

          # --- LOGGER STATS ---
          REPORT = ["# 🛡️ Apex Titanium v18.0 Report", ""]
          STATS = {'total': 0, 'heuristic': 0, 'ai': 0, 'failed': 0, 'skipped': 0}

          print(f">>> [INIT] Titanium v18.0 (Obsidian). Model: {MODEL}")

          def log(msg):
              print(msg)
              REPORT.append(msg.strip())

          def clean_response(text):
              """Sanitizes AI output."""
              text = re.sub(r'^__backtick__[a-z]*\n', '', text, flags=re.MULTILINE)
              text = re.sub(r'\n__backtick__$', '', text, flags=re.MULTILINE)
              text = text.replace("__backtick__", "```")
              return text.strip()

          def get_brace_balance(text):
              clean = re.sub(r'//.*', '', text)
              clean = re.sub(r'/\*.*?\*/', '', clean, flags=re.DOTALL)
              return clean.count('{') - clean.count('}')

          def validate_syntax(ai_code, local_code, filename):
              # 1. Hallucination Check (Markers)
              if "<<<<<<<" in ai_code or "=======" in ai_code or ">>>>>>>" in ai_code:
                  return False

              # 2. Config Bypass
              if any(filename.endswith(x) for x in ['.txt', '.gitignore', 'Makefile', '.mk', 'Kconfig', '.conf']):
                  return True 
              
              # 3. Unclosed Comments
              if ai_code.count('/*') != ai_code.count('*/'):
                  return False

              # 4. Brace Balance
              local_bal = get_brace_balance(local_code)
              ai_bal = get_brace_balance(ai_code)
              if local_bal == 0 and ai_bal != 0:
                  return False
                  
              return True

          def solve_heuristic(local, remote, filename):
              is_config = any(x in filename for x in ['defconfig', 'Kconfig', '.gitignore', '.txt'])
              if is_config:
                  l_lines = set(x.strip() for x in local.splitlines() if x.strip())
                  r_lines = set(x.strip() for x in remote.splitlines() if x.strip())
                  merged = sorted(list(l_lines.union(r_lines)))
                  return "\n".join(merged)
              return None

          def execute_gemini(prompt):
              url = f"https://generativelanguage.googleapis.com/v1beta/models/{MODEL}:generateContent?key={API_KEY}"
              headers = {'Content-Type': 'application/json'}
              data = {
                  "contents": [{"parts": [{"text": prompt}]}],
                  "generationConfig": {"temperature": 0.2, "maxOutputTokens": 8192}
              }

              for attempt in range(1, MAX_RETRIES + 1):
                  try:
                      resp = requests.post(url, headers=headers, json=data, timeout=60)
                      
                      if resp.status_code == 200:
                          time.sleep(REQUEST_DELAY) 
                          try:
                              return clean_response(resp.json()['candidates'][0]['content']['parts'][0]['text'])
                          except: return None
                      
                      elif resp.status_code == 429:
                          wait = PENALTY_WAIT + random.uniform(1, 10)
                          print(f"    🛑 Rate Limit (429). Cooling {wait:.1f}s...")
                          time.sleep(wait)
                          continue 
                      
                      elif resp.status_code >= 500:
                          time.sleep(10)
                          continue
                      
                      else:
                          print(f"    ❌ API Error {resp.status_code}")
                          return None
                              
                  except Exception as e:
                      print(f"    ⚠️ Network: {e}")
                      time.sleep(10)
              
              return None

          def solve_conflict_block(local, remote, pre, post, filename):
              STATS['total'] += 1
              
              # 1. Heuristic Bypass
              heuristic = solve_heuristic(local, remote, filename)
              if heuristic: 
                  STATS['heuristic'] += 1
                  log(f"    ⚡ [HEURISTIC] {filename}")
                  return heuristic

              # 2. Safety Cap
              block_len = len(local.splitlines()) + len(remote.splitlines())
              if block_len > MAX_BLOCK_SIZE:
                  STATS['skipped'] += 1
                  log(f"    ⚠️ [SKIP] Huge Block ({block_len} lines).")
                  return local

              # 3. AI Resolution
              print(f"    🧠 [AI] Thinking...")
              prompt = f"""
              TASK: Merge C Code.
              FILE: {filename}
              
              PRE_CONTEXT:
              {pre}
              
              <<<<<<< LOCAL
              {local}
              =======
              {remote}
              >>>>>>> REMOTE
              
              POST_CONTEXT:
              {post}
              
              INSTRUCTIONS:
              1. Return ONLY the valid merged code.
              2. Keep LOCAL driver logic + REMOTE core updates.
              3. NO Markdown. NO Markers.
              """
              
              ai_sol = execute_gemini(prompt)
              
              if ai_sol and validate_syntax(ai_sol, local, filename):
                  STATS['ai'] += 1
                  return ai_sol
              
              STATS['failed'] += 1
              log(f"    ☢️ [FAIL] Validation/AI Error. Keeping LOCAL.")
              return local

          def process_file(filepath):
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f: lines = f.readlines()
              except: return

              new_lines = []
              i = 0
              modified = False
              
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('<<<<<<<'):
                      start = i
                      
                      # Context: Strictly 20 Lines
                      pre_ctx = "".join(lines[max(0, start-CONTEXT_LINES):start])
                      
                      local_blk, remote_blk = [], []
                      mode = "local"
                      i += 1
                      while i < len(lines):
                          if lines[i].startswith('======='): mode = "remote"
                          elif lines[i].startswith('>>>>>>>'): break
                          else:
                              if mode == "local": local_blk.append(lines[i])
                              else: remote_blk.append(lines[i])
                          i += 1
                      
                      post_ctx = "".join(lines[i+1:min(len(lines), i+1+CONTEXT_LINES)])
                      
                      log(f"🔎 Conflict: {filepath} (Line {start})")
                      resolved = solve_conflict_block("".join(local_blk), "".join(remote_blk), pre_ctx, post_ctx, filepath)
                      new_lines.append(resolved + "\n")
                      modified = True
                  else:
                      new_lines.append(line)
                  i += 1

              if modified:
                  with open(filepath, 'w', encoding='utf-8') as f: f.writelines(new_lines)
                  subprocess.run(["git", "add", filepath], check=True)

          if __name__ == "__main__":
              if not os.path.exists("conflicts.txt"): sys.exit(0)
              with open("conflicts.txt", "r") as f:
                  files = [x.strip() for x in f if x.strip()]
              
              log(f"📋 Processing {len(files)} conflicted files...")
              for f in files:
                  if os.path.exists(f): process_file(f)

              # Generate Report
              REPORT.append("")
              REPORT.append("## Statistics")
              REPORT.append(f"- **Total Conflicts:** {STATS['total']}")
              REPORT.append(f"- **AI Resolved:** {STATS['ai']}")
              REPORT.append(f"- **Heuristic Fix:** {STATS['heuristic']}")
              REPORT.append(f"- **Skipped (Safety):** {STATS['skipped']}")
              REPORT.append(f"- **Failed (Fallback):** {STATS['failed']}")
              
              with open("TITANIUM_REPORT.md", "w") as f:
                  f.write("\n".join(REPORT))
          EOF
          
          # Fix Python Syntax
          sed -i 's/__backtick__/```/g' titanium_core.py

      # ========================================================
      # PHASE 3: STRATEGIC MERGE (HISTOGRAM)
      # ========================================================
      - name: 🧬 Merge & Detect
        id: merge
        shell: bash
        run: |
          git remote add upstream "${{ inputs.upstream_repo }}" 2>/dev/null || true
          git fetch upstream "${{ inputs.upstream_branch }}" --no-tags
          
          TS=$(date +%s)
          TMP="titanium-$TS"
          git checkout -b "$TMP" "origin/${{ inputs.target_branch }}"
          echo "branch=$TMP" >> $GITHUB_OUTPUT

          # --- GHOST SUBMODULES (Anti-Crash) ---
          git rm -r --cached toolchains > /dev/null 2>&1 || true

          echo ">>> STARTING MERGE (Histogram Mode)..."
          git merge "upstream/${{ inputs.upstream_branch }}" \
            --no-commit --no-ff \
            -s ort \
            -X find-renames=50% \
            -X ignore-all-space \
            -X diff-algorithm=histogram || true
          
          # File IPC
          git diff --name-only --diff-filter=U > conflicts.txt
          COUNT=$(wc -l < conflicts.txt)
          
          if [ "$COUNT" -gt "0" ]; then
             echo "found_conflicts=true" >> $GITHUB_OUTPUT
             echo "⚠️ Conflicts Detected: $COUNT"
          else
             echo "found_conflicts=false" >> $GITHUB_OUTPUT
          fi

      # ========================================================
      # PHASE 4: EXECUTION
      # ========================================================
      - name: 🚑 Run Titanium Core
        if: steps.merge.outputs.found_conflicts == 'true'
        run: |
          echo ">>> ENGAGING TITANIUM v18..."
          python3 -u titanium_core.py
          rm titanium_core.py conflicts.txt
      
      # ========================================================
      # PHASE 5: REPORTING & ARTIFACTS
      # ========================================================
      - name: 📤 Upload Titanium Report
        if: steps.merge.outputs.found_conflicts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: titanium-report
          path: TITANIUM_REPORT.md

      # ========================================================
      # PHASE 6: VERIFY & DEPLOY (WITH FAILSAFE)
      # ========================================================
      - name: 🔒 Verify & Push
        run: |
          # 1. MARKER SWEEP
          grep -r -l "<<<<<<< HEAD" . | xargs sed -i '/<<<<<<< HEAD/d' || true
          grep -r -l "=======" . | xargs sed -i '/=======/d' || true
          grep -r -l ">>>>>>>" . | xargs sed -i '/>>>>>>>/d' || true
          
          # 2. RESTORE SUBMODULES
          git add .
          git reset HEAD toolchains > /dev/null 2>&1 || true
          
          if git diff-index --quiet HEAD --; then
             echo "⚠️ No changes to commit."
          else
             git commit -m "Apex Titanium: Auto-Merge (${{ inputs.ai_model }})"
             
             # Robust Push
             for i in {1..5}; do
                if git push origin "${{ steps.merge.outputs.branch }}:refs/heads/${{ inputs.target_branch }}"; then
                   echo "✅ DEPLOY SUCCESSFUL"
                   exit 0
                fi
                sleep 5
             done
             exit 1
          fi

      # ========================================================
      # PHASE 7: EMERGENCY PROTOCOLS
      # ========================================================
      - name: 🚨 Emergency Commit (WIP)
        if: failure()
        run: |
          echo "⚠️ Workflow Failed. Committing WIP state..."
          git rm -r --cached toolchains > /dev/null 2>&1 || true
          git add . || true
          git reset HEAD toolchains > /dev/null 2>&1 || true
          git commit -m "⚠️ Auto-Merge Failed: Saving WIP" || true
          git push origin "${{ steps.merge.outputs.branch }}" || true

      - name: 📝 Create Failure Report PR
        if: failure()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "❌ Titanium Merge Failed: Manual Fix Needed"
          body: |
            The Apex Titanium Agent failed to resolve all conflicts safely.
            **Branch:** `${{ steps.merge.outputs.branch }}`
            1. Pull this branch.
            2. Search for `<<<<<<< HEAD`.
            3. Fix manually and push.
          branch: ${{ steps.merge.outputs.branch }}
          base: ${{ inputs.target_branch }}
          
