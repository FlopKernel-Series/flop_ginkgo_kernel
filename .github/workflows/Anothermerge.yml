name: 🔱 merge

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream Repository URL'
        required: true
        default: 'https://github.com/neophyteprjkt/kernel_xiaomi_ginkgo.git'
      upstream_branch:
        description: 'Upstream Branch'
        required: true
        default: 'main'
      target_branch:
        description: 'Target Branch'
        required: true
        default: 'floppy-new'
      
      # --- INTELLIGENCE GRID ---
      gemini_api_key:
        description: 'Gemini API Key (Required)'
        required: true
      
      deepseek_api_key:
        description: 'DeepSeek API Key (Optional - Recommended)'
        required: false
      
      ai_model_gemini:
        description: 'Gemini Model'
        required: true
        default: 'gemini-2.5-flash'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  trinity_engine:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KEY_GEMINI: ${{ inputs.gemini_api_key }}
      KEY_DEEPSEEK: ${{ inputs.deepseek_api_key }}
      MODEL_GEMINI: ${{ inputs.ai_model_gemini }}

    steps:
      # ========================================================
      # PHASE 1: HARDENED INFRASTRUCTURE
      # ========================================================
      - name: 🛡️ System Hardening
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git python3-pip python3-requests
          pip3 install requests

      - name: 📥 Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configure Git
        run: |
          git config --global user.name "Apex-Trinity"
          git config --global user.email "bot@floppykernel.ai"
          git config merge.renameLimit 999999
          
          # BINARY SHIELD: Protect kernel blobs
          echo "* -text" > .gitattributes
          for ext in png dtb gz ko o bpf zip jpg bmp iso so a; do
            echo "*.$ext binary" >> .gitattributes
          done

      # ========================================================
      # PHASE 2: INJECT "TRINITY" CORE (CORTEX + 2 AIs)
      # ========================================================
      - name: 🧠 Inject Trinity Core
        run: |
          cat << 'EOF' > trinity_core.py
          import sys, os, re, requests, time, json

          # REAL-TIME LOGGING
          sys.stdout.reconfigure(line_buffering=True)

          # --- CONFIGURATION ---
          KEY_GEMINI = os.environ.get("KEY_GEMINI", "").strip()
          KEY_DEEPSEEK = os.environ.get("KEY_DEEPSEEK", "").strip()
          
          RAW_GEMINI_MODEL = os.environ.get("MODEL_GEMINI", "gemini-2.5-flash")
          ID_GEMINI = RAW_GEMINI_MODEL.replace("models/", "")
          ID_DEEPSEEK = "deepseek-chat" # Standard V3 Endpoint

          # --- GOVERNOR SETTINGS ---
          MIN_DELAY = 10.0 # Universal cooldown
          LAST_REQUEST = 0

          print(f">>> [SYSTEM] Trinity Online.")
          print(f"    - Cortex: Active")
          print(f"    - DeepSeek: {'Enabled' if KEY_DEEPSEEK else 'Disabled'}")
          print(f"    - Gemini: Enabled ({ID_GEMINI})")

          # ======================================================
          # CLASS 1: CORTEX (THE ARCHITECT - LOCAL LOGIC)
          # ======================================================
          class Cortex:
              """Deterministic Logic & Symbolic Analysis."""
              
              @staticmethod
              def solve_math(local, remote, filename):
                  l_lines = [x.strip() for x in local.splitlines() if x.strip()]
                  r_lines = [x.strip() for x in remote.splitlines() if x.strip()]

                  # 1. KERNEL VERSION (Always Upstream)
                  if filename == 'Makefile':
                      if any(x.startswith(('VERSION', 'PATCHLEVEL', 'SUBLEVEL')) for x in r_lines):
                          print(f"    ⚡ [CORTEX] Kernel Version Bump -> Accepting REMOTE")
                          return remote

                  # 2. SET THEORY (Includes, Configs, Lists)
                  if any(filename.endswith(x) for x in ['.gitignore', '.txt', '.conf', '.json']) or \
                     all(x.startswith(('#include', 'import')) for x in l_lines + r_lines):
                      print(f"    ⚡ [CORTEX] Set Union Merge")
                      return "\n".join(sorted(list(set(l_lines + r_lines))))

                  # 3. KCONFIG / DEFCONFIG (Configuration Merge)
                  if 'Kconfig' in filename or 'defconfig' in filename:
                      # If purely definitions, merge unique lines
                      if all(re.match(r'^(config|bool|default|select|menu|source)', x) or '=' in x for x in l_lines + r_lines):
                          print("    ⚡ [CORTEX] Merging Config Definitions")
                          return "\n".join(sorted(list(set(l_lines + r_lines))))

                  return None

              @staticmethod
              def analyze_ghost(local, remote):
                  """Detects Deletions."""
                  if not local.strip() and remote.strip():
                      print(f"    👻 [CORTEX] Ghost Block (Local Deletion) -> Enforcing Deletion")
                      return "" # Empty string
                  return None

              @staticmethod
              def validate(text, filename):
                  """Syntax Guard."""
                  clean = re.sub(r'//.*', '', text)
                  clean = re.sub(r'/\*.*?\*/', '', clean, flags=re.DOTALL)
                  
                  if any(filename.endswith(x) for x in ['.txt', '.gitignore', 'Makefile', '.mk', 'Kconfig']):
                      return True
                  
                  # Check for C/DTS brace balance
                  return clean.count('{') == clean.count('}')

          # ======================================================
          # CLASS 2: DEEPSEEK (THE CODING SPECIALIST)
          # ======================================================
          class DeepSeekAgent:
              @staticmethod
              def query(prompt):
                  if not KEY_DEEPSEEK: return None
                  
                  Governor.wait()
                  
                  url = "https://api.deepseek.com/v1/chat/completions"
                  headers = {"Authorization": f"Bearer {KEY_DEEPSEEK}", "Content-Type": "application/json"}
                  data = {
                      "model": "deepseek-chat",
                      "messages": [
                          {"role": "system", "content": "You are a Linux Kernel Maintainer. Output ONLY Code."},
                          {"role": "user", "content": prompt}
                      ],
                      "temperature": 0.1
                  }

                  try:
                      resp = requests.post(url, headers=headers, json=data, timeout=60)
                      if resp.status_code == 200:
                          raw = resp.json()['choices'][0]['message']['content']
                          return Utility.clean_markdown(raw)
                      elif resp.status_code == 429:
                          print("    🛑 [DEEPSEEK] Rate Limit. Switching to Gemini...")
                          return None
                      else:
                          print(f"    ⚠️ [DEEPSEEK] Error {resp.status_code}")
                          return None
                  except: return None

          # ======================================================
          # CLASS 3: GEMINI (THE FALLBACK GENERALIST)
          # ======================================================
          class GeminiAgent:
              @staticmethod
              def query(prompt):
                  Governor.wait()
                  
                  url = f"https://generativelanguage.googleapis.com/v1beta/models/{ID_GEMINI}:generateContent?key={KEY_GEMINI}"
                  headers = {'Content-Type': 'application/json'}
                  data = {
                      "contents": [{"parts": [{"text": prompt}]}],
                      "generationConfig": {"temperature": 0.2, "maxOutputTokens": 4096}
                  }

                  # Simple Retry Logic for Gemini
                  for i in range(2):
                      try:
                          resp = requests.post(url, headers=headers, json=data, timeout=60)
                          if resp.status_code == 200:
                              try:
                                  return Utility.clean_markdown(resp.json()['candidates'][0]['content']['parts'][0]['text'])
                              except: return None
                          elif resp.status_code == 429:
                              print(f"    🛑 [GEMINI] Rate Limit. Sleeping 60s...")
                              time.sleep(60)
                              continue
                          else:
                              print(f"    ⚠️ [GEMINI] Error {resp.status_code}")
                              return None
                      except: time.sleep(5)
                  return None

          # ======================================================
          # UTILITIES
          # ======================================================
          class Governor:
              @staticmethod
              def wait():
                  global LAST_REQUEST
                  now = time.time()
                  elapsed = now - LAST_REQUEST
                  if elapsed < MIN_DELAY:
                      time.sleep(MIN_DELAY - elapsed)
                  LAST_REQUEST = time.time()

          class Utility:
              @staticmethod
              def clean_markdown(text):
                  text = re.sub(r'^```[a-z]*\n', '', text, flags=re.MULTILINE)
                  text = re.sub(r'\n```$', '', text, flags=re.MULTILINE)
                  text = re.sub(r'<<<<<<< .*', '', text)
                  text = re.sub(r'=======', '', text)
                  text = re.sub(r'>>>>>>> .*', '', text)
                  return text.strip()

          # ======================================================
          # ORCHESTRATOR
          # ======================================================
          def orchestrate_merge(filepath):
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f: lines = f.readlines()
              except: return

              new_lines = []
              i = 0
              modified = False
              
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('<<<<<<<'):
                      start = i
                      # Context: 40 Lines (Optimized)
                      pre = "".join(lines[max(0, start-40):start])
                      
                      local_blk, remote_blk = [], []
                      mode = "local"
                      i += 1
                      while i < len(lines):
                          if lines[i].startswith('======='): mode = "remote"
                          elif lines[i].startswith('>>>>>>>'): break
                          else:
                              if mode == "local": local_blk.append(lines[i])
                              else: remote_blk.append(lines[i])
                          i += 1
                      
                      post = "".join(lines[i+1:min(len(lines), i+40)])
                      
                      print(f"🔎 Analyzing: {filepath} (Line {start})")
                      local_str = "".join(local_blk)
                      remote_str = "".join(remote_blk)

                      # --- LEVEL 1: CORTEX DETERMINISTIC ---
                      merged = Cortex.solve_math(local_str, remote_str, filepath)
                      
                      if merged is None:
                          # --- LEVEL 2: CORTEX GHOST CHECK ---
                          merged = Cortex.analyze_ghost(local_str, remote_str)

                      if merged is None:
                          # --- LEVEL 3: AI TRIAGE ---
                          prompt = f"""
                          ROLE: Senior Linux Kernel Maintainer.
                          TASK: Merge Conflict in '{filepath}'.
                          
                          GUIDELINES:
                          1. **PRIORITIZE LOCAL:** My branch has custom drivers. Keep them.
                          2. **ADAPT REMOTE:** If Upstream made valid updates that fit, merge them.
                          3. **SYNTAX:** Strict brace balance.
                          
                          CONTEXT BEFORE:
                          {pre}
                          <<<<<<< LOCAL
                          {local_str}
                          =======
                          {remote_str}
                          >>>>>>> REMOTE
                          CONTEXT AFTER:
                          {post}
                          
                          OUTPUT: ONLY valid code.
                          """
                          
                          # Try DeepSeek First
                          if KEY_DEEPSEEK:
                              print(f"    🧠 [DEEPSEEK] Engaging Specialist...")
                              merged = DeepSeekAgent.query(prompt)
                          
                          # If DeepSeek failed or is disabled, Try Gemini
                          if not merged or (merged and not Cortex.validate(merged, filepath)):
                              if merged: print("    ⚠️ [DEEPSEEK] Validation Failed.")
                              print(f"    🧠 [GEMINI] Engaging Fallback...")
                              merged = GeminiAgent.query(prompt)

                      # --- LEVEL 4: FINAL DECISION ---
                      if merged and Cortex.validate(merged, filepath):
                          print("    ✅ Resolved.")
                          new_lines.append(merged + "\n")
                      else:
                          print("    ☢️ ALL AIs FAILED. Enforcing LOCAL.")
                          new_lines.append(local_str)

                      modified = True
                  else:
                      new_lines.append(line)
                  i += 1

              if modified:
                  with open(filepath, 'w', encoding='utf-8') as f: f.writelines(new_lines)
                  subprocess.run(["git", "add", filepath], check=True)

          if __name__ == "__main__":
              if not os.path.exists("conflicts.txt"):
                  print("No conflicts.")
                  sys.exit(0)
              
              with open("conflicts.txt", "r") as f:
                  files = [x.strip() for x in f if x.strip()]
              
              print(f"📋 Mission: Fix {len(files)} files.")
              for f in files:
                  if os.path.exists(f): orchestrate_merge(f)
          EOF

      # ========================================================
      # PHASE 3: STRATEGIC MERGE
      # ========================================================
      - name: 🧬 Execute Strategic Merge
        id: merge
        shell: bash
        run: |
          git remote add upstream "${{ inputs.upstream_repo }}" 2>/dev/null || true
          git fetch upstream "${{ inputs.upstream_branch }}" --no-tags
          
          TS=$(date +%s)
          TMP="trinity-$TS"
          git checkout -b "$TMP" "origin/${{ inputs.target_branch }}"
          echo "branch=$TMP" >> $GITHUB_OUTPUT

          # SUBMODULE CLEANUP
          echo "🧹 Sanitizing Index..."
          git rm -r --cached toolchains > /dev/null 2>&1 || true

          echo ">>> Executing Merge..."
          git merge "upstream/${{ inputs.upstream_branch }}" \
            --no-commit --no-ff \
            -s ort \
            -X find-renames=50% \
            -X ignore-all-space \
            -X diff-algorithm=histogram || true
          
          git diff --name-only --diff-filter=U > conflicts.txt
          COUNT=$(wc -l < conflicts.txt)
          
          if [ "$COUNT" -gt "0" ]; then
             echo "has_conflicts=true" >> $GITHUB_OUTPUT
             echo "⚠️ Conflicts Detected: $COUNT"
             cat conflicts.txt
          else
             echo "has_conflicts=false" >> $GITHUB_OUTPUT
             echo "✅ Clean Merge."
          fi

      # ========================================================
      # PHASE 4: EXECUTION
      # ========================================================
      - name: 🚑 Engage Trinity
        if: steps.merge.outputs.has_conflicts == 'true'
        run: |
          echo ">>> Starting Trinity Engine..."
          python3 -u trinity_core.py
          rm trinity_core.py conflicts.txt

      # ========================================================
      # PHASE 5: FINALIZE
      # ========================================================
      - name: 🔒 Commit & Push
        run: |
          if grep -r "<<<<<<< HEAD" . --exclude-dir=.github; then
             echo "⚠️ Cleaning markers..."
             grep -r -l "<<<<<<< HEAD" . | xargs sed -i '/<<<<<<< HEAD/d'
             grep -r -l "=======" . | xargs sed -i '/=======/d'
             grep -r -l ">>>>>>>" . | xargs sed -i '/>>>>>>>/d'
          fi

          if [[ -n $(git diff --name-only --diff-filter=U) ]]; then
             echo "❌ CRITICAL: Unmerged files."
             exit 1
          fi

          git add .
          git reset HEAD toolchains > /dev/null 2>&1 || true
          
          if git diff-index --quiet HEAD --; then
             echo "⚠️ No changes."
          else
             git commit -m "Trinity: Tri-Core Merge (${{ inputs.ai_model }})"
             
             TARGET="${{ inputs.target_branch }}"
             BRANCH="${{ steps.merge.outputs.branch }}"
             
             git repack -a -d
             for i in {1..5}; do
                if git push origin "$BRANCH:refs/heads/$TARGET"; then
                   echo "✅ SUCCESS"
                   git push origin --delete "$BRANCH"
                   exit 0
                fi
                sleep 5
             done
             exit 1
          fi

      - name: 📝 Failure Report
        if: failure()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "❌ Trinity Merge Failed"
          body: "Manual intervention required on branch `${{ steps.merge.outputs.branch }}`."
          branch: ${{ steps.merge.outputs.branch }}
          base: ${{ inputs.target_branch }}
