name: 🛡️ 

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream Repository URL'
        required: true
        default: 'https://github.com/neophyteprjkt/kernel_xiaomi_ginkgo.git'
      upstream_branch:
        description: 'Upstream Branch'
        required: true
        default: 'main'
      target_branch:
        description: 'Target Branch (Your Fork)'
        required: true
        default: 'floppy-new'
      
      # --- AI CONFIGURATION ---
      ai_provider:
        description: 'AI Provider'
        required: true
        default: 'gemini'
        type: choice
        options:
          - gemini
          - openai
      
      ai_api_key:
        description: 'AI API Key (Required)'
        required: true
      
      ai_model:
        description: 'Model Name'
        required: true
        default: 'gemini-2.5-flash'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  titanium_agent:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AI_PROVIDER: ${{ inputs.ai_provider }}
      AI_KEY: ${{ inputs.ai_api_key }}
      AI_MODEL: ${{ inputs.ai_model }}

    steps:
      # ========================================================
      # 1. ENVIRONMENT & CHECKOUT
      # ========================================================
      - name: 🛡️ Harden Environment
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git python3-pip python3-requests
          pip3 install requests

      - name: 📥 Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configure Git
        run: |
          git config --global user.name "Apex-Titanium"
          git config --global user.email "bot@apex-automation.ai"
          git config merge.renameLimit 999999
          
          # BINARY GUARD: Protect kernel blobs
          echo "* -text" > .gitattributes
          for ext in png dtb gz ko o bpf zip jpg bmp iso so a; do
            echo "*.$ext binary" >> .gitattributes
          done

      # ========================================================
      # 2. INJECT TITANIUM BRAIN (ULTIMATE ENGINE)
      # ========================================================
      - name: 🧠 Inject Titanium Brain
        run: |
          # ESCAPED FOR YAML: We use __backtick__ placeholders
          cat << 'EOF' > agent_brain.py
          #!/usr/bin/env python3
          import sys, os, re, requests, time, subprocess, random
          from datetime import datetime

          # --- CONFIGURATION ---
          sys.stdout.reconfigure(line_buffering=True)
          
          PROVIDER = os.environ.get("AI_PROVIDER", "gemini")
          API_KEY = os.environ.get("AI_KEY", "").strip()
          REQUESTED_MODEL = os.environ.get("AI_MODEL", "gemini-2.5-flash")
          
          # --- SAFETY TUNING ---
          CONTEXT_LINES = 20       # Strict 20 Lines
          REQUEST_DELAY = 12       # 12s = 5 RPM (Safe Zone)
          MAX_BLOCK_SIZE = 200     # Token Saver
          MAX_RETRIES = 3          # Attempts per block

          # --- LOGGING ---
          REPORT = [f"# 🛡️ Titanium v20.0 Report ({datetime.now().strftime('%Y-%m-%d %H:%M')})", ""]
          STATS = {'total': 0, 'ai': 0, 'skipped': 0, 'failed': 0, 'retries': 0}

          def log(msg):
              print(msg)
              sys.stdout.flush()
              REPORT.append(msg.strip())

          def clean_ai_output(text):
              text = re.sub(r'^__backtick__[a-z]*\n', '', text, flags=re.MULTILINE)
              text = re.sub(r'\n__backtick__$', '', text, flags=re.MULTILINE)
              text = text.replace("__backtick__", "```")
              return text.strip()

          def count_balance(text):
              # 1. Remove Strings (Double & Single Quotes)
              clean = re.sub(r'"(?:\.|[^"\])*"', '', text)
              clean = re.sub(r"'(?:\.|[^'\])*'", '', clean)
              # 2. Remove Comments
              clean = re.sub(r'//.*', '', clean)
              clean = re.sub(r'/\*.*?\*/', '', clean, flags=re.DOTALL)
              return clean.count('{') - clean.count('}')

          def execute_api_call(model, prompt, retry_count=0):
              """Robust API Caller with 429 Self-Healing"""
              if PROVIDER == "gemini":
                  url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={API_KEY}"
                  headers = {'Content-Type': 'application/json'}
                  data = {"contents": [{"parts": [{"text": prompt}]}]}
                  
                  try:
                      resp = requests.post(url, headers=headers, json=data, timeout=60)
                      
                      if resp.status_code == 200:
                          time.sleep(REQUEST_DELAY) 
                          try:
                              return clean_ai_output(resp.json()['candidates'][0]['content']['parts'][0]['text'])
                          except: return None
                      
                      elif resp.status_code == 429:
                          if retry_count == 0:
                              log(f"    🛑 Rate Limit (429). Self-Healing (60s)...")
                              time.sleep(60)
                              STATS['retries'] += 1
                              return execute_api_call(model, prompt, retry_count=1) # Retry Once
                          else:
                              log("    ❌ Rate Limit Persisted.")
                              return "RATE_LIMIT"
                              
                      elif resp.status_code == 404:
                          return "MODEL_NOT_FOUND"
                      else:
                          log(f"    ❌ API Error: {resp.status_code}")
                          return None
                  except Exception as e:
                      log(f"    ⚠️ Network: {e}")
                      return None

              elif PROVIDER == "openai":
                  url = "https://api.openai.com/v1/chat/completions"
                  headers = {"Authorization": f"Bearer {API_KEY}"}
                  data = {"model": model, "messages": [{"role": "user", "content": prompt}], "temperature": 0.2}
                  try:
                      resp = requests.post(url, json=data, headers=headers, timeout=60)
                      if resp.status_code == 200:
                          return clean_ai_output(resp.json()['choices'][0]['message']['content'])
                  except: pass
              return None

          def ask_ai_with_tri_fallback(prompt):
              # 1. Primary Model (User Requested)
              res = execute_api_call(REQUESTED_MODEL, prompt)
              if res and res not in ["MODEL_NOT_FOUND", "RATE_LIMIT"]: return res
              if res == "RATE_LIMIT": return None 

              # 2. Fallback A: Gemini 2.0 Flash Exp (Fast/Smart)
              if PROVIDER == "gemini":
                  log("    🔄 Fallback A: gemini-2.0-flash-exp")
                  res = execute_api_call("gemini-2.0-flash-exp", prompt)
                  if res and res not in ["MODEL_NOT_FOUND", "RATE_LIMIT"]: return res

                  # 3. Fallback B: Gemini 1.5 Flash (Stable/Old)
                  log("    🔄 Fallback B: gemini-1.5-flash")
                  res = execute_api_call("gemini-1.5-flash", prompt)
                  if res and res not in ["MODEL_NOT_FOUND", "RATE_LIMIT"]: return res

              return None

          def solve_conflict_block(local, remote, pre, post, filename):
              STATS['total'] += 1
              
              # Safety: Huge Block Cap
              block_len = len(local.splitlines()) + len(remote.splitlines())
              if block_len > MAX_BLOCK_SIZE:
                  STATS['skipped'] += 1
                  log(f"    ⚠️ [SKIP] Huge Block ({block_len} lines).")
                  return local

              log(f"    🧠 [AI] Thinking...")
              prompt = f"""
              TASK: Merge C Code.
              FILE: {filename}
              
              PRE_CONTEXT:
              {pre}
              
              <<<<<<< LOCAL
              {local}
              =======
              {remote}
              >>>>>>> REMOTE
              
              POST_CONTEXT:
              {post}
              
              INSTRUCTIONS:
              1. Return ONLY the valid merged code.
              2. Keep LOCAL driver logic + REMOTE core updates.
              3. NO Markdown. NO Markers.
              """
              
              for i in range(MAX_RETRIES):
                  sol = ask_ai_with_tri_fallback(prompt)
                  if sol:
                      # A. Hallucination Check
                      if "<<<<" in sol or "====" in sol: continue
                      
                      # B. Smart Brace Check
                      if count_balance(sol) != 0 and count_balance(local) == 0:
                          # Only reject if we broke previously balanced code
                          log("    ⚠️ Brace Imbalance detected in AI output. Retrying...")
                          continue 

                      STATS['ai'] += 1
                      return sol
              
              STATS['failed'] += 1
              log("    ☢️ [FAIL] Keeping LOCAL.")
              return local

          def process_file(filepath):
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f: lines = f.readlines()
              except: return

              new_lines = []
              i = 0
              modified = False
              
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('<<<<<<<'):
                      start = i
                      
                      # Context: Strictly 20 Lines
                      pre_ctx = "".join(lines[max(0, start-CONTEXT_LINES):start])
                      
                      local_blk, remote_blk = [], []
                      mode = "local"
                      i += 1
                      while i < len(lines):
                          if lines[i].startswith('======='): mode = "remote"
                          elif lines[i].startswith('>>>>>>>'): break
                          else:
                              if mode == "local": local_blk.append(lines[i])
                              else: remote_blk.append(lines[i])
                          i += 1
                      
                      # Context: Strictly 20 Lines
                      post_ctx = "".join(lines[i+1:min(len(lines), i+1+CONTEXT_LINES)])
                      
                      log(f"🔎 Conflict: {filepath} (Line {start})")
                      resolved = solve_conflict_block("".join(local_blk), "".join(remote_blk), pre_ctx, post_ctx, filepath)
                      new_lines.append(resolved + "\n")
                      modified = True
                  else:
                      new_lines.append(line)
                  i += 1

              if modified:
                  with open(filepath, 'w', encoding='utf-8') as f: f.writelines(new_lines)
                  subprocess.run(["git", "add", filepath], check=True)

          if __name__ == "__main__":
              files = sys.argv[1:]
              if files:
                  log(f"📋 Processing {len(files)} files...")
                  for f in files:
                      if os.path.exists(f): process_file(f)
                  
                  # Write Report
                  REPORT.append("")
                  REPORT.append("## Statistics")
                  REPORT.append(f"- **Total:** {STATS['total']}")
                  REPORT.append(f"- **AI Fixed:** {STATS['ai']}")
                  REPORT.append(f"- **Failed:** {STATS['failed']}")
                  REPORT.append(f"- **429 Retries:** {STATS['retries']}")
                  
                  with open("TITANIUM_REPORT.md", "w") as f: f.write("\n".join(REPORT))
          EOF
          
          sed -i 's/__backtick__/```/g' agent_brain.py

      # ========================================================
      # 3. MERGE (HISTOGRAM)
      # ========================================================
      - name: 🧬 Merge (Smart Strategy)
        id: merge_step
        run: |
          git remote add upstream "${{ inputs.upstream_repo }}" 2>/dev/null || true
          git fetch upstream "${{ inputs.upstream_branch }}" --no-tags --prune

          TS=$(date +%s)
          TMP="titanium-$TS"
          git checkout -b "$TMP" "origin/${{ inputs.target_branch }}"
          echo "tmp_branch=$TMP" >> $GITHUB_OUTPUT

          echo ">>> Executing Histogram Merge..."
          git merge "upstream/${{ inputs.upstream_branch }}" \
            --no-commit --no-ff \
            -s ort \
            -X find-renames=50% \
            -X ignore-all-space \
            -X diff-algorithm=histogram || true

      # ========================================================
      # 4. RUN TITANIUM AGENT
      # ========================================================
      - name: 🚑 Run Titanium Agent
        run: |
          CONFLICTS=$(git diff --name-only --diff-filter=U)
          if [ ! -z "$CONFLICTS" ]; then
             echo "Detected Conflicts: $CONFLICTS"
             python3 agent_brain.py $CONFLICTS
          else
             echo "No text conflicts detected."
          fi
          rm agent_brain.py

      # ========================================================
      # 5. REPORTING
      # ========================================================
      - name: 📤 Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titanium-report
          path: TITANIUM_REPORT.md

      # ========================================================
      # 6. VERIFY & DEPLOY
      # ========================================================
      - name: 🔍 Verify & Deploy
        run: |
          # A. Unmerged Check
          if [[ -n $(git diff --name-only --diff-filter=U) ]]; then
             echo "❌ CRITICAL: Unmerged files remain."
             exit 1
          fi
          
          # B. Marker Check
          if grep -r "<<<<<<< HEAD" . --exclude-dir=.github; then
             echo "❌ CRITICAL: Conflict markers found."
             exit 1
          fi

          # C. Commit & Push
          git rm -r --cached toolchains > /dev/null 2>&1 || true
          git add .
          git reset HEAD toolchains > /dev/null 2>&1 || true
          
          if git diff-index --quiet HEAD --; then
             echo "⚠️ No changes."
          else
             git commit -m "Titanium Ultimate: Auto-Merge (${{ inputs.ai_model }})"
             
             TMP="${{ steps.merge_step.outputs.tmp_branch }}"
             TARGET="${{ inputs.target_branch }}"
             
             for i in {1..5}; do
                if git push origin "$TMP:refs/heads/$TARGET"; then
                   echo "✅ DEPLOYED TO $TARGET"
                   exit 0
                fi
                sleep 5
             done
             exit 1
          fi

      # ========================================================
      # 7. FAIL SAFE
      # ========================================================
      - name: 🚨 Emergency Commit
        if: failure()
        run: |
          echo "⚠️ Workflow Failed. Saving WIP..."
          git rm -r --cached toolchains > /dev/null 2>&1 || true
          git add . || true
          git reset HEAD toolchains > /dev/null 2>&1 || true
          
          git commit -m "⚠️ Auto-Merge Failed: WIP" || true
          TMP="${{ steps.merge_step.outputs.tmp_branch }}"
          git push origin "$TMP" || true

      - name: 📝 Create Failure Report
        if: failure()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "❌ Titanium Merge Failed"
          body: |
            Manual Fix Needed.
            Branch: `${{ steps.merge_step.outputs.tmp_branch }}`
          branch: ${{ steps.merge_step.outputs.tmp_branch }}
          base: ${{ inputs.target_branch }}
          
