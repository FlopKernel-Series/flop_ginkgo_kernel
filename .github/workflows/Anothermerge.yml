name: 💠 Apex Quad-Core (v20.0 - 4x AI)

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream Repository URL'
        required: true
        default: 'https://github.com/neophyteprjkt/kernel_xiaomi_ginkgo.git'
      upstream_branch:
        description: 'Upstream Branch'
        required: true
        default: 'main'
      target_branch:
        description: 'Target Branch'
        required: true
        default: 'floppy-new'
      
      # --- INTELLIGENCE CREDENTIALS ---
      gemini_api_key:
        description: 'Gemini API Key (Required - Free Tier)'
        required: true
      
      deepseek_api_key:
        description: 'DeepSeek API Key (Optional - Specialist)'
        required: false
      
      openai_api_key:
        description: 'OpenAI API Key (Optional - Generalist)'
        required: false
      
      # --- MODEL SELECTION ---
      openai_model:
        description: 'OpenAI Model'
        required: true
        default: 'gpt-4o-mini'
        type: choice
        options:
          - gpt-4o-mini     # Fast & Cheap
          - gpt-4o          # Powerful & Expensive
      
      gemini_model:
        description: 'Gemini Model'
        required: true
        default: 'gemini-2.5-flash'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  # ========================================================
  # JOB 1: THE GRAND ARBITER (PROBING & RANKING)
  # ========================================================
  arbiter_node:
    runs-on: ubuntu-latest
    outputs:
      provider_queue: ${{ steps.decide.outputs.queue }}
      gemini_id: ${{ steps.decide.outputs.gemini_id }}
    steps:
      - name: 🛡️ Init
        run: pip3 install requests

      - name: ⚖️ Run Arbiter Logic
        id: decide
        env:
          KEY_GEMINI: ${{ inputs.gemini_api_key }}
          KEY_DEEPSEEK: ${{ inputs.deepseek_api_key }}
          KEY_OPENAI: ${{ inputs.openai_api_key }}
          MODEL_OPENAI: ${{ inputs.openai_model }}
        run: |
          cat << 'EOF' > arbiter.py
          import os, requests, re, json

          # --- PROBES ---
          def check_deepseek(key):
              if not key: return False
              print(">>> Probing DeepSeek...")
              try:
                  resp = requests.post(
                      "https://api.deepseek.com/v1/chat/completions",
                      headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json"},
                      json={"model": "deepseek-chat", "messages": [{"role":"user", "content":"x"}], "max_tokens": 1},
                      timeout=5
                  )
                  if resp.status_code == 200: return True
                  print(f"    ❌ DeepSeek Error: {resp.status_code}")
              except: pass
              return False

          def check_openai(key, model):
              if not key: return False
              print(f">>> Probing OpenAI ({model})...")
              try:
                  resp = requests.post(
                      "https://api.openai.com/v1/chat/completions",
                      headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json"},
                      json={"model": model, "messages": [{"role":"user", "content":"x"}], "max_tokens": 1},
                      timeout=5
                  )
                  if resp.status_code == 200: return True
                  print(f"    ❌ OpenAI Error: {resp.status_code}")
              except: pass
              return False

          def get_best_gemini(key):
              print(">>> Probing Gemini...")
              best = "gemini-1.5-flash"
              try:
                  resp = requests.get(
                      f"https://generativelanguage.googleapis.com/v1beta/models?key={key}",
                      timeout=5
                  )
                  if resp.status_code == 200:
                      models = [m['name'].replace("models/", "") for m in resp.json().get('models', []) if "flash" in m['name']]
                      models.sort(key=lambda x: float(re.search(r'(\d+\.\d+)', x).group(1)), reverse=True)
                      if models: best = models[0]
              except: pass
              return best

          # --- MAIN DECISION ENGINE ---
          if __name__ == "__main__":
              k_ds = os.environ.get("KEY_DEEPSEEK")
              k_oa = os.environ.get("KEY_OPENAI")
              m_oa = os.environ.get("MODEL_OPENAI")
              k_gem = os.environ.get("KEY_GEMINI")

              active_providers = []

              # 1. Check DeepSeek (Specialist)
              if check_deepseek(k_ds): active_providers.append("deepseek")

              # 2. Check OpenAI (Generalist Leader)
              if check_openai(k_oa, m_oa): active_providers.append("openai")

              # 3. Check Gemini (Reliable Fallback)
              gem_model = get_best_gemini(k_gem)
              # Gemini is assumed active if key exists, as it's free tier
              if k_gem: active_providers.append("gemini")

              # Serialize list for GitHub Actions
              queue_str = ",".join(active_providers)
              print(f"::notice::Intelligence Queue: {queue_str} (Gemini: {gem_model})")

              with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
                  fh.write(f"queue={queue_str}\n")
                  fh.write(f"gemini_id={gem_model}\n")
          EOF
          python3 arbiter.py

  # ========================================================
  # JOB 2: QUAD-CORE ENGINE
  # ========================================================
  quad_core:
    needs: arbiter_node
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KEY_GEMINI: ${{ inputs.gemini_api_key }}
      KEY_DEEPSEEK: ${{ inputs.deepseek_api_key }}
      KEY_OPENAI: ${{ inputs.openai_api_key }}
      
      # Dynamic Inputs
      AI_QUEUE: ${{ needs.arbiter_node.outputs.provider_queue }}
      MODEL_GEMINI: ${{ needs.arbiter_node.outputs.gemini_id }}
      MODEL_OPENAI: ${{ inputs.openai_model }}

    steps:
      - name: 🛡️ System Hardening
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git python3-pip python3-requests
          pip3 install requests

      - name: 📥 Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configure Git
        run: |
          git config --global user.name "Apex-QuadCore"
          git config --global user.email "bot@floppykernel.ai"
          git config merge.renameLimit 999999
          
          echo "* -text" > .gitattributes
          for ext in png dtb gz ko o bpf zip jpg bmp iso so a; do
            echo "*.$ext binary" >> .gitattributes
          done

      - name: 🧠 Inject Quad-Core Engine
        run: |
          cat << 'EOF' > quad_core.py
          import sys, os, re, requests, time, subprocess

          sys.stdout.reconfigure(line_buffering=True)

          # --- CONFIG ---
          KEYS = {
              "gemini": os.environ.get("KEY_GEMINI", "").strip(),
              "deepseek": os.environ.get("KEY_DEEPSEEK", "").strip(),
              "openai": os.environ.get("KEY_OPENAI", "").strip()
          }
          
          MODELS = {
              "gemini": os.environ.get("MODEL_GEMINI", "gemini-1.5-flash"),
              "openai": os.environ.get("MODEL_OPENAI", "gpt-4o-mini"),
              "deepseek": "deepseek-chat"
          }

          # Load Priority Queue (e.g., "deepseek,openai,gemini")
          QUEUE = os.environ.get("AI_QUEUE", "gemini").split(",")
          
          # Governor: 15s to be safe for Gemini Free Tier. 
          # OpenAI/DeepSeek usually handle faster, but we keep it safe.
          MIN_DELAY = 12.0
          LAST_REQUEST = 0

          print(f">>> [SYSTEM] Quad-Core Online.")
          print(f"    - Strategy: Cortex -> { ' -> '.join([q.upper() for q in QUEUE]) } -> Local")

          # ======================================================
          # CLASS: CORTEX (LOGIC)
          # ======================================================
          class Cortex:
              @staticmethod
              def solve_heuristics(local, remote, filename):
                  l_lines = [x.strip() for x in local.splitlines() if x.strip()]
                  r_lines = [x.strip() for x in remote.splitlines() if x.strip()]

                  # 1. Makefile Version
                  if filename == 'Makefile':
                      if any(x.startswith(('VERSION', 'PATCHLEVEL', 'SUBLEVEL')) for x in r_lines):
                          print(f"    ⚡ [CORTEX] Version Bump -> REMOTE")
                          return remote
                      if all('+=' in x for x in l_lines + r_lines):
                          print(f"    ⚡ [CORTEX] Makefile Append -> MERGE")
                          return local + "\n" + remote

                  # 2. Set Union
                  if any(filename.endswith(x) for x in ['.gitignore', '.txt', '.conf', '.json']) or \
                     all(x.startswith(('#include', 'import')) for x in l_lines + r_lines):
                      print(f"    ⚡ [CORTEX] Set Union Merge")
                      return "\n".join(sorted(list(set(l_lines + r_lines))))

                  # 3. Kconfig
                  if 'Kconfig' in filename:
                      if all(re.match(r'^(config|bool|default|select|menu|source)', x) or '=' in x for x in l_lines + r_lines):
                          print("    ⚡ [CORTEX] Merging Config Definitions")
                          return "\n".join(sorted(list(set(l_lines + r_lines))))
                  return None

              @staticmethod
              def check_ghost(local, remote):
                  if not local.strip() and remote.strip():
                      print("    👻 [CORTEX] Ghost Block (Deletion) -> Keeping Deleted")
                      return "" 
                  return None

              @staticmethod
              def validate(text, filename):
                  clean = re.sub(r'//.*', '', text)
                  clean = re.sub(r'/\*.*?\*/', '', clean, flags=re.DOTALL)
                  if any(filename.endswith(x) for x in ['.txt', '.gitignore', 'Makefile', '.mk', 'Kconfig']): return True
                  return clean.count('{') == clean.count('}')

          # ======================================================
          # CLASS: OMNI CLIENT (HANDLES ALL APIS)
          # ======================================================
          class OmniClient:
              @staticmethod
              def clean(text):
                  text = re.sub(r'^```[a-z]*\n', '', text, flags=re.MULTILINE)
                  text = re.sub(r'\n```$', '', text, flags=re.MULTILINE)
                  return text.strip()

              @staticmethod
              def govern():
                  global LAST_REQUEST
                  now = time.time()
                  elapsed = now - LAST_REQUEST
                  if elapsed < MIN_DELAY:
                      time.sleep(MIN_DELAY - elapsed)
                  LAST_REQUEST = time.time()

              @staticmethod
              def call(provider, prompt):
                  OmniClient.govern()
                  key = KEYS.get(provider)
                  model = MODELS.get(provider)
                  
                  try:
                      # --- OPENAI ---
                      if provider == "openai":
                          resp = requests.post(
                              "https://api.openai.com/v1/chat/completions",
                              headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json"},
                              json={"model": model, "messages": [{"role":"user", "content":prompt}], "temperature":0.1},
                              timeout=60
                          )
                          if resp.status_code == 200:
                              return OmniClient.clean(resp.json()['choices'][0]['message']['content'])
                          elif resp.status_code in [402, 429]:
                              print(f"    ⚠️ [OPENAI] Limit Reached ({resp.status_code}).")

                      # --- DEEPSEEK ---
                      elif provider == "deepseek":
                          resp = requests.post(
                              "https://api.deepseek.com/v1/chat/completions",
                              headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json"},
                              json={"model": model, "messages": [{"role":"user", "content":prompt}], "temperature":0.1},
                              timeout=60
                          )
                          if resp.status_code == 200:
                              return OmniClient.clean(resp.json()['choices'][0]['message']['content'])
                          elif resp.status_code in [402, 429]:
                              print(f"    ⚠️ [DEEPSEEK] Limit Reached ({resp.status_code}).")

                      # --- GEMINI ---
                      elif provider == "gemini":
                          url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={key}"
                          for i in range(2): # Retry logic
                              resp = requests.post(
                                  url, headers={'Content-Type': 'application/json'},
                                  json={"contents": [{"parts": [{"text": prompt}]}], "generationConfig": {"temperature": 0.2}},
                                  timeout=60
                              )
                              if resp.status_code == 200:
                                  return OmniClient.clean(resp.json()['candidates'][0]['content']['parts'][0]['text'])
                              elif resp.status_code == 429:
                                  print("    🛑 [GEMINI] 429. Sleeping 60s...")
                                  time.sleep(60)
                                  continue
                              break # Break if other error
                  except Exception as e:
                      print(f"    ⚠️ [{provider.upper()}] Exception: {e}")
                  
                  return None

          # ======================================================
          # ORCHESTRATOR
          # ======================================================
          def solve_conflict(filepath):
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f: lines = f.readlines()
              except: return

              new_lines = []
              i = 0
              modified = False
              
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('<<<<<<<'):
                      start = i
                      # Context: Truncate to 2000 chars to save tokens
                      pre_raw = "".join(lines[max(0, start-40):start])
                      pre = pre_raw[-2000:]
                      
                      local_blk, remote_blk = [], []
                      mode = "local"
                      i += 1
                      while i < len(lines):
                          if lines[i].startswith('======='): mode = "remote"
                          elif lines[i].startswith('>>>>>>>'): break
                          else:
                              if mode == "local": local_blk.append(lines[i])
                              else: remote_blk.append(lines[i])
                          i += 1
                      
                      post = "".join(lines[i+1:min(len(lines), i+40)])[:2000]
                      local_str = "".join(local_blk)
                      remote_str = "".join(remote_blk)
                      
                      print(f"🔎 Conflict: {filepath} (Line {start})")

                      # 1. CORTEX
                      merged = Cortex.solve_heuristics(local_str, remote_str, filepath)
                      if merged is None: merged = Cortex.check_ghost(local_str, remote_str)

                      # 2. AI CASCADE (Quad-Core)
                      if merged is None:
                          prompt = f"""
                          ROLE: Linux Kernel Dev.
                          TASK: Merge Conflict in '{filepath}'.
                          RULES:
                          1. **LOCAL SUPREMACY:** My branch (LOCAL) has custom drivers. PRESERVE IT.
                          2. **ADAPT REMOTE:** If Upstream updated syntax/versions, apply it IF it works with LOCAL.
                          3. **SYNTAX:** Strict brace balance.
                          
                          CONTEXT BEFORE:
                          {pre}
                          <<<<<<< LOCAL
                          {local_str}
                          =======
                          {remote_str}
                          >>>>>>> REMOTE
                          CONTEXT AFTER:
                          {post}
                          
                          OUTPUT: VALID C CODE ONLY.
                          """
                          
                          # Iterate through Queue (e.g., DeepSeek -> OpenAI -> Gemini)
                          for provider in QUEUE:
                              if provider == "none": continue
                              print(f"    🧠 Invoking {provider.upper()}...")
                              merged = OmniClient.call(provider, prompt)
                              
                              if merged and Cortex.validate(merged, filepath):
                                  print(f"    ✅ Resolved by {provider.upper()}.")
                                  break # Success, stop cascading
                              
                              if merged: print(f"    ⚠️ {provider.upper()} Validation Failed. Trying next...")

                      # 3. FINAL DECISION
                      if merged is not None and Cortex.validate(merged, filepath):
                          new_lines.append(merged + "\n")
                      else:
                          print("    ☢️ FAILED. Enforcing LOCAL.")
                          new_lines.append(local_str)

                      modified = True
                  else:
                      new_lines.append(line)
                  i += 1

              if modified:
                  with open(filepath, 'w', encoding='utf-8') as f: f.writelines(new_lines)
                  subprocess.run(["git", "add", filepath], check=True)

          if __name__ == "__main__":
              if not os.path.exists("conflicts.txt"): sys.exit(0)
              with open("conflicts.txt", "r") as f:
                  files = [x.strip() for x in f if x.strip()]
              
              print(f"📋 Mission: Fix {len(files)} files.")
              for f in files:
                  if os.path.exists(f): solve_conflict(f)
          EOF

      - name: 🧬 Execute Strategic Merge
        id: merge
        shell: bash
        run: |
          git remote add upstream "${{ inputs.upstream_repo }}" 2>/dev/null || true
          git fetch upstream "${{ inputs.upstream_branch }}" --no-tags
          
          TS=$(date +%s)
          TMP="quad-$TS"
          git checkout -b "$TMP" "origin/${{ inputs.target_branch }}"
          echo "branch=$TMP" >> $GITHUB_OUTPUT

          echo "🧹 Sanitizing Index..."
          git rm -r --cached toolchains > /dev/null 2>&1 || true

          echo ">>> Executing Merge..."
          git merge "upstream/${{ inputs.upstream_branch }}" \
            --no-commit --no-ff \
            -s ort \
            -X find-renames=50% \
            -X ignore-all-space \
            -X diff-algorithm=histogram || true
          
          git diff --name-only --diff-filter=U > conflicts.txt
          COUNT=$(wc -l < conflicts.txt)
          
          if [ "$COUNT" -gt "0" ]; then
             echo "has_conflicts=true" >> $GITHUB_OUTPUT
             echo "⚠️ Conflicts Detected: $COUNT"
             cat conflicts.txt
          else
             echo "has_conflicts=false" >> $GITHUB_OUTPUT
             echo "✅ Clean Merge."
          fi

      - name: 🚑 Engage Quad-Core
        if: steps.merge.outputs.has_conflicts == 'true'
        run: |
          echo ">>> Starting Quad-Core Engine..."
          python3 -u quad_core.py
          rm quad_core.py conflicts.txt

      - name: 🔒 Commit & Push
        run: |
          if grep -r "<<<<<<< HEAD" . --exclude-dir=.github; then
             echo "⚠️ Cleaning markers..."
             grep -r -l "<<<<<<< HEAD" . | xargs sed -i '/<<<<<<< HEAD/d'
             grep -r -l "=======" . | xargs sed -i '/=======/d'
             grep -r -l ">>>>>>>" . | xargs sed -i '/>>>>>>>/d'
          fi

          if [[ -n $(git diff --name-only --diff-filter=U) ]]; then
             echo "❌ CRITICAL: Unmerged files."
             exit 1
          fi

          git add .
          git reset HEAD toolchains > /dev/null 2>&1 || true

          if git diff-index --quiet HEAD --; then
             echo "⚠️ No changes."
          else
             git commit -m "Quad-Core: Auto-Merge (${{ inputs.ai_model }})"
             TARGET="${{ inputs.target_branch }}"
             BRANCH="${{ steps.merge.outputs.branch }}"
             
             git repack -a -d
             for i in {1..5}; do
                if git push origin "$BRANCH:refs/heads/$TARGET"; then
                   echo "✅ SUCCESS"
                   git push origin --delete "$BRANCH"
                   exit 0
                fi
                sleep 5
             done
             exit 1
          fi

      - name: 📝 Failure Report
        if: failure()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "❌ Quad-Core Merge Failed"
          body: "Manual intervention required on branch `${{ steps.merge.outputs.branch }}`."
          branch: ${{ steps.merge.outputs.branch }}
          base: ${{ inputs.target_branch }}
          
