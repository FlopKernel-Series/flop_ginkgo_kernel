name: ⚙️ merge

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream Repository URL'
        required: true
        default: 'https://github.com/neophyteprjkt/kernel_xiaomi_ginkgo.git'
      upstream_branch:
        description: 'Upstream Branch'
        required: true
        default: 'main'
      target_branch:
        description: 'Target Branch'
        required: true
        default: 'floppy-new'
      
      # --- INTELLIGENCE KEYS ---
      gemini_api_key:
        description: 'Gemini API Key (Required - Free Tier)'
        required: true
      
      deepseek_api_key:
        description: 'DeepSeek API Key (Optional - Coding Specialist)'
        required: false
      
      openai_api_key:
        description: 'OpenAI API Key (Optional - Generalist)'
        required: false
        
      ai_model_gemini:
        description: 'Gemini Model ID'
        required: true
        default: 'gemini-2.5-flash'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  trinity_core:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KEY_GEMINI: ${{ inputs.gemini_api_key }}
      KEY_DEEPSEEK: ${{ inputs.deepseek_api_key }}
      KEY_OPENAI: ${{ inputs.openai_api_key }}
      MODEL_GEMINI: ${{ inputs.ai_model_gemini }}

    steps:
      # ========================================================
      # PHASE 1: HARDENED PREP
      # ========================================================
      - name: 🛡️ System Hardening
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git python3-pip python3-requests
          pip3 install requests

      - name: 📥 Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configure Git
        run: |
          git config --global user.name "Apex-Auto"
          git config --global user.email "bot@floppykernel.ai"
          git config merge.renameLimit 999999
          
          # BINARY SHIELD: Protect blobs
          echo "* -text" > .gitattributes
          for ext in png dtb gz ko o bpf zip jpg bmp iso so a; do
            echo "*.$ext binary" >> .gitattributes
          done

      # ========================================================
      # PHASE 2: INJECT TRINITY ENGINE (ADAPTIVE GOVERNOR)
      # ========================================================
      - name: 🧠 Inject Intelligence Core
        run: |
          cat << 'EOF' > trinity_core.py
          import sys, os, re, requests, time, subprocess

          # 1. FORCE UNBUFFERED LOGS (Fixes "Silent Death")
          sys.stdout.reconfigure(line_buffering=True)

          # --- CONFIGURATION ---
          KEYS = {
              "gemini": os.environ.get("KEY_GEMINI", "").strip(),
              "deepseek": os.environ.get("KEY_DEEPSEEK", "").strip(),
              "openai": os.environ.get("KEY_OPENAI", "").strip()
          }
          
          RAW_GEMINI = os.environ.get("MODEL_GEMINI", "gemini-2.5-flash")
          ID_GEMINI = RAW_GEMINI.replace("models/", "")
          
          # --- ADAPTIVE TOKEN BUCKET SETTINGS ---
          # Gemini Free Tier Strategy: 
          # We assume a safe refill rate of ~400 chars per second (conservative).
          # If we send 4000 chars, we sleep 10s. If 800 chars, sleep 2s.
          SAFE_REFILL_RATE_CHARS_PER_SEC = 400 
          MIN_SLEEP_FLOOR = 3.0 # Minimum cooldown no matter how small

          print(f">>> [SYSTEM] v24.0 Adaptive Core Online.")
          print(f"    - Gemini Model: {ID_GEMINI}")

          class AdaptiveGovernor:
              """Calculates sleep time based on payload size (Token Weight)."""
              @staticmethod
              def pace(payload_text):
                  char_count = len(payload_text)
                  # Calculate required refill time
                  wait_time = (char_count / SAFE_REFILL_RATE_CHARS_PER_SEC)
                  # Ensure floor
                  final_wait = max(MIN_SLEEP_FLOOR, wait_time)
                  
                  # Cap at 60s max to prevent stalling
                  final_wait = min(60.0, final_wait)
                  
                  print(f"    ⏳ Adaptive Governor: {char_count} chars -> Sleeping {final_wait:.1f}s...")
                  time.sleep(final_wait)

          class CortexLogic:
              """Deterministic Logic (Cost: 0 Tokens)."""
              @staticmethod
              def solve(local, remote, filename):
                  l_lines = [x.strip() for x in local.splitlines() if x.strip()]
                  r_lines = [x.strip() for x in remote.splitlines() if x.strip()]

                  # 1. Kernel Version Bump (Always Remote)
                  if filename == 'Makefile':
                      if any(x.startswith(('VERSION', 'PATCHLEVEL', 'SUBLEVEL')) for x in r_lines):
                          print(f"    ⚡ [CORTEX] Kernel Version Bump -> Accepting REMOTE")
                          return remote
                      if all('+=' in x for x in l_lines + r_lines):
                          print(f"    ⚡ [CORTEX] Makefile Append -> Merge")
                          return local + "\n" + remote

                  # 2. Set Union (Lists, Configs)
                  if any(filename.endswith(x) for x in ['.gitignore', '.txt', '.conf', '.json']) or \
                     all(x.startswith(('#include', 'import')) for x in l_lines + r_lines):
                      print(f"    ⚡ [CORTEX] Set Union Merge")
                      return "\n".join(sorted(list(set(l_lines + r_lines))))

                  # 3. Kconfig
                  if 'Kconfig' in filename:
                      if all(re.match(r'^(config|bool|default|select|menu|source)', x) or '=' in x for x in l_lines + r_lines):
                          print("    ⚡ [CORTEX] Merging Config Definitions")
                          return "\n".join(sorted(list(set(l_lines + r_lines))))
                  return None

              @staticmethod
              def validate(text, filename):
                  clean = re.sub(r'//.*', '', text)
                  clean = re.sub(r'/\*.*?\*/', '', clean, flags=re.DOTALL)
                  
                  if any(filename.endswith(x) for x in ['.txt', '.gitignore', 'Makefile', '.mk', 'Kconfig']): return True
                  
                  return clean.count('{') == clean.count('}')

          class OmniClient:
              @staticmethod
              def clean(text):
                  text = re.sub(r'^```[a-z]*\n', '', text, flags=re.MULTILINE)
                  text = re.sub(r'\n```$', '', text, flags=re.MULTILINE)
                  return text.strip()

              @staticmethod
              def call(provider, prompt):
                  # APPLY ADAPTIVE PACING BEFORE REQUEST
                  AdaptiveGovernor.pace(prompt)
                  
                  key = KEYS.get(provider)
                  if not key: return None

                  try:
                      # --- DEEPSEEK ---
                      if provider == "deepseek":
                          resp = requests.post(
                              "https://api.deepseek.com/v1/chat/completions",
                              headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json"},
                              json={"model": "deepseek-chat", "messages": [{"role":"user", "content":prompt}], "temperature":0.1},
                              timeout=60
                          )
                          if resp.status_code == 200:
                              return OmniClient.clean(resp.json()['choices'][0]['message']['content'])
                          elif resp.status_code == 402:
                              print("    ❌ DeepSeek: Out of Credits.")
                              KEYS["deepseek"] = "" # Disable for session

                      # --- OPENAI ---
                      elif provider == "openai":
                          resp = requests.post(
                              "https://api.openai.com/v1/chat/completions",
                              headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json"},
                              json={"model": "gpt-4o-mini", "messages": [{"role":"user", "content":prompt}], "temperature":0.1},
                              timeout=60
                          )
                          if resp.status_code == 200:
                              return OmniClient.clean(resp.json()['choices'][0]['message']['content'])

                      # --- GEMINI ---
                      elif provider == "gemini":
                          url = f"https://generativelanguage.googleapis.com/v1beta/models/{ID_GEMINI}:generateContent?key={key}"
                          for attempt in range(2):
                              resp = requests.post(
                                  url, headers={'Content-Type': 'application/json'},
                                  json={"contents": [{"parts": [{"text": prompt}]}], "generationConfig": {"temperature": 0.2}},
                                  timeout=60
                              )
                              if resp.status_code == 200:
                                  return OmniClient.clean(resp.json()['candidates'][0]['content']['parts'][0]['text'])
                              elif resp.status_code == 429:
                                  # If we hit 429 despite adaptive pacing, double down on sleep
                                  print("    🛑 Gemini Burst Limit. Forced Sleep 60s...")
                                  time.sleep(60)
                                  continue
                              break
                  except Exception as e:
                      print(f"    ⚠️ {provider.upper()} Error: {e}")
                  
                  return None

          def solve_conflict(filepath):
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f: lines = f.readlines()
              except: return

              new_lines = []
              i = 0
              modified = False
              
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('<<<<<<<'):
                      start = i
                      
                      # Context Strategy: 
                      # Reduce context to 40 lines (usually enough) to keep Token Weight low.
                      pre_raw = "".join(lines[max(0, start-40):start])
                      pre = pre_raw[-2500:] # Hard CAP on chars
                      
                      local_blk, remote_blk = [], []
                      mode = "local"
                      i += 1
                      while i < len(lines):
                          if lines[i].startswith('======='): mode = "remote"
                          elif lines[i].startswith('>>>>>>>'): break
                          else:
                              if mode == "local": local_blk.append(lines[i])
                              else: remote_blk.append(lines[i])
                          i += 1
                      
                      post_raw = "".join(lines[i+1:min(len(lines), i+40)])
                      post = post_raw[:2500] # Hard CAP
                      
                      local_str = "".join(local_blk)
                      remote_str = "".join(remote_blk)
                      
                      print(f"🔎 Conflict: {filepath} (Line {start})")

                      # 1. CORTEX HEURISTIC
                      merged = CortexLogic.solve(local_str, remote_str, filepath)
                      
                      # 2. GHOST DETECT (Deletion)
                      if merged is None and not local_str.strip() and remote_str.strip():
                          print("    👻 [CORTEX] Detected Deletion -> Preserving")
                          merged = ""

                      # 3. AI TRIAGE (Priority Queue)
                      if merged is None:
                          prompt = f"""
                          ROLE: Senior Linux Kernel Dev.
                          TASK: Merge Conflict in '{filepath}'.
                          RULES:
                          1. **LOCAL SUPREMACY:** My branch (LOCAL) contains custom drivers/optimizations. PRESERVE IT.
                          2. **ADAPT REMOTE:** If Upstream updated syntax/versions, apply it IF it works with LOCAL.
                          3. **SYNTAX:** Strict brace balance.
                          
                          CONTEXT BEFORE:
                          {pre}
                          <<<<<<< LOCAL
                          {local_str}
                          =======
                          {remote_str}
                          >>>>>>> REMOTE
                          CONTEXT AFTER:
                          {post}
                          
                          OUTPUT: VALID C CODE ONLY.
                          """
                          
                          # A. Try DeepSeek (Specialist)
                          if KEYS["deepseek"]:
                              print("    🧠 Asking DeepSeek...")
                              merged = OmniClient.call("deepseek", prompt)
                          
                          # B. Try OpenAI (Generalist)
                          if (not merged) and KEYS["openai"]:
                              print("    🧠 Asking OpenAI...")
                              merged = OmniClient.call("openai", prompt)

                          # C. Try Gemini (Infinite Fallback)
                          if not merged:
                              print(f"    🧠 Asking Gemini...")
                              merged = OmniClient.call("gemini", prompt)

                      # 4. DECISION & VALIDATION
                      if merged is not None:
                          # Run simplistic validation
                          if CortexLogic.validate(merged, filepath):
                              print("    ✅ Resolved.")
                              new_lines.append(merged + "\n")
                          else:
                              print("    ⚠️ AI Syntax Check Failed (Unbalanced). Enforcing LOCAL.")
                              new_lines.append(local_str)
                      else:
                          print("    ☢️ ALL FAILED. Enforcing LOCAL.")
                          new_lines.append(local_str)

                      modified = True
                  else:
                      new_lines.append(line)
                  i += 1

              if modified:
                  with open(filepath, 'w', encoding='utf-8') as f: f.writelines(new_lines)
                  subprocess.run(["git", "add", filepath], check=True)

          if __name__ == "__main__":
              if not os.path.exists("conflicts.txt"):
                  sys.exit(0)
              with open("conflicts.txt", "r") as f:
                  files = [x.strip() for x in f if x.strip()]
              
              print(f"📋 Mission: Fix {len(files)} files.")
              for f in files:
                  if os.path.exists(f): solve_conflict(f)
          EOF

      # ========================================================
      # PHASE 3: STRATEGIC MERGE
      # ========================================================
      - name: 🧬 Execute Strategic Merge
        id: merge
        shell: bash
        run: |
          git remote add upstream "${{ inputs.upstream_repo }}" 2>/dev/null || true
          git fetch upstream "${{ inputs.upstream_branch }}" --no-tags
          
          TS=$(date +%s)
          TMP="trinity-$TS"
          git checkout -b "$TMP" "origin/${{ inputs.target_branch }}"
          echo "branch=$TMP" >> $GITHUB_OUTPUT

          # CLEAN INDEX
          echo "🧹 Sanitizing Index..."
          git rm -r --cached toolchains > /dev/null 2>&1 || true

          echo ">>> Executing Merge..."
          git merge "upstream/${{ inputs.upstream_branch }}" \
            --no-commit --no-ff \
            -s ort \
            -X find-renames=50% \
            -X ignore-all-space \
            -X diff-algorithm=histogram || true
          
          git diff --name-only --diff-filter=U > conflicts.txt
          COUNT=$(wc -l < conflicts.txt)
          
          if [ "$COUNT" -gt "0" ]; then
             echo "has_conflicts=true" >> $GITHUB_OUTPUT
             echo "⚠️ Conflicts Detected: $COUNT"
             cat conflicts.txt
          else
             echo "has_conflicts=false" >> $GITHUB_OUTPUT
             echo "✅ Clean Merge."
          fi

      # ========================================================
      # PHASE 4: EXECUTION
      # ========================================================
      - name: 🚑 Engage Trinity
        if: steps.merge.outputs.has_conflicts == 'true'
        run: |
          echo ">>> Starting Trinity Engine (Adaptive Mode)..."
          python3 -u trinity_core.py
          rm trinity_core.py conflicts.txt

      # ========================================================
      # PHASE 5: FINALIZE
      # ========================================================
      - name: 🔒 Commit & Push
        run: |
          if grep -r "<<<<<<< HEAD" . --exclude-dir=.github; then
             echo "⚠️ Cleaning markers..."
             grep -r -l "<<<<<<< HEAD" . | xargs sed -i '/<<<<<<< HEAD/d'
             grep -r -l "=======" . | xargs sed -i '/=======/d'
             grep -r -l ">>>>>>>" . | xargs sed -i '/>>>>>>>/d'
          fi

          if [[ -n $(git diff --name-only --diff-filter=U) ]]; then
             echo "❌ CRITICAL: Unmerged files."
             exit 1
          fi

          git add .
          git reset HEAD toolchains > /dev/null 2>&1 || true
          
          if git diff-index --quiet HEAD --; then
             echo "⚠️ No changes."
          else
             git commit -m "Trinity: Auto-Merge (${{ inputs.ai_model }})"
             
             TARGET="${{ inputs.target_branch }}"
             BRANCH="${{ steps.merge.outputs.branch }}"
             
             git repack -a -d
             for i in {1..5}; do
                if git push origin "$BRANCH:refs/heads/$TARGET"; then
                   echo "✅ SUCCESS"
                   git push origin --delete "$BRANCH"
                   exit 0
                fi
                sleep 5
             done
             exit 1
          fi

      - name: 📝 Failure Report
        if: failure()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "❌ Trinity Merge Failed"
          body: "Manual intervention required on branch `${{ steps.merge.outputs.branch }}`."
          branch: ${{ steps.merge.outputs.branch }}
          base: ${{ inputs.target_branch }}
