name: 🌌 merge

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream Repository URL'
        required: true
        default: 'https://github.com/neophyteprjkt/kernel_xiaomi_ginkgo.git'
      upstream_branch:
        description: 'Upstream Branch'
        required: true
        default: 'main'
      target_branch:
        description: 'Target Branch'
        required: true
        default: 'floppy-new'
      
      ai_api_key:
        description: 'Gemini API Key'
        required: true
      
      ai_model:
        description: 'Model ID'
        required: true
        default: 'gemini-2.5-flash'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  nebula_core:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AI_KEY: ${{ inputs.ai_api_key }}
      AI_MODEL: ${{ inputs.ai_model }}

    steps:
      # ========================================================
      # PHASE 1: HARDENED ENVIRONMENT
      # ========================================================
      - name: 🛡️ System Prep
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git python3-pip python3-requests
          pip3 install requests

      - name: 📥 Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configure Git
        run: |
          git config --global user.name "Apex-Nebula"
          git config --global user.email "bot@floppykernel.ai"
          git config merge.renameLimit 999999
          
          # BINARY SHIELD: Prevent text-merging of blobs
          echo "* -text" > .gitattributes
          for ext in png dtb gz ko o bpf zip jpg bmp iso so a; do
            echo "*.$ext binary" >> .gitattributes
          done

      # ========================================================
      # PHASE 2: INJECT "CORTEX" INTELLIGENCE ENGINE
      # ========================================================
      - name: 🧠 Inject Cortex v14.4
        run: |
          cat << 'EOF' > cortex_engine.py
          import sys, os, re, requests, time, subprocess

          # 1. FORCE UNBUFFERED LOGS (No Silent Deaths)
          sys.stdout.reconfigure(line_buffering=True)

          # --- CONFIGURATION ---
          API_KEY = os.environ.get("AI_KEY", "").strip()
          RAW_MODEL = os.environ.get("AI_MODEL", "gemini-2.5-flash")
          MODEL_ID = RAW_MODEL.replace("models/", "")

          # --- RATE LIMIT GOVERNOR ---
          # 15 RPM = 1 request every 4s. We use 10s to be absolutely safe.
          MIN_DELAY = 10.0 
          LAST_REQUEST = 0
          MAX_RETRIES = 3

          print(f">>> [SYSTEM] Cortex v14.4 Online. Model: {MODEL_ID}")

          class CortexLogic:
              """The 'No-AI' Heuristic Solver (Saves Tokens)."""
              @staticmethod
              def solve(local, remote, filename):
                  l_lines = [x.strip() for x in local.splitlines() if x.strip()]
                  r_lines = [x.strip() for x in remote.splitlines() if x.strip()]

                  # 1. Lists / Gitignore / Configs (Set Union)
                  if any(filename.endswith(x) for x in ['.gitignore', '.txt', '.conf', '.json']):
                      print("    ⚡ [CORTEX] Merging List/Config (Union)")
                      return "\n".join(sorted(list(set(l_lines + r_lines))))

                  # 2. Includes (Set Union)
                  if all(x.startswith(('#include', 'import')) for x in l_lines + r_lines):
                      print("    ⚡ [CORTEX] Merging Headers (Union)")
                      return "\n".join(sorted(list(set(l_lines + r_lines))))

                  # 3. Kconfig / Defconfig (Prioritize Assignments)
                  if 'Kconfig' in filename or 'defconfig' in filename:
                      # If conflicts are purely configs, merge them
                      if all(('=' in x or 'config ' in x or 'bool ' in x) for x in l_lines + r_lines):
                          print("    ⚡ [CORTEX] Merging Kernel Configs")
                          # Basic strategy: Keep both unique lines. 
                          # If duplicate keys exist, Git conflict logic usually implies differing values.
                          # Since we prefer LOCAL, we can just return LOCAL if keys overlap, or Union if distinct.
                          # For safety, let's trust the AI for overlapping keys, but use Union for distinct.
                          return None # Let AI handle value collisions to prioritize LOCAL

                  return None

          class GeminiBridge:
              @staticmethod
              def clean_response(text):
                  text = re.sub(r'^```[a-z]*\n', '', text, flags=re.MULTILINE)
                  text = re.sub(r'\n```$', '', text, flags=re.MULTILINE)
                  text = re.sub(r'<<<<<<< .*', '', text)
                  text = re.sub(r'=======', '', text)
                  text = re.sub(r'>>>>>>> .*', '', text)
                  return text.strip()

              @staticmethod
              def validate(text, filename):
                  clean = re.sub(r'//.*', '', text)
                  clean = re.sub(r'/\*.*?\*/', '', clean, flags=re.DOTALL)
                  
                  if any(filename.endswith(x) for x in ['.txt', '.gitignore', 'Makefile', '.mk', 'Kconfig']):
                      return True
                  
                  # DTS/C Brace Check
                  return clean.count('{') == clean.count('}')

              @staticmethod
              def query(prompt):
                  global LAST_REQUEST
                  
                  # GOVERNOR: Enforce Delay
                  now = time.time()
                  elapsed = now - LAST_REQUEST
                  if elapsed < MIN_DELAY:
                      time.sleep(MIN_DELAY - elapsed)
                  
                  url = f"https://generativelanguage.googleapis.com/v1beta/models/{MODEL_ID}:generateContent?key={API_KEY}"
                  headers = {'Content-Type': 'application/json'}
                  data = {
                      "contents": [{"parts": [{"text": prompt}]}],
                      "generationConfig": {"temperature": 0.1, "maxOutputTokens": 4096}
                  }

                  for attempt in range(1, MAX_RETRIES + 1):
                      try:
                          resp = requests.post(url, headers=headers, json=data, timeout=60)
                          LAST_REQUEST = time.time()
                          
                          if resp.status_code == 200:
                              try:
                                  return GeminiBridge.clean_response(resp.json()['candidates'][0]['content']['parts'][0]['text'])
                              except: return None
                          
                          elif resp.status_code == 429:
                              wait = 60 * attempt
                              print(f"    🛑 Rate Limit (429). Penalty Box: {wait}s...")
                              time.sleep(wait)
                              continue
                          
                          elif resp.status_code >= 500:
                              time.sleep(5); continue
                          else:
                              print(f"    ❌ API Error: {resp.status_code}")
                              return None
                      except: time.sleep(5)
                  return None

          def resolve_conflict_block(local, remote, pre, post, filename):
              # 1. CORTEX HEURISTIC
              heuristic = CortexLogic.solve(local, remote, filename)
              if heuristic: return heuristic

              # 2. GHOST BLOCK / REVERT DETECTION
              # If LOCAL is empty (deleted) and REMOTE has content -> Prefer LOCAL (Deletion)
              if not local.strip() and remote.strip():
                  print("    🛡️ [CORTEX] Detected Revert/Deletion. Keeping LOCAL (Empty).")
                  return ""

              # 3. AI GENERATION
              print(f"    🧠 [GEMINI] Analyzing Conflict...")
              
              prompt = f"""
              ROLE: Senior Linux Kernel Maintainer.
              TASK: Resolve Git Conflict in '{filename}'.
              
              CONFLICT STATE:
              - LOCAL (My Branch): High Priority. This contains custom driver logic and reverts.
              - REMOTE (Upstream): Updates.
              
              STRATEGY:
              1. **LOCAL SUPREMACY:** If values differ (e.g., versions, flags, logic), KEEP LOCAL.
              2. **NO RESURRECTION:** If LOCAL deleted a block (empty), DO NOT accept REMOTE's code unless it's a completely new unrelated function.
              3. **SYNTAX:** Ensure braces {{}} match the surrounding code in PRE/POST context.
              4. **OUTPUT:** Return ONLY the valid merged C code.
              
              CONTEXT BEFORE:
              {pre}
              
              <<<<<<< LOCAL
              {local}
              =======
              {remote}
              >>>>>>> REMOTE
              
              CONTEXT AFTER:
              {post}
              """
              
              ai_res = GeminiBridge.query(prompt)
              
              # 4. VALIDATION
              if ai_res and GeminiBridge.validate(ai_res, filename):
                  return ai_res
              
              print("    ☢️ AI Failed/Unsafe. Enforcing LOCAL.")
              return local

          def process_file(filepath):
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f: lines = f.readlines()
              except: return

              new_lines = []
              i = 0
              modified = False
              
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('<<<<<<<'):
                      start = i
                      # Context: 30 lines (Divide & Conquer Strategy)
                      pre = "".join(lines[max(0, start-30):start])
                      
                      local_blk, remote_blk = [], []
                      mode = "local"
                      i += 1
                      while i < len(lines):
                          if lines[i].startswith('======='): mode = "remote"
                          elif lines[i].startswith('>>>>>>>'): break
                          else:
                              if mode == "local": local_blk.append(lines[i])
                              else: remote_blk.append(lines[i])
                          i += 1
                      
                      post = "".join(lines[i+1:min(len(lines), i+30)])
                      
                      print(f"🔎 Analyzing: {filepath} (Line {start})")
                      
                      merged = resolve_conflict_block("".join(local_blk), "".join(remote_blk), pre, post, filepath)
                      new_lines.append(merged + "\n")
                      modified = True
                  else:
                      new_lines.append(line)
                  i += 1

              if modified:
                  with open(filepath, 'w', encoding='utf-8') as f: f.writelines(new_lines)
                  subprocess.run(["git", "add", filepath], check=True)

          if __name__ == "__main__":
              if not os.path.exists("conflicts.txt"):
                  print("No conflicts.")
                  sys.exit(0)
                  
              with open("conflicts.txt", "r") as f:
                  files = [x.strip() for x in f if x.strip()]
              
              print(f"📋 Targets: {len(files)} files.")
              for f in files:
                  if os.path.exists(f): process_file(f)
          EOF

      # ========================================================
      # PHASE 3: STRATEGIC MERGE
      # ========================================================
      - name: 🧬 Merge Sequence
        id: merge
        shell: bash
        run: |
          git remote add upstream "${{ inputs.upstream_repo }}" 2>/dev/null || true
          git fetch upstream "${{ inputs.upstream_branch }}" --no-tags
          
          TS=$(date +%s)
          TMP="nebula-$TS"
          git checkout -b "$TMP" "origin/${{ inputs.target_branch }}"
          echo "branch=$TMP" >> $GITHUB_OUTPUT

          # SUBMODULE CLEANUP (Prevents Dirty Index)
          echo "🧹 Unstaging toolchains..."
          git rm -r --cached toolchains > /dev/null 2>&1 || true

          echo ">>> Executing Merge..."
          git merge "upstream/${{ inputs.upstream_branch }}" \
            --no-commit --no-ff \
            -s ort \
            -X find-renames=50% \
            -X ignore-all-space \
            -X diff-algorithm=histogram || true
          
          git diff --name-only --diff-filter=U > conflicts.txt
          COUNT=$(wc -l < conflicts.txt)
          
          if [ "$COUNT" -gt "0" ]; then
             echo "has_conflicts=true" >> $GITHUB_OUTPUT
             echo "⚠️ Conflicts: $COUNT"
             cat conflicts.txt
          else
             echo "has_conflicts=false" >> $GITHUB_OUTPUT
             echo "✅ Clean Merge."
          fi

      # ========================================================
      # PHASE 4: EXECUTION & VERIFICATION
      # ========================================================
      - name: 🚑 Engage Nebula
        if: steps.merge.outputs.has_conflicts == 'true'
        run: |
          echo ">>> Starting Cortex Engine..."
          python3 -u cortex_engine.py
          rm cortex_engine.py conflicts.txt

      - name: 🔒 Finalize
        run: |
          # 1. MARKER SWEEP
          if grep -r "<<<<<<< HEAD" . --exclude-dir=.github; then
             echo "⚠️ Cleaning markers..."
             grep -r -l "<<<<<<< HEAD" . | xargs sed -i '/<<<<<<< HEAD/d'
             grep -r -l "=======" . | xargs sed -i '/=======/d'
             grep -r -l ">>>>>>>" . | xargs sed -i '/>>>>>>>/d'
          fi

          # 2. INDEX CHECK
          if [[ -n $(git diff --name-only --diff-filter=U) ]]; then
             echo "❌ CRITICAL: Unmerged files."
             exit 1
          fi

          # 3. COMMIT
          git add .
          git reset HEAD toolchains > /dev/null 2>&1 || true
          
          if git diff-index --quiet HEAD --; then
             echo "⚠️ No changes."
          else
             git commit -m "Nebula: Smart Merge (${{ inputs.ai_model }})"
             
             TARGET="${{ inputs.target_branch }}"
             BRANCH="${{ steps.merge.outputs.branch }}"
             
             git repack -a -d
             for i in {1..5}; do
                if git push origin "$BRANCH:refs/heads/$TARGET"; then
                   echo "✅ SUCCESS"
                   git push origin --delete "$BRANCH"
                   exit 0
                fi
                sleep 5
             done
             exit 1
          fi

      - name: 📝 Failure Report
        if: failure()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "❌ Nebula Merge Failed"
          body: "Manual intervention required on branch `${{ steps.merge.outputs.branch }}`."
          branch: ${{ steps.merge.outputs.branch }}
          base: ${{ inputs.target_branch }}
