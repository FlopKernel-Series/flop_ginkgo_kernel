name: auto merge v2

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream URL'
        required: true
        default: 'https://github.com/neophyteprjkt/kernel_xiaomi_ginkgo.git'
      upstream_branch:
        description: 'Upstream Branch'
        required: true
        default: 'main'
      target_branch:
        description: 'Target Branch'
        required: true
        default: 'floppy-new'
      
      ai_api_key:
        description: 'Gemini API Key'
        required: true
      
      ai_model:
        description: 'Model ID'
        required: true
        default: 'models/gemini-2.5-flash'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  apex_infinity:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AI_KEY: ${{ inputs.ai_api_key }}
      AI_MODEL: ${{ inputs.ai_model }}

    steps:
      # 1. PROFESSIONAL ENVIRONMENT SETUP
      - name: 🛡️ Initialize Hardened Environment
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git python3-pip python3-requests
          pip3 install requests

      - name: 📥 Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configure Git Systems
        run: |
          git config --global user.name "Apex-Infinity"
          git config --global user.email "bot@floppykernel.ai"
          git config merge.renameLimit 999999
          
          # --- BINARY PROTECTION LAYER ---
          # Strictly prevents corrupting kernel blobs
          echo "* -text" > .gitattributes
          for ext in png dtb gz ko o bpf zip jpg; do
            echo "*.$ext binary" >> .gitattributes
          done

      # 2. INJECT APEX LOGIC ENGINE (PYTHON)
      - name: 🧠 Inject Apex Infinity Core
        run: |
          cat << 'EOF' > apex_infinity.py
          import sys, os, re, requests, time, subprocess

          # --- CONFIGURATION ---
          API_KEY = os.environ.get("AI_KEY", "").strip()
          MODEL_ID = os.environ.get("AI_MODEL", "models/gemini-2.5-flash")
          
          # SAFETY SETTINGS
          MAX_RETRIES = 5
          SESSION_RESET_TIME = 3  # Seconds to wait after every success (Refills Bucket)

          def clean_response(text):
              """Sanitizes AI output to strictly code."""
              text = re.sub(r'^```[a-z]*\n', '', text, flags=re.MULTILINE)
              text = re.sub(r'\n```$', '', text, flags=re.MULTILINE)
              text = re.sub(r'<<<<<<< .*', '', text)
              text = re.sub(r'=======', '', text)
              text = re.sub(r'>>>>>>> .*', '', text)
              return text.strip()

          def validate_syntax(text, filename):
              """Validates structural integrity based on file type."""
              clean = re.sub(r'//.*', '', text)
              clean = re.sub(r'/\*.*?\*/', '', clean, flags=re.DOTALL)
              
              # Loose files (Makefiles, Text, Ignore) - Pass always
              if any(filename.endswith(x) for x in ['.txt', '.gitignore', 'Makefile', '.mk']):
                  return True

              # C/C++ - Check Brace Balance
              return clean.count('{') == clean.count('}')

          def reset_session():
              """
              The 'Reset' Logic.
              Forces a system sleep to decouple API calls and allow quota refill.
              """
              print(f"      🔄 System: Resetting AI Session & Refilling Quota ({SESSION_RESET_TIME}s)...")
              time.sleep(SESSION_RESET_TIME)

          def execute_gemini_request(prompt):
              """Executes API call with stateless retry logic."""
              url = f"https://generativelanguage.googleapis.com/v1beta/{MODEL_ID}:generateContent?key={API_KEY}"
              headers = {'Content-Type': 'application/json'}
              data = {
                  "contents": [{"parts": [{"text": prompt}]}],
                  "generationConfig": {
                      "temperature": 0.2,
                      "maxOutputTokens": 8192
                  }
              }

              for attempt in range(1, MAX_RETRIES + 1):
                  try:
                      response = requests.post(url, headers=headers, json=data, timeout=60)
                      
                      if response.status_code == 200:
                          try:
                              return clean_response(response.json()['candidates'][0]['content']['parts'][0]['text'])
                          except KeyError:
                              print(f"      ⚠️ [Attempt {attempt}] Malformed JSON response.")
                      elif response.status_code == 429:
                          wait = attempt * 10
                          print(f"      ⏳ [Attempt {attempt}] Rate Limit (429). Cooling down {wait}s...")
                          time.sleep(wait)
                          continue
                      elif response.status_code == 503:
                          wait = attempt * 5
                          print(f"      ⏳ [Attempt {attempt}] Server Busy (503). Cooling down {wait}s...")
                          time.sleep(wait)
                          continue
                      else:
                          print(f"      ❌ [Attempt {attempt}] Fatal API Error {response.status_code}")
                          return None
                  except Exception as e:
                      print(f"      ⚠️ [Attempt {attempt}] Network Exception: {e}")
                      time.sleep(5)
              
              return None

          def solve_heuristic(local, remote, filename):
              """
              Layer 1: Logic Resolver.
              Solves non-logic conflicts (lists, imports) instantly.
              """
              l_lines = [x.strip() for x in local.splitlines() if x.strip()]
              r_lines = [x.strip() for x in remote.splitlines() if x.strip()]
              
              # 1. Gitignore / Text Lists
              if filename.endswith('.gitignore') or filename.endswith('.txt'):
                  print(f"      ⚡ [LOGIC] Merging List/Ignore File")
                  return "\n".join(sorted(list(set(l_lines + r_lines))))

              # 2. Imports / Includes
              if all(x.startswith('#include') or x.startswith('import') for x in l_lines + r_lines):
                  print("      ⚡ [LOGIC] Merging Headers")
                  return "\n".join(sorted(list(set(l_lines + r_lines))))
              
              return None

          def process_block(local, remote, pre, post, filename):
              # A. Heuristic Check
              heuristic = solve_heuristic(local, remote, filename)
              if heuristic: 
                  # Even for heuristics, we briefly pause to ensure stability
                  time.sleep(0.5)
                  return heuristic

              # B. AI Check
              print(f"      🧠 [AI] Engaging {MODEL_ID}...")
              
              prompt = f"""
              ROLE: Expert Linux Kernel Engineer.
              TASK: Resolve Merge Conflict in '{filename}'.
              
              STRICT RULES:
              1. KEEP 'LOCAL' (Downstream/My Driver) Logic intact.
              2. MERGE 'REMOTE' (Upstream) only if it doesn't break LOCAL.
              3. OUTPUT PURE CODE ONLY. NO MARKDOWN.
              
              CONTEXT BEFORE:
              {pre}
              
              <<<<<<< LOCAL
              {local}
              =======
              {remote}
              >>>>>>> REMOTE
              
              CONTEXT AFTER:
              {post}
              """
              
              ai_sol = execute_gemini_request(prompt)
              
              if ai_sol:
                  if validate_syntax(ai_sol, filename):
                      return ai_sol
                  else:
                      print("      ⚠️ [AI] Syntax Check Failed (Unbalanced).")
              
              return None

          def process_file(filepath):
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f: lines = f.readlines()
              except: return

              new_lines = []
              i = 0
              modified = False
              
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('<<<<<<<'):
                      start = i
                      pre_ctx = "".join(lines[max(0, start-100):start])
                      
                      local_blk, remote_blk = [], []
                      mode = "local"
                      i += 1
                      while i < len(lines):
                          if lines[i].startswith('======='): mode = "remote"
                          elif lines[i].startswith('>>>>>>>'): break
                          else:
                              if mode == "local": local_blk.append(lines[i])
                              else: remote_blk.append(lines[i])
                          i += 1
                      
                      post_ctx = "".join(lines[i+1:min(len(lines), i+100)])
                      
                      print(f"🔎 Conflict found in: {filepath}")
                      
                      # SOLVE
                      resolved = process_block("".join(local_blk), "".join(remote_blk), pre_ctx, post_ctx, filepath)
                      
                      if resolved:
                          new_lines.append(resolved + "\n")
                          print("      ✅ Resolved Successfully.")
                          modified = True
                          # RESET QUOTA / SESSION
                          reset_session()
                      else:
                          print("      ☢️ FAILED. Enforcing LOCAL (Downstream).")
                          new_lines.append("".join(local_blk)) # NUCLEAR FALLBACK
                          modified = True
                          reset_session()
                  else:
                      new_lines.append(line)
                  i += 1

              if modified:
                  with open(filepath, 'w', encoding='utf-8') as f: f.writelines(new_lines)
                  subprocess.run(["git", "add", filepath], check=True)

          if __name__ == "__main__":
              files = sys.argv[1:]
              if not files: sys.exit(0)
              for f in files:
                  if os.path.exists(f): process_file(f)
          EOF

      # 3. MERGE (ADVANCED STRATEGY)
      - name: 🧬 Execute Strategic Merge
        id: merge
        run: |
          git remote add upstream "${{ inputs.upstream_repo }}" 2>/dev/null || true
          git fetch upstream "${{ inputs.upstream_branch }}" --no-tags
          
          TS=$(date +%s)
          TMP="apex-$TS"
          git checkout -b "$TMP" "origin/${{ inputs.target_branch }}"
          echo "branch=$TMP" >> $GITHUB_OUTPUT

          echo ">>> STARTING MERGE..."
          # We expect failure (exit 1), so we use || true to proceed to Python logic
          git merge "upstream/${{ inputs.upstream_branch }}" \
            --no-commit --no-ff \
            -s ort \
            -X find-renames=50% \
            -X ignore-all-space \
            -X diff-algorithm=histogram || true

      # 4. RUN APEX INFINITY
      - name: 🚑 Engage Apex Infinity
        run: |
          CONFLICTS=$(git diff --name-only --diff-filter=U)
          if [ ! -z "$CONFLICTS" ]; then
             echo ">>> CONFLICTS DETECTED: $CONFLICTS"
             python3 apex_infinity.py $CONFLICTS
          else
             echo ">>> MERGE CLEAN. SKIPPING AI."
          fi
          rm apex_infinity.py

      # 5. VERIFY & DEPLOY
      - name: 🔒 Verify & Push
        run: |
          # 1. MARKER CLEANUP (Safety Net)
          if grep -r "<<<<<<< HEAD" . --exclude-dir=.github; then
             echo "⚠️ Cleaning residual markers..."
             grep -r -l "<<<<<<< HEAD" . | xargs sed -i '/<<<<<<< HEAD/d'
             grep -r -l "=======" . | xargs sed -i '/=======/d'
             grep -r -l ">>>>>>>" . | xargs sed -i '/>>>>>>>/d'
          fi
          
          # 2. FINAL CHECK
          if [[ -n $(git diff --name-only --diff-filter=U) ]]; then
             echo "❌ CRITICAL: Unmerged files remain."
             exit 1
          fi

          # 3. COMMIT
          git rm -r --cached toolchains > /dev/null 2>&1 || true
          git add .
          git reset HEAD toolchains > /dev/null 2>&1 || true
          
          if git diff-index --quiet HEAD --; then
             echo "⚠️ No changes to commit."
          else
             git commit -m "Apex Infinity: Resolved with Gemini 2.5 Logic"
             
             TARGET="${{ inputs.target_branch }}"
             BRANCH="${{ steps.merge.outputs.branch }}"
             
             # 4. ROBUST PUSH
             git repack -a -d
             for i in {1..5}; do
                if git push origin "$BRANCH:refs/heads/$TARGET"; then
                   echo "✅ DEPLOY SUCCESSFUL: $TARGET"
                   git push origin --delete "$BRANCH"
                   exit 0
                fi
                echo "   🔄 Push conflict. Retrying..."
                sleep 5
             done
             exit 1
          fi

      # 6. REPORTING
      - name: 📝 Failure Report
        if: failure()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "❌ Apex Infinity Failed"
          body: "Manual Fix Required on branch `${{ steps.merge.outputs.branch }}`."
          branch: ${{ steps.merge.outputs.branch }}
          base: ${{ inputs.target_branch }}
