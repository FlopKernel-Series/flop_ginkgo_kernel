name: 🧠 Auto merge v2

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream URL'
        required: true
        default: 'https://github.com/neophyteprjkt/kernel_xiaomi_ginkgo.git'
      upstream_branch:
        description: 'Upstream Branch'
        required: true
        default: 'main'
      target_branch:
        description: 'Target Branch'
        required: true
        default: 'floppy-new'
      
      # --- AI CONFIGURATION ---
      ai_provider:
        description: 'AI Provider'
        required: true
        default: 'gemini'
        type: choice
        options:
          - gemini
          - openai
      
      ai_api_key:
        description: 'AI API Key'
        required: true
      
      ai_model:
        description: 'Primary Model'
        required: true
        default: 'gemini-1.5-pro'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  neural_merge:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AI_PROVIDER: ${{ inputs.ai_provider }}
      AI_KEY: ${{ inputs.ai_api_key }}
      AI_MODEL: ${{ inputs.ai_model }}

    steps:
      # ========================================================
      # LAYER 1: HARDENED INFRASTRUCTURE
      # ========================================================
      - name: 🛡️ Harden Environment
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git python3-pip python3-requests
          pip3 install requests

      - name: 📥 Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configure Git Neural Net
        run: |
          git config --global user.name "Apex-Omni"
          git config --global user.email "bot@floppykernel.ai"
          git config merge.renameLimit 999999
          
          # --- LAYER 2: BINARY PROTECTION ---
          # Protects compiled objects from being text-merged
          echo "* -text" > .gitattributes
          echo "*.png binary" >> .gitattributes
          echo "*.dtb binary" >> .gitattributes
          echo "*.gz binary" >> .gitattributes
          echo "*.ko binary" >> .gitattributes
          echo "*.o binary" >> .gitattributes

      # ========================================================
      # LAYER 3: THE OMNI-BRAIN INJECTION
      # ========================================================
      - name: 🧠 Inject Omni-Brain (Heuristics + AI)
        run: |
          cat << 'EOF' > omni_brain.py
          import sys, os, re, requests, subprocess, time

          # --- MATRIX CONFIGURATION ---
          PROVIDER = os.environ.get("AI_PROVIDER", "gemini")
          API_KEY = os.environ.get("AI_KEY", "").strip()
          PRIMARY_MODEL = os.environ.get("AI_MODEL", "gemini-1.5-flash")
          MAX_RETRIES = 3

          # --- UTILITIES ---
          def clean_ai_output(text):
              # Remove Markdown blocks
              text = re.sub(r'^```[a-z]*\n', '', text, flags=re.MULTILINE)
              text = re.sub(r'\n```$', '', text, flags=re.MULTILINE)
              # Remove conflict markers if AI accidentally left them
              text = re.sub(r'<<<<<<< .*', '', text)
              text = re.sub(r'=======', '', text)
              text = re.sub(r'>>>>>>> .*', '', text)
              return text.strip()

          def count_balance(text):
              """Checks for balanced braces {} to prevent syntax errors"""
              clean = re.sub(r'//.*', '', text)
              clean = re.sub(r'/\*.*?\*/', '', clean, flags=re.DOTALL)
              return clean.count('{') - clean.count('}')

          # --- LAYER 4: API COMMUNICATION ---
          def execute_api_call(model, prompt):
              if PROVIDER == "gemini":
                  url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={API_KEY}"
                  data = {
                      "contents": [{"parts": [{"text": prompt}]}],
                      "generationConfig": {"temperature": 0.2} # Low temp for precision
                  }
                  try:
                      resp = requests.post(url, json=data, timeout=60)
                      if resp.status_code == 200:
                          return clean_ai_output(resp.json()['candidates'][0]['content']['parts'][0]['text'])
                      elif resp.status_code == 404: return "MODEL_NOT_FOUND"
                      else: 
                          print(f"   ⚠️ Gemini Error: {resp.status_code}")
                          return None
                  except Exception as e: print(f"   ⚠️ Network: {e}"); return None

              elif PROVIDER == "openai":
                  url = "https://api.openai.com/v1/chat/completions"
                  headers = {"Authorization": f"Bearer {API_KEY}"}
                  data = {"model": model, "messages": [{"role": "user", "content": prompt}], "temperature": 0.2}
                  try:
                      resp = requests.post(url, json=data, headers=headers, timeout=60)
                      if resp.status_code == 200:
                          return clean_ai_output(resp.json()['choices'][0]['message']['content'])
                  except: pass
              return None

          # --- LAYER 5: ALGORITHMIC HEURISTICS (The Logic Filter) ---
          def try_heuristic_merge(local, remote):
              """
              Tries to solve conflicts WITHOUT AI for common patterns.
              Returns Merged String or None.
              """
              l_lines = [x.strip() for x in local.splitlines() if x.strip()]
              r_lines = [x.strip() for x in remote.splitlines() if x.strip()]
              
              # 5a. Import/Include Union
              # If both are just lists of #include or import, merge them uniquely
              if all(x.startswith('#include') or x.startswith('import') for x in l_lines + r_lines):
                  print("   ⚡ Heuristic: Merging Includes...")
                  unique = sorted(list(set(l_lines + r_lines)))
                  return "\n".join(unique)
              
              # 5b. Simple Makefile/Kconfig Additions
              # If both blocks look like config definitions, try to keep both
              if all('=' in x or 'config ' in x for x in l_lines + r_lines):
                  # Very basic check: if no identical keys, append
                  print("   ⚡ Heuristic: Merging Configs...")
                  return local + "\n" + remote

              return None

          # --- LAYER 6: THE AI SOLVER ---
          def solve_conflict_ai(local, remote, pre, post, filename):
              current_error = ""
              
              # Model Fallback Chain
              models_to_try = [PRIMARY_MODEL, "gemini-1.5-flash", "gemini-1.5-pro"]
              if PROVIDER == "openai": models_to_try = [PRIMARY_MODEL, "gpt-4o", "gpt-3.5-turbo"]

              for model in models_to_try:
                  for attempt in range(1, 3): # 2 attempts per model
                      print(f"   🧠 Neural Net: {model} (Attempt {attempt})...")
                      
                      prompt = f"""
                      ROLE: Senior Linux Kernel Architect.
                      TASK: Resolve Git Conflict in '{filename}'.
                      
                      STRATEGY:
                      1. Analyze 'LOCAL' (Our Driver Logic) and 'REMOTE' (Upstream Updates).
                      2. If LOCAL has custom driver features, PRESERVE THEM.
                      3. If REMOTE has core kernel fixes, INTEGRATE THEM.
                      4. Output valid C/Makefile code only. No Markdown.
                      
                      CONTEXT BEFORE:
                      {pre}
                      
                      <<<<<<< LOCAL
                      {local}
                      =======
                      {remote}
                      >>>>>>> REMOTE
                      
                      CONTEXT AFTER:
                      {post}
                      
                      ERROR_HISTORY: {current_error}
                      """
                      
                      solution = execute_api_call(model, prompt)
                      
                      if not solution or solution == "MODEL_NOT_FOUND": continue
                      
                      # Validation: Check Braces
                      if count_balance(solution) != 0 and count_balance(local) == 0:
                          current_error = "Previous solution had unbalanced braces. Fix it."
                          continue
                          
                      return solution
              
              return None

          def process_file(filepath):
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f: lines = f.readlines()
              except: return

              new_lines = []
              i = 0
              modified = False
              
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('<<<<<<<'):
                      start_marker = i
                      
                      # Context Grabbing (Expanded to 60 lines)
                      pre = "".join(lines[max(0, start_marker-60):start_marker])
                      
                      local_blk = []
                      remote_blk = []
                      mode = "local"
                      i += 1
                      while i < len(lines):
                          if lines[i].startswith('======='): mode = "remote"
                          elif lines[i].startswith('>>>>>>>'): break
                          else:
                              if mode == "local": local_blk.append(lines[i])
                              else: remote_blk.append(lines[i])
                          i += 1
                      
                      post = "".join(lines[i+1:min(len(lines), i+60)])
                      
                      local_str = "".join(local_blk)
                      remote_str = "".join(remote_blk)

                      print(f"🔎 Conflict: {filepath}")
                      
                      # STEP 1: Try Heuristic (Fast & Local)
                      merged = try_heuristic_merge(local_str, remote_str)
                      
                      # STEP 2: Try AI (Smart & Remote)
                      if not merged:
                          merged = solve_conflict_ai(local_str, remote_str, pre, post, filepath)
                      
                      # STEP 3: Nuclear Fallback (Survival Mode)
                      if merged:
                          new_lines.append(merged + "\n")
                          modified = True
                          print("   ✅ Resolved.")
                      else:
                          print("   ☢️ UNRESOLVABLE: Enforcing LOCAL (Ours).")
                          # FORCE OURS: We discard remote changes for this block
                          new_lines.append(local_str) 
                          modified = True

                  else:
                      new_lines.append(line)
                  i += 1

              if modified:
                  with open(filepath, 'w', encoding='utf-8') as f: f.writelines(new_lines)
                  subprocess.run(["git", "add", filepath], check=True)

          if __name__ == "__main__":
              files = sys.argv[1:]
              if not files: sys.exit(0)
              for f in files:
                  if os.path.exists(f): process_file(f)
          EOF

      # ========================================================
      # LAYER 7: EXECUTION STRATEGY
      # ========================================================
      - name: 🧬 Merge (Histogram Strategy)
        id: merge_step
        run: |
          git remote add upstream "${{ inputs.upstream_repo }}" 2>/dev/null || true
          git fetch upstream "${{ inputs.upstream_branch }}" --no-tags
          
          TS=$(date +%s)
          TMP="omni-merge-$TS"
          git checkout -b "$TMP" "origin/${{ inputs.target_branch }}"
          echo "tmp_branch=$TMP" >> $GITHUB_OUTPUT

          echo ">>> Executing Advanced Histogram Merge..."
          # Strategy: ORT + Histogram + Find Renames (50%) + Ignore Whitespace
          set +e
          git merge "upstream/${{ inputs.upstream_branch }}" \
            --no-commit --no-ff \
            -s ort \
            -X find-renames=50% \
            -X ignore-all-space \
            -X diff-algorithm=histogram
          
          exit 0 # Continue even if merge returns 1 (conflict)

      - name: 🚑 Engage Omni-Brain
        run: |
          CONFLICTS=$(git diff --name-only --diff-filter=U)
          if [ ! -z "$CONFLICTS" ]; then
             echo ">>> Detected Conflicts in:"
             echo "$CONFLICTS"
             python3 omni_brain.py $CONFLICTS
          else
             echo ">>> No text conflicts detected. Clean merge."
          fi
          rm omni_brain.py

      # ========================================================
      # LAYER 8: FINAL INTEGRITY CHECK & DEPLOY
      # ========================================================
      - name: 🔍 Integrity Scan & Deploy
        run: |
          # A. Final Conflict Check
          if [[ -n $(git diff --name-only --diff-filter=U) ]]; then
             echo "❌ CRITICAL: Unmerged files remain even after Nuclear Fallback."
             # This theoretically shouldn't happen due to logic, but safety first.
             exit 1
          fi
          
          # B. Marker Sweep
          if grep -r "<<<<<<< HEAD" . --exclude-dir=.github; then
             echo "⚠️ Warning: Markers found. Attempting sed cleanup..."
             # Emergency Cleanup: If markers exist, strip lines containing them
             grep -r -l "<<<<<<< HEAD" . | xargs sed -i '/<<<<<<< HEAD/d'
             grep -r -l "=======" . | xargs sed -i '/=======/d'
             grep -r -l ">>>>>>>" . | xargs sed -i '/>>>>>>>/d'
          fi

          # C. Safe Commit
          git rm -r --cached toolchains > /dev/null 2>&1 || true
          git add .
          git reset HEAD toolchains > /dev/null 2>&1 || true
          
          if git diff-index --quiet HEAD --; then
             echo "⚠️ No changes to commit."
          else
             git commit -m "Omni-Merge: Auto-Resolved with Apex Logic"
             
             TMP="${{ steps.merge_step.outputs.tmp_branch }}"
             TARGET="${{ inputs.target_branch }}"
             
             # Robust Push Loop
             git repack -a -d
             for i in {1..5}; do
                if git push origin "$TMP:refs/heads/$TARGET"; then
                   echo "✅ MISSION COMPLETE: Deployed to $TARGET"
                   git push origin --delete "$TMP"
                   exit 0
                fi
                echo "   🔄 Retrying push..."
                sleep 5
             done
             exit 1
          fi

      # ========================================================
      # LAYER 9: FAIL-SAFE REPORTING
      # ========================================================
      - name: 📝 Create Failure Report PR
        if: failure()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "❌ Omni-Merge Failed: Manual Intervention Required"
          body: |
            The Neural Network failed to resolve conflicts cleanly.
            **Branch:** `${{ steps.merge_step.outputs.tmp_branch }}`
          branch: ${{ steps.merge_step.outputs.tmp_branch }}
          base: ${{ inputs.target_branch }}
