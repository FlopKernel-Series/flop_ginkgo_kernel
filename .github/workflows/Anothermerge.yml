name: 🛡️ 

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream Repository URL'
        required: true
        default: 'https://github.com/neophyteprjkt/kernel_xiaomi_ginkgo.git'
      upstream_branch:
        description: 'Upstream Branch'
        required: true
        default: 'main'
      target_branch:
        description: 'Target Branch (Your Fork)'
        required: true
        default: 'floppy-new'
      
      ai_provider:
        description: 'AI Provider'
        required: true
        default: 'gemini'
        type: choice
        options:
          - gemini
          - openai
      
      ai_api_key:
        description: 'AI API Key (Required)'
        required: true
      
      ai_model:
        description: 'Model Name'
        required: true
        default: 'gemini-2.5-flash'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  titanium_singularity:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AI_PROVIDER: ${{ inputs.ai_provider }}
      AI_KEY: ${{ inputs.ai_api_key }}
      AI_MODEL: ${{ inputs.ai_model }}

    steps:
      # ========================================================
      # 1. HARDENED BOOTSTRAP
      # ========================================================
      - name: 🛡️ Harden Environment
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git python3-pip python3-requests
          pip3 install requests

      - name: 📥 Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configure Git
        run: |
          git config --global user.name "Apex-Titanium"
          git config --global user.email "singularity@apex-ai.org"
          git config merge.renameLimit 999999
          
          # BINARY GUARD
          echo "* -text" > .gitattributes
          for ext in png dtb gz ko o bpf zip jpg bmp iso so a; do
            echo "*.$ext binary" >> .gitattributes
          done

      # ========================================================
      # 2. INJECT SINGULARITY ENGINE (BRAIN)
      # ========================================================
      - name: 🧠 Inject Singularity Engine
        run: |
          # ESCAPED FOR YAML WRAPPER
          cat << 'EOF' > singularity.py
          #!/usr/bin/env python3
          import sys, os, re, requests, time, random, json
          from datetime import datetime

          # --- CONFIG ---
          sys.stdout.reconfigure(line_buffering=True)
          PROVIDER = os.environ.get("AI_PROVIDER", "gemini")
          API_KEY = os.environ.get("AI_KEY", "").strip()
          REQUESTED_MODEL = os.environ.get("AI_MODEL", "gemini-2.5-flash")
          
          # --- TUNING ---
          CONTEXT_LINES = 20
          MAX_RETRIES = 4          # Increased for persistence
          MAX_BLOCK_SIZE = 300     # Increased for big Makefile chunks

          REPORT = [f"# Titanium Singularity Report ({datetime.now().strftime('%H:%M:%S')})", ""]

          def log(msg):
              print(msg)
              sys.stdout.flush()
              REPORT.append(msg.strip())

          def clean_ai_output(text):
              text = re.sub(r'^__backtick__[a-z]*\n', '', text, flags=re.MULTILINE)
              text = re.sub(r'\n__backtick__$', '', text, flags=re.MULTILINE)
              text = text.replace("__backtick__", "```")
              return text.strip()

          def is_c_like(filename):
              """Determines if strict brace checking is safe."""
              return any(filename.endswith(x) for x in ['.c', '.h', '.cpp', '.hpp', '.dtsi', '.dts', '.java'])

          def count_balance(text):
              """Counts brace balance, ignoring strings and comments."""
              # CRITICAL FIX: Quadruple escaping in JS ensures correct Regex in Python
              clean = re.sub(r'"(?:\\.|[^"\\\\])*"', '', text) 
              clean = re.sub(r"'(?:\\.|[^'\\\\])*'", '', clean)
              clean = re.sub(r'//.*', '', clean)
              clean = re.sub(r'/\*.*?\*/', '', clean, flags=re.DOTALL)
              return clean.count('{') - clean.count('}')

          def execute_request(model, prompt, attempt=1):
              """Executes API call with EXPONENTIAL BACKOFF."""
              if PROVIDER == "gemini":
                  url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={API_KEY}"
                  headers = {'Content-Type': 'application/json'}
                  data = {"contents": [{"parts": [{"text": prompt}]}]}
                  
                  try:
                      resp = requests.post(url, headers=headers, json=data, timeout=60)
                      
                      if resp.status_code == 200:
                          try:
                              return clean_ai_output(resp.json()['candidates'][0]['content']['parts'][0]['text'])
                          except: return None
                      
                      elif resp.status_code == 429:
                          # EXPONENTIAL BACKOFF: 10s, 20s, 40s, 80s...
                          wait_time = (2 ** attempt) * 10 + random.uniform(1, 5)
                          log(f"    🛑 429 Rate Limit. Cooling {wait_time:.1f}s (Attempt {attempt})...")
                          time.sleep(wait_time)
                          if attempt < MAX_RETRIES:
                              return execute_request(model, prompt, attempt + 1)
                          else:
                              return "RATE_LIMIT_EXHAUSTED"
                              
                      elif resp.status_code == 404:
                          return "MODEL_NOT_FOUND"
                      else:
                          log(f"    ❌ API Error {resp.status_code}")
                          return None
                  except Exception as e:
                      log(f"    ⚠️ Network: {e}")
                      return None
              return None

          def solve_conflict(local, remote, pre, post, filename):
              # 1. Skip if huge (Token Safety)
              if len(local) + len(remote) > MAX_BLOCK_SIZE * 50: # approx chars
                  log("    ⚠️ Block too large. Skipping.")
                  return local

              # 2. Construct Prompt
              log("    🧠 Singularity AI: Analyzing...")
              
              file_type_hint = "C/C++ Code" if is_c_like(filename) else "Text/Config/Makefile"
              
              prompt = f"""
              ROLE: Senior Linux Kernel Architect.
              TASK: Merge conflict in {filename} ({file_type_hint}).
              
              CONTEXT_ABOVE:
              {pre}
              
              <<<<<<< LOCAL
              {local}
              =======
              {remote}
              >>>>>>> REMOTE
              
              CONTEXT_BELOW:
              {post}
              
              RULES:
              1. Return ONLY the valid merged content.
              2. Remove all conflict markers.
              3. NO Markdown fences. NO Explanations.
              4. If this is a Makefile/Kconfig, preserve logic from both sides intelligently.
              """

              solution = execute_request(REQUESTED_MODEL, prompt)
              
              # 3. Fallback Logic
              if not solution or solution == "RATE_LIMIT_EXHAUSTED":
                  log("    ⚠️ Primary model failed/exhausted. Trying fallback (Gemini 1.5 Flash)...")
                  solution = execute_request("gemini-1.5-flash", prompt)

              if solution and solution not in ["RATE_LIMIT_EXHAUSTED", "MODEL_NOT_FOUND"]:
                  # 4. Validation
                  if "<<<<<<<" in solution: 
                      log("    ❌ AI hallucinated markers.")
                      return None
                  
                  if is_c_like(filename):
                      if count_balance(solution) != 0 and count_balance(local) == 0:
                          log("    ❌ Brace imbalance detected.")
                          return None
                  
                  return solution
              
              log("    ☢️ Resolution failed. Keeping LOCAL.")
              return local

          def process_file(filepath):
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f: lines = f.readlines()
              except: return

              new_lines = []
              i = 0
              modified = False
              
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('<<<<<<<'):
                      start = i
                      
                      # Context: 20 Lines
                      pre_ctx = "".join(lines[max(0, start-CONTEXT_LINES):start])
                      
                      local_blk = []
                      remote_blk = []
                      mode = "local"
                      i += 1
                      while i < len(lines):
                          if lines[i].startswith('======='): mode = "remote"
                          elif lines[i].startswith('>>>>>>>'): break
                          else:
                              if mode == "local": local_blk.append(lines[i])
                              else: remote_blk.append(lines[i])
                          i += 1
                      
                      post_ctx = "".join(lines[i+1:min(len(lines), i+1+CONTEXT_LINES)])
                      
                      log(f"🔎 Conflict: {filepath} (Line {start+1})")
                      resolved = solve_conflict("".join(local_blk), "".join(remote_blk), pre_ctx, post_ctx, filepath)
                      new_lines.append(resolved if resolved else "".join(local_blk)) # Fallback to local if None
                      new_lines.append("\n") # Safety newline
                      modified = True
                  else:
                      new_lines.append(line)
                  i += 1

              if modified:
                  with open(filepath, 'w', encoding='utf-8') as f: f.writelines(new_lines)
                  subprocess.run(["git", "add", filepath], check=True)

          if __name__ == "__main__":
              # IPC: Read from file list to avoid ARG_MAX issues
              if not os.path.exists("titanium_conflicts.txt"): sys.exit(0)
              
              with open("titanium_conflicts.txt", "r") as f:
                  files = [x.strip() for x in f if x.strip()]
              
              log(f"📋 Processing {len(files)} conflicts...")
              for f in files:
                  if os.path.exists(f): 
                      process_file(f)
                      time.sleep(1) # Gentle base pacing

              with open("TITANIUM_REPORT.md", "w") as f: f.write("\n".join(REPORT))
          EOF
          
          # Final Cleanup
          sed -i 's/__backtick__/```/g' singularity.py

      # ========================================================
      # 3. MERGE (HISTOGRAM STRATEGY)
      # ========================================================
      - name: 🧬 Merge & Detect
        id: merge_step
        run: |
          git remote add upstream "${{ inputs.upstream_repo }}" 2>/dev/null || true
          git fetch upstream "${{ inputs.upstream_branch }}" --no-tags --prune

          TS=$(date +%s)
          TMP="singularity-$TS"
          git checkout -b "$TMP" "origin/${{ inputs.target_branch }}"
          echo "tmp_branch=$TMP" >> $GITHUB_OUTPUT

          echo ">>> Executing Histogram Merge..."
          git merge "upstream/${{ inputs.upstream_branch }}" \
            --no-commit --no-ff \
            -s ort \
            -X find-renames=50% \
            -X ignore-all-space \
            -X diff-algorithm=histogram || true
          
          # GENERATE CONFLICT LIST
          git diff --name-only --diff-filter=U > titanium_conflicts.txt
          COUNT=$(wc -l < titanium_conflicts.txt)
          echo "conflict_count=$COUNT" >> $GITHUB_OUTPUT

      # ========================================================
      # 4. EXECUTE SINGULARITY
      # ========================================================
      - name: 🚑 Run Singularity
        if: steps.merge_step.outputs.conflict_count > 0
        run: |
          echo "Detected ${{ steps.merge_step.outputs.conflict_count }} conflicts."
          python3 singularity.py

      # ========================================================
      # 5. VERIFY & DEPLOY
      # ========================================================
      - name: 📤 Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: singularity-report
          path: TITANIUM_REPORT.md

      - name: 🔍 Verify & Push
        run: |
          # 1. Unmerged check
          if [[ -n $(git diff --name-only --diff-filter=U) ]]; then
             echo "❌ Unmerged files remain."
             exit 1
          fi
          
          # 2. Marker check
          if grep -r "<<<<<<< HEAD" . --exclude-dir=.github; then
             echo "❌ Conflict markers found."
             exit 1
          fi

          # 3. Commit
          git rm -r --cached toolchains > /dev/null 2>&1 || true
          git add .
          git reset HEAD toolchains > /dev/null 2>&1 || true
          
          if git diff-index --quiet HEAD --; then
             echo "⚠️ No changes."
          else
             git commit -m "Singularity: Auto-Merge (${{ inputs.ai_model }})"
             
             TMP="${{ steps.merge_step.outputs.tmp_branch }}"
             TARGET="${{ inputs.target_branch }}"
             
             for i in {1..5}; do
                if git push origin "$TMP:refs/heads/$TARGET"; then
                   echo "✅ DEPLOYED TO $TARGET"
                   exit 0
                fi
                sleep 5
             done
             exit 1
          fi

      # ========================================================
      # 6. FAIL SAFE
      # ========================================================
      - name: 🚨 Emergency Protocol
        if: failure()
        run: |
          echo "⚠️ Workflow Failed. Saving WIP..."
          git rm -r --cached toolchains > /dev/null 2>&1 || true
          git add . || true
          git reset HEAD toolchains > /dev/null 2>&1 || true
          
          git commit -m "⚠️ Auto-Merge Failed: WIP" || true
          TMP="${{ steps.merge_step.outputs.tmp_branch }}"
          git push origin "$TMP" || true

      - name: 📝 Failure PR
        if: failure()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "❌ Singularity Merge Failed"
          body: |
            Manual Intervention Required.
            Branch: `${{ steps.merge_step.outputs.tmp_branch }}`
          branch: ${{ steps.merge_step.outputs.tmp_branch }}
          base: ${{ inputs.target_branch }}
          
