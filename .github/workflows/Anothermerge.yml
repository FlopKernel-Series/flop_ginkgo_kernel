name: 🌌 merge

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream Repository URL'
        required: true
        default: 'https://github.com/neophyteprjkt/kernel_xiaomi_ginkgo.git'
      upstream_branch:
        description: 'Upstream Branch'
        required: true
        default: 'main'
      target_branch:
        description: 'Target Branch'
        required: true
        default: 'floppy-new'
      
      # --- INTELLIGENCE GRID ---
      gemini_api_key:
        description: 'Gemini API Key (Required - Free)'
        required: true
      
      openai_api_key:
        description: 'OpenAI API Key (Optional - Generalist)'
        required: false
      
      deepseek_api_key:
        description: 'DeepSeek API Key (Optional - Specialist)'
        required: false
      
      ai_model:
        description: 'Gemini Model'
        required: true
        default: 'gemini-2.5-flash'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  horizon_engine:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KEY_GEMINI: ${{ inputs.gemini_api_key }}
      KEY_OPENAI: ${{ inputs.openai_api_key }}
      KEY_DEEPSEEK: ${{ inputs.deepseek_api_key }}
      MODEL_GEMINI: ${{ inputs.ai_model }}

    steps:
      # ========================================================
      # PHASE 1: HARDENING
      # ========================================================
      - name: 🛡️ System Prep
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git python3-pip python3-requests
          pip3 install requests

      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configure Git
        run: |
          git config --global user.name "Apex-Horizon"
          git config --global user.email "bot@floppykernel.ai"
          git config merge.renameLimit 999999
          
          # BINARY SHIELD
          echo "* -text" > .gitattributes
          for ext in png dtb gz ko o bpf zip jpg bmp iso so a; do
            echo "*.$ext binary" >> .gitattributes
          done

      # ========================================================
      # PHASE 2: INJECT HORIZON CORE
      # ========================================================
      - name: 🧠 Inject Horizon Engine
        run: |
          cat << 'EOF' > horizon.py
          import sys, os, re, requests, time, subprocess, json

          # 1. FORCE UNBUFFERED OUTPUT (CRITICAL)
          sys.stdout.reconfigure(line_buffering=True)

          # --- CONFIG ---
          KEYS = {
              "gemini": os.environ.get("KEY_GEMINI", "").strip(),
              "openai": os.environ.get("KEY_OPENAI", "").strip(),
              "deepseek": os.environ.get("KEY_DEEPSEEK", "").strip(),
          }
          
          GEMINI_ID = os.environ.get("MODEL_GEMINI", "gemini-2.5-flash").replace("models/", "")
          
          # --- TOKEN PHYSICS (The "Zero 429" Math) ---
          # Safe Processing Rate for Free Tier: ~100 Characters per Second refill rate.
          # If we treat it slower, we never crash.
          REFILL_RATE = 80.0 
          MIN_SLEEP = 5.0

          print(f">>> [SYSTEM] Horizon v25.0 Online.")
          print(f"    - Gemini: {GEMINI_ID}")
          print(f"    - DeepSeek: {'Active' if KEYS['deepseek'] else 'Disabled'}")
          print(f"    - OpenAI: {'Active' if KEYS['openai'] else 'Disabled'}")

          # ======================================================
          # CLASS: CORTEX (LOGIC GATE)
          # ======================================================
          class Cortex:
              @staticmethod
              def solve_heuristics(local, remote, filename):
                  l_lines = [x.strip() for x in local.splitlines() if x.strip()]
                  r_lines = [x.strip() for x in remote.splitlines() if x.strip()]

                  # 1. Version Bumps (Makefile)
                  if filename == 'Makefile':
                      if any(x.startswith(('VERSION', 'PATCHLEVEL', 'SUBLEVEL')) for x in r_lines):
                          print(f"    ⚡ [CORTEX] Version Bump -> Upstream")
                          return remote
                      if all('+=' in x for x in l_lines + r_lines):
                          print(f"    ⚡ [CORTEX] Additive Map -> Merge")
                          return local + "\n" + remote

                  # 2. Set Union (Lists, Includes)
                  if any(filename.endswith(x) for x in ['.gitignore', '.txt', '.conf', '.json']) or \
                     all(x.startswith(('#include', 'import')) for x in l_lines + r_lines):
                      print(f"    ⚡ [CORTEX] Set Union -> Merge")
                      return "\n".join(sorted(list(set(l_lines + r_lines))))

                  # 3. Kconfig / Defconfig
                  if 'Kconfig' in filename or 'defconfig' in filename:
                      # If lines are definitions, merge them
                      if all(re.match(r'^(config|bool|default|select|menu|source)', x) or '=' in x for x in l_lines + r_lines):
                          print("    ⚡ [CORTEX] Configuration -> Merge")
                          merged_set = set(l_lines + r_lines)
                          # Sort implies grouping similar configs
                          return "\n".join(sorted(list(merged_set)))

                  return None

              @staticmethod
              def validate(text, filename):
                  clean = re.sub(r'//.*', '', text)
                  clean = re.sub(r'/\*.*?\*/', '', clean, flags=re.DOTALL)
                  if any(filename.endswith(x) for x in ['.txt', '.gitignore', 'Makefile', '.mk', 'Kconfig']): return True
                  return clean.count('{') == clean.count('}')

          # ======================================================
          # CLASS: OMNI CLIENT
          # ======================================================
          class OmniClient:
              @staticmethod
              def clean(text):
                  text = re.sub(r'^```[a-z]*\n', '', text, flags=re.MULTILINE)
                  text = re.sub(r'\n```$', '', text, flags=re.MULTILINE)
                  return text.strip()

              @staticmethod
              def calculate_sleep(prompt_len):
                  # Dynamic Weight Calculation
                  wait = (prompt_len / REFILL_RATE) + MIN_SLEEP
                  wait = min(wait, 90.0) # Cap at 90s
                  return wait

              @staticmethod
              def call_deepseek(prompt):
                  if not KEYS["deepseek"]: return None
                  try:
                      resp = requests.post(
                          "https://api.deepseek.com/v1/chat/completions",
                          headers={"Authorization": f"Bearer {KEYS['deepseek']}", "Content-Type": "application/json"},
                          json={"model": "deepseek-chat", "messages": [{"role":"user", "content":prompt}], "temperature":0.1},
                          timeout=60
                      )
                      if resp.status_code == 200: return OmniClient.clean(resp.json()['choices'][0]['message']['content'])
                      elif resp.status_code == 402: 
                          print("    ❌ DeepSeek: Insufficient Funds. Disabling.")
                          KEYS["deepseek"] = "" # Disable globally
                  except: pass
                  return None

              @staticmethod
              def call_openai(prompt):
                  if not KEYS["openai"]: return None
                  try:
                      resp = requests.post(
                          "https://api.openai.com/v1/chat/completions",
                          headers={"Authorization": f"Bearer {KEYS['openai']}", "Content-Type": "application/json"},
                          json={"model": "gpt-4o-mini", "messages": [{"role":"user", "content":prompt}], "temperature":0.1},
                          timeout=60
                      )
                      if resp.status_code == 200: return OmniClient.clean(resp.json()['choices'][0]['message']['content'])
                  except: pass
                  return None

              @staticmethod
              def call_gemini(prompt):
                  # SAFETY SLEEP BEFORE REQUEST
                  sleep_duration = OmniClient.calculate_sleep(len(prompt))
                  print(f"    ⏱️ Token Cost: {len(prompt)} chars. Pacing for {sleep_duration:.1f}s...")
                  time.sleep(sleep_duration)

                  url = f"https://generativelanguage.googleapis.com/v1beta/models/{GEMINI_ID}:generateContent?key={KEYS['gemini']}"
                  
                  for i in range(2):
                      try:
                          resp = requests.post(
                              url, headers={'Content-Type': 'application/json'},
                              json={"contents": [{"parts": [{"text": prompt}]}], "generationConfig": {"temperature": 0.2, "maxOutputTokens": 4096}},
                              timeout=60
                          )
                          if resp.status_code == 200:
                              return OmniClient.clean(resp.json()['candidates'][0]['content']['parts'][0]['text'])
                          elif resp.status_code == 429:
                              print(f"    🛑 Gemini 429. Burst protection sleep (60s)...")
                              time.sleep(60)
                              continue
                      except: time.sleep(5)
                  return None

          # ======================================================
          # MANAGER
          # ======================================================
          def engine():
              if not os.path.exists("conflicts.txt"):
                  print("✅ No conflicts files found.")
                  return

              with open("conflicts.txt", "r") as f:
                  files = [x.strip() for x in f if x.strip()]

              conflict_queue = []

              # --- PHASE 1: CORTEX ANALYSIS ---
              print(f"\n🚀 PHASE 1: CORTEX ANALYSIS ({len(files)} files)")
              for filepath in files:
                  if not os.path.exists(filepath): continue
                  
                  try:
                      with open(filepath, 'r', encoding='utf-8', errors='ignore') as f: lines = f.readlines()
                  except: continue

                  new_lines = []
                  file_solved_by_cortex = True # Assume innocent until proven guilty
                  i = 0
                  
                  while i < len(lines):
                      if lines[i].startswith('<<<<<<<'):
                          start = i
                          pre_raw = "".join(lines[max(0, start-40):start])
                          local_blk, remote_blk = [], []
                          mode = "local"
                          i += 1
                          while i < len(lines):
                              if lines[i].startswith('======='): mode = "remote"
                              elif lines[i].startswith('>>>>>>>'): break
                              else:
                                  if mode == "local": local_blk.append(lines[i])
                                  else: remote_blk.append(lines[i])
                              i += 1
                          
                          post_raw = "".join(lines[i+1:min(len(lines), i+40)])
                          
                          local_str = "".join(local_blk)
                          remote_str = "".join(remote_blk)

                          # Try Cortex
                          merged = Cortex.solve_heuristics(local_str, remote_str, filepath)
                          
                          if merged is None and not local_str.strip() and remote_str.strip():
                              print(f"    👻 [CORTEX] {filepath}: Deletion Detected -> SOLVED")
                              merged = ""
                          
                          if merged is not None:
                              print(f"    ⚡ [CORTEX] {filepath}: Logical Match -> SOLVED")
                              new_lines.append(merged + "\n")
                          else:
                              # Logic failed, needs AI
                              file_solved_by_cortex = False
                              # Save data for Phase 2
                              conflict_queue.append({
                                  "file": filepath,
                                  "local": local_str,
                                  "remote": remote_str,
                                  "pre": pre_raw,
                                  "post": post_raw,
                                  "marker_start": start
                              })
                              # Add placeholder (will be replaced in Phase 2)
                              new_lines.append(f"<<<<<<< PENDING_AI_PHASE_2 >>>>>>>\n")
                      else:
                          new_lines.append(lines[i])
                      i += 1
                  
                  # If fully solved, write it now
                  if file_solved_by_cortex and new_lines:
                      with open(filepath, 'w', encoding='utf-8') as f: f.writelines(new_lines)
                      subprocess.run(["git", "add", filepath], check=True)

              # --- PHASE 2: AI SURGERY ---
              if not conflict_queue:
                  print("✅ All conflicts solved by Cortex.")
                  return

              print(f"\n🧠 PHASE 2: AI SURGERY ({len(conflict_queue)} blocks pending)")
              
              # Group by file to minimize IO
              from collections import defaultdict
              file_groups = defaultdict(list)
              for item in conflict_queue:
                  file_groups[item['file']].append(item)

              for fname, blocks in file_groups.items():
                  # Re-read the file (which currently has placeholders)
                  # In a complex scenario, we'd keep it in memory, but for safety we re-read/write
                  # Actually, simplest is to re-construct based on original read logic logic, 
                  # but since we didn't save line numbers relative to new file...
                  # BETTER STRATEGY: Process file-by-file linearly in Phase 2.
                  pass 
              
              # ACTUAL STRATEGY FOR PHASE 2:
              # We re-scan the files that failed Phase 1. 
              # Since Phase 1 didn't write them if they failed, they still have git markers.
              # Simple and Robust.
              
              seen_files = set(item['file'] for item in conflict_queue)
              
              for filepath in seen_files:
                  print(f"  📂 Processing Complex File: {filepath}")
                  try:
                      with open(filepath, 'r', encoding='utf-8', errors='ignore') as f: lines = f.readlines()
                  except: continue

                  final_lines = []
                  i = 0
                  
                  while i < len(lines):
                      if lines[i].startswith('<<<<<<<'):
                          start = i
                          pre = "".join(lines[max(0, start-40):start])[-2000:]
                          local_blk, remote_blk = [], []
                          mode = "local"
                          i += 1
                          while i < len(lines):
                              if lines[i].startswith('======='): mode = "remote"
                              elif lines[i].startswith('>>>>>>>'): break
                              else:
                                  if mode == "local": local_blk.append(lines[i])
                                  else: remote_blk.append(lines[i])
                              i += 1
                          
                          post = "".join(lines[i+1:min(len(lines), i+40)])[:2000]
                          local_str = "".join(local_blk)
                          remote_str = "".join(remote_blk)

                          # AI Prompt
                          prompt = f"""
                          ROLE: Senior Linux Kernel Dev.
                          TASK: Merge Conflict in '{filepath}'.
                          RULES:
                          1. **LOCAL SUPREMACY:** Keep my driver/logic (LOCAL) if it conflicts with upstream.
                          2. **ADAPT:** If upstream (REMOTE) assumes code that LOCAL deleted, discard REMOTE.
                          3. **SYNTAX:** Brace balance.
                          
                          CONTEXT BEFORE:
                          {pre}
                          <<<<<<< LOCAL
                          {local_str}
                          =======
                          {remote_str}
                          >>>>>>> REMOTE
                          CONTEXT AFTER:
                          {post}
                          
                          OUTPUT: VALID C CODE ONLY.
                          """

                          merged = None
                          
                          # 1. Specialist (DeepSeek)
                          if KEYS["deepseek"]: 
                              print("    🧠 Asking DeepSeek...")
                              merged = OmniClient.call_deepseek(prompt)
                          
                          # 2. Generalist (OpenAI)
                          if not merged and KEYS["openai"]:
                              print("    🧠 Asking OpenAI...")
                              merged = OmniClient.call_openai(prompt)
                          
                          # 3. Fallback (Gemini)
                          if not merged:
                              print("    🧠 Asking Gemini...")
                              merged = OmniClient.call_gemini(prompt)

                          if merged and Cortex.validate(merged, filepath):
                              print("    ✅ Resolved.")
                              final_lines.append(merged + "\n")
                          else:
                              print("    ☢️ Validation Failed. Enforcing LOCAL.")
                              final_lines.append(local_str)
                          
                      else:
                          final_lines.append(lines[i])
                      i += 1
                  
                  with open(filepath, 'w', encoding='utf-8') as f: f.writelines(final_lines)
                  subprocess.run(["git", "add", filepath], check=True)

          if __name__ == "__main__":
              engine()
          EOF

      # ========================================================
      # PHASE 3: STRATEGIC MERGE
      # ========================================================
      - name: 🧬 Execute Strategic Merge
        id: merge
        shell: bash
        run: |
          git remote add upstream "${{ inputs.upstream_repo }}" 2>/dev/null || true
          git fetch upstream "${{ inputs.upstream_branch }}" --no-tags
          
          TS=$(date +%s)
          TMP="horizon-$TS"
          git checkout -b "$TMP" "origin/${{ inputs.target_branch }}"
          echo "branch=$TMP" >> $GITHUB_OUTPUT

          echo "🧹 Sanitizing Index..."
          git rm -r --cached toolchains > /dev/null 2>&1 || true

          echo ">>> Executing Merge..."
          git merge "upstream/${{ inputs.upstream_branch }}" \
            --no-commit --no-ff \
            -s ort \
            -X find-renames=50% \
            -X ignore-all-space \
            -X diff-algorithm=histogram || true
          
          git diff --name-only --diff-filter=U > conflicts.txt
          COUNT=$(wc -l < conflicts.txt)
          
          if [ "$COUNT" -gt "0" ]; then
             echo "has_conflicts=true" >> $GITHUB_OUTPUT
             echo "⚠️ Conflicts Detected: $COUNT"
             cat conflicts.txt
          else
             echo "has_conflicts=false" >> $GITHUB_OUTPUT
             echo "✅ Clean Merge."
          fi

      # ========================================================
      # PHASE 4: EXECUTION
      # ========================================================
      - name: 🚑 Engage Horizon
        if: steps.merge.outputs.has_conflicts == 'true'
        run: |
          echo ">>> Starting Horizon Engine..."
          python3 -u horizon.py
          rm horizon.py conflicts.txt

      # ========================================================
      # PHASE 5: FINALIZE
      # ========================================================
      - name: 🔒 Commit & Push
        run: |
          if grep -r "<<<<<<< HEAD" . --exclude-dir=.github; then
             echo "⚠️ Cleaning markers..."
             grep -r -l "<<<<<<< HEAD" . | xargs sed -i '/<<<<<<< HEAD/d'
             grep -r -l "=======" . | xargs sed -i '/=======/d'
             grep -r -l ">>>>>>>" . | xargs sed -i '/>>>>>>>/d'
          fi

          if [[ -n $(git diff --name-only --diff-filter=U) ]]; then
             echo "❌ CRITICAL: Unmerged files."
             exit 1
          fi

          git add .
          git reset HEAD toolchains > /dev/null 2>&1 || true
          
          if git diff-index --quiet HEAD --; then
             echo "⚠️ No changes."
          else
             git commit -m "Horizon: Omni-Phase Merge (${{ inputs.ai_model }})"
             TARGET="${{ inputs.target_branch }}"
             BRANCH="${{ steps.merge.outputs.branch }}"

             git repack -a -d
             for i in {1..5}; do
                if git push origin "$BRANCH:refs/heads/$TARGET"; then
                   echo "✅ SUCCESS"
                   git push origin --delete "$BRANCH"
                   exit 0
                fi
                sleep 5
             done
             exit 1
          fi

      - name: 📝 Failure Report
        if: failure()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "❌ Horizon Merge Failed"
          body: "Manual intervention required on branch `${{ steps.merge.outputs.branch }}`."
          branch: ${{ steps.merge.outputs.branch }}
          base: ${{ inputs.target_branch }}
