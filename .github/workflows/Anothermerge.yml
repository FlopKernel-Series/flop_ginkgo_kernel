name: auto merge v2

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream URL'
        required: true
        default: 'https://github.com/neophyteprjkt/kernel_xiaomi_ginkgo.git'
      upstream_branch:
        description: 'Upstream Branch'
        required: true
        default: 'main'
      target_branch:
        description: 'Target Branch'
        required: true
        default: 'floppy-new'
      
      ai_api_key:
        description: 'Gemini API Key'
        required: true
      
      ai_model:
        description: 'Model ID'
        required: true
        default: 'models/gemini-2.5-flash'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  apex_sovereign:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AI_KEY: ${{ inputs.ai_api_key }}
      AI_MODEL: ${{ inputs.ai_model }}

    steps:
      # ========================================================
      # 1. PROFESSIONAL INITIALIZATION
      # ========================================================
      - name: 🛡️ Initialize System
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git python3-pip python3-requests
          pip3 install requests

      - name: 📥 Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configure Git
        run: |
          git config --global user.name "Apex-Sovereign"
          git config --global user.email "bot@floppykernel.ai"
          git config merge.renameLimit 999999
          
          # --- BINARY PROTECTION ---
          # Prevents text-merge attempts on binaries
          echo "* -text" > .gitattributes
          for ext in png dtb gz ko o bpf zip jpg bmp; do
            echo "*.$ext binary" >> .gitattributes
          done

      # ========================================================
      # 2. INJECT APEX LOGIC ENGINE (PYTHON)
      # ========================================================
      - name: 🧠 Inject Apex Brain
        run: |
          cat << 'EOF' > apex_brain.py
          import sys, os, re, requests, time, subprocess

          # --- CONFIGURATION ---
          API_KEY = os.environ.get("AI_KEY", "").strip()
          MODEL_ID = os.environ.get("AI_MODEL", "models/gemini-2.5-flash")
          
          # SAFETY & QUOTA SETTINGS
          MAX_RETRIES = 5
          RESET_DELAY = 5  # Seconds to sleep after EVERY file (Quota Reset)

          def clean_response(text):
              """Sanitizes AI output to strictly code."""
              text = re.sub(r'^```[a-z]*\n', '', text, flags=re.MULTILINE)
              text = re.sub(r'\n```$', '', text, flags=re.MULTILINE)
              text = re.sub(r'<<<<<<< .*', '', text)
              text = re.sub(r'=======', '', text)
              text = re.sub(r'>>>>>>> .*', '', text)
              return text.strip()

          def validate_syntax(text, filename):
              """Validates structural integrity."""
              clean = re.sub(r'//.*', '', text)
              clean = re.sub(r'/\*.*?\*/', '', clean, flags=re.DOTALL)
              
              # Passthrough for non-code files
              if any(filename.endswith(x) for x in ['.txt', '.gitignore', 'Makefile', '.mk']):
                  return True

              # C/C++ Brace Balance
              return clean.count('{') == clean.count('}')

          def reset_quota_session():
              """
              Forces a system sleep to reset the 'Requests Per Minute' counter.
              """
              print(f"      ⏳ System: Quota Cool-down ({RESET_DELAY}s)...")
              time.sleep(RESET_DELAY)

          def execute_gemini_request(prompt):
              """Executes API call with robust error handling."""
              url = f"https://generativelanguage.googleapis.com/v1beta/{MODEL_ID}:generateContent?key={API_KEY}"
              headers = {'Content-Type': 'application/json'}
              data = {
                  "contents": [{"parts": [{"text": prompt}]}],
                  "generationConfig": {
                      "temperature": 0.2, # Low temp for precision
                      "maxOutputTokens": 8192
                  }
              }

              for attempt in range(1, MAX_RETRIES + 1):
                  try:
                      response = requests.post(url, headers=headers, json=data, timeout=60)
                      
                      if response.status_code == 200:
                          try:
                              return clean_response(response.json()['candidates'][0]['content']['parts'][0]['text'])
                          except KeyError:
                              print(f"      ⚠️ [Attempt {attempt}] Malformed JSON.")
                      elif response.status_code == 429:
                          wait = attempt * 10
                          print(f"      🛑 [Attempt {attempt}] Rate Limit (429). Pausing {wait}s...")
                          time.sleep(wait)
                          continue
                      elif response.status_code >= 500:
                          print(f"      ⚠️ [Attempt {attempt}] Server Error {response.status_code}. Retrying...")
                          time.sleep(5)
                          continue
                      else:
                          print(f"      ❌ [Attempt {attempt}] Fatal Error {response.status_code}")
                          return None
                  except Exception as e:
                      print(f"      ⚠️ [Attempt {attempt}] Network Exception: {e}")
                      time.sleep(5)
              
              return None

          def solve_heuristic(local, remote, filename):
              """Layer 1: Instant Math Solver (Saves Tokens)."""
              l_lines = [x.strip() for x in local.splitlines() if x.strip()]
              r_lines = [x.strip() for x in remote.splitlines() if x.strip()]
              
              # 1. Gitignore / Lists
              if filename.endswith('.gitignore') or filename.endswith('.txt'):
                  print(f"      ⚡ [LOGIC] Merging List File")
                  return "\n".join(sorted(list(set(l_lines + r_lines))))

              # 2. Imports / Includes
              if all(x.startswith('#include') or x.startswith('import') for x in l_lines + r_lines):
                  print("      ⚡ [LOGIC] Merging Headers")
                  return "\n".join(sorted(list(set(l_lines + r_lines))))
              
              return None

          def process_block(local, remote, pre, post, filename):
              # A. Heuristic Check
              heuristic = solve_heuristic(local, remote, filename)
              if heuristic: return heuristic

              # B. AI Processing
              print(f"      🧠 [AI] Querying {MODEL_ID}...")
              
              prompt = f"""
              ROLE: Expert Linux Kernel Architect.
              TASK: Resolve Git Conflict in '{filename}'.
              
              RULES:
              1. PRESERVE 'LOCAL' (My Driver Changes) - This is priority.
              2. INTEGRATE 'REMOTE' (Upstream) only if it doesn't break LOCAL.
              3. OUTPUT ONLY THE MERGED CODE BLOCK. NO MARKDOWN.
              
              CONTEXT BEFORE:
              {pre}
              
              <<<<<<< LOCAL
              {local}
              =======
              {remote}
              >>>>>>> REMOTE
              
              CONTEXT AFTER:
              {post}
              """
              
              ai_sol = execute_gemini_request(prompt)
              
              if ai_sol:
                  if validate_syntax(ai_sol, filename):
                      return ai_sol
                  else:
                      print("      ⚠️ [AI] Syntax Validation Failed.")
              
              return None

          def process_file(filepath):
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f: lines = f.readlines()
              except: return

              new_lines = []
              i = 0
              modified = False
              
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('<<<<<<<'):
                      start = i
                      # Context: 100 lines for visibility
                      pre_ctx = "".join(lines[max(0, start-100):start])
                      
                      local_blk, remote_blk = [], []
                      mode = "local"
                      i += 1
                      while i < len(lines):
                          if lines[i].startswith('======='): mode = "remote"
                          elif lines[i].startswith('>>>>>>>'): break
                          else:
                              if mode == "local": local_blk.append(lines[i])
                              else: remote_blk.append(lines[i])
                          i += 1
                      
                      post_ctx = "".join(lines[i+1:min(len(lines), i+100)])
                      
                      print(f"🔎 Analyzing: {filepath} (Line {start})")
                      
                      # SOLVE
                      resolved = process_block("".join(local_blk), "".join(remote_blk), pre_ctx, post_ctx, filepath)
                      
                      if resolved:
                          new_lines.append(resolved + "\n")
                          print("      ✅ Resolved.")
                          modified = True
                      else:
                          print("      ☢️ FAILED. Enforcing LOCAL (Ours).")
                          new_lines.append("".join(local_blk)) # NUCLEAR FALLBACK
                          modified = True
                      
                      # IMPORTANT: RESET QUOTA AFTER EVERY BLOCK
                      reset_quota_session()

                  else:
                      new_lines.append(line)
                  i += 1

              if modified:
                  with open(filepath, 'w', encoding='utf-8') as f: f.writelines(new_lines)
                  subprocess.run(["git", "add", filepath], check=True)

          if __name__ == "__main__":
              # Professional: Read from file list to avoid ARG_MAX limits
              if not os.path.exists("conflicts_list.txt"):
                  print("No conflicts list found.")
                  sys.exit(0)
                  
              with open("conflicts_list.txt", "r") as f:
                  files = [line.strip() for line in f if line.strip()]
              
              if not files:
                  print("No files to process.")
                  sys.exit(0)

              print(f"📋 Processing {len(files)} conflicted files...")
              for f in files:
                  if os.path.exists(f): 
                      process_file(f)
          EOF

      # ========================================================
      # 3. MERGE & DETECT
      # ========================================================
      - name: 🧬 Merge & Isolate Conflicts
        id: merge
        run: |
          git remote add upstream "${{ inputs.upstream_repo }}" 2>/dev/null || true
          git fetch upstream "${{ inputs.upstream_branch }}" --no-tags
          
          TS=$(date +%s)
          TMP="sovereign-$TS"
          git checkout -b "$TMP" "origin/${{ inputs.target_branch }}"
          echo "branch=$TMP" >> $GITHUB_OUTPUT

          echo ">>> STARTING HISTOGRAM MERGE..."
          # The '|| true' ensures we don't crash here. We WANT to handle conflicts.
          git merge "upstream/${{ inputs.upstream_branch }}" \
            --no-commit --no-ff \
            -s ort \
            -X find-renames=50% \
            -X ignore-all-space \
            -X diff-algorithm=histogram || true
          
          # GENERATE CONFLICT LIST
          git diff --name-only --diff-filter=U > conflicts_list.txt
          
          # DEBUG INFO
          COUNT=$(wc -l < conflicts_list.txt)
          echo "found_conflicts=$COUNT" >> $GITHUB_OUTPUT
          echo ">>> Found $COUNT conflicts."
          cat conflicts_list.txt

      # ========================================================
      # 4. ENGAGE APEX SOVEREIGN (AI)
      # ========================================================
      - name: 🚑 Engage Apex Sovereign
        if: steps.merge.outputs.found_conflicts > 0
        run: |
          echo ">>> STARTING AI RESOLUTION ENGINE..."
          python3 apex_brain.py
          rm apex_brain.py conflicts_list.txt

      # ========================================================
      # 5. VERIFY & DEPLOY
      # ========================================================
      - name: 🔒 Verify & Push
        run: |
          # 1. MARKER CLEANUP (Safety Net)
          if grep -r "<<<<<<< HEAD" . --exclude-dir=.github; then
             echo "⚠️ Cleaning residual markers..."
             grep -r -l "<<<<<<< HEAD" . | xargs sed -i '/<<<<<<< HEAD/d'
             grep -r -l "=======" . | xargs sed -i '/=======/d'
             grep -r -l ">>>>>>>" . | xargs sed -i '/>>>>>>>/d'
          fi
          
          # 2. FINAL INTEGRITY CHECK
          if [[ -n $(git diff --name-only --diff-filter=U) ]]; then
             echo "❌ CRITICAL: Unmerged files remain."
             exit 1
          fi

          # 3. COMMIT
          git rm -r --cached toolchains > /dev/null 2>&1 || true
          git add .
          git reset HEAD toolchains > /dev/null 2>&1 || true
          
          if git diff-index --quiet HEAD --; then
             echo "⚠️ No changes to commit."
          else
             git commit -m "Apex Sovereign: Auto-Merge (${{ inputs.ai_model }})"
             
             TARGET="${{ inputs.target_branch }}"
             BRANCH="${{ steps.merge.outputs.branch }}"
             
             # 4. ROBUST PUSH LOOP
             git repack -a -d
             for i in {1..5}; do
                if git push origin "$BRANCH:refs/heads/$TARGET"; then
                   echo "✅ DEPLOY SUCCESSFUL: $TARGET"
                   git push origin --delete "$BRANCH"
                   exit 0
                fi
                echo "   🔄 Push conflict. Retrying..."
                sleep 5
             done
             exit 1
          fi

      # ========================================================
      # 6. FAIL-SAFE REPORTING
      # ========================================================
      - name: 📝 Failure Report
        if: failure()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "❌ Apex Sovereign Failed"
          body: "Manual intervention required on branch `${{ steps.merge.outputs.branch }}`."
          branch: ${{ steps.merge.outputs.branch }}
          base: ${{ inputs.target_branch }}
