name: 🏛️ auto merge v2

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream URL'
        required: true
        default: 'https://github.com/neophyteprjkt/kernel_xiaomi_ginkgo.git'
      upstream_branch:
        description: 'Upstream Branch'
        required: true
        default: 'main'
      target_branch:
        description: 'Target Branch'
        required: true
        default: 'floppy-new'
      
      ai_api_key:
        description: 'Gemini API Key'
        required: true
      
      ai_model:
        description: 'Model ID'
        required: true
        default: 'models/gemini-2.5-flash'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  architect_engine:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AI_KEY: ${{ inputs.ai_api_key }}
      AI_MODEL: ${{ inputs.ai_model }}

    steps:
      # ========================================================
      # PHASE 1: INFRASTRUCTURE & HARDENING
      # ========================================================
      - name: 🛡️ Harden Environment
        run: |
          # Professional cleanup to ensure IO stability
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git python3-pip python3-requests
          pip3 install requests

      - name: 📥 Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configure Git Systems
        run: |
          git config --global user.name "Apex-Architect"
          git config --global user.email "bot@floppykernel.ai"
          git config merge.renameLimit 999999
          
          # --- BINARY ASSET PROTECTION SYSTEM ---
          # Strictly forces Git to treat these as binaries, preventing text-merge corruption
          echo "* -text" > .gitattributes
          for ext in png dtb gz ko o bpf zip jpg bmp iso; do
            echo "*.$ext binary" >> .gitattributes
          done

      # ========================================================
      # PHASE 2: INJECT THE INTELLIGENCE CORE
      # ========================================================
      - name: 🧠 Inject Apex Brain
        run: |
          cat << 'EOF' > apex_brain.py
          import sys, os, re, requests, time, subprocess

          # --- CONFIGURATION ---
          API_KEY = os.environ.get("AI_KEY", "").strip()
          # FIX: Robustly handle model name formats (removes 'models/' if present)
          RAW_MODEL = os.environ.get("AI_MODEL", "gemini-2.5-flash")
          MODEL_ID = RAW_MODEL.replace("models/", "")
          
          # TUNING
          MAX_RETRIES = 5
          # 10s delay ensures we NEVER hit rate limits, even on free tier
          SESSION_RESET_TIME = 10 

          def clean_response(text):
              """Sanitizes AI output to ensure clean code injection."""
              text = re.sub(r'^```[a-z]*\n', '', text, flags=re.MULTILINE)
              text = re.sub(r'\n```$', '', text, flags=re.MULTILINE)
              # Remove hallucinated Git markers
              text = re.sub(r'<<<<<<< .*', '', text)
              text = re.sub(r'=======', '', text)
              text = re.sub(r'>>>>>>> .*', '', text)
              return text.strip()

          def validate_syntax(text, filename):
              """
              Professional Syntax Validator.
              Returns True if code looks structurally sound.
              """
              clean = re.sub(r'//.*', '', text)
              clean = re.sub(r'/\*.*?\*/', '', clean, flags=re.DOTALL)
              
              # Pass-through for non-code files
              if any(filename.endswith(x) for x in ['.txt', '.gitignore', 'Makefile', '.mk', '.bp', '.json', '.conf']):
                  return True
              
              # C/C++ Brace Balance Check
              if clean.count('{') != clean.count('}'):
                  return False
              
              return True

          def reset_session():
              """Forces a session cool-down to reset API quota buckets."""
              print(f"      ⏳ System: Session Cool-down ({SESSION_RESET_TIME}s)...")
              time.sleep(SESSION_RESET_TIME)

          def execute_gemini_request(prompt):
              """Robust API Caller with Exponential Backoff."""
              url = f"https://generativelanguage.googleapis.com/v1beta/models/{MODEL_ID}:generateContent?key={API_KEY}"
              headers = {'Content-Type': 'application/json'}
              data = {
                  "contents": [{"parts": [{"text": prompt}]}],
                  "generationConfig": {
                      "temperature": 0.2, # Precise Logic
                      "maxOutputTokens": 8192
                  }
              }

              for attempt in range(1, MAX_RETRIES + 1):
                  try:
                      response = requests.post(url, headers=headers, json=data, timeout=60)
                      
                      if response.status_code == 200:
                          try:
                              return clean_response(response.json()['candidates'][0]['content']['parts'][0]['text'])
                          except KeyError:
                              print("      ⚠️ Error: Unexpected JSON structure.")
                      elif response.status_code == 429:
                          wait = attempt * 10
                          print(f"      🛑 Rate Limit (429). Pausing {wait}s...")
                          time.sleep(wait)
                          continue
                      elif response.status_code == 404:
                          print(f"      ❌ Critical: Model '{MODEL_ID}' not found.")
                          return None
                      else:
                          print(f"      ❌ API Error: {response.status_code}")
                          time.sleep(5)
                  except Exception as e:
                      print(f"      ⚠️ Network Error: {e}")
                      time.sleep(5)
              return None

          def solve_heuristic(local, remote, filename):
              """
              Layer 1: Deterministic Solver.
              Solves lists and imports mathematically, bypassing AI.
              """
              l_lines = [x.strip() for x in local.splitlines() if x.strip()]
              r_lines = [x.strip() for x in remote.splitlines() if x.strip()]
              
              # 1. Configuration/List Files
              if any(filename.endswith(x) for x in ['.gitignore', '.txt', '.conf']):
                  print(f"      ⚡ [LOGIC] Merging List File")
                  return "\n".join(sorted(list(set(l_lines + r_lines))))
              
              # 2. C/C++ Includes
              if all(x.startswith('#include') or x.startswith('import') for x in l_lines + r_lines):
                  print("      ⚡ [LOGIC] Merging Headers")
                  return "\n".join(sorted(list(set(l_lines + r_lines))))
              
              # 3. Kconfig/Makefile (Additions only)
              if all(('obj-' in x or 'CONFIG_' in x) for x in l_lines + r_lines):
                  print("      ⚡ [LOGIC] Merging Configs")
                  return local + "\n" + remote

              return None

          def process_block(local, remote, pre, post, filename):
              # A. Try Heuristic (Fast & Accurate)
              heuristic = solve_heuristic(local, remote, filename)
              if heuristic: return heuristic

              # B. Try AI (Smart)
              print(f"      🧠 [AI] Engaging {MODEL_ID}...")
              
              prompt = f"""
              ROLE: Senior Linux Kernel Architect.
              TASK: Resolve Git Conflict in '{filename}'.
              
              DIRECTIVES:
              1. PRESERVE 'LOCAL' (Our Driver Logic) - High Priority.
              2. MERGE 'REMOTE' (Upstream) - Only if it improves core logic without breaking Local.
              3. FORMAT: Output raw C code only. No Markdown. No comments.
              
              CONTEXT BEFORE:
              {pre}
              <<<<<<< LOCAL
              {local}
              =======
              {remote}
              >>>>>>> REMOTE
              CONTEXT AFTER:
              {post}
              """
              
              ai_sol = execute_gemini_request(prompt)
              
              # C. Validation Layer
              if ai_sol:
                  if validate_syntax(ai_sol, filename):
                      return ai_sol
                  else:
                      print("      ⚠️ [AI] Validation Failed: Syntax Corruption Detected.")
              
              return None

          def process_file(filepath):
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f: lines = f.readlines()
              except: return

              new_lines = []
              i = 0
              modified = False
              
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('<<<<<<<'):
                      start = i
                      # Context Expansion: 100 lines for maximum AI visibility
                      pre_ctx = "".join(lines[max(0, start-100):start])
                      
                      local_blk, remote_blk = [], []
                      mode = "local"
                      i += 1
                      while i < len(lines):
                          if lines[i].startswith('======='): mode = "remote"
                          elif lines[i].startswith('>>>>>>>'): break
                          else:
                              if mode == "local": local_blk.append(lines[i])
                              else: remote_blk.append(lines[i])
                          i += 1
                      
                      post_ctx = "".join(lines[i+1:min(len(lines), i+100)])
                      
                      print(f"🔎 Analyzing: {filepath} (Line {start})")
                      resolved = process_block("".join(local_blk), "".join(remote_blk), pre_ctx, post_ctx, filepath)
                      
                      if resolved:
                          new_lines.append(resolved + "\n")
                          print("      ✅ Resolved.")
                      else:
                          # THE NUCLEAR OPTION:
                          # If Logic & AI fail, we enforce LOCAL to keep drivers working.
                          print("      ☢️ FAILED. Enforcing LOCAL (Ours).")
                          new_lines.append("".join(local_blk))
                      
                      modified = True
                      reset_session()
                  else:
                      new_lines.append(line)
                  i += 1

              if modified:
                  with open(filepath, 'w', encoding='utf-8') as f: f.writelines(new_lines)
                  subprocess.run(["git", "add", filepath], check=True)

          if __name__ == "__main__":
              # Professional IPC: Read from file, not arguments
              if not os.path.exists("conflicts.txt"):
                  print("No conflicts file found.")
                  sys.exit(0)
                  
              with open("conflicts.txt", "r") as f:
                  files = [x.strip() for x in f if x.strip()]
              
              if not files:
                  print("No conflicts detected.")
                  sys.exit(0)

              print(f"📋 Processing {len(files)} conflicted files...")
              for f in files:
                  if os.path.exists(f): process_file(f)
          EOF

      # ========================================================
      # PHASE 3: THE "CLEAN-ROOM" MERGE STRATEGY
      # ========================================================
      - name: 🧬 Execute Strategic Merge
        id: merge
        shell: bash
        run: |
          # 1. Remote Setup
          git remote add upstream "${{ inputs.upstream_repo }}" 2>/dev/null || true
          git fetch upstream "${{ inputs.upstream_branch }}" --no-tags
          
          # 2. Branch Prep
          TS=$(date +%s)
          TMP="apex-arch-$TS"
          git checkout -b "$TMP" "origin/${{ inputs.target_branch }}"
          echo "branch=$TMP" >> $GITHUB_OUTPUT

          # 3. CRITICAL: CLEAN THE INDEX
          # This prevents "Entry 'toolchains' not uptodate" errors
          echo "🧹 Sanitizing Git Index (Removing submodules)..."
          git rm -r --cached toolchains > /dev/null 2>&1 || true
          
          # 4. The Merge
          echo ">>> STARTING HISTOGRAM MERGE..."
          # We use '|| true' because we EXPECT conflicts and want to solve them
          git merge "upstream/${{ inputs.upstream_branch }}" \
            --no-commit --no-ff \
            -s ort \
            -X find-renames=50% \
            -X ignore-all-space \
            -X diff-algorithm=histogram || true
          
          # 5. Detection
          git diff --name-only --diff-filter=U > conflicts.txt
          COUNT=$(wc -l < conflicts.txt)
          
          if [ "$COUNT" -gt "0" ]; then
             echo "found_conflicts=true" >> $GITHUB_OUTPUT
             echo "⚠️ Conflicts Detected: $COUNT"
             cat conflicts.txt
          else
             echo "found_conflicts=false" >> $GITHUB_OUTPUT
             echo "✅ Clean Merge - No intervention needed."
          fi

      # ========================================================
      # PHASE 4: ENGAGE INTELLIGENCE
      # ========================================================
      - name: 🚑 Engage Apex Architect
        if: steps.merge.outputs.found_conflicts == 'true'
        run: |
          echo ">>> STARTING AI ENGINE..."
          python3 apex_brain.py
          rm apex_brain.py conflicts.txt

      # ========================================================
      # PHASE 5: VERIFICATION & DEPLOYMENT
      # ========================================================
      - name: 🔒 Integrity Check & Deploy
        run: |
          # 1. MARKER SWEEP
          # Safety Net: Delete lines with markers if AI failed to remove them
          if grep -r "<<<<<<< HEAD" . --exclude-dir=.github; then
             echo "⚠️ Residual markers found. Forcing cleanup..."
             grep -r -l "<<<<<<< HEAD" . | xargs sed -i '/<<<<<<< HEAD/d'
             grep -r -l "=======" . | xargs sed -i '/=======/d'
             grep -r -l ">>>>>>>" . | xargs sed -i '/>>>>>>>/d'
          fi
          
          # 2. INDEX VERIFICATION
          if [[ -n $(git diff --name-only --diff-filter=U) ]]; then
             echo "❌ CRITICAL: Unmerged files remain in index."
             exit 1
          fi

          # 3. RESTORE & COMMIT
          git add .
          
          # CRITICAL: Restore toolchains to the index state (Reset)
          # This ensures we don't commit the 'deletion' of the toolchains
          git reset HEAD toolchains > /dev/null 2>&1 || true
          
          if git diff-index --quiet HEAD --; then
             echo "⚠️ No changes to commit."
          else
             git commit -m "Apex Architect: Auto-Merge (${{ inputs.ai_model }})"
             
             TARGET="${{ inputs.target_branch }}"
             BRANCH="${{ steps.merge.outputs.branch }}"
             
             # 4. ROBUST PUSH
             git repack -a -d
             for i in {1..5}; do
                if git push origin "$BRANCH:refs/heads/$TARGET"; then
                   echo "✅ DEPLOY SUCCESSFUL: $TARGET"
                   git push origin --delete "$BRANCH"
                   exit 0
                fi
                echo "   🔄 Push conflict. Retrying in 5s..."
                sleep 5
             done
             exit 1
          fi

      # ========================================================
      # PHASE 6: REPORTING
      # ========================================================
      - name: 📝 Failure Report
        if: failure()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "❌ Apex Architect Failed"
          body: "The workflow encountered an unrecoverable state on branch `${{ steps.merge.outputs.branch }}`."
          branch: ${{ steps.merge.outputs.branch }}
          base: ${{ inputs.target_branch }}
