name: auto merge v2

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream Repository URL'
        required: true
        default: 'https://github.com/neophyteprjkt/kernel_xiaomi_ginkgo.git'
      upstream_branch:
        description: 'Upstream Branch'
        required: true
        default: 'main'
      target_branch:
        description: 'Target Branch'
        required: true
        default: 'floppy-new'
      
      # --- APEX CORE CONFIGURATION ---
      ai_api_key:
        description: 'Gemini API Key (Required)'
        required: true
      
      ai_model:
        description: 'Primary Logic Core'
        required: true
        default: 'models/gemini-2.5-flash'
        type: choice
        options:
          - models/gemini-2.5-flash
          - models/gemini-2.5-pro
          - models/gemini-2.0-flash-thinking-exp-01-21
          - models/gemini-2.0-pro-exp-02-05

permissions:
  contents: write
  pull-requests: write

jobs:
  apex_engine:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AI_KEY: ${{ inputs.ai_api_key }}
      AI_MODEL: ${{ inputs.ai_model }}

    steps:
      # 1. INITIALIZATION & HARDENING
      - name: 🛡️ Initialize Environment
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git python3-pip python3-requests
          pip3 install requests

      - name: 📥 Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configure Git Systems
        run: |
          git config --global user.name "Apex-Bot"
          git config --global user.email "bot@floppykernel.ai"
          git config merge.renameLimit 999999
          
          # --- BINARY ASSET PROTECTION ---
          # Strictly forbids Git from attempting text merges on binary files
          echo "* -text" > .gitattributes
          echo "*.png binary" >> .gitattributes
          echo "*.dtb binary" >> .gitattributes
          echo "*.gz binary" >> .gitattributes
          echo "*.ko binary" >> .gitattributes
          echo "*.o binary" >> .gitattributes
          echo "*.bpf binary" >> .gitattributes
          echo "*.zip binary" >> .gitattributes

      # 2. INJECT APEX LOGIC CORE (PYTHON)
      - name: 🧠 Inject Apex Logic Core
        run: |
          cat << 'EOF' > apex_core.py
          import sys, os, re, requests, time

          # --- CONFIGURATION ---
          API_KEY = os.environ.get("AI_KEY", "").strip()
          PRIMARY_MODEL = os.environ.get("AI_MODEL", "models/gemini-2.5-flash")
          
          # The "Thinking" model is used if the Primary fails validation
          FALLBACK_MODEL = "models/gemini-2.0-flash-thinking-exp-01-21"
          
          COOLDOWN = 2  # Seconds between calls to prevent 429
          MAX_RETRIES = 3

          def clean_response(text):
              """Sanitizes AI output to strictly code."""
              # Remove Markdown blocks
              text = re.sub(r'^```[a-z]*\n', '', text, flags=re.MULTILINE)
              text = re.sub(r'\n```$', '', text, flags=re.MULTILINE)
              # Remove accidental markers
              text = re.sub(r'<<<<<<< .*', '', text)
              text = re.sub(r'=======', '', text)
              text = re.sub(r'>>>>>>> .*', '', text)
              return text.strip()

          def validate_syntax(text, filename):
              """
              Professional Syntax Validator.
              Adapts logic based on file extension.
              """
              # 1. Strip comments for accurate counting
              clean = re.sub(r'//.*', '', text)
              clean = re.sub(r'/\*.*?\*/', '', clean, flags=re.DOTALL)
              
              # 2. DTS/DTSI Files (Device Tree)
              if filename.endswith('.dts') or filename.endswith('.dtsi'):
                  # Device trees use nodes { }; but also properties < >;
                  # We check brace balance strictly.
                  return clean.count('{') == clean.count('}')
              
              # 3. C/C++/Java/Makefiles
              # Check Braces {} and Parentheses ()
              braces = clean.count('{') == clean.count('}')
              parens = clean.count('(') == clean.count(')')
              return braces and parens

          def execute_gemini_request(model, prompt):
              """Executes API call with exponential backoff for Rate Limits."""
              url = f"https://generativelanguage.googleapis.com/v1beta/{model}:generateContent?key={API_KEY}"
              headers = {'Content-Type': 'application/json'}
              data = {
                  "contents": [{"parts": [{"text": prompt}]}],
                  "generationConfig": {
                      "temperature": 0.1, 
                      "maxOutputTokens": 8192
                  }
              }

              for attempt in range(1, MAX_RETRIES + 1):
                  try:
                      time.sleep(COOLDOWN * attempt) # Anti-429 Backoff
                      response = requests.post(url, headers=headers, json=data, timeout=60)
                      
                      if response.status_code == 200:
                          try:
                              return clean_response(response.json()['candidates'][0]['content']['parts'][0]['text'])
                          except KeyError:
                              return None
                      elif response.status_code == 429:
                          print(f"      [APEX] Rate Limit (429). Pausing {attempt * 5}s...")
                          time.sleep(attempt * 5)
                      else:
                          print(f"      [APEX] API Error {response.status_code}: {response.text[:100]}")
                          return None
                  except Exception as e:
                      print(f"      [APEX] Network Exception: {e}")
              return None

          def solve_heuristic(local, remote):
              """Layer 1: Deterministic Algorithmic Solver."""
              l_lines = [x.strip() for x in local.splitlines() if x.strip()]
              r_lines = [x.strip() for x in remote.splitlines() if x.strip()]

              # 1. Header/Import Union
              if all(x.startswith('#include') or x.startswith('import') for x in l_lines + r_lines):
                  print("      [LOGIC] Optimizing Headers (Union Strategy)")
                  return "\n".join(sorted(list(set(l_lines + r_lines))))

              # 2. Makefile/Kconfig Additions
              if all(('obj-' in x or 'CONFIG_' in x) for x in l_lines + r_lines):
                  print("      [LOGIC] Optimizing Configs (Append Strategy)")
                  return local + "\n" + remote
              
              return None

          def resolve_conflict(local, remote, pre, post, filename):
              # A. Attempt Heuristic Resolution
              heuristic = solve_heuristic(local, remote)
              if heuristic: return heuristic

              # B. Construct Professional Prompt
              prompt = f"""
              SYSTEM_ROLE: Expert Linux Kernel Architect.
              TASK: Resolve Git Merge Conflict in '{filename}'.
              
              STRICT_GUIDELINES:
              1. OUTPUT: Return ONLY the valid C/Code block. No Markdown. No comments.
              2. STRATEGY: PRESERVE 'LOCAL' (Downstream/Driver) logic. INTEGRATE 'REMOTE' (Upstream) fixes only if safe.
              3. SYNTAX: Ensure perfectly balanced braces {{}} and parentheses ().
              4. CONTEXT: Analyze the surrounding code provided below.
              
              --- CONTEXT BEFORE ---
              {pre}
              
              --- CONFLICT: LOCAL (KEEP THIS LOGIC) ---
              {local}
              
              --- CONFLICT: REMOTE (INCOMING CHANGES) ---
              {remote}
              
              --- CONTEXT AFTER ---
              {post}
              """

              # C. Attempt 1: Primary Model (Gemini 2.5 Flash)
              print(f"      [AI] Requesting Resolution via {PRIMARY_MODEL}...")
              solution = execute_gemini_request(PRIMARY_MODEL, prompt)
              
              if solution and validate_syntax(solution, filename):
                  return solution
              else:
                  print("      [AI] Primary model failed validation. Engaging Reasoning Engine...")

              # D. Attempt 2: Thinking Model (Gemini 2.0 Flash Thinking)
              # Used for complex logic where 2.5 Flash might have missed a brace
              solution = execute_gemini_request(FALLBACK_MODEL, prompt)
              if solution and validate_syntax(solution, filename):
                  print("      [AI] Reasoning Engine resolved the conflict.")
                  return solution
              
              return None

          def process_file(filepath):
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f: lines = f.readlines()
              except: return

              new_lines = []
              i = 0
              modified = False
              
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('<<<<<<<'):
                      start = i
                      
                      # Expanded Context Window (100 lines) for structural awareness
                      pre_ctx = "".join(lines[max(0, start-100):start])
                      
                      local_blk, remote_blk = [], []
                      mode = "local"
                      i += 1
                      while i < len(lines):
                          if lines[i].startswith('======='): mode = "remote"
                          elif lines[i].startswith('>>>>>>>'): break
                          else:
                              if mode == "local": local_blk.append(lines[i])
                              else: remote_blk.append(lines[i])
                          i += 1
                      
                      post_ctx = "".join(lines[i+1:min(len(lines), i+100)])
                      
                      local_str = "".join(local_blk)
                      remote_str = "".join(remote_blk)

                      print(f"🔎 Processing Conflict: {filepath} (Line {start})")
                      
                      # EXECUTE RESOLUTION
                      resolved = resolve_conflict(local_str, remote_str, pre_ctx, post_ctx, filepath)
                      
                      if resolved:
                          new_lines.append(resolved + "\n")
                          print("      ✅ Conflict Resolved.")
                          modified = True
                      else:
                          # NUCLEAR FALLBACK: Force Local
                          print("      ☢️ RESOLUTION FAILED. Enforcing LOCAL (Downstream) Preservation.")
                          new_lines.append(local_str)
                          modified = True
                  else:
                      new_lines.append(line)
                  i += 1

              if modified:
                  with open(filepath, 'w', encoding='utf-8') as f: f.writelines(new_lines)
                  subprocess.run(["git", "add", filepath], check=True)

          if __name__ == "__main__":
              files = sys.argv[1:]
              if not files: sys.exit(0)
              for f in files:
                  if os.path.exists(f): process_file(f)
          EOF

      # 3. MERGE EXECUTION
      - name: 🧬 Execute Strategic Merge
        id: merge
        run: |
          git remote add upstream "${{ inputs.upstream_repo }}" 2>/dev/null || true
          git fetch upstream "${{ inputs.upstream_branch }}" --no-tags
          
          TS=$(date +%s)
          TMP_BRANCH="apex-merge-$TS"
          git checkout -b "$TMP_BRANCH" "origin/${{ inputs.target_branch }}"
          echo "branch=$TMP_BRANCH" >> $GITHUB_OUTPUT

          echo ">>> STARTING MERGE OPERATION"
          # Allow merge to fail (exit code 1) so we can handle conflicts
          git merge "upstream/${{ inputs.upstream_branch }}" \
            --no-commit --no-ff \
            -s ort \
            -X find-renames=50% \
            -X ignore-all-space \
            -X diff-algorithm=histogram || true

      # 4. ENGAGE APEX CORE
      - name: 🚑 Engage Apex Logic Core
        run: |
          CONFLICTS=$(git diff --name-only --diff-filter=U)
          if [ ! -z "$CONFLICTS" ]; then
             echo ">>> CONFLICTS DETECTED. INITIALIZING PYTHON CORE."
             python3 apex_core.py $CONFLICTS
          else
             echo ">>> MERGE CLEAN. SKIPPING LOGIC CORE."
          fi
          rm apex_core.py

      # 5. VERIFICATION & DEPLOYMENT
      - name: 🔒 Verification & Deployment
        run: |
          # A. MARKER SWEEP (Safety Net)
          # If AI failed to remove markers but returned code, we force delete markers
          if grep -r "<<<<<<< HEAD" . --exclude-dir=.github; then
             echo "⚠️ WARNING: Residual markers detected. Performing sanitation..."
             grep -r -l "<<<<<<< HEAD" . | xargs sed -i '/<<<<<<< HEAD/d'
             grep -r -l "=======" . | xargs sed -i '/=======/d'
             grep -r -l ">>>>>>>" . | xargs sed -i '/>>>>>>>/d'
          fi
          
          # B. INDEX CHECK
          if [[ -n $(git diff --name-only --diff-filter=U) ]]; then
             echo "❌ CRITICAL FAILURE: Unmerged files persist."
             exit 1
          fi

          # C. COMMIT PREPARATION
          # Isolate toolchains/submodules
          git rm -r --cached toolchains > /dev/null 2>&1 || true
          git add .
          git reset HEAD toolchains > /dev/null 2>&1 || true
          
          if git diff-index --quiet HEAD --; then
             echo "⚠️ No changes to commit."
          else
             git commit -m "Apex: Professional Auto-Merge (Gemini 2.5)"
             
             TARGET="${{ inputs.target_branch }}"
             TEMP="${{ steps.merge.outputs.branch }}"
             
             # D. PUSH SEQUENCE
             git repack -a -d
             for i in {1..5}; do
                if git push origin "$TEMP:refs/heads/$TARGET"; then
                   echo "✅ DEPLOYMENT SUCCESSFUL: $TARGET"
                   git push origin --delete "$TEMP"
                   exit 0
                fi
                echo "   🔄 Push collision. Retrying in 5s..."
                sleep 5
             done
             exit 1
          fi

      # 6. REPORTING
      - name: 📝 Failure Report
        if: failure()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "❌ Apex Merge Failed"
          body: "The Apex workflow encountered an unresolvable state on branch `${{ steps.merge.outputs.branch }}`."
          branch: ${{ steps.merge.outputs.branch }}
          base: ${{ inputs.target_branch }}
