name: "🚀 HORIZON - AI-Powered Kernel Merge Engine"
on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: "Upstream Repository URL (HTTPS)"
        required: true
        default: "https://github.com/neophyteprjkt/kernel_xiaomi_ginkgo.git"
      upstream_branch:
        description: "Upstream Branch"
        required: true
        default: "main"
      target_branch:
        description: "Target Branch"
        required: true
        default: "floppy-new"
      
      # AI Configuration
      gemini_api_key:
        description: "Gemini 2.5 Flash API Key"
        required: true
      
      merge_strategy:
        description: "Conflict Resolution Strategy"
        required: true
        default: "hybrid"
        type: choice
        options:
          - "hybrid"
          - "conservative"
          - "aggressive"
      
      # Safety Controls
      max_conflicts:
        description: "Max Conflicts Before Abort (0=unlimited)"
        required: true
        default: "100"
        type: number
      
      enable_validation:
        description: "Enable Pre/Post Validation"
        required: true
        default: true
        type: boolean

# ========================================================================
# GLOBAL CONFIGURATION
# ========================================================================
env:
  # Gemini Configuration
  GEMINI_MODEL: "gemini-2.5-flash-exp"
  GEMINI_RPM: 15
  GEMINI_TPM: 1000000
  GEMINI_TIMEOUT: 120
  
  # Git Configuration
  GIT_DEPTH: 100
  GIT_STRATEGY: "ort"
  
  # System Paths
  WORKSPACE: "${{ github.workspace }}"
  TEMP_DIR: "/tmp/horizon_${{ github.run_id }}"
  LOG_FILE: "${{ github.workspace }}/horizon.log"
  
  # Processing Limits
  MAX_FILE_SIZE_MB: 5
  MAX_CONCURRENT_AI: 2

# ========================================================================
# JOBS
# ========================================================================
jobs:
  # ---------------------------------------------------------------------
  # JOB 1: PREFLIGHT VALIDATION
  # ---------------------------------------------------------------------
  preflight:
    name: "🔍 Preflight Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      passed: ${{ steps.validate.outputs.passed }}
      message: ${{ steps.validate.outputs.message }}
      conflict_estimate: ${{ steps.analyze.outputs.conflict_count }}
      merge_viable: ${{ steps.analyze.outputs.viable }}
      merge_branch: ${{ steps.prepare.outputs.merge_branch }}
    
    steps:
      - name: "🛡️ Initialize Environment"
        run: |
          echo "=== INITIALIZING ENVIRONMENT ==="
          mkdir -p "$TEMP_DIR"
          chmod 700 "$TEMP_DIR"
          
          # Install system dependencies
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git curl jq python3 python3-pip python3-venv \
            build-essential ca-certificates
          
          echo "✓ Environment initialized"
      
      - name: "📥 Checkout Target Branch"
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: ${{ env.GIT_DEPTH }}
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: "✅ Validate Inputs & API Keys"
        id: validate
        run: |
          echo "=== VALIDATING INPUTS ==="
          
          # Validate required inputs
          if [[ -z "${{ inputs.gemini_api_key }}" ]]; then
            echo "❌ ERROR: Gemini API Key is required"
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "message=Missing Gemini API Key" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          if [[ -z "${{ inputs.upstream_repo }}" ]]; then
            echo "❌ ERROR: Upstream repository is required"
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "message=Missing upstream repository" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # Test Gemini API connectivity
          echo "Testing Gemini API connectivity..."
          TEST_RESPONSE=$(curl -s -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/$GEMINI_MODEL:generateContent?key=${{ inputs.gemini_api_key }}" \
            -H "Content-Type: application/json" \
            -d '{"contents":[{"parts":[{"text":"test"}]}],"generationConfig":{"maxOutputTokens":1}}' \
            --max-time 10 2>&1 || echo "CONNECTION_ERROR")
          
          if echo "$TEST_RESPONSE" | grep -q "API_KEY_INVALID\|quota\|429"; then
            echo "❌ ERROR: Gemini API key is invalid or quota exceeded"
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "message=Gemini API key validation failed" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "✅ All inputs validated successfully"
          echo "passed=true" >> $GITHUB_OUTPUT
          echo "message=Validation successful" >> $GITHUB_OUTPUT
      
      - name: "⚙️ Configure Git"
        run: |
          echo "=== CONFIGURING GIT ==="
          
          git config --global user.name "Horizon Merge Bot"
          git config --global user.email "horizon-bot@users.noreply.github.com"
          git config --global core.preloadIndex true
          git config --global core.fscache true
          git config --global merge.renameLimit 999999
          git config --global diff.renameLimit 999999
          
          # Configure binary handling
          cat > .git/info/attributes << 'EOF'
          *.ko binary
          *.dtb binary
          *.dtbo binary
          *.img binary
          *.bin binary
          *.o binary
          *.a binary
          *.so binary
          *.gz binary
          *.zip binary
          EOF
          
          echo "✓ Git configuration complete"
      
      - name: "🔀 Prepare Merge Branch"
        id: prepare
        run: |
          echo "=== PREPARING MERGE BRANCH ==="
          
          # Create unique merge branch name
          MERGE_BRANCH="horizon/merge-${{ github.run_id }}-$(date +%s)"
          echo "Creating merge branch: $MERGE_BRANCH"
          
          git checkout -b "$MERGE_BRANCH"
          echo "merge_branch=$MERGE_BRANCH" >> $GITHUB_OUTPUT
          
          # Add upstream remote
          git remote add upstream "${{ inputs.upstream_repo }}" 2>/dev/null || \
            git remote set-url upstream "${{ inputs.upstream_repo }}"
          
          echo "✓ Merge branch prepared"
      
      - name: "📊 Analyze Merge Complexity"
        id: analyze
        if: ${{ inputs.enable_validation == true }}
        run: |
          echo "=== ANALYZING MERGE COMPLEXITY ==="
          
          # Fetch upstream changes
          echo "Fetching upstream branch: ${{ inputs.upstream_branch }}"
          git fetch upstream "${{ inputs.upstream_branch }}" --depth=50 --no-tags --progress
          
          # Create analysis branch
          ANALYSIS_BRANCH="analysis-${{ github.run_id }}"
          git checkout -b "$ANALYSIS_BRANCH" 2>/dev/null || git checkout "$ANALYSIS_BRANCH"
          
          # Perform dry-run merge
          echo "Performing dry-run merge..."
          set +e
          MERGE_OUTPUT=$(git merge --no-commit --no-ff \
            "upstream/${{ inputs.upstream_branch }}" \
            --strategy=$GIT_STRATEGY \
            --strategy-option="find-renames=50%" \
            --dry-run 2>&1)
          MERGE_STATUS=$?
          set -e
          
          # Count conflict indicators
          CONFLICT_COUNT=$(echo "$MERGE_OUTPUT" | grep -c -E "CONFLICT|conflict" || true)
          
          # Check file changes
          FILE_CHANGES=$(echo "$MERGE_OUTPUT" | grep -c "^Auto-merging\|^CONFLICT" || true)
          
          # Clean up analysis branch
          git merge --abort 2>/dev/null || true
          git checkout "$MERGE_BRANCH" 2>/dev/null || true
          git branch -D "$ANALYSIS_BRANCH" 2>/dev/null || true
          
          echo "Estimated conflicts: $CONFLICT_COUNT"
          echo "Files affected: $FILE_CHANGES"
          
          # Determine viability
          VIABLE="true"
          if [[ "${{ inputs.max_conflicts }}" != "0" ]] && [[ $CONFLICT_COUNT -gt ${{ inputs.max_conflicts }} ]]; then
            echo "❌ Too many estimated conflicts ($CONFLICT_COUNT > ${{ inputs.max_conflicts }})"
            VIABLE="false"
          fi
          
          if [[ $CONFLICT_COUNT -gt 500 ]]; then
            echo "⚠️ Warning: High conflict count ($CONFLICT_COUNT), merge may take longer"
          fi
          
          echo "conflict_count=$CONFLICT_COUNT" >> $GITHUB_OUTPUT
          echo "viable=$VIABLE" >> $GITHUB_OUTPUT
          
          echo "✓ Analysis complete"
      
      - name: "📋 Generate Preflight Report"
        run: |
          echo "=== PREFLIGHT REPORT ==="
          echo "Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "Workflow: ${{ github.workflow }} #${{ github.run_number }}"
          echo "Run ID: ${{ github.run_id }}"
          echo ""
          echo "VALIDATION: ${{ steps.validate.outputs.passed }}"
          echo "MESSAGE: ${{ steps.validate.outputs.message }}"
          echo "ESTIMATED CONFLICTS: ${{ steps.analyze.outputs.conflict_count }}"
          echo "MERGE VIABLE: ${{ steps.analyze.outputs.viable }}"
          echo "MERGE BRANCH: ${{ steps.prepare.outputs.merge_branch }}"
          echo ""
          echo "CONFIGURATION:"
          echo "- Upstream: ${{ inputs.upstream_repo }} @ ${{ inputs.upstream_branch }}"
          echo "- Target: ${{ inputs.target_branch }}"
          echo "- Strategy: ${{ inputs.merge_strategy }}"
          echo "- Max Conflicts: ${{ inputs.max_conflicts }}"
          echo "- Validation: ${{ inputs.enable_validation }}"
  
  # ---------------------------------------------------------------------
  # JOB 2: MERGE EXECUTION
  # ---------------------------------------------------------------------
  merge:
    name: "⚡ Execute Merge"
    runs-on: ubuntu-latest
    needs: preflight
    if: ${{ needs.preflight.outputs.passed == 'true' && needs.preflight.outputs.merge_viable == 'true' }}
    timeout-minutes: 45
    
    outputs:
      merge_branch: ${{ needs.preflight.outputs.merge_branch }}
      conflict_count: ${{ steps.detect_conflicts.outputs.conflict_count }}
      success: ${{ steps.finalize.outputs.success }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    
    steps:
      - name: "📥 Checkout Merge Branch"
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.merge_branch }}
          fetch-depth: ${{ env.GIT_DEPTH }}
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: "🔧 Setup Python Environment"
        run: |
          echo "=== SETTING UP PYTHON ENVIRONMENT ==="
          
          # Create and activate virtual environment
          python3 -m venv /opt/horizon-venv
          source /opt/horizon-venv/bin/activate
          
          # Install dependencies
          pip install --upgrade pip wheel setuptools
          pip install \
            google-generativeai==0.3.2 \
            requests==2.31.0 \
            backoff==2.2.1 \
            tqdm==4.66.1 \
            colorama==0.4.6
          
          echo "✓ Python environment ready"
      
      - name: "🔄 Fetch Upstream Changes"
        run: |
          echo "=== FETCHING UPSTREAM CHANGES ==="
          
          # Add upstream remote if not exists
          git remote add upstream "${{ inputs.upstream_repo }}" 2>/dev/null || true
          
          # Fetch with parallel optimization
          git fetch upstream "${{ inputs.upstream_branch }}" \
            --depth=${{ env.GIT_DEPTH }} \
            --no-tags \
            --progress \
            -j4
          
          echo "✓ Upstream changes fetched"
      
      - name: "🤝 Execute Actual Merge"
        id: execute_merge
        run: |
          echo "=== EXECUTING MERGE ==="
          
          # Perform the merge
          set +e
          MERGE_OUTPUT=$(git merge \
            "upstream/${{ inputs.upstream_branch }}" \
            --no-commit --no-ff \
            --strategy=${{ env.GIT_STRATEGY }} \
            --strategy-option="find-renames=50%" \
            --strategy-option="diff-algorithm=histogram" \
            --stat 2>&1)
          MERGE_STATUS=$?
          set -e
          
          echo "$MERGE_OUTPUT"
          
          if [[ $MERGE_STATUS -eq 0 ]]; then
            echo "✅ Clean merge - no conflicts"
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
          else
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
          fi
      
      - name: "🔍 Detect Conflicts"
        id: detect_conflicts
        if: ${{ steps.execute_merge.outputs.has_conflicts == 'true' }}
        run: |
          echo "=== DETECTING CONFLICTS ==="
          
          # Get list of conflicted files
          CONFLICT_FILES=$(git diff --name-only --diff-filter=U)
          CONFLICT_COUNT=$(echo "$CONFLICT_FILES" | wc -l | tr -d ' ')
          
          if [[ -n "$CONFLICT_FILES" ]]; then
            echo "$CONFLICT_FILES" > "$TEMP_DIR/conflict_files.txt"
            echo "Found $CONFLICT_COUNT conflicted files"
            
            # Analyze file types
            echo "=== CONFLICT ANALYSIS ==="
            for file in $CONFLICT_FILES; do
              if [[ -f "$file" ]]; then
                EXT="${file##*.}"
                echo "$EXT" >> "$TEMP_DIR/file_extensions.txt"
              fi
            done
            
            sort "$TEMP_DIR/file_extensions.txt" | uniq -c | sort -rn > "$TEMP_DIR/extension_stats.txt"
            echo "File type distribution:"
            cat "$TEMP_DIR/extension_stats.txt"
          fi
          
          echo "conflict_count=$CONFLICT_COUNT" >> $GITHUB_OUTPUT
          echo "✓ Conflict detection complete"
      
      - name: "🧠 Deploy AI Resolution Engine"
        if: ${{ steps.detect_conflicts.outputs.conflict_count > 0 }}
        run: |
          echo "=== DEPLOYING AI ENGINE ==="
          
          source /opt/horizon-venv/bin/activate
          
          cat > /opt/horizon_ai.py << 'EOF'
          #!/usr/bin/env python3
          """
          HORIZON AI RESOLUTION ENGINE v2.0
          Optimized for Gemini 2.5 Flash with 15 RPM rate limiting
          """
          
          import os, sys, re, time, json, asyncio, requests, backoff
          from typing import List, Dict, Optional, Tuple
          from dataclasses import dataclass, field
          from pathlib import Path
          from datetime import datetime, timedelta
          import hashlib
          from tqdm import tqdm
          
          # Configuration
          CONFIG = {
              "GEMINI_API_KEY": os.environ["GEMINI_API_KEY"],
              "GEMINI_MODEL": os.environ.get("GEMINI_MODEL", "gemini-2.5-flash-exp"),
              "GEMINI_RPM": int(os.environ.get("GEMINI_RPM", 15)),
              "GEMINI_TPM": int(os.environ.get("GEMINI_TPM", 1000000)),
              "REQUEST_TIMEOUT": int(os.environ.get("GEMINI_TIMEOUT", 120)),
              "MAX_CONCURRENT": int(os.environ.get("MAX_CONCURRENT_AI", 2)),
              "STRATEGY": os.environ.get("MERGE_STRATEGY", "hybrid"),
              "TEMPERATURE": 0.1,
              "MAX_RETRIES": 3,
              "BASE_DELAY": 5.0
          }
          
          # Logging setup
          def log(message: str, level: str = "INFO"):
              timestamp = datetime.now().isoformat()[:19]
              print(f"[{timestamp}] [{level}] {message}", file=sys.stderr, flush=True)
          
          @dataclass
          class Conflict:
              file_path: str
              local_content: str
              remote_content: str
              context_before: str
              context_after: str
              line_start: int
              conflict_hash: str = field(init=False)
              
              def __post_init__(self):
                  content_hash = f"{self.local_content}{self.remote_content}"
                  self.conflict_hash = hashlib.sha256(content_hash.encode()).hexdigest()[:16]
              
              @property
              def estimated_tokens(self) -> int:
                  total_chars = len(self.local_content) + len(self.remote_content)
                  return max(100, total_chars // 4)
          
          class RateLimiter:
              """Token bucket rate limiter for Gemini's 15 RPM limit"""
              
              def __init__(self, rpm: int = 15, tpm: int = 1000000):
                  self.rpm = rpm
                  self.tpm = tpm
                  self.request_times: List[float] = []
                  self.token_usage = 0
                  self.window_start = time.time()
                  self.lock = asyncio.Lock()
              
              async def acquire(self, estimated_tokens: int = 1000) -> float:
                  async with self.lock:
                      now = time.time()
                      
                      # Clean old requests (older than 60 seconds)
                      cutoff = now - 60.0
                      self.request_times = [t for t in self.request_times if t > cutoff]
                      
                      # Reset token usage if window expired
                      if now - self.window_start > 60.0:
                          self.token_usage = 0
                          self.window_start = now
                      
                      # Check RPM limit
                      if len(self.request_times) >= self.rpm:
                          oldest = self.request_times[0]
                          wait_time = max(0.0, 60.0 - (now - oldest) + 0.1)
                          if wait_time > 0:
                              log(f"RPM limit reached, waiting {wait_time:.1f}s")
                              await asyncio.sleep(wait_time)
                              return await self.acquire(estimated_tokens)
                      
                      # Check TPM limit
                      if self.token_usage + estimated_tokens > self.tpm:
                          available = self.tpm - self.token_usage
                          wait_time = 60.0 * (estimated_tokens - available) / self.tpm
                          wait_time = max(wait_time, 0.1)
                          log(f"TPM limit reached, waiting {wait_time:.1f}s")
                          await asyncio.sleep(wait_time)
                          return await self.acquire(estimated_tokens)
                      
                      # Record this request
                      self.request_times.append(now)
                      self.token_usage += estimated_tokens
                      
                      return 0.0
          
          class GeminiClient:
              """Gemini 2.5 Flash API client with rate limiting"""
              
              def __init__(self):
                  self.rate_limiter = RateLimiter(
                      rpm=CONFIG["GEMINI_RPM"],
                      tpm=CONFIG["GEMINI_TPM"]
                  )
                  self.base_url = "https://generativelanguage.googleapis.com/v1beta"
                  
              @backoff.on_exception(
                  backoff.expo,
                  (requests.exceptions.RequestException, requests.exceptions.Timeout),
                  max_tries=CONFIG["MAX_RETRIES"],
                  max_time=300,
                  jitter=backoff.full_jitter
              )
              async def resolve_conflict(self, conflict: Conflict) -> Tuple[Optional[str], Dict]:
                  """Resolve a single conflict using Gemini"""
                  
                  start_time = time.time()
                  
                  # Apply rate limiting
                  wait_time = await self.rate_limiter.acquire(conflict.estimated_tokens)
                  if wait_time > 1.0:
                      log(f"Rate limited for {wait_time:.1f}s before request")
                  
                  # Build prompt based on file type and strategy
                  prompt = self._build_prompt(conflict)
                  
                  # Prepare request
                  url = f"{self.base_url}/models/{CONFIG['GEMINI_MODEL']}:generateContent"
                  params = {"key": CONFIG["GEMINI_API_KEY"]}
                  
                  payload = {
                      "contents": [{"parts": [{"text": prompt}]}],
                      "generationConfig": {
                          "temperature": CONFIG["TEMPERATURE"],
                          "maxOutputTokens": 8192,
                          "topP": 0.95,
                          "topK": 40
                      },
                      "safetySettings": [
                          {"category": "HARM_CATEGORY_HARASSMENT", "threshold": "BLOCK_NONE"},
                          {"category": "HARM_CATEGORY_HATE_SPEECH", "threshold": "BLOCK_NONE"},
                          {"category": "HARM_CATEGORY_SEXUALLY_EXPLICIT", "threshold": "BLOCK_NONE"},
                          {"category": "HARM_CATEGORY_DANGEROUS_CONTENT", "threshold": "BLOCK_NONE"}
                      ]
                  }
                  
                  try:
                      response = requests.post(
                          url,
                          params=params,
                          json=payload,
                          timeout=CONFIG["REQUEST_TIMEOUT"]
                      )
                      
                      if response.status_code == 429:
                          log("Gemini 429 - Rate limited, increasing delay")
                          raise requests.exceptions.RequestException("Rate limited")
                      
                      response.raise_for_status()
                      data = response.json()
                      
                      if "candidates" in data and data["candidates"]:
                          text = data["candidates"][0]["content"]["parts"][0]["text"]
                          # Clean response
                          text = re.sub(r'^```[a-z]*\n', '', text, flags=re.MULTILINE)
                          text = re.sub(r'\n```$', '', text)
                          text = text.strip()
                          
                          # Validate basic syntax
                          if self._validate_solution(text, conflict.file_path):
                              processing_time = time.time() - start_time
                              stats = {
                                  "tokens_estimated": conflict.estimated_tokens,
                                  "processing_time": processing_time,
                                  "wait_time": wait_time,
                                  "success": True
                              }
                              return text, stats
                      
                  except Exception as e:
                      log(f"Gemini API error: {str(e)}", "ERROR")
                      
                  # Fallback: return local content
                  processing_time = time.time() - start_time
                  stats = {
                      "tokens_estimated": conflict.estimated_tokens,
                      "processing_time": processing_time,
                      "wait_time": wait_time,
                      "success": False,
                      "fallback": "local"
                  }
                  return conflict.local_content, stats
              
              def _build_prompt(self, conflict: Conflict) -> str:
                  """Build optimized prompt for conflict resolution"""
                  
                  file_ext = Path(conflict.file_path).suffix.lower()
                  strategy_instructions = {
                      "hybrid": """
                      RESOLUTION STRATEGY: HYBRID (Recommended)
                      - For driver files (.c/.h): Prefer LOCAL changes (custom implementations)
                      - For core kernel files: Prefer REMOTE changes (security/stability)
                      - For config files: Merge compatible changes
                      - For Device Tree files: Merge unique nodes
                      """,
                      "conservative": """
                      RESOLUTION STRATEGY: CONSERVATIVE
                      - STRONGLY PREFER LOCAL CHANGES
                      - Only use REMOTE changes if they don't conflict with local logic
                      - Preserve all custom drivers and optimizations
                      """,
                      "aggressive": """
                      RESOLUTION STRATEGY: AGGRESSIVE
                      - STRONGLY PREFER REMOTE CHANGES
                      - Update to upstream standards and conventions
                      - Only keep LOCAL changes if absolutely necessary
                      """
                  }
                  
                  kernel_rules = """
                  LINUX KERNEL RULES (MUST FOLLOW):
                  1. Maintain kernel coding style (tabs, 80-char limit)
                  2. Preserve SPDX license identifiers
                  3. Keep kernel-doc comments intact
                  4. Maintain backward compatibility for drivers
                  5. Ensure brace/parenthesis balance
                  6. No leftover merge markers
                  """
                  
                  prompt = f"""You are a senior Linux kernel maintainer. Resolve this merge conflict.

          FILE: {conflict.file_path}
          EXTENSION: {file_ext}

          {strategy_instructions.get(CONFIG["STRATEGY"], strategy_instructions["hybrid"])}

          {kernel_rules}

          CONTEXT BEFORE (last 3-5 lines):
          ```
          {conflict.context_before[-300:]}
          ```

          === CONFLICT ===
          <<<<<<< LOCAL (our changes)
          {conflict.local_content}
          =======
          {conflict.remote_content}
          >>>>>>> REMOTE (upstream changes)

          CONTEXT AFTER (next 3-5 lines):
          ```
          {conflict.context_after[:300]}
          ```

          OUTPUT REQUIREMENTS:
          1. Output ONLY the resolved code block
          2. NO explanations, markdown, or extra text
          3. Ensure syntactical correctness
          4. Maintain proper indentation (tabs for C files)
          5. Preserve preprocessor directives (#ifdef, #endif)

          RESOLVED CODE:"""
                  
                  return prompt
              
              def _validate_solution(self, text: str, file_path: str) -> bool:
                  """Basic validation of resolved code"""
                  
                  # Check for leftover conflict markers
                  if any(marker in text for marker in ["<<<<<<<", "=======", ">>>>>>>"]):
                      return False
                  
                  # Check for balanced braces in C files
                  if file_path.endswith(('.c', '.h', '.dts', '.dtsi')):
                      if text.count('{') != text.count('}'):
                          return False
                      if text.count('(') != text.count(')'):
                          return False
                  
                  # Check for obvious syntax errors
                  lines = text.split('\n')
                  for i, line in enumerate(lines):
                      line = line.strip()
                      if line and not line.startswith(('#', '//', '/*', '*')):
                          if line.endswith('{') and i > 0:
                              prev = lines[i-1].strip()
                              if not any(prev.endswith(c) for c in ['{', '}', ';', ':', ')']):
                                  return False
                  
                  return True
          
          def parse_conflict_file(file_path: str) -> List[Conflict]:
              """Parse all conflicts from a file"""
              
              try:
                  with open(file_path, 'r', encoding='utf-8', errors='ignore') as f:
                      content = f.read()
              except Exception as e:
                  log(f"Failed to read {file_path}: {e}", "ERROR")
                  return []
              
              if '<<<<<<<' not in content:
                  return []
              
              conflicts = []
              lines = content.splitlines(keepends=True)
              i = 0
              
              while i < len(lines):
                  if lines[i].startswith('<<<<<<<'):
                      start = i
                      local_lines = []
                      remote_lines = []
                      
                      # Skip marker line
                      i += 1
                      
                      # Read local content
                      while i < len(lines) and not lines[i].startswith('======='):
                          local_lines.append(lines[i])
                          i += 1
                      
                      if i >= len(lines):
                          break
                      
                      # Skip separator
                      i += 1
                      
                      # Read remote content
                      while i < len(lines) and not lines[i].startswith('>>>>>>>'):
                          remote_lines.append(lines[i])
                          i += 1
                      
                      if i >= len(lines):
                          break
                      
                      end = i
                      
                      # Get context
                      context_before = ''.join(lines[max(0, start-3):start])
                      context_after = ''.join(lines[end+1:min(len(lines), end+4)])
                      
                      conflict = Conflict(
                          file_path=file_path,
                          local_content=''.join(local_lines).rstrip(),
                          remote_content=''.join(remote_lines).rstrip(),
                          context_before=context_before,
                          context_after=context_after,
                          line_start=start
                      )
                      
                      conflicts.append(conflict)
                  
                  i += 1
              
              return conflicts
          
          async def process_conflict_file(file_path: str, client: GeminiClient, semaphore: asyncio.Semaphore) -> Dict:
              """Process all conflicts in a single file"""
              
              async with semaphore:
                  conflicts = parse_conflict_file(file_path)
                  if not conflicts:
                      return {"file": file_path, "conflicts": 0, "resolved": 0, "failed": 0}
                  
                  log(f"Processing {file_path}: {len(conflicts)} conflicts")
                  
                  # Read original file
                  with open(file_path, 'r', encoding='utf-8', errors='ignore') as f:
                      original = f.read()
                  
                  result = original
                  resolved = 0
                  failed = 0
                  offset = 0
                  
                  for conflict in conflicts:
                      # Replace conflict block with placeholder
                      conflict_pattern = re.escape('<<<<<<<') + r'.*?' + re.escape('>>>>>>>')
                      match = re.search(conflict_pattern, result[offset:], re.DOTALL)
                      
                      if match:
                          start, end = match.span()
                          resolution, stats = await client.resolve_conflict(conflict)
                          
                          if stats.get("success", False):
                              resolved += 1
                          else:
                              failed += 1
                          
                          # Replace conflict with resolution
                          result = result[:offset+start] + resolution + result[offset+end:]
                          offset = offset + start + len(resolution)
                  
                  # Write resolved file
                  if resolved > 0 or failed > 0:
                      try:
                          with open(file_path, 'w', encoding='utf-8') as f:
                              f.write(result)
                          
                          # Stage the file for git
                          import subprocess
                          subprocess.run(['git', 'add', file_path], 
                                       capture_output=True, check=False)
                          
                      except Exception as e:
                          log(f"Failed to write {file_path}: {e}", "ERROR")
                          failed = len(conflicts)
                  
                  return {
                      "file": file_path,
                      "conflicts": len(conflicts),
                      "resolved": resolved,
                      "failed": failed
                  }
          
          async def main():
              """Main execution function"""
              
              log("=== HORIZON AI ENGINE STARTING ===")
              log(f"Strategy: {CONFIG['STRATEGY']}")
              log(f"Gemini RPM: {CONFIG['GEMINI_RPM']}")
              log(f"Max Concurrent: {CONFIG['MAX_CONCURRENT']}")
              
              # Load conflict files
              conflict_files_path = os.environ.get("CONFLICT_FILES", "")
              if not os.path.exists(conflict_files_path):
                  log("No conflict files found", "WARNING")
                  return
              
              with open(conflict_files_path, 'r') as f:
                  conflict_files = [line.strip() for line in f if line.strip()]
              
              if not conflict_files:
                  log("No conflicts to resolve", "INFO")
                  return
              
              log(f"Found {len(conflict_files)} files with conflicts")
              
              # Initialize client and semaphore for concurrency control
              client = GeminiClient()
              semaphore = asyncio.Semaphore(CONFIG["MAX_CONCURRENT"])
              
              # Process files
              results = []
              total_conflicts = 0
              total_resolved = 0
              total_failed = 0
              
              with tqdm(total=len(conflict_files), desc="Resolving conflicts") as pbar:
                  tasks = []
                  for file_path in conflict_files:
                      if os.path.exists(file_path):
                          task = process_conflict_file(file_path, client, semaphore)
                          tasks.append(task)
                      else:
                          log(f"File not found: {file_path}", "WARNING")
                  
                  # Process files concurrently
                  for task in asyncio.as_completed(tasks):
                      result = await task
                      results.append(result)
                      
                      total_conflicts += result["conflicts"]
                      total_resolved += result["resolved"]
                      total_failed += result["failed"]
                      
                      pbar.update(1)
                      if result["conflicts"] > 0:
                          pbar.set_postfix({
                              "res": result["resolved"],
                              "fail": result["failed"]
                          })
              
              # Generate report
              report = {
                  "timestamp": datetime.now().isoformat(),
                  "total_files": len(conflict_files),
                  "total_conflicts": total_conflicts,
                  "total_resolved": total_resolved,
                  "total_failed": total_failed,
                  "success_rate": (total_resolved / total_conflicts * 100) if total_conflicts > 0 else 0,
                  "file_results": results
              }
              
              # Save report
              report_path = os.environ.get("REPORT_PATH", "./horizon_report.json")
              with open(report_path, 'w') as f:
                  json.dump(report, f, indent=2)
              
              # Print summary
              log("=== RESOLUTION SUMMARY ===")
              log(f"Files processed: {len(conflict_files)}")
              log(f"Total conflicts: {total_conflicts}")
              log(f"Successfully resolved: {total_resolved}")
              log(f"Failed: {total_failed}")
              log(f"Success rate: {report['success_rate']:.1f}%")
              
              if total_failed > 0:
                  log(f"⚠️ {total_failed} conflicts could not be resolved", "WARNING")
              
              # Set exit code
              if total_failed > total_conflicts * 0.5:  # More than 50% failed
                  sys.exit(1)
          
          if __name__ == "__main__":
              asyncio.run(main())
          EOF
          
          chmod +x /opt/horizon_ai.py
          echo "✓ AI Engine deployed"
      
      - name: "🤖 Execute AI Resolution"
        if: ${{ steps.detect_conflicts.outputs.conflict_count > 0 }}
        env:
          GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
          GEMINI_MODEL: ${{ env.GEMINI_MODEL }}
          GEMINI_RPM: ${{ env.GEMINI_RPM }}
          GEMINI_TPM: ${{ env.GEMINI_TPM }}
          GEMINI_TIMEOUT: ${{ env.GEMINI_TIMEOUT }}
          MERGE_STRATEGY: ${{ inputs.merge_strategy }}
          MAX_CONCURRENT_AI: ${{ env.MAX_CONCURRENT_AI }}
          CONFLICT_FILES: "${{ env.TEMP_DIR }}/conflict_files.txt"
          REPORT_PATH: "${{ env.TEMP_DIR }}/ai_report.json"
        run: |
          echo "=== EXECUTING AI RESOLUTION ==="
          
          source /opt/horizon-venv/bin/activate
          
          # Run AI engine
          python3 /opt/horizon_ai.py
          
          # Display report
          if [[ -f "$TEMP_DIR/ai_report.json" ]]; then
            echo "=== AI RESOLUTION REPORT ==="
            cat "$TEMP_DIR/ai_report.json" | jq '.'
          fi
          
          echo "✓ AI resolution complete"
      
      - name: "🧹 Cleanup Conflict Markers"
        run: |
          echo "=== CLEANUP ==="
          
          # Check for any leftover conflict markers
          LEFT_OVER=$(grep -r -l "<<<<<<<" . \
            --include="*.c" --include="*.h" \
            --include="*.dts" --include="*.dtsi" \
            --include="Makefile" --include="*.mk" \
            --include="Kconfig" 2>/dev/null | wc -l || echo "0")
          
          if [[ $LEFT_OVER -gt 0 ]]; then
            echo "⚠️ Found $LEFT_OVER files with leftover markers"
            
            # Safe cleanup - only remove complete conflict blocks
            find . -type f \( -name "*.c" -o -name "*.h" \) \
              -exec grep -l "<<<<<<<" {} \; 2>/dev/null | \
              while read file; do
                sed -i '/<<<<<<< .*/,/>>>>>>> .*/d' "$file" 2>/dev/null || true
              done
            
            echo "✓ Cleanup completed"
          fi
      
      - name: "✅ Final Validation"
        id: finalize
        run: |
          echo "=== FINAL VALIDATION ==="
          
          # Check for unmerged files
          UNMERGED=$(git diff --name-only --diff-filter=U 2>/dev/null | wc -l || echo "0")
          if [[ $UNMERGED -gt 0 ]]; then
            echo "❌ ERROR: $UNMERGED files still have unmerged changes"
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # Check git status
          echo "Git status:"
          git status --short | head -20
          
          # Check if there are changes to commit
          if git diff --cached --quiet && git diff --quiet; then
            echo "⚠️ No changes to commit"
            echo "success=true" >> $GITHUB_OUTPUT
            echo "no_changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "success=true" >> $GITHUB_OUTPUT
          echo "no_changes=false" >> $GITHUB_OUTPUT
          echo "✓ Validation passed"
      
      - name: "💾 Create Commit"
        id: commit
        if: ${{ steps.finalize.outputs.success == 'true' && steps.finalize.outputs.no_changes != 'true' }}
        run: |
          echo "=== CREATING COMMIT ==="
          
          # Generate commit message
          COMMIT_MSG="HORIZON: AI-Powered Kernel Merge (${{ inputs.merge_strategy }})

          Automated merge from: ${{ inputs.upstream_repo }} @ ${{ inputs.upstream_branch }}
          Target branch: ${{ inputs.target_branch }}
          
          Statistics:
          - Conflicts detected: ${{ steps.detect_conflicts.outputs.conflict_count || 0 }}
          - AI Model: ${{ env.GEMINI_MODEL }}
          - Merge strategy: ${{ inputs.merge_strategy }}
          
          Technical details:
          - Workflow: ${{ github.workflow }} #${{ github.run_number }}
          - Run ID: ${{ github.run_id }}
          - Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          
          Signed-off-by: Horizon Merge Bot <horizon-bot@users.noreply.github.com>"
          
          # Create commit
          git commit -m "$COMMIT_MSG" --no-verify
          
          # Get commit SHA
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          
          echo "✓ Commit created: $COMMIT_SHA"
      
      - name: "📋 Generate Merge Report"
        if: always()
        run: |
          echo "=== MERGE EXECUTION REPORT ==="
          echo "Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "Workflow: ${{ github.workflow }} #${{ github.run_number }}"
          echo "Run ID: ${{ github.run_id }}"
          echo ""
          echo "RESULTS:"
          echo "- Merge Branch: ${{ needs.preflight.outputs.merge_branch }}"
          echo "- Conflicts Detected: ${{ steps.detect_conflicts.outputs.conflict_count || 0 }}"
          echo "- Validation: ${{ steps.finalize.outputs.success || 'false' }}"
          echo "- Changes: ${{ steps.finalize.outputs.no_changes == 'true' && 'No changes' || 'Changes committed' }}"
          echo "- Commit SHA: ${{ steps.commit.outputs.commit_sha || 'N/A' }}"
          echo ""
          echo "CONFIGURATION:"
          echo "- AI Model: ${{ env.GEMINI_MODEL }}"
          echo "- Strategy: ${{ inputs.merge_strategy }}"
          echo "- Max Conflicts: ${{ inputs.max_conflicts }}"

  # ---------------------------------------------------------------------
  # JOB 3: FINAL PUSH
  # ---------------------------------------------------------------------
  push:
    name: "🚀 Push Changes"
    runs-on: ubuntu-latest
    needs: [preflight, merge]
    if: ${{ needs.merge.outputs.success == 'true' && needs.merge.outputs.conflict_count != '0' }}
    timeout-minutes: 15
    
    steps:
      - name: "📥 Checkout Merge Branch"
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.merge_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: "🔄 Push to Target Branch"
        run: |
          echo "=== PUSHING CHANGES ==="
          
          MERGE_BRANCH="${{ needs.preflight.outputs.merge_branch }}"
          TARGET_BRANCH="${{ inputs.target_branch }}"
          
          echo "Pushing $MERGE_BRANCH to $TARGET_BRANCH..."
          
          # Push with retry logic
          MAX_ATTEMPTS=3
          ATTEMPT=1
          SUCCESS=false
          
          while [[ $ATTEMPT -le $MAX_ATTEMPTS && $SUCCESS == false ]]; do
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS..."
            
            if git push origin "$MERGE_BRANCH:$TARGET_BRANCH" --force-with-lease; then
              echo "✅ Successfully pushed to $TARGET_BRANCH"
              SUCCESS=true
              
              # Clean up merge branch
              git push origin --delete "$MERGE_BRANCH" 2>/dev/null || true
            else
              echo "❌ Push failed (attempt $ATTEMPT)"
              
              if [[ $ATTEMPT -lt $MAX_ATTEMPTS ]]; then
                WAIT_TIME=$((10 * ATTEMPT))
                echo "Waiting $WAIT_TIME seconds before retry..."
                sleep $WAIT_TIME
                
                # Refresh local branch
                git fetch origin "$TARGET_BRANCH"
                git rebase "origin/$TARGET_BRANCH" || git rebase --abort
              fi
            fi
            
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          if [[ $SUCCESS == false ]]; then
            echo "❌ All push attempts failed"
            exit 1
          fi
      
      - name: "🎉 Success Notification"
        run: |
          echo "=== MERGE SUCCESSFUL ==="
          echo ""
          echo "🎉 HORIZON MERGE COMPLETED SUCCESSFULLY!"
          echo ""
          echo "Summary:"
          echo "- Target Branch: ${{ inputs.target_branch }}"
          echo "- Conflicts Resolved: ${{ needs.merge.outputs.conflict_count || 0 }}"
          echo "- Commit: ${{ needs.merge.outputs.commit_sha || 'N/A' }}"
          echo "- AI Model: ${{ env.GEMINI_MODEL }}"
          echo "- Strategy: ${{ inputs.merge_strategy }}"
          echo ""
          echo "The merge has been pushed successfully."
          echo "Review the changes and run kernel builds as needed."

  # ---------------------------------------------------------------------
  # JOB 4: FAILURE RECOVERY
  # ---------------------------------------------------------------------
  failure:
    name: "🆘 Failure Recovery"
    runs-on: ubuntu-latest
    needs: [preflight, merge]
    if: ${{ failure() && !cancelled() }}
    
    steps:
      - name: "📊 Generate Failure Report"
        run: |
          echo "=== FAILURE ANALYSIS ==="
          
          cat > "$TEMP_DIR/failure_report.md" << 'EOF'
          # 🚨 Horizon Merge Failed
          
          ## Summary
          - **Timestamp:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          - **Workflow:** ${{ github.workflow }} #${{ github.run_number }}
          - **Run ID:** ${{ github.run_id }}
          
          ## Configuration
          - **Upstream:** ${{ inputs.upstream_repo }} @ ${{ inputs.upstream_branch }}
          - **Target:** ${{ inputs.target_branch }}
          - **Strategy:** ${{ inputs.merge_strategy }}
          - **AI Model:** ${{ env.GEMINI_MODEL }}
          
          ## Status
          EOF
          
          # Determine which job failed
          if [[ "${{ needs.preflight.result }}" == "failure" ]]; then
            echo "**Failed Job:** Preflight Validation" >> "$TEMP_DIR/failure_report.md"
            echo "" >> "$TEMP_DIR/failure_report.md"
            echo "### Preflight Results" >> "$TEMP_DIR/failure_report.md"
            echo "- **Validation:** ${{ needs.preflight.outputs.passed || 'unknown' }}" >> "$TEMP_DIR/failure_report.md"
            echo "- **Message:** ${{ needs.preflight.outputs.message || 'unknown' }}" >> "$TEMP_DIR/failure_report.md"
            echo "- **Conflicts Estimated:** ${{ needs.preflight.outputs.conflict_estimate || 'unknown' }}" >> "$TEMP_DIR/failure_report.md"
          else
            echo "**Failed Job:** Merge Execution" >> "$TEMP_DIR/failure_report.md"
            echo "" >> "$TEMP_DIR/failure_report.md"
            echo "### Merge Status" >> "$TEMP_DIR/failure_report.md"
            echo "- **Merge Branch:** ${{ needs.preflight.outputs.merge_branch || 'unknown' }}" >> "$TEMP_DIR/failure_report.md"
            echo "- **Conflicts Detected:** ${{ needs.merge.outputs.conflict_count || 'unknown' }}" >> "$TEMP_DIR/failure_report.md"
            echo "- **Success:** ${{ needs.merge.outputs.success || 'false' }}" >> "$TEMP_DIR/failure_report.md"
          fi
          
          cat >> "$TEMP_DIR/failure_report.md" << 'EOF'
          
          ## Next Steps
          1. Check the workflow logs for detailed error messages
          2. Review the merge branch if available: \`${{ needs.preflight.outputs.merge_branch || 'N/A' }}\`
          3. Consider adjusting configuration:
             - Reduce max_conflicts threshold
             - Change merge strategy
             - Verify API keys and permissions
          4. Run manual merge if AI resolution fails
          
          ## Common Issues
          - Gemini API rate limits (15 RPM)
          - Network connectivity issues
          - Repository permission problems
          - Large conflict volumes
          EOF
          
          cat "$TEMP_DIR/failure_report.md"
      
      - name: "📁 Upload Debug Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-debug-${{ github.run_id }}
          path: |
            ${{ env.TEMP_DIR }}
            *.log
            *.json
            *.md
          retention-days: 7
